[project]
name = "nlp-baseline"
version = "0.1.0"
description = "TF-IDF baseline interpretavel para PT-BR. Package compartilhado entre o worker NLP da NORA e o notebook academico (Data Science Sprint 1+2)."
requires-python = ">=3.12"
authors = [{ name = "Time NORA" }]
license = { text = "Proprietary" }
keywords = ["nlp", "tf-idf", "baseline", "ptbr", "nora"]

dependencies = [
  "scikit-learn>=1.4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
