# NORA — datasources do Grafana (provisionados, não criados pela UI)
# =============================================================================
# Montado read-only em docker-compose.yml:538. `editable: false` é intencional:
# o volume grafana_data persiste, mas datasource criado/editado pela UI não está
# versionado e some no dia em que o volume for recriado. Aqui, o arquivo é a verdade.
#
# Os `uid` são FIXOS e estáveis. O nora-overview.json referencia estes uids
# literalmente; se alguém trocar, todo painel do dashboard quebra com
# "Datasource nora-prometheus was not found". Não gere uid aleatório.

apiVersion: 1

# Remove datasources com estes nomes antes de aplicar. Evita duplicata do tipo
# "Prometheus-1" quando alguém já criou um na mão pela UI.
deleteDatasources:
  - name: Prometheus
    orgId: 1
  - name: Loki
    orgId: 1

datasources:
  # ---------------------------------------------------------------------------
  # Prometheus — métricas (default)
  # ---------------------------------------------------------------------------
  # Default porque é o que a maior parte dos painéis usa e o que o "Explore" abre
  # primeiro. Substitui o Metrics Explorer do Application Insights.
  - name: Prometheus
    uid: nora-prometheus
    type: prometheus
    access: proxy          # o browser fala com o Grafana; o Grafana fala com o Prometheus
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      # POST em vez de GET: queries do dashboard com regex de rota estouram o limite
      # de URL em GET.
      httpMethod: POST
      # Bate com o scrape_interval do prometheus.yml. Sem isso o Grafana usa 15s
      # chutado e o $__rate_interval pode ficar menor que o intervalo real de scrape,
      # produzindo gráfico serrilhado com buracos.
      timeInterval: 15s
      prometheusType: Prometheus
      prometheusVersion: 3.1.0
      # Alerting é gerenciado pelo unified alerting do Grafana, não por rules
      # carregadas do Prometheus (não há rule_files no prometheus.yml).
      manageAlerts: false
      incrementalQuerying: true

  # ---------------------------------------------------------------------------
  # Loki — logs
  # ---------------------------------------------------------------------------
  # Substitui a query de log do Log Analytics (as consultas KQL sobre
  # ContainerAppConsoleLogs_CL). A linguagem muda de KQL para LogQL: nenhuma consulta
  # salva do Azure é portável, todas precisam ser reescritas à mão.
  - name: Loki
    uid: nora-loki
    type: loki
    access: proxy
    url: http://loki:3100
    isDefault: false
    editable: false
    jsonData:
      # Teto do painel de logs. Acima disso o browser engasga antes do Loki.
      maxLines: 1000
      timeout: 60
      # SEM derivedFields para trace_id: seria o "pular do log para a transação" do
      # App Insights, mas exige um datasource de traces (não há Tempo no compose) e
      # trace_id no MDC do logback. Adicionar aqui hoje só criaria link quebrado.
      # Quando existir Tempo, é este o bloco:
      #   derivedFields:
      #     - name: TraceID
      #       matcherRegex: 'trace_id=(\w+)'
      #       url: '$${__value.raw}'
      #       datasourceUid: nora-tempo
