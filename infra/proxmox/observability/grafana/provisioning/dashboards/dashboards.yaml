# NORA — Grafana dashboard provider
# =============================================================================
# Loads every *.json in this folder as a dashboard. The provider ignores files that are
# not .json, so this dashboards.yaml living in the same directory is safe.
#
# `allowUiUpdates: false`: the dashboard is read-only in the interface. That is on purpose.
# The way to change a panel is to edit nora-overview.json and redeploy — if the UI
# could save, the change would live only in the grafana_data volume, outside git, and would
# vanish the first time the volume is recreated. To experiment without friction: "Edit" ->
# tweak -> "Export/Save JSON" and paste it back into the file.

apiVersion: 1

providers:
  - name: nora
    orgId: 1
    folder: NORA
    folderUid: nora
    type: file
    disableDeletion: false
    allowUiUpdates: false
    # Reloads from disk periodically. With the file mounted :ro
    # (docker-compose.yml:538), a `docker compose restart grafana` is not needed
    # to pick up a dashboard change — but the bind mount only reflects the host's file,
    # so editing on the host is enough.
    updateIntervalSeconds: 30
    options:
      path: /etc/grafana/provisioning/dashboards
      # false: a single "NORA" folder, without mirroring subfolders.
      foldersFromFilesStructure: false
