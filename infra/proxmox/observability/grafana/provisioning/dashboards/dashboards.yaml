# NORA — provider de dashboards do Grafana
# =============================================================================
# Carrega todo *.json desta pasta como dashboard. O provider ignora arquivos que não
# sejam .json, então este próprio dashboards.yaml conviver no mesmo diretório é seguro.
#
# `allowUiUpdates: false`: o dashboard fica read-only na interface. Isso é de propósito.
# O caminho para mudar um painel é editar o nora-overview.json e redeployar — se a UI
# pudesse salvar, a alteração viveria só no volume grafana_data, fora do git, e sumiria
# na primeira recriação do volume. Para experimentar sem atrito: "Edit" -> mexer ->
# "Export/Save JSON" e colar de volta no arquivo.

apiVersion: 1

providers:
  - name: nora
    orgId: 1
    folder: NORA
    folderUid: nora
    type: file
    disableDeletion: false
    allowUiUpdates: false
    # Recarrega do disco periodicamente. Com o arquivo montado :ro
    # (docker-compose.yml:538), um `docker compose restart grafana` não é necessário
    # para pegar mudança de dashboard — mas o bind mount só reflete o arquivo do host,
    # então editar no host basta.
    updateIntervalSeconds: 30
    options:
      path: /etc/grafana/provisioning/dashboards
      # false: um único folder "NORA", sem espelhar subpastas.
      foldersFromFilesStructure: false
