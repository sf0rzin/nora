# NORA — OpenTelemetry Collector
# =============================================================================
# Substitui a perna de TRACES + MÉTRICAS do Application Insights.
# NÃO substitui a perna de LOGS: essa é do Alloy (ver config.alloy). Um Collector
# é write-only e não faz tail de stdout de container.
#
# Mapa 1:1 com o que o App Insights fazia:
#
#   applicationinsights-agent-3.x.jar  ->  opentelemetry-javaagent.jar + este arquivo
#   endpoint Breeze da connection str  ->  otlp receiver (4317 grpc / 4318 http)
#   "Live Metrics" / Metrics Explorer  ->  prometheusremotewrite -> Prometheus -> Grafana
#   "Transaction Search" / App Map     ->  NÃO EXISTE HOJE (sem Tempo na stack, ver §TRACES)
#   Query REST API (KQL)               ->  Prometheus Query API (PrometheusHealthSource)
#
# ATENÇÃO — a troca do JAR já está feita NO FONTE, mas depende da imagem publicada:
# o agent do App Insights exportava para o endpoint Breeze da APPLICATIONINSIGHTS_CONNECTION_STRING
# e IGNORAVA OTEL_EXPORTER_OTLP_ENDPOINT — trocar só a env do compose não moveria um byte para cá.
# Por isso o services/api/Dockerfile já baixa o opentelemetry-javaagent.jar (ARG
# OTEL_AGENT_VERSION=2.30.0, linhas 30-33) e o carrega no JAVA_TOOL_OPTIONS (linha 49).
#
# O que ainda pode deixar este Collector ocioso NÃO é o código, é a TAG em uso: se o
# API_TAG apontar para uma imagem construída ANTES dessa troca, o container em execução
# ainda carrega o agent antigo e não exporta nada para cá. O último build-images em main
# com deploy-apps OK foi 2026-07-06. Confirme com:
#
#     docker compose exec api sh -c 'echo $JAVA_TOOL_OPTIONS'
#     # tem que conter -javaagent:/app/opentelemetry-javaagent.jar
#
# Sintoma de tag velha: este arquivo correto, o collector healthy e o dashboard da API
# em "No data" — sem um único erro em lugar nenhum.
#
# A API também NÃO tem micrometer-registry-prometheus no pom.xml e o actuator só expõe
# `health,info` (application.yml:51-55). Ou seja: não existe /actuator/prometheus para o
# Prometheus raspar. Todo métrico da API depende deste caminho de push OTLP.

receivers:
  otlp:
    protocols:
      grpc:
        # CRÍTICO: desde o collector 0.104 o default destes endpoints é `localhost:<porta>`
        # (feature gate component.UseLocalHostAsDefaultHost). Dentro de um container isso
        # significa "só o próprio container" e todo export de api/worker/web/admin dá
        # connection refused EM SILÊNCIO do lado do collector. Tem que ser 0.0.0.0.
        endpoint: 0.0.0.0:4317
        # A API manda via grpc (OTEL_EXPORTER_OTLP_PROTOCOL: grpc no compose).
        max_recv_msg_size_mib: 8
      http:
        # 4318 existe para os apps Node (web/admin) quando/se ganharem SDK: o
        # @vercel/otel e o SDK Node usam http/protobuf por default, não grpc.
        endpoint: 0.0.0.0:4318

  # ---------------------------------------------------------------------------
  # OPCIONAL (desligado) — métricas de container por docker_stats
  # ---------------------------------------------------------------------------
  # Isto é o que dá CPU/memória/restart por container, o mais próximo que existe do
  # "Container Apps -> Metrics" do Azure. NÃO está ligado porque o docker-compose.yml
  # não monta o socket no otel-collector. Para habilitar, adicione ao serviço:
  #
  #     volumes:
  #       - /var/run/docker.sock:/var/run/docker.sock:ro
  #       - ./observability/otel-collector.yaml:/etc/otelcol/config.yaml:ro
  #
  # e inclua `docker_stats` no pipeline metrics abaixo.
  #
  # docker_stats:
  #   endpoint: unix:///var/run/docker.sock
  #   collection_interval: 30s
  #   container_labels_to_metric_labels:
  #     com.docker.compose.service: compose_service
  #   metrics:
  #     container.cpu.utilization:
  #       enabled: true
  #     container.memory.usage.total:
  #       enabled: true
  #     container.restarts:
  #       enabled: true

processors:
  # memory_limiter TEM que ser o primeiro processor de cada pipeline. Ele aplica
  # backpressure no receiver antes do collector ser morto por OOM. Sem ele, um pico
  # de telemetria derruba o container e você perde o sinal justamente na hora do
  # incidente — que é exatamente quando você precisa dele.
  # Dimensionado para caber com folga: o compose não impõe deploy.resources ao
  # collector, então este é o teto de fato.
  memory_limiter:
    check_interval: 1s
    limit_mib: 384
    spike_limit_mib: 96

  # Carimba host.name / os.type no resource. Substitui as colunas `Computer` e
  # `_ResourceId` que o Log Analytics injetava sozinho em toda linha.
  # Detector `docker` de propósito FORA: ele exige o socket do Docker, que este
  # container não monta (ver receiver docker_stats acima). `system` não exige nada.
  resourcedetection:
    detectors: [env, system]
    system:
      hostname_sources: [os]
      resource_attributes:
        host.name:
          enabled: true
        os.type:
          enabled: true
    timeout: 5s
    override: false

  # Agrupa antes de exportar. Reduz drasticamente o número de writes no Prometheus.
  # send_batch_max_size limita o tamanho da request de remote-write.
  batch:
    timeout: 10s
    send_batch_size: 1024
    send_batch_max_size: 2048

exporters:
  # ---------------------------------------------------------------------------
  # MÉTRICAS -> Prometheus (remote-write)
  # ---------------------------------------------------------------------------
  # Push, não pull: os apps não expõem /metrics (a API nem tem o registry Micrometer),
  # então o Prometheus não teria o que raspar. O receiver de remote-write é ligado
  # pela flag --web.enable-remote-write-receiver no docker-compose.yml:476.
  #
  # Como os labels saem do outro lado (isto define as queries do dashboard):
  #   resource service.name        -> label `job`       (ex.: job="nora-api")
  #   resource service.instance.id -> label `instance`
  #   demais resource attributes   -> só na série `target_info`
  # Por isso o dashboard filtra por `job=~"$job"` e não por `service_name`.
  #
  # O javaagent gera um service.instance.id novo (UUID) a cada boot da JVM, então cada
  # deploy cria uma série nova. Com 1 réplica e retenção de 30d isso é ruído irrelevante,
  # mas as queries do dashboard sempre agregam por `job` para não quebrar no rollout.
  #
  # Requisito silencioso: remote-write só aceita temporalidade CUMULATIVE. O javaagent 2.x
  # já exporta cumulative por default — não sete OTEL_EXPORTER_OTLP_METRICS_TEMPORALITY_PREFERENCE=delta
  # ou as métricas são descartadas sem erro visível no app.
  prometheusremotewrite:
    endpoint: http://prometheus:9090/api/v1/write
    tls:
      insecure: true   # tráfego não sai da bridge `internal` (internal: true)
    add_metric_suffixes: true      # http.server.request.duration -> http_server_request_duration_seconds
    target_info:
      enabled: true                # série target_info com host.name, os.type, service.version
    resource_to_telemetry_conversion:
      enabled: false               # true explodiria a cardinalidade com host.name em toda série
    remote_write_queue:
      enabled: true
      num_consumers: 5
      queue_size: 10000
    external_labels:
      source: otel-collector

  # ---------------------------------------------------------------------------
  # LOGS -> Loki (OTLP nativo)
  # ---------------------------------------------------------------------------
  # O exporter `loki` foi DEPRECADO em 0.107 e REMOVIDO do contrib pouco depois.
  # O caminho suportado hoje é otlphttp contra o endpoint OTLP nativo do Loki 3.x:
  # o exporter concatena /v1/logs, então a base é http://loki:3100/otlp.
  #
  # HOJE ESTE EXPORTER NÃO RECEBE NADA: o compose seta OTEL_LOGS_EXPORTER: none na API
  # (docker-compose.yml:301) e os logs entram no Loki pelo Alloy, lendo o socket do Docker.
  # A pipeline existe para que ligar OTEL_LOGS_EXPORTER=otlp seja uma troca de env var,
  # sem mexer neste arquivo. Se você ligar, saiba que vai DUPLICAR: a mesma linha chega
  # pelo SDK e pelo stdout via Alloy.
  otlphttp/loki:
    endpoint: http://loki:3100/otlp
    tls:
      insecure: true
    compression: gzip

  # ---------------------------------------------------------------------------
  # TRACES -> lugar nenhum (ver §TRACES no bloco service)
  # ---------------------------------------------------------------------------
  # verbosity: basic imprime só contadores agregados, não o conteúdo dos spans.
  # Não use `detailed` aqui: o json-file driver do compose tem max-size 20m/5 arquivos
  # e um trace verboso enche isso em minutos.
  debug:
    verbosity: basic
    sampling_initial: 2
    sampling_thereafter: 500

extensions:
  # Alvo do healthcheck do compose (docker-compose.yml:461-465, wget em :13133/).
  # Mesma pegadinha do localhost dos receivers: precisa de 0.0.0.0 explícito.
  health_check:
    endpoint: 0.0.0.0:13133
    path: /

service:
  extensions: [health_check]

  telemetry:
    logs:
      level: info
    metrics:
      level: normal
      # Métricas internas do próprio collector (otelcol_receiver_accepted_*,
      # otelcol_exporter_send_failed_*). O job `otel-collector` do prometheus.yml
      # raspa exatamente esta porta — sem 0.0.0.0 aqui aquele scrape dá
      # connection refused e você fica cego para perda de telemetria.
      address: 0.0.0.0:8888

  pipelines:
    # -------------------------------------------------------------------------
    # TRACES — recebidos e DESCARTADOS. Isto não é um bug, é o estado real.
    # -------------------------------------------------------------------------
    # Não existe backend de traces nesta stack: o docker-compose.yml não tem Tempo,
    # Jaeger nem equivalente. O "Transaction Search" / "Application Map" / "End-to-end
    # transaction details" do App Insights NÃO tem substituto hoje. Isso é regressão
    # de funcionalidade, não paridade.
    #
    # A pipeline existe mesmo assim porque o compose já aponta OTEL_EXPORTER_OTLP_ENDPOINT
    # de quatro serviços para cá. Sem uma pipeline de traces registrada, o collector
    # devolve erro em todo export e os apps enchem o log de falha de exportação.
    #
    # Para fechar a lacuna, adicione um serviço `tempo` ao compose e troque `debug` por:
    #
    #   otlp/tempo:
    #     endpoint: tempo:4317
    #     tls:
    #       insecure: true
    #
    # Alternativa sem Tempo (traces viram RED metrics em vez de sumirem): o connector
    # `spanmetrics`. Vale principalmente pelos spans de banco, que não aparecem em
    # http.server.request.duration:
    #
    #   connectors:
    #     spanmetrics:
    #       namespace: traces.spanmetrics
    #       histogram:
    #         unit: s
    #       dimensions:
    #         - name: http.route
    #         - name: http.response.status_code
    #       metrics_flush_interval: 30s
    #
    #   ... e então traces.exporters: [debug, spanmetrics] + metrics.receivers: [otlp, spanmetrics]
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resourcedetection, batch]
      exporters: [debug]

    # -------------------------------------------------------------------------
    # MÉTRICAS — a perna que realmente funciona
    # -------------------------------------------------------------------------
    # Fonte hoje: SÓ a API (javaagent OTel). worker, web e admin têm
    # OTEL_EXPORTER_OTLP_ENDPOINT setado no compose mas NÃO têm SDK instalado —
    # a env var não faz nada sozinha. Ver o README da pasta.
    metrics:
      receivers: [otlp]
      # inclua docker_stats aqui se montar o socket:  [otlp, docker_stats]
      processors: [memory_limiter, resourcedetection, batch]
      exporters: [prometheusremotewrite]

    # -------------------------------------------------------------------------
    # LOGS — ocioso por design (o caminho de produção é Alloy -> Loki)
    # -------------------------------------------------------------------------
    logs:
      receivers: [otlp]
      processors: [memory_limiter, resourcedetection, batch]
      exporters: [otlphttp/loki]
