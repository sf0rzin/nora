# =============================================================================
# NORA — Cloudflare Tunnel: REFERENCE ingress.
# =============================================================================
#
# ############################################################################
# #  THIS FILE IS NOT READ BY THE CONTAINER. READ THE PARAGRAPH BELOW BEFORE  #
# #  EDITING IT THINKING THAT CHANGES ANYTHING IN PRODUCTION.                 #
# ############################################################################
#
# The `cloudflared` service in infra/proxmox/docker-compose.yml comes up like this:
#
#     command: tunnel --no-autoupdate --metrics 0.0.0.0:2000 run
#     environment:
#       TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?...}
#
# No `--config`, no volume mounted on this directory. With `TUNNEL_TOKEN` the
# tunnel is REMOTELY-MANAGED (managed from the dashboard): the connector fetches
# the ingress configuration from Cloudflare the moment it connects. The REAL
# rules live in:
#
#     Zero Trust > Networks > Tunnels > (the NORA tunnel) > Configure >
#     Public Hostnames
#
# So: this YAML is the VERSIONED DOCUMENTATION of what has to be registered
# there. It exists to (a) review the ingress configuration in a pull request,
# (b) rebuild the tunnel from scratch without archaeology in the dashboard, and
# (c) serve as a ready config if one day this migrates to a locally-managed tunnel
# (see the "Locally-managed mode" section in the footer).
#
# Editing this file and running `docker compose up -d` does NOT change routing.
# Changing a route = touching the dashboard (or using the Cloudflare API).
#
# -----------------------------------------------------------------------------
# WHAT TO REGISTER IN THE DASHBOARD (1:1 equivalent of the `ingress:` block below)
# -----------------------------------------------------------------------------
# Four Public Hostnames, ALL pointing at the same `http://caddy:80` service
# — what decides which app answers is Caddy, by the Host header (see ../caddy/Caddyfile).
# The connector resolves `caddy` through Docker's internal DNS, so cloudflared and
# caddy have to share the `edge` network (they already do in the compose).
#
#   | Subdomain | Domain          | Type | URL          |
#   |-----------|-----------------|------|--------------|
#   | (empty)   | nora.systems    | HTTP | caddy:80     |
#   | www       | nora.systems    | HTTP | caddy:80     |
#   | api       | nora.systems    | HTTP | caddy:80     |
#   | admin     | nora.systems    | HTTP | caddy:80     |
#   | grafana   | nora.systems    | HTTP | caddy:80     |
#
# HTTP type (not HTTPS): the origin has no TLS on purpose — the visitor's TLS
# terminates at the Cloudflare edge and the cloudflared -> caddy leg never leaves
# the Docker bridges. See the Caddyfile header.
#
# The DNS (CNAME record `<host>.nora.systems -> <tunnel-id>.cfargotunnel.com`,
# proxied) is created automatically when the Public Hostname is added.
#
# Replace `nora.systems` if NORA_PUBLIC_DOMAIN is something else: this file has
# no environment variable interpolation (cloudflared does not do that).
# =============================================================================

# --- Tunnel identity ---------------------------------------------------------
# Only used in locally-managed mode. With TUNNEL_TOKEN the connector already knows
# which tunnel it is and authenticates by the token — these two fields are ignored.
tunnel: nora-proxmox
credentials-file: /etc/cloudflared/credentials.json

# --- Operational -------------------------------------------------------------
# Autoupdate off: the version is pinned by the image tag in the compose
# (cloudflare/cloudflared:2026.5.2). Updating = bumping the tag in a commit.
no-autoupdate: true

# Connector metrics on :2000 (the same flag the compose passes). Exposes
# /metrics in Prometheus format and /ready. It is where
# cloudflared_tunnel_ha_connections shows up — expected 4; dropping to 0 is exactly
# the 522 that took nora.systems down.
#
# The `cloudflared` job ALREADY EXISTS in ../observability/prometheus.yml and TODAY
# COLLECTS NOTHING: this service is only on the `edge` network and prometheus only on
# `internal`, so the scrape resolves to "no such host". One line in the compose closes
# it, on the cloudflared service:  networks: [edge, internal]  — it does not increase
# exposure, `internal` is `internal: true`. See the job's comment over there.
metrics: 0.0.0.0:2000

# Logs on stdout for Alloy to collect (same pipeline as the other containers).
loglevel: info

# --- Defaults applied to every rule ------------------------------------------
originRequest:
  # Time to open the TCP connection to Caddy. Short on purpose: Caddy is the
  # only component that does NOT disappear during the rolling update (it is the
  # one holding the request while api/web restart, via lb_try_duration).
  connectTimeout: 10s

  # NO response timeout: the chat uses SSE and the response stays open while
  # the model generates tokens. `disableChunkedEncoding: false` (default) preserves
  # streaming; turning it on would break the chat silently.
  disableChunkedEncoding: false

  # Origin over plain HTTP — no TLS to verify. Kept explicit to make clear
  # that `noTLSVerify: true` is NOT needed here.
  noTLSVerify: false

  # Preserves the original Host (api.nora.systems etc.). It is what Caddy's
  # routing uses; overriding it with `httpHostHeader` would always land on the 404 catch-all.
  # httpHostHeader: <do not set>

  # Reuses connections to Caddy instead of opening one per request.
  keepAliveConnections: 100
  keepAliveTimeout: 90s

# --- Ingress rules (order matters: the first that matches wins) --------------
ingress:
  # Public site (Next.js/BFF) — apex.
  - hostname: nora.systems
    service: http://caddy:80

  # Public site — www.
  - hostname: www.nora.systems
    service: http://caddy:80

  # Spring Boot API. Route of the chat SSE.
  - hostname: api.nora.systems
    service: http://caddy:80

  # Operator console (`platform` profile). Authentication happens at the EDGE:
  # this route MUST have a Cloudflare Access Application in front, otherwise the
  # admin is wide open — apps/admin/src/lib/access.ts does fail-OPEN when
  # CF_ACCESS_AUD arrives empty. The connector injects `Cf-Access-Jwt-Assertion`.
  - hostname: admin.nora.systems
    service: http://caddy:80

  # Grafana. Protected only by the admin password, unless an Access Application
  # is put in front of it too (recommended).
  - hostname: grafana.nora.systems
    service: http://caddy:80

  # MANDATORY catch-all: cloudflared refuses the configuration if the last rule
  # has a `hostname`. Any Host not listed dies here, without reaching the
  # VM.
  - service: http_status:404

# =============================================================================
# Locally-managed mode (alternative — NOT the mode in use)
# =============================================================================
# If one day the connector token is swapped for local credentials, this file
# becomes the source of truth and routing goes back to living in the repo.
#
#   1. Authenticate and create the tunnel on a machine with a browser:
#        cloudflared tunnel login
#        cloudflared tunnel create nora-proxmox
#      That generates <TUNNEL-ID>.json (the credentials) and prints the TUNNEL-ID.
#   2. Keep the JSON on the host (e.g. /etc/nora/cloudflared/credentials.json,
#      chmod 600) — it is a secret, do NOT version it. If it is to be versioned
#      encrypted, use the same SOPS + age as the rest of the stack (../.sops.yaml).
#   3. Create the DNS for each hostname:
#        cloudflared tunnel route dns nora-proxmox api.nora.systems   # etc.
#   4. In docker-compose.yml: remove TUNNEL_TOKEN, mount this directory and
#      change the command to
#        tunnel --no-autoupdate --config /etc/cloudflared/config.yml run
#      with the volumes
#        - ./cloudflared:/etc/cloudflared:ro
#        - /etc/nora/cloudflared/credentials.json:/etc/cloudflared/credentials.json:ro
#   5. Replace `tunnel: nora-proxmox` with the TUNNEL-ID, to be explicit if preferred.
#
# Trade-off: locally-managed versions the routing (auditable in a PR) but moves
# one more secret onto the host. Remotely-managed (the current mode) keeps only
# the TUNNEL_TOKEN, at the cost of the real routing living outside the repo — which
# is exactly the reason this file exists.
# =============================================================================
