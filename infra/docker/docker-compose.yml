services:
  postgres:
    image: postgres:16-alpine
    container_name: nora-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nora}
      POSTGRES_USER: ${POSTGRES_USER:-nora}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nora_dev}
    # Explicit bind to 127.0.0.1: a dev db must not listen on the machine's LAN.
    # Override with `POSTGRES_BIND=0.0.0.0` in .env.local if you need to reach it from
    # another host (e.g.: testing from the phone).
    ports:
      - "${POSTGRES_BIND:-127.0.0.1}:5432:5432"
    volumes:
      - nora_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nora} -d ${POSTGRES_DB:-nora}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    mem_limit: 512m

  adminer:
    # Pinned to a specific version (generic 4 had CVEs).
    image: adminer:4.8.1
    container_name: nora-adminer
    ports:
      - "${ADMINER_BIND:-127.0.0.1}:8090:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 256m

volumes:
  nora_pgdata:
