# NORA — Loki (single binary, filesystem)
# =============================================================================
# Replaces the Log Analytics Workspace: the destination of the Container Apps
# Environment's `appLogsConfiguration`. Where stdout/stderr of the 4 apps used to go to
# the ContainerAppConsoleLogs_CL table, it now goes here, pushed by Alloy.
#
# Target scale: one VM, one binary, local disk. No S3, no memberlist, no distributed
# ring. `replication_factor: 1` and the inmemory kvstore are deliberate — anything
# else here is complexity without an owner.
#
# =============================================================================
# >>> READ THIS BEFORE TOUCHING RETENTION <<<
# =============================================================================
# `limits_config.retention_period: 720h` ON ITS OWN DELETES NOTHING.
#
# Unlike Log Analytics' `retentionInDays: 30` — where Azure had a managed process
# sweeping the workspace — in Loki retention_period is only a policy DECLARATION.
# What executes the policy is the COMPACTOR, and it ignores the whole policy unless
# you turn two keys on explicitly:
#
#     compactor:
#       retention_enabled: true          <- without this, retention_period is decorative
#       delete_request_store: filesystem <- mandatory when retention_enabled: true
#
# The failure mode is the worst possible: SILENT. Loki comes up normally, answers /ready,
# ingests logs, serves queries, and the dashboard stays green. Except nothing is ever
# deleted. You find out weeks later, when the VM disk fills up, Postgres can no longer
# write WAL and the whole stack goes down — because of old logs.
#
# It is even worse on `filesystem`: there is no bucket lifecycle policy as a safety net
# like there would be on S3/Azure Blob. If the compactor does not delete, nobody does.
#
# Version note: in Loki < 3.0 the key was `compactor.shared_store`. It was REMOVED
# in Loki 3.x. Old config copied from a tutorial either makes Loki refuse to boot or
# (depending on the field) leaves retention off. The image here is grafana/loki:3.3.2
# (docker-compose.yml:488), so `delete_request_store` is the one that applies.
#
# How to CONFIRM it is working (do not trust the file, check the series):
#   loki_compactor_runs_started_total                    must grow
#   loki_boltdb_shipper_compact_tables_operation_last_successful_run_timestamp_seconds
#                                                        must rise every ~10min
# The `loki` job in prometheus.yml exists for exactly that.
# =============================================================================

auth_enabled: false   # single tenant; Caddy/Cloudflare Access is what authenticates at the edge

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: info
  # Spring traces can produce long lines; grpc's 4MB default is more than enough.
  grpc_server_max_recv_msg_size: 8388608
  grpc_server_max_send_msg_size: 8388608

common:
  path_prefix: /loki          # loki_data volume (docker-compose.yml:495)
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    instance_addr: 127.0.0.1
    kvstore:
      store: inmemory

schema_config:
  configs:
    # tsdb + v13 is the only combo that supports structured metadata, which in turn is
    # a requirement of native OTLP ingestion (/otlp/v1/logs, used by the collector's
    # otlphttp/loki). An old schema (boltdb-shipper / v11) would make the OTLP endpoint reject.
    # `from` in the past: it is the start of the schema's validity, not the creation date.
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

storage_config:
  tsdb_shipper:
    active_index_directory: /loki/tsdb-index
    cache_location: /loki/tsdb-cache
    cache_ttl: 24h
  filesystem:
    directory: /loki/chunks

# -----------------------------------------------------------------------------
# COMPACTOR — what actually executes retention (see the big warning at the top)
# -----------------------------------------------------------------------------
compactor:
  working_directory: /loki/compactor

  # The key that turns retention_period from a declaration into action.
  retention_enabled: true

  # MANDATORY when retention_enabled: true. Without it Loki aborts the boot with
  # "delete_request_store should be configured when retention is enabled".
  # That error is a stroke of luck: it is the only part of retention that fails loud
  # instead of failing silently.
  delete_request_store: filesystem

  compaction_interval: 10m
  retention_delete_delay: 2h        # regret window before the physical delete
  retention_delete_worker_count: 150
  delete_request_cancel_period: 24h

limits_config:
  # 720h = 30 days. Mirrors Log Analytics' `retentionInDays: 30` and Prometheus'
  # --storage.tsdb.retention.time=30d. The three numbers have to move together,
  # otherwise the metric<->log correlation has a hole at the old end.
  #
  # Repeating because it is the point of the file: this line alone deletes nothing.
  # It only has an effect because compactor.retention_enabled: true is above.
  retention_period: 720h

  # Rejects logs with an old timestamp. Protects against an Alloy that sat dead for days
  # and comes back dumping backlog outside the window — that would corrupt the dashboard rates.
  reject_old_samples: true
  reject_old_samples_max_age: 168h

  # Ingestion cap. On a single VM this is the fuse: an app in an error loop
  # spitting stack traces must not eat the whole disk in one afternoon.
  ingestion_rate_mb: 8
  ingestion_burst_size_mb: 16
  per_stream_rate_limit: 5MB
  per_stream_rate_limit_burst: 20MB

  # Cardinality guardrail. Every unique combination of labels is a stream with its
  # own index. config.alloy keeps labels low-cardinality precisely so it does not
  # hit this.
  max_label_names_per_series: 15
  max_streams_per_user: 5000
  max_global_streams_per_user: 5000

  max_query_series: 5000
  max_query_parallelism: 16
  # Enables the volume API (Grafana "Logs volume" above the logs panel).
  volume_enabled: true
  allow_structured_metadata: true

# Per-stream retention (optional). Example: keep less infra log than app log.
# It only works because the compactor is on — the same dependency as always.
#   limits_config:
#     retention_stream:
#       - selector: '{service="nora-postgres"}'
#         priority: 1
#         period: 168h

pattern_ingester:
  enabled: true    # feeds Grafana's "Explain/Patterns"; cheap on a single binary

query_range:
  align_queries_with_step: true
  cache_results: true
  results_cache:
    cache:
      embedded_cache:
        enabled: true
        max_size_mb: 128

ruler:
  storage:
    type: local
    local:
      directory: /loki/rules
  rule_path: /loki/rules-temp
  enable_api: true
  # No alertmanager_url: log alerting today is Grafana's unified alerting
  # on top of the Loki datasource, not Loki's ruler.

# Usage telemetry to Grafana Labs. Off, consistent with
# GF_ANALYTICS_REPORTING_ENABLED: "false" in the compose and with the repo being public.
analytics:
  reporting_enabled: false
