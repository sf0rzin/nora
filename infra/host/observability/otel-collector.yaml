# NORA — OpenTelemetry Collector
# =============================================================================
# Replaces the TRACES + METRICS leg of Application Insights.
# Does NOT replace the LOGS leg: that one belongs to Alloy (see config.alloy). A Collector
# is write-only and does not tail container stdout.
#
# 1:1 map with what App Insights did:
#
#   applicationinsights-agent-3.x.jar  ->  opentelemetry-javaagent.jar + this file
#   Breeze endpoint of the connection str -> otlp receiver (4317 grpc / 4318 http)
#   "Live Metrics" / Metrics Explorer  ->  prometheusremotewrite -> Prometheus -> Grafana
#   "Transaction Search" / App Map     ->  DOES NOT EXIST TODAY (no Tempo in the stack, see §TRACES)
#   Query REST API (KQL)               ->  Prometheus Query API (PrometheusHealthSource)
#
# WATCH OUT — the JAR swap is already done IN THE SOURCE, but it depends on the published image:
# the App Insights agent exported to the Breeze endpoint of APPLICATIONINSIGHTS_CONNECTION_STRING
# and IGNORED OTEL_EXPORTER_OTLP_ENDPOINT — changing only the compose env would not move a byte here.
# That is why services/api/Dockerfile already downloads opentelemetry-javaagent.jar (ARG
# OTEL_AGENT_VERSION=2.30.0, lines 30-33) and loads it in JAVA_TOOL_OPTIONS (line 49).
#
# What can still leave this Collector idle is NOT the code, it is the TAG in use: if
# API_TAG points at an image built BEFORE that swap, the running container still carries
# the old agent and exports nothing here. The last build-images on main with deploy-apps
# OK was 2026-07-06. Confirm with:
#
#     docker compose exec api sh -c 'echo $JAVA_TOOL_OPTIONS'
#     # it has to contain -javaagent:/app/opentelemetry-javaagent.jar
#
# Symptom of an old tag: this file correct, the collector healthy and the API dashboard
# on "No data" — without a single error anywhere.
#
# The API also does NOT have micrometer-registry-prometheus in pom.xml and the actuator only
# exposes `health,info` (application.yml:51-55). That is: there is no /actuator/prometheus for
# Prometheus to scrape. Every API metric depends on this OTLP push path.

receivers:
  otlp:
    protocols:
      grpc:
        # CRITICAL: since collector 0.104 the default of these endpoints is `localhost:<port>`
        # (feature gate component.UseLocalHostAsDefaultHost). Inside a container that
        # means "only the container itself" and every export from api/worker/web/admin gets
        # connection refused SILENTLY on the collector's side. It has to be 0.0.0.0.
        endpoint: 0.0.0.0:4317
        # The API sends via grpc (OTEL_EXPORTER_OTLP_PROTOCOL: grpc in the compose).
        max_recv_msg_size_mib: 8
      http:
        # 4318 exists for the Node apps (web/admin) when/if they get an SDK:
        # @vercel/otel and the Node SDK use http/protobuf by default, not grpc.
        endpoint: 0.0.0.0:4318

  # ---------------------------------------------------------------------------
  # HOST FILESYSTEM — the series behind the disk alert
  # ---------------------------------------------------------------------------
  # Added for one rule: `nora-root-disk-low` in grafana/provisioning/alerting/rules.yaml.
  # Before it there was NO disk metric anywhere in the stack (no node-exporter, no cAdvisor —
  # see the closing section of prometheus.yml), so "the disk is filling" was a condition this
  # host could not state, on a machine where /srv holds both the Postgres volume and the only
  # backups.
  #
  # NO HOST MOUNT, and that is the whole reason this is acceptable. The usual recipe for
  # hostmetrics is `- /:/hostfs:ro` plus `root_path: /hostfs`, which hands the collector a
  # readable copy of the entire host — including /etc/nora/age.key, the single private key
  # that decrypts every secret this stack has. Not worth a gauge.
  #
  # What it reads instead is the CONTAINER's own root mount, which is an overlay whose statfs
  # reports the backing filesystem: the host's /var/lib/docker device, which on the default
  # layout is the same filesystem as /srv. So the number is the number that matters and the
  # collector gains no new read access at all.
  #
  # `include_mount_points` restricted to `/` on purpose: without it the scraper also reports
  # /dev/shm (64 MiB tmpfs) and every bind mount, and a `min()` across all of them would fire
  # the disk alert permanently. rules.yaml filters on `mountpoint="/"` as well — keep the two
  # in step, and prefer changing this file, since a series that is never produced is cheaper
  # to notice than one that is produced and quietly ignored.
  hostmetrics:
    collection_interval: 60s
    scrapers:
      filesystem:
        include_mount_points:
          mount_points: ["/"]
          match_type: strict

  # ---------------------------------------------------------------------------
  # POSTGRES — the series behind "the database is unreachable"
  # ---------------------------------------------------------------------------
  # Also added for one rule (`nora-postgres-unreachable`). The stack could detect a broken API
  # and a broken edge and had nothing at all to say about the database underneath them: the
  # apps expose no /metrics, there is no postgres_exporter, and the `backup` service's hourly
  # `pg_isready` is a log line an hour late.
  #
  # THE TRADE, stated rather than buried: this puts the primary database's credentials into
  # the telemetry container and attaches that container to the `data` bridge (see the
  # `otel-collector` service in docker-compose.yml). Compromising the collector now yields a
  # database login as well. The reason that is acceptable here and would not be elsewhere is
  # the neighbourhood: `alloy` on the same `internal` bridge already mounts the Docker socket,
  # which is root on the host and strictly more than a Postgres password — the collector is
  # not the weakest link, and pretending otherwise would be the only thing gained by leaving
  # the database unmonitored.
  #
  # The credentials come from the compose environment, which sets them unconditionally from
  # POSTGRES_ADMIN_USER/POSTGRES_ADMIN_PASSWORD. They are never absent: the compose marks the
  # password `:?` and refuses to render without it, so `${env:...}` below cannot expand to
  # nothing and take the collector down at boot.
  #
  # `tls.insecure: true` because the Postgres image comes up with SSL off and the traffic
  # never leaves the `data` bridge (`internal: true`) — the same reasoning that removed
  # `sslmode=require` from the API's JDBC URL.
  postgresql:
    endpoint: postgres:5432
    transport: tcp
    username: ${env:NORA_PG_MONITOR_USER}
    password: ${env:NORA_PG_MONITOR_PASSWORD}
    databases:
      - nora
    collection_interval: 60s
    tls:
      insecure: true

  # ---------------------------------------------------------------------------
  # OPTIONAL (off) — per-container metrics via docker_stats
  # ---------------------------------------------------------------------------
  # This is what gives CPU/memory/restarts per container, the closest thing there is to
  # Azure's "Container Apps -> Metrics". It is NOT on because this collector has no route to
  # the Docker API.
  #
  # DO NOT ENABLE IT BY MOUNTING THE SOCKET, which is what this note used to suggest. That
  # mount is root on the host — the Docker API can create a container with `/` bind-mounted
  # into it — and the whole point of the `socket-proxy` service in docker-compose.yml is that
  # exactly one container in this stack holds it. Adding a second one gives back everything
  # that change bought.
  #
  # The supported route is the proxy. To enable: put this service on the `docker-api` network
  # as well, allow the stats path on the proxy (`/containers/{id}/stats` is already covered by
  # its `CONTAINERS=1`), point the receiver at `http://socket-proxy:2375`, and include
  # `docker_stats` in the metrics pipeline below. Note that the collector would then be a
  # second consumer of a proxy sized for one — check its haproxy `maxconn` before assuming it
  # is free.
  #
  # docker_stats:
  #   endpoint: http://socket-proxy:2375
  #   collection_interval: 30s
  #   container_labels_to_metric_labels:
  #     com.docker.compose.service: compose_service
  #   metrics:
  #     container.cpu.utilization:
  #       enabled: true
  #     container.memory.usage.total:
  #       enabled: true
  #     container.restarts:
  #       enabled: true

processors:
  # memory_limiter MUST be the first processor of every pipeline. It applies
  # backpressure on the receiver before the collector gets killed by OOM. Without it, a
  # telemetry spike takes the container down and you lose the signal right at the moment
  # of the incident — which is exactly when you need it.
  # Sized to fit with room to spare: the compose does not impose deploy.resources on the
  # collector, so this is the de facto cap.
  memory_limiter:
    check_interval: 1s
    limit_mib: 384
    spike_limit_mib: 96

  # Stamps host.name / os.type on the resource. Replaces the `Computer` and
  # `_ResourceId` columns that Log Analytics injected on its own into every line.
  # The `docker` detector is deliberately OUT: it requires the Docker socket, which this
  # container does not mount (see the docker_stats receiver above). `system` requires nothing.
  resourcedetection:
    detectors: [env, system]
    system:
      hostname_sources: [os]
      resource_attributes:
        host.name:
          enabled: true
        os.type:
          enabled: true
    timeout: 5s
    override: false

  # Groups before exporting. Drastically reduces the number of writes to Prometheus.
  # send_batch_max_size limits the size of the remote-write request.
  batch:
    timeout: 10s
    send_batch_size: 1024
    send_batch_max_size: 2048

exporters:
  # ---------------------------------------------------------------------------
  # METRICS -> Prometheus (remote-write)
  # ---------------------------------------------------------------------------
  # Push, not pull: the apps do not expose /metrics (the API does not even have the
  # Micrometer registry), so Prometheus would have nothing to scrape. The remote-write
  # receiver is turned on by the --web.enable-remote-write-receiver flag in docker-compose.yml:476.
  #
  # How the labels come out on the other side (this defines the dashboard queries):
  #   resource service.name        -> label `job`       (e.g. job="nora-api")
  #   resource service.instance.id -> label `instance`
  #   other resource attributes    -> only on the `target_info` series
  # That is why the dashboard filters by `job=~"$job"` and not by `service_name`.
  #
  # The javaagent generates a new service.instance.id (UUID) on every JVM boot, so each
  # deploy creates a new series. With 1 replica and 30d retention that is irrelevant noise,
  # but the dashboard queries always aggregate by `job` so they do not break during the rollout.
  #
  # Silent requirement: remote-write only accepts CUMULATIVE temporality. The javaagent 2.x
  # already exports cumulative by default — do not set OTEL_EXPORTER_OTLP_METRICS_TEMPORALITY_PREFERENCE=delta
  # or the metrics are dropped with no visible error in the app.
  prometheusremotewrite:
    endpoint: http://prometheus:9090/api/v1/write
    tls:
      insecure: true   # traffic never leaves the `internal` bridge (internal: true)
    add_metric_suffixes: true      # http.server.request.duration -> http_server_request_duration_seconds
    target_info:
      enabled: true                # target_info series with host.name, os.type, service.version
    resource_to_telemetry_conversion:
      enabled: false               # true would blow up cardinality with host.name on every series
    remote_write_queue:
      enabled: true
      num_consumers: 5
      queue_size: 10000
    external_labels:
      source: otel-collector

  # ---------------------------------------------------------------------------
  # LOGS -> Loki (native OTLP)
  # ---------------------------------------------------------------------------
  # The `loki` exporter was DEPRECATED in 0.107 and REMOVED from contrib shortly after.
  # The supported path today is otlphttp against Loki 3.x's native OTLP endpoint:
  # the exporter appends /v1/logs, so the base is http://loki:3100/otlp.
  #
  # TODAY THIS EXPORTER RECEIVES NOTHING: the compose sets OTEL_LOGS_EXPORTER: none on the
  # API (docker-compose.yml:301) and logs enter Loki through Alloy, reading the Docker socket.
  # The pipeline exists so that turning OTEL_LOGS_EXPORTER=otlp on is an env var swap,
  # without touching this file. If you turn it on, know that it will DUPLICATE: the same line
  # arrives via the SDK and via stdout through Alloy.
  otlphttp/loki:
    endpoint: http://loki:3100/otlp
    tls:
      insecure: true
    compression: gzip

  # ---------------------------------------------------------------------------
  # TRACES -> nowhere (see §TRACES in the service block)
  # ---------------------------------------------------------------------------
  # verbosity: basic prints only aggregated counters, not the content of the spans.
  # Do not use `detailed` here: the compose's json-file driver has max-size 20m/5 files
  # and a verbose trace fills that in minutes.
  debug:
    verbosity: basic
    sampling_initial: 2
    sampling_thereafter: 500

extensions:
  # Target of the compose healthcheck (docker-compose.yml:461-465, wget on :13133/).
  # Same localhost gotcha as the receivers: it needs an explicit 0.0.0.0.
  health_check:
    endpoint: 0.0.0.0:13133
    path: /

service:
  extensions: [health_check]

  telemetry:
    logs:
      level: info
    metrics:
      level: normal
      # The collector's own internal metrics (otelcol_receiver_accepted_*,
      # otelcol_exporter_send_failed_*). The `otel-collector` job in prometheus.yml
      # scrapes exactly this port — without 0.0.0.0 here that scrape gets
      # connection refused and you go blind to telemetry loss.
      address: 0.0.0.0:8888

  pipelines:
    # -------------------------------------------------------------------------
    # TRACES — received and DISCARDED. This is not a bug, it is the real state.
    # -------------------------------------------------------------------------
    # There is no traces backend in this stack: docker-compose.yml has no Tempo,
    # no Jaeger and no equivalent. App Insights' "Transaction Search" / "Application Map" /
    # "End-to-end transaction details" has NO replacement today. That is a functionality
    # regression, not parity.
    #
    # The pipeline exists anyway because the compose already points OTEL_EXPORTER_OTLP_ENDPOINT
    # of four services here. Without a registered traces pipeline, the collector
    # returns an error on every export and the apps fill the log with export failures.
    #
    # To close the gap, add a `tempo` service to the compose and swap `debug` for:
    #
    #   otlp/tempo:
    #     endpoint: tempo:4317
    #     tls:
    #       insecure: true
    #
    # Alternative without Tempo (traces become RED metrics instead of vanishing): the
    # `spanmetrics` connector. Mostly worth it for the database spans, which do not show up
    # in http.server.request.duration:
    #
    #   connectors:
    #     spanmetrics:
    #       namespace: traces.spanmetrics
    #       histogram:
    #         unit: s
    #       dimensions:
    #         - name: http.route
    #         - name: http.response.status_code
    #       metrics_flush_interval: 30s
    #
    #   ... and then traces.exporters: [debug, spanmetrics] + metrics.receivers: [otlp, spanmetrics]
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resourcedetection, batch]
      exporters: [debug]

    # -------------------------------------------------------------------------
    # METRICS — the leg that actually works
    # -------------------------------------------------------------------------
    # Source today: ONLY the API (OTel javaagent). worker, web and admin have
    # OTEL_EXPORTER_OTLP_ENDPOINT set in the compose but do NOT have an SDK installed —
    # the env var does nothing on its own. See the folder's README.
    # `hostmetrics` and `postgresql` join `otlp` here: both are scrapers, both feed the same
    # remote-write path, and both exist to make an alert rule possible rather than to fill a
    # dashboard. If either is removed, the matching rule in
    # grafana/provisioning/alerting/rules.yaml starts evaluating against a series that does
    # not exist — with `noDataState: Alerting` on the Postgres rule that is loud, which is the
    # intended direction.
    metrics:
      receivers: [otlp, hostmetrics, postgresql]
      # include docker_stats here if you mount the socket:  [otlp, docker_stats]
      processors: [memory_limiter, resourcedetection, batch]
      exporters: [prometheusremotewrite]

    # -------------------------------------------------------------------------
    # LOGS — idle by design (the production path is Alloy -> Loki)
    # -------------------------------------------------------------------------
    logs:
      receivers: [otlp]
      processors: [memory_limiter, resourcedetection, batch]
      exporters: [otlphttp/loki]
