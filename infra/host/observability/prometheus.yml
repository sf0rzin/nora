# NORA — Prometheus
# =============================================================================
# Replaces the "metrics" half of Application Insights (Metrics Explorer, Live Metrics
# charts, metric alerts) and is the source of the PrometheusHealthSource that
# retires AppInsightsHealthSource.java (that one did a GET with KQL against
# api.applicationinsights.io/v1/apps/{id}/query — there is no automatic translation;
# it is a Java class rewrite, see ADR 0034).
#
# RETENTION: 30 days, to match Log Analytics' `retentionInDays: 30`.
# It is NOT declared here. It is in the docker-compose.yml:475 flag:
#     --storage.tsdb.retention.time=30d
# There is no `retention` key in prometheus.yml. If someone tries to put one in,
# Prometheus fails the config parse and does not come up.
#
# REMOTE-WRITE (receiving): also not configured here. This file's `remote_write` block
# is for SENDING out; RECEIVING depends on the compose flag:
#     --web.enable-remote-write-receiver          (docker-compose.yml:476)
# which opens POST /api/v1/write. That is where everything the otel-collector pushes comes in.
#
# Two data paths, not one:
#   1. PUSH  — otel-collector -> /api/v1/write  -> app metrics (only the API has an SDK)
#   2. SCRAPE — the jobs below                  -> infra metrics
# The apps have no /metrics endpoint (the API has no micrometer-registry-prometheus and the
# actuator only exposes health,info). There is no point creating a scrape job for api/web/worker/admin.

global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s
  external_labels:
    cluster: nora-host
    env: prod

# No Alertmanager in the stack yet. Alerting today is Grafana's (unified alerting),
# which queries this Prometheus as a datasource. If an Alertmanager enters the compose,
# this is where it gets pointed at.
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets: ["alertmanager:9093"]

# rule_files: []

scrape_configs:
  # ---------------------------------------------------------------------------
  # Prometheus itself — "who watches the watchman"
  # ---------------------------------------------------------------------------
  # prometheus_tsdb_head_series is the cardinality-explosion indicator; on a single
  # VM, it is what fills the disk before the 30d retention has a chance to act.
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
        labels:
          component: observability

  # ---------------------------------------------------------------------------
  # OTel Collector — internal telemetry (port 8888, NOT 4317/4318)
  # ---------------------------------------------------------------------------
  # Most important signal from here: otelcol_exporter_send_failed_metric_points_total.
  # If that counter climbs, remote-write is failing and the dashboard goes flat
  # without a single error showing up in the apps.
  # Depends on `service.telemetry.metrics.address: 0.0.0.0:8888` in otel-collector.yaml
  # (the default is localhost and the scrape would get connection refused).
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8888"]
        labels:
          component: observability

  # ---------------------------------------------------------------------------
  # Caddy — edge metrics (the closest thing to "Container Apps ingress requests")
  # ---------------------------------------------------------------------------
  # >>> THIS JOB DOES NOT WORK WITH THE CADDYFILE AS IT IS. <<<
  #
  # There are TWO preconditions, and today's caddy/Caddyfile meets NEITHER of them:
  #
  #   1) admin reachable from outside the container.
  #      The Caddyfile has `admin localhost:2019` (caddy/Caddyfile:53) — bound only to
  #      loopback. The compose healthcheck (docker-compose.yml:101) works because it runs
  #      INSIDE the container; a scrape coming from Prometheus gets connection refused.
  #      Do NOT switch to `admin 0.0.0.0:2019` without thinking: the admin API reconfigures
  #      the whole proxy at runtime and would become exposed to EVERY container on the
  #      `edge` and `internal` networks — including cloudflared, which is what receives
  #      traffic from the internet. That trade-off is documented in the Caddyfile:47-53 itself.
  #      The way out without that cost is to serve the metrics from a dedicated site block,
  #      which uses the same Prometheus registry but does NOT expose the admin API:
  #
  #          http://:2021 {
  #              metrics /metrics
  #          }
  #
  #      ...and then switch the target below to ["caddy:2021"]. (You cannot use :2019
  #      in the site block: 0.0.0.0:2019 collides with the admin's 127.0.0.1:2019.)
  #
  #   2) global `servers { metrics }` block — absent today.
  #      Since Caddy 2.7 the per-handler metrics (caddy_http_*) are OPT-IN, because of
  #      cardinality. Without it, the endpoint answers 200 but only with Go runtime and
  #      admin metrics — no caddy_http_request_duration_seconds at all.
  #
  # The two preconditions do not block the same set of panels, and the difference matters
  # when prioritizing:
  #
  #   - (1) on its own takes down EVERYTHING here, including `caddy_reverse_proxy_upstreams_healthy`
  #     — if the endpoint is not reachable, there is no scrape at all.
  #   - (2) only takes down the caddy_http_* family ("Req/s at the edge", "5xx/s at the edge",
  #     "Req/s by HTTP code", "Latency at the edge"). The upstreams gauge is registered
  #     by the reverse_proxy module and does NOT depend on the opt-in, so fixing (1) alone
  #     already lights up "Healthy upstreams (Caddy)" and "Healthy upstreams by target".
  #
  # This is relevant because those two upstream panels are the ONLY metric with
  # per-service granularity that covers web and admin. Fixing (1) is the biggest gain per
  # changed line in the whole stack. None of this raises an error: it is collection turned
  # off, not a broken panel.
  #
  # Real limitation: Caddy's labels are server/handler/code/method. `server` is the
  # autogenerated listener name (srv0, srv1...), NOT the Host. Since web/api/admin/grafana
  # share the same listener behind cloudflared, Caddy gives the edge AGGREGATE,
  # not RED per service. What separates by service is the `upstream` of
  # caddy_reverse_proxy_upstreams_healthy — and only for health, not for latency.
  - job_name: caddy
    static_configs:
      - targets: ["caddy:2019"]
        labels:
          component: edge

  # ---------------------------------------------------------------------------
  # cloudflared — tunnel health
  # ---------------------------------------------------------------------------
  # The `--metrics 0.0.0.0:2000` is already in the compose command (docker-compose.yml:68),
  # so this side is right.
  #
  # cloudflared has to be on `edge` AND `internal`: prometheus only exists on
  # `internal`, and without a shared interface the scrape dies on "no such host" (that is
  # what happened on the first deploy of VM 106 — the only `down` target out of seven). This
  # does NOT expose cloudflared to anything more: `internal` is `internal: true` and has no
  # route to the internet; it only adds the interface on the inside.
  #
  # If one day cloudflared goes back to `networks: [edge]`, this job starts failing again —
  # and the failure is silent in the wrong place: the tunnel keeps working, it is only the
  # metric that proves it works that disappears.
  #
  # The metric that matters: cloudflared_tunnel_ha_connections (expected 4 — four connections
  # to the Cloudflare edge). Dropping to 0 is the 522 that took nora.systems down.
  # The request counters (cloudflared_tunnel_total_requests) are NOT trustworthy:
  # they depend on the transport and stay at zero on the QUIC path. Do not build a panel on them.
  - job_name: cloudflared
    static_configs:
      - targets: ["cloudflared:2000"]
        labels:
          component: edge

  # ---------------------------------------------------------------------------
  # Loki — the alarm that retention has stopped
  # ---------------------------------------------------------------------------
  # loki_boltdb_shipper_compact_tables_operation_last_successful_run_timestamp_seconds
  # going stale = compactor stopped = the 720h retention is not deleting anything.
  # See the big warning in loki.yaml.
  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]
        labels:
          component: observability

  # ---------------------------------------------------------------------------
  # Alloy — if the log shipper dies, nobody notices through the logs
  # ---------------------------------------------------------------------------
  # loki_write_dropped_entries_total > 0 is real log loss.
  - job_name: alloy
    static_configs:
      - targets: ["alloy:12345"]
        labels:
          component: observability

  - job_name: grafana
    static_configs:
      - targets: ["grafana:3000"]
        labels:
          component: observability

  # ---------------------------------------------------------------------------
  # NOT CONFIGURED — per-container metrics (CPU/memory/restarts)
  # ---------------------------------------------------------------------------
  # This is the gap equivalent to the Container Apps "Metrics" panel. There is no cAdvisor
  # and no node-exporter in docker-compose.yml, so the series
  # container_cpu_usage_seconds_total / container_memory_working_set_bytes DO NOT EXIST.
  # The nora-overview dashboard does not use them on purpose — inventing those queries
  # would only produce an empty panel.
  #
  # Two ways to close it (pick one):
  #   a) docker_stats receiver in the otel-collector (see otel-collector.yaml) — no
  #      new container, but it requires mounting the socket into the collector;
  #   b) cAdvisor as a compose service and uncomment the job below.
  #
  # - job_name: cadvisor
  #   static_configs:
  #     - targets: ["cadvisor:8080"]
  #       labels:
  #         component: host
