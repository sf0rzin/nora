# NORA — Grafana datasources (provisioned, not created through the UI)
# =============================================================================
# Mounted read-only in docker-compose.yml:538. `editable: false` is intentional:
# the grafana_data volume persists, but a datasource created/edited through the UI is
# not versioned and disappears the day the volume is recreated. Here, the file is the truth.
#
# The `uid`s are FIXED and stable. nora-overview.json references these uids
# literally; if someone changes them, every dashboard panel breaks with
# "Datasource nora-prometheus was not found". Do not generate a random uid.

apiVersion: 1

# Removes datasources with these names before applying. Avoids a duplicate of the
# "Prometheus-1" kind when someone already created one by hand through the UI.
deleteDatasources:
  - name: Prometheus
    orgId: 1
  - name: Loki
    orgId: 1

datasources:
  # ---------------------------------------------------------------------------
  # Prometheus — metrics (default)
  # ---------------------------------------------------------------------------
  # Default because it is what most panels use and what "Explore" opens
  # first. Replaces the Application Insights Metrics Explorer.
  - name: Prometheus
    uid: nora-prometheus
    type: prometheus
    access: proxy          # the browser talks to Grafana; Grafana talks to Prometheus
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      # POST instead of GET: dashboard queries with a route regex blow past the URL
      # limit on GET.
      httpMethod: POST
      # Matches the scrape_interval in prometheus.yml. Without this Grafana guesses 15s
      # and $__rate_interval can end up smaller than the real scrape interval,
      # producing a jagged graph with holes.
      timeInterval: 15s
      prometheusType: Prometheus
      prometheusVersion: 3.1.0
      # Alerting is managed by Grafana's unified alerting, not by rules
      # loaded from Prometheus (there are no rule_files in prometheus.yml).
      manageAlerts: false
      incrementalQuerying: true

  # ---------------------------------------------------------------------------
  # Loki — logs
  # ---------------------------------------------------------------------------
  # Replaces the Log Analytics log query (the KQL queries over
  # ContainerAppConsoleLogs_CL). The language changes from KQL to LogQL: no saved query
  # from Azure is portable, all of them have to be rewritten by hand.
  - name: Loki
    uid: nora-loki
    type: loki
    access: proxy
    url: http://loki:3100
    isDefault: false
    editable: false
    jsonData:
      # Cap of the logs panel. Above that the browser chokes before Loki does.
      maxLines: 1000
      timeout: 60
      # NO derivedFields for trace_id: it would be App Insights' "jump from the log to
      # the transaction", but it requires a traces datasource (there is no Tempo in the
      # compose) and trace_id in logback's MDC. Adding it today would only create a broken link.
      # When Tempo exists, this is the block:
      #   derivedFields:
      #     - name: TraceID
      #       matcherRegex: 'trace_id=(\w+)'
      #       url: '$${__value.raw}'
      #       datasourceUid: nora-tempo
