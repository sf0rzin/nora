# NORA — self-hosted production stack (single bare-metal host, no hypervisor + Docker Compose).
#
# Replaces the Azure Container Apps Environment that used to be defined in infra/bicep/main.bicep
# (ADR 0034; that directory is deleted — ADR 0036). Every service here was the 1:1 counterpart of a
# `container-app.bicep` module; the env vars were transcribed from that file's line 694-1540 (all
# 92 declarations, not just the API block).
#
# Topology:
#
#   Internet ──> Cloudflare edge ──(tunnel, egress-only)──> cloudflared
#                                                              │
#                                                            caddy            <- retry buffer
#                                                        ┌─────┼─────┐           of the rolling update
#                                                       web   api   admin
#                                                              │
#                                                           worker (internal)
#                                                              │
#                                              postgres  +  postgres-platform
#
# Usage:  ./scripts/deploy.sh          (health-gated rollout of every service)
#       docker compose --env-file .env up -d --wait
#
# Do NOT expose ports on the host: all traffic comes in through cloudflared. The only
# published ports are on 127.0.0.1 (local debug via SSH port-forward).

name: nora

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"
    tag: "{{.Name}}"

x-restart: &default-restart
  restart: unless-stopped

networks:
  edge:
    driver: bridge
  internal:
    driver: bridge
    internal: true   # no route to the internet: postgres and worker cannot get out on their own
  data:
    driver: bridge
    internal: true
  # Two members and no more: `socket-proxy` and `alloy`. It exists so that reaching the
  # filtered Docker API is not something every container on `internal` can do — putting the
  # proxy on `internal` would have handed a read-only view of the daemon to `web`, `api`,
  # `caddy` and everything else, which is a smaller hole than the raw socket but still a hole
  # nobody asked for. `internal: true` for the same reason as the other two: nothing on this
  # bridge has any business talking to the internet.
  docker-api:
    driver: bridge
    internal: true

# WHICH OF THESE SEVEN IS BACKED UP, AND WHICH IS NOT BY DECISION.
#
# The `backup` service dumps the two Postgres databases hourly and
# scripts/offsite-backup.sh copies the newest verified dump off the host. The other five
# volumes are covered by nothing, and that is a decision rather than an oversight — the
# reasoning is in offsite-backup.sh's header, summarised here because this is the list a
# reader counts:
#
#   pgdata, pgdata_platform  -> dumped hourly, verified, copied off-host. Tenant data; it
#                               cannot be reproduced from anything.
#   prometheus_data          -> NOT backed up. 30d of metrics, derived. Losing the host loses
#   loki_data                -> NOT backed up. 30d of logs, derived. ...the forensic record of
#                               the incident that took the host, which is the real cost and is
#                               accepted: it is evidence about an event, not the product.
#   grafana_data             -> NOT backed up, and needs no backup: dashboards and datasources
#                               are provisioned from this repository, and the rest is UI state.
#   caddy_data, caddy_config -> NOT backed up. ACME state for certificates the origin does not
#                               use (TLS terminates at Cloudflare); reissued on demand.
volumes:
  pgdata:
  pgdata_platform:
  grafana_data:
  loki_data:
  prometheus_data:
  caddy_data:
  caddy_config:

services:
  # ==========================================================================
  # EDGE — cloudflared (ADR 0025, extended from admin to the whole stack)
  # ==========================================================================
  # Replaces: Container Apps external ingress + managed certificates + staticIp.
  # The visitor's TLS is Cloudflare's Universal SSL; the origin needs no cert
  # (SSL mode Full, as it already was — see the audit fix about the "window without TLS").
  cloudflared:
    image: cloudflare/cloudflared:2026.5.2
    container_name: nora-cloudflared
    <<: *default-restart
    logging: *default-logging
    command: tunnel --no-autoupdate --metrics 0.0.0.0:2000 run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?CLOUDFLARE_TUNNEL_TOKEN is required}
    # For the `ssh.nora.systems` Public Hostname, which routes to the host's own sshd so the
    # machine is reachable from networks that block outbound 22 (the tunnel speaks TLS/443).
    #
    # `ssh://localhost:22` does NOT work and is the mistake to avoid: this connector is a
    # CONTAINER, so its localhost is the container's own loopback, where nothing listens.
    # `host.docker.internal` resolves to the Docker bridge gateway, which is the host.
    # Verified on 2026-08-10 with an ephemeral container on this same network:
    #   getent -> 172.17.0.1, and `nc host.docker.internal 22` returns
    #   SSH-2.0-OpenSSH_9.6p1 Ubuntu-3ubuntu13.18
    #
    # INERT UNTIL THIS CONTAINER IS RECREATED, and inert until the route is switched to the
    # name. `extra_hosts` is written into /etc/hosts at container creation, and the live ingress
    # rule currently names the IP (`ssh://172.17.0.1:22`, see cloudflared/config.yml). Both
    # steps, and the fact that recreating this container drops the only ingress for a few
    # seconds, are in docs/operations/ssh-over-tunnel.md under "Applying extra_hosts".
    #
    # This adds no exposure by itself. A Public Hostname is only reachable once it exists in
    # the tunnel's ingress, and the one in front of ssh:// is gated by a Cloudflare Access
    # policy. sshd, port 22 and the firewall are untouched: the direct path keeps working
    # exactly as before.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # `internal` is not for serving traffic — it is so prometheus (which only lives on
    # it) can reach the :2000 metrics. Without it the `cloudflared` job in prometheus.yml
    # gives "no such host" and the stack loses precisely the signal that the tunnel is up
    # (cloudflared_tunnel_ha_connections; dropping to 0 is the 522 that took nora.systems down).
    # `internal: true` has no route to the internet, so this does not widen cloudflared's
    # exposure — it only adds the interface on the inside.
    networks: [edge, internal]
    depends_on:
      caddy:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "cloudflared", "--version"]
      interval: 60s
      timeout: 5s
      retries: 3

  # ==========================================================================
  # EDGE — Caddy (Host-based routing + retry buffer during the rolling update)
  # ==========================================================================
  # Why it exists: `docker compose up -d` tears the old container down BEFORE bringing the
  # new one up (there is no readiness gate like Container Apps' `activeRevisionsMode: Single`).
  # The Spring boot with Flyway takes ~30s. `lb_try_duration` in the Caddyfile turns that
  # 502 into a slow request. See docs/operations/host-deploy.md §rolling update.
  caddy:
    image: caddy:2.8-alpine
    container_name: nora-caddy
    <<: *default-restart
    logging: *default-logging
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      NORA_PUBLIC_DOMAIN: ${NORA_PUBLIC_DOMAIN:-nora.systems}
    networks: [edge, internal]
    healthcheck:
      # Do NOT use `--spider` against the admin API's :2019/config/: busybox wget's
      # `--spider` issues HEAD, and that handler only deals with GET/POST/PUT/PATCH/DELETE —
      # HEAD falls into the default and comes back 405. wget exits != 0, the container never
      # becomes healthy, and cloudflared (`condition: service_healthy`) never comes up: the
      # whole stack is unreachable with no obvious error. The /healthz of the :80 block is
      # served by `respond`, which handles HEAD without complaining. Second reason to keep it
      # this way: the admin API binds loopback only, so a check that ever moves out of this
      # container would not reach :2019 at all. See caddy/Caddyfile §admin and its `:80` block.
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ==========================================================================
  # DATA — primary Postgres (replaces nora-pg-dev, B1ms Burstable)
  # ==========================================================================
  # pgvector/pgvector image: the extension is AVAILABLE but is NOT created. V021
  # stores embeddings as JSON in TEXT and computes cosine in Java precisely because
  # Azure's allow-list blocked pgvector — leaving Azure unblocks it, but changing that is
  # a RAG refactor, not an infra migration. See ADR 0034 §escopo-excluido.
  postgres:
    image: pgvector/pgvector:pg16
    container_name: nora-postgres
    <<: *default-restart
    logging: *default-logging
    environment:
      POSTGRES_DB: nora
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:-nora_admin}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?POSTGRES_ADMIN_PASSWORD is required}
      # pt-BR locale consistent with what the Flexible Server delivered.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5432:5432"   # loopback only — remote access via `ssh -L`
    networks: [data]
    shm_size: 256mb
    command:
      - postgres
      - -c
      - max_connections=100
      - -c
      - shared_buffers=512MB
      - -c
      - effective_cache_size=1536MB
      - -c
      - work_mem=8MB
      - -c
      - log_min_duration_statement=1000
      - -c
      - log_connections=on
      - -c
      - log_disconnections=on
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_ADMIN_USER:-nora_admin} -d nora"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ==========================================================================
  # DATA — platform Postgres (ADR 0022: isolated blast radius)
  # ==========================================================================
  # SEPARATE server, as in the now-deleted Bicep (`postgresPlatform`, main.bicep:609). On a
  # single host the isolation is weaker than Azure's was, but it preserves the
  # PLATFORM_DATASOURCE_URL contract and keeps dump/restore of the two databases independent.
  postgres-platform:
    image: pgvector/pgvector:pg16
    container_name: nora-postgres-platform
    <<: *default-restart
    logging: *default-logging
    profiles: ["platform"]
    environment:
      POSTGRES_DB: nora_platform
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:-nora_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PLATFORM_ADMIN_PASSWORD:-${POSTGRES_ADMIN_PASSWORD}}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"
    volumes:
      - pgdata_platform:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    networks: [data]
    shm_size: 128mb
    command:
      - postgres
      - -c
      - max_connections=50
      - -c
      - shared_buffers=256MB
      - -c
      - log_min_duration_statement=1000
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_ADMIN_USER:-nora_admin} -d nora_platform"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ==========================================================================
  # APP — NLP Worker (replaces nora-worker-dev; internal ingress, min 0 max 3)
  # ==========================================================================
  # No scale-to-zero: on a single host the cost of keeping 1 replica up is irrelevant and
  # it removes the cold start. The Dockerfile's `--workers 2` still applies.
  worker:
    image: ${REGISTRY:-ghcr.io}/${IMAGE_PREFIX:-sf0rzin/nora}-worker:${WORKER_TAG:-latest}
    container_name: nora-worker
    <<: *default-restart
    logging: *default-logging
    environment:
      NORA_ENV: ${NORA_ENV:-prod}
      USE_LLM_STUB: ${USE_LLM_STUB:-false}
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      LLM_API_KEY: ${OPENAI_API_KEY:-}
      LLM_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      # Wall-clock budget for one request. Must stay under the API's nora.worker.timeout-millis
      # (120000), or the worker keeps spending tokens after the caller has given up.
      LLM_REQUEST_BUDGET_SECONDS: ${LLM_REQUEST_BUDGET_SECONDS:-90}
      # Observability: OTLP to the local collector (replaces APPLICATIONINSIGHTS_CONNECTION_STRING).
      OTEL_SERVICE_NAME: nora-worker
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      # Control plane (ADR 0024) — only with the platform profile.
      NORA_PLATFORM_INTERNAL_TOKEN: ${NORA_PLATFORM_INTERNAL_TOKEN:-}
      NORA_API_BASE_URL: http://api:8080
      # Service-to-service auth for /analyze, /split and /analyze-live: the API sends this in
      # `X-Internal-Token` and the worker verifies it. Required (`:?`) because the worker is
      # otherwise open to every container on `internal` and `edge` — posting a transcript is
      # all it takes to spend an LLM call on this project's account. Must be the SAME value
      # the `api` service gets below, and a DIFFERENT one from NORA_PLATFORM_INTERNAL_TOKEN
      # (that one travels worker -> API; same word, opposite direction, distinct secret).
      NORA_WORKER_INTERNAL_TOKEN: ${NORA_WORKER_INTERNAL_TOKEN:?NORA_WORKER_INTERNAL_TOKEN is required (openssl rand -hex 32); it authenticates api -> worker and is NOT NORA_PLATFORM_INTERNAL_TOKEN}
    # `edge` does NOT publish a port: there is no `ports:` here and the only entry point
    # is still cloudflared -> caddy. It exists because the `internal` and `data` networks
    # are `internal: true`, which blocks egress AND external DNS resolution. Without it the
    # stack comes up with ALL healthchecks green (they are local) and fails on the first real call.
    networks: [internal, edge]
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1536M
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ==========================================================================
  # APP — Spring Boot API (replaces nora-api-dev; 1 vCPU / 2Gi, min 1)
  # ==========================================================================
  api:
    image: ${REGISTRY:-ghcr.io}/${IMAGE_PREFIX:-sf0rzin/nora}-api:${API_TAG:-latest}
    container_name: nora-api
    <<: *default-restart
    logging: *default-logging
    environment:
      SPRING_PROFILES_ACTIVE: ${NORA_ENV:-prod}
      NORA_ENV: ${NORA_ENV:-prod}

      # ---- Primary datasource ----
      # sslmode REMOVED on purpose: the official Postgres image comes up with SSL OFF and
      # `?sslmode=require` makes Hikari fail at boot. Traffic never leaves the `data` bridge,
      # which is `internal: true`. See the audit fix about sslmode.
      DATASOURCE_URL: jdbc:postgresql://postgres:5432/nora
      DATASOURCE_USERNAME: ${DATASOURCE_USERNAME:-nora_admin}
      # Defaults to the admin password so nothing changes before the RLS cutover. After it,
      # DATASOURCE_USERNAME becomes nora_app and DATASOURCE_PASSWORD has to be able to become
      # nora_app's password -- without this indirection the username could be switched and the
      # password could not, which is a login failure at boot with a misleading message.
      DATASOURCE_PASSWORD: ${DATASOURCE_PASSWORD:-${POSTGRES_ADMIN_PASSWORD:?POSTGRES_ADMIN_PASSWORD is required}}

      # ---- RLS enforce (ADR 0026/0028) — separate flip, see rls-cutover ----
      NORA_RLS_ENFORCE: ${NORA_RLS_ENFORCE:-false}
      # Flyway ALWAYS points at the admin/owner: it needs DDL and needs to own the
      # tables so that nora_app (non-owner) is subject to RLS. After the cutover
      # DATASOURCE_* becomes nora_app and these three do NOT follow — that separation
      # is exactly what ADR 0028 asks for.
      #
      # Do not use `${SPRING_FLYWAY_URL:-}` here. An empty string is a DEFINED variable, and
      # a defined `spring.flyway.url` (even empty) satisfies FlywayUrlCondition: Spring
      # stops inheriting spring.datasource and builds its own SimpleDriverDataSource from
      # an empty URL. The boot dies on `Driver has not been set`, inside the
      # flywayInitializer, without naming the guilty variable. The comment in application.yml
      # already warned about this; the compose fell into the hole anyway, on the first real deploy.
      SPRING_FLYWAY_URL: ${SPRING_FLYWAY_URL:-jdbc:postgresql://postgres:5432/nora}
      # Defaults to the OWNER, not to DATASOURCE_USERNAME. It used to follow it, which turned
      # the documented cutover into a boot failure: setting DATASOURCE_USERNAME=nora_app also
      # pointed Flyway at nora_app, with the admin password (the line below defaults to that
      # independently), so Flyway failed to authenticate -- and had it authenticated, Flyway
      # would have been running as a NOBYPASSRLS non-owner, which cannot do DDL and defeats the
      # whole premise of ADR 0028. Flyway must be the owner; that is what makes nora_app subject
      # to the policies.
      SPRING_FLYWAY_USER: ${SPRING_FLYWAY_USER:-${POSTGRES_ADMIN_USER:-nora_admin}}
      SPRING_FLYWAY_PASSWORD: ${SPRING_FLYWAY_PASSWORD:-${POSTGRES_ADMIN_PASSWORD}}
      # All THREE roles matter: nora_app (NOBYPASSRLS), nora_telemetry (BYPASSRLS) and the
      # admin/owner. Without nora_telemetry the operator panel sees 0 rows SILENTLY.
      NORA_TELEMETRY_DATASOURCE_URL: ${NORA_TELEMETRY_DATASOURCE_URL:-}
      NORA_TELEMETRY_DATASOURCE_USERNAME: ${NORA_TELEMETRY_DATASOURCE_USERNAME:-}
      NORA_TELEMETRY_DATASOURCE_PASSWORD: ${NORA_TELEMETRY_DATASOURCE_PASSWORD:-}

      # ---- Auth ----
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required (min 32 chars)}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_RS256_PRIVATE_KEY_PEM: ${JWT_RS256_PRIVATE_KEY_PEM:-}
      JWT_RS256_KID: ${JWT_RS256_KID:-nora-key-1}
      AUTH_COOKIE_SECURE: "true"
      AUTH_COOKIE_DOMAIN: ${NORA_PUBLIC_DOMAIN:-nora.systems}
      EXPOSE_DEV_TOKENS: "false"

      # ---- Public URLs / CORS ----
      CORS_ALLOWED_ORIGINS: https://${NORA_PUBLIC_DOMAIN:-nora.systems},https://www.${NORA_PUBLIC_DOMAIN:-nora.systems}
      NORA_APP_PUBLIC_BASE_URL: https://${NORA_PUBLIC_DOMAIN:-nora.systems}
      NORA_FRONTEND_BASE_URL: https://${NORA_PUBLIC_DOMAIN:-nora.systems}

      # ---- Worker ----
      NLP_WORKER_BASE_URL: http://worker:8001
      # Same value the `worker` service above requires — this is the sending side.
      NORA_WORKER_INTERNAL_TOKEN: ${NORA_WORKER_INTERNAL_TOKEN:?NORA_WORKER_INTERNAL_TOKEN is required (openssl rand -hex 32); it authenticates api -> worker and is NOT NORA_PLATFORM_INTERNAL_TOKEN}

      # ---- Embeddings (RAG) + realtime STT session broker (ADR 0039/0045) ----
      # OPENAI_API_KEY now feeds two things in this service: embeddings, and the key exchange
      # behind POST /stt/sessions. It stays in this container: the endpoint returns a short-lived
      # client secret, never the key, and the desktop bundle never carries one.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # Bare key = pass through from the host env, and DO NOT SET when it is absent. The
      # `${VAR:-}` form used elsewhere in this file would inject an empty string, and an empty
      # string is a resolved value: it would win over the `${OPENAI_API_KEY:}` fallback that
      # application.yml declares for this property, silently disabling STT on a host that has a
      # perfectly good OPENAI_API_KEY.
      NORA_STT_OPENAI_API_KEY:
      NORA_STT_MODEL: ${NORA_STT_MODEL:-gpt-live-transcribe}
      NORA_STT_SESSIONS_PER_MINUTE: ${NORA_STT_SESSIONS_PER_MINUTE:-12}

      # ---- Email ----
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      NORA_EMAIL_FROM: ${NORA_EMAIL_FROM:-NORA <onboarding@resend.dev>}

      # ---- LGPD (ADR 0029) ----
      # 0 or negative = retention OFF (nothing is purged, and that is this default);
      # N >= 1 = purge meetings older than N days. There is no value meaning "purge
      # now" — lowering it towards zero turns the purge off. The API logs which state
      # is active at boot. See infra/host/.env.example for the full note.
      NORA_PRIVACY_RETENTION_DAYS: ${NORA_PRIVACY_RETENTION_DAYS:-0}
      NORA_PRIVACY_RETENTION_CRON: ${NORA_PRIVACY_RETENTION_CRON:-0 30 3 * * *}

      # ---- Observability (OTel; replaces the App Insights agent) ----
      OTEL_SERVICE_NAME: nora-api
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_METRICS_EXPORTER: otlp
      OTEL_LOGS_EXPORTER: none

      # ---- OAuth integrations (ADR 0031). Redirect URIs derive from the public domain. ----
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      GOOGLE_OAUTH_REDIRECT_URI: https://api.${NORA_PUBLIC_DOMAIN:-nora.systems}/integrations/google/oauth/callback
      SLACK_OAUTH_CLIENT_ID: ${SLACK_OAUTH_CLIENT_ID:-}
      SLACK_OAUTH_CLIENT_SECRET: ${SLACK_OAUTH_CLIENT_SECRET:-}
      SLACK_OAUTH_REDIRECT_URI: https://api.${NORA_PUBLIC_DOMAIN:-nora.systems}/integrations/slack/oauth/callback
      GITHUB_OAUTH_CLIENT_ID: ${GITHUB_OAUTH_CLIENT_ID:-}
      GITHUB_OAUTH_CLIENT_SECRET: ${GITHUB_OAUTH_CLIENT_SECRET:-}
      GITHUB_OAUTH_REDIRECT_URI: https://api.${NORA_PUBLIC_DOMAIN:-nora.systems}/integrations/github/oauth/callback
      NOTION_OAUTH_CLIENT_ID: ${NOTION_OAUTH_CLIENT_ID:-}
      NOTION_OAUTH_CLIENT_SECRET: ${NOTION_OAUTH_CLIENT_SECRET:-}
      NOTION_OAUTH_REDIRECT_URI: https://api.${NORA_PUBLIC_DOMAIN:-nora.systems}/integrations/notion/oauth/callback
      TODOIST_OAUTH_CLIENT_ID: ${TODOIST_OAUTH_CLIENT_ID:-}
      TODOIST_OAUTH_CLIENT_SECRET: ${TODOIST_OAUTH_CLIENT_SECRET:-}
      TODOIST_OAUTH_REDIRECT_URI: https://api.${NORA_PUBLIC_DOMAIN:-nora.systems}/integrations/todoist/oauth/callback
      LINEAR_OAUTH_CLIENT_ID: ${LINEAR_OAUTH_CLIENT_ID:-}
      LINEAR_OAUTH_CLIENT_SECRET: ${LINEAR_OAUTH_CLIENT_SECRET:-}
      LINEAR_OAUTH_REDIRECT_URI: https://api.${NORA_PUBLIC_DOMAIN:-nora.systems}/integrations/linear/oauth/callback
      MS_OAUTH_CLIENT_ID: ${MS_OAUTH_CLIENT_ID:-}
      MS_OAUTH_CLIENT_SECRET: ${MS_OAUTH_CLIENT_SECRET:-}
      MS_OAUTH_REDIRECT_URI: https://api.${NORA_PUBLIC_DOMAIN:-nora.systems}/integrations/microsoft/oauth/callback
      NORA_TELEGRAM_BOT_TOKEN: ${NORA_TELEGRAM_BOT_TOKEN:-}
      TRELLO_API_KEY: ${TRELLO_API_KEY:-}
      NORA_INTEGRATIONS_STATE_SECRET: ${NORA_INTEGRATIONS_STATE_SECRET:-}
      # AES-256-GCM, 32 bytes base64. NEVER pass "unset" here: TokenCipher validates
      # base64 and kills the boot (that was the 2026-06-11 incident with KV-reference).
      #
      # `:?` and not `:-`, same shape as JWT_SECRET above. It used to default to EMPTY, and
      # an empty key is not "no encryption feature": TokenCipher falls back to writing
      # `plain:<token>` into oauth_connections, so the access AND refresh tokens of all nine
      # providers (Google, Slack, GitHub, Notion, Todoist, Linear, Microsoft, Telegram,
      # Trello) sit in the clear in Postgres. The only signal was one WARN line at boot,
      # which nobody re-reads three weeks into a deployment. Degrading is still possible
      # for local dev, but it now takes an explicit NORA_INTEGRATIONS_ALLOW_PLAINTEXT=true
      # and that opt-in is deliberately NOT wired here: on this host the key is mandatory.
      NORA_INTEGRATIONS_ENC_KEY: ${NORA_INTEGRATIONS_ENC_KEY:?NORA_INTEGRATIONS_ENC_KEY is required (base64 of 32 bytes; openssl rand -base64 32). Set NORA_INTEGRATIONS_ALLOW_PLAINTEXT=true only in local dev to store OAuth tokens unencrypted}

      # ---- Control plane (ADR 0022/0023/0024) ----
      NORA_PLATFORM_ENABLED: ${NORA_PLATFORM_ENABLED:-false}
      PLATFORM_DATASOURCE_URL: jdbc:postgresql://postgres-platform:5432/nora_platform
      # Same reasoning as SPRING_FLYWAY_USER: this must NOT follow DATASOURCE_USERNAME. The RLS
      # cutover points that at nora_app, a role that exists in the `postgres` container and not
      # in this one, so the control plane would be pointed at a login that does not exist.
      PLATFORM_DATASOURCE_USERNAME: ${PLATFORM_DATASOURCE_USERNAME:-${POSTGRES_ADMIN_USER:-nora_admin}}
      PLATFORM_DATASOURCE_PASSWORD: ${POSTGRES_PLATFORM_ADMIN_PASSWORD:-${POSTGRES_ADMIN_PASSWORD}}
      NORA_PLATFORM_INTERNAL_TOKEN: ${NORA_PLATFORM_INTERNAL_TOKEN:-}
      # `:?` and not `:-`, unlike the line above, and the asymmetry is the whole point.
      #
      # PlatformProperties.adminTokenResolved() falls back to internalToken when adminToken is
      # blank. That fallback cannot be reached by an attacker — InternalTokenAuthFilter refuses
      # a blank expected token outright — but when internalToken IS set and adminToken is not,
      # the WORKER's service token authenticates /admin/platform/**. The operator console and
      # the worker stop being distinct principals, silently, on a host provisioned without this
      # one variable. Fail-open by construction is worth one line of compose to close.
      #
      # Measured on the running stack before making it mandatory, values not printed: both
      # tokens are set, 64 characters each, and DISTINCT. So this breaks nothing that is up.
      NORA_PLATFORM_ADMIN_TOKEN: ${NORA_PLATFORM_ADMIN_TOKEN:?NORA_PLATFORM_ADMIN_TOKEN is required - without it the worker's internal token authenticates the operator console}
      # Control plane health: replaces the App Insights Query REST API (KQL) with the
      # Prometheus Query API. See PrometheusHealthSource (ADR 0034).
      NORA_PLATFORM_HEALTH_PROMETHEUS_URL: http://prometheus:9090
      NORA_PLATFORM_HEALTH_WINDOW: ${NORA_PLATFORM_HEALTH_WINDOW:-PT1H}
      NORA_PLATFORM_BUSINESS_ENABLED: ${NORA_PLATFORM_BUSINESS_ENABLED:-true}

      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    # `edge` does NOT publish a port: there is no `ports:` here and the only entry point
    # is still cloudflared -> caddy. It exists because the `internal` and `data` networks
    # are `internal: true`, which blocks egress AND external DNS resolution. Without it the
    # stack comes up with ALL healthchecks green (they are local) and fails on the first real call.
    networks: [internal, data, edge]
    depends_on:
      postgres:
        condition: service_healthy
      worker:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2560M
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      # failureThreshold 12 in the Bicep was calibrated for the Spring + Flyway boot (~30s).
      retries: 12
      start_period: 45s

  # ==========================================================================
  # APP — Web Next.js / BFF (replaces nora-web-dev; 1 vCPU / 2Gi, min 1)
  # ==========================================================================
  # WATCH OUT: NEXT_PUBLIC_API_BASE_URL is baked into the bundle at BUILD-TIME. Setting it
  # here does NOT change the bundle. If the public domain changes, the image has to be
  # rebuilt with the --build-arg (see .github/workflows/build-images.yml). Since the domain
  # is still nora.systems, the current GHCR image serves without a rebuild.
  web:
    image: ${REGISTRY:-ghcr.io}/${IMAGE_PREFIX:-sf0rzin/nora}-web:${WEB_TAG:-latest}
    container_name: nora-web
    <<: *default-restart
    logging: *default-logging
    environment:
      NORA_ENV: ${NORA_ENV:-prod}
      NEXT_PUBLIC_API_BASE_URL: https://api.${NORA_PUBLIC_DOMAIN:-nora.systems}
      # SERVER-side base for the BFF. The variable already existed and was never set, so
      # `route.ts` fell through to NEXT_PUBLIC_API_BASE_URL — the PUBLIC hostname — and every
      # internal call the chat makes left the host, crossed Cloudflare, came back down the same
      # tunnel this request arrived on, and reached the API through Caddy. Six calls per message
      # taking that trip, to talk to a container on the same bridge. Measured from `web`:
      # 13-95ms via the public URL, 4-6ms via `api:8080`.
      #
      # It also made the chat depend on the edge being healthy to answer at all, which is a
      # dependency loop: the request cannot complete until the tunnel serves a second request
      # nested inside it. Internal traffic belongs on the internal network.
      API_BASE_URL: http://api:8080
      NEXT_PUBLIC_USE_MOCKS: "false"
      OTEL_SERVICE_NAME: nora-web
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      # Core chat (server-side BFF, ADR 0004/0024). Keys never go to the browser.
      LLM_API_KEY: ${OPENAI_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
      LLM_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      LLM_KEY_OPENAI: ${OPENAI_API_KEY:-}
      LLM_KEY_DEEPSEEK: ${DEEPSEEK_API_KEY:-}
      LLM_KEY_GOOGLE: ${GEMINI_API_KEY:-}
      NORA_PLATFORM_INTERNAL_TOKEN: ${NORA_PLATFORM_INTERNAL_TOKEN:-}
    # `edge` does NOT publish a port: there is no `ports:` here and the only entry point
    # is still cloudflared -> caddy. It exists because the `internal` and `data` networks
    # are `internal: true`, which blocks egress AND external DNS resolution. Without it the
    # stack comes up with ALL healthchecks green (they are local) and fails on the first real call.
    networks: [internal, edge]
    depends_on:
      api:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2048M
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ==========================================================================
  # APP — Admin / control plane (replaces nora-admin-dev, ADR 0023/0025)
  # ==========================================================================
  # Still with no direct public route: it is only reached via Caddy when cloudflared
  # delivers the Host admin.<domain>, and Cloudflare's Access Application is what
  # authenticates at the edge.
  #
  # access.ts changed shape on 2026-08-16 and this comment with it. It used to enforce only when
  # THREE things held and to fail OPEN if any was missing, which meant that the safe state was
  # the insecure one and that the three `:?`/literal below were the only thing standing between
  # a forgotten variable and an unauthenticated console. Now enforcement is on unless mocks are
  # explicitly requested, and an incomplete Access configuration BLOCKS instead of standing
  # aside. The three settings below did not become pointless — they became belt to the app's
  # braces, and they still fail the deploy loudly at parse time rather than at first request:
  #   NORA_ADMIN_USE_MOCKS "false"  hardcoded below. Any value other than "true" means the same
  #                                 thing now; it stays spelled out because a control plane is
  #                                 not the place to rely on a default.
  #   CF_ACCESS_TEAM_DOMAIN `:?`    without it the console answers 403 to everything, which is
  #   CF_ACCESS_AUD         `:?`    correct but useless — better to never come up.
  #
  # This comment used to end "and today in production it arrives empty (it was `vars.` reading a
  # Secret)". That is no longer true — measured on the running container, 2026-08-12, values not
  # printed: NORA_ADMIN_USE_MOCKS=false, CF_ACCESS_TEAM_DOMAIN length 28, CF_ACCESS_AUD length 64.
  admin:
    image: ${REGISTRY:-ghcr.io}/${IMAGE_PREFIX:-sf0rzin/nora}-admin:${ADMIN_TAG:-latest}
    container_name: nora-admin
    <<: *default-restart
    logging: *default-logging
    profiles: ["platform"]
    environment:
      NORA_ENV: ${NORA_ENV:-prod}
      NORA_ADMIN_USE_MOCKS: "false"
      PLATFORM_API_BASE_URL: http://api:8080
      PLATFORM_INTERNAL_TOKEN: ${NORA_PLATFORM_ADMIN_TOKEN:-}
      CF_ACCESS_TEAM_DOMAIN: ${CF_ACCESS_TEAM_DOMAIN:?CF_ACCESS_TEAM_DOMAIN is required - without it access.ts blocks every request}
      CF_ACCESS_AUD: ${CF_ACCESS_AUD:?CF_ACCESS_AUD is required - without it access.ts blocks every request}
      OTEL_SERVICE_NAME: nora-admin
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    # `edge` does NOT publish a port: there is no `ports:` here and the only entry point
    # is still cloudflared -> caddy. It exists because the `internal` and `data` networks
    # are `internal: true`, which blocks egress AND external DNS resolution. Without it the
    # stack comes up with ALL healthchecks green (they are local) and fails on the first real call.
    networks: [internal, edge]
    depends_on:
      api:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    healthcheck:
      # 127.0.0.1, not `localhost`: Next standalone binds IPv4-only (0.0.0.0), but the
      # container's /etc/hosts also resolves `localhost` to ::1 and BusyBox wget tries
      # IPv6 first -- connection refused with the server up and answering.
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3002/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ==========================================================================
  # OBSERVABILITY — replaces Log Analytics + Application Insights
  # ==========================================================================
  # Equivalent coverage requires TWO legs, not one:
  #   - traces/metrics (what the -javaagent did)    -> otel-collector -> prometheus/tempo
  #   - stdout logs of the 4 apps (what appLogsConfiguration did) -> alloy -> loki
  # An OTel Collector alone does NOT cover log shipping.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.115.1
    container_name: nora-otel-collector
    <<: *default-restart
    logging: *default-logging
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./observability/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    environment:
      # Credentials for the `postgresql` receiver (observability/otel-collector.yaml), which
      # exists so `nora-postgres-unreachable` in the alerting rules has a series to look at.
      # Named apart from POSTGRES_* so that pointing the collector at a narrower monitoring
      # role later is one variable, not a hunt through this file. `:?` on the password for the
      # same reason the receiver's comment gives: the collector expands `${env:...}` at boot
      # and an absent variable is a container that does not come up.
      NORA_PG_MONITOR_USER: ${POSTGRES_ADMIN_USER:-nora_admin}
      NORA_PG_MONITOR_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?POSTGRES_ADMIN_PASSWORD is required}
    # `data` is new here and is not free — read the TRADE note above the `postgresql` receiver
    # in observability/otel-collector.yaml before removing or copying it. The collector needs
    # it to reach postgres:5432; `data` is `internal: true`, so this adds no egress.
    networks: [internal, data]
    security_opt:
      - no-new-privileges:true
    # NO healthcheck, and that is deliberate. The otel-collector-contrib image is
    # distroless: it has no shell, no wget and no curl, so any `test:` based on them
    # never runs and the container stays `unhealthy` FOREVER — `up -d --wait`
    # aborts and deploy.sh fails a collector that is working fine.
    # Nobody declares a `depends_on` on it, and with `--wait` a service without a
    # healthcheck is considered ready once it is `running`. The health_check extension
    # is still enabled in observability/otel-collector.yaml and answers on :13133 — it can
    # be probed from outside (`docker compose exec prometheus wget -qO- otel-collector:13133`),
    # just not from inside.
    #
    # THAT EXTERNAL PROBE IS NOW IMPLEMENTED, which is the part this comment used to describe
    # and nothing did: scripts/deploy.sh's `fallback_probe` runs exactly that wget from the
    # `prometheus` container during the rollout's health gate. So the collector is no longer
    # passing the gate on `running` alone, and it still has no `healthcheck:` here — which is
    # the correct combination for a distroless image.

  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: nora-prometheus
    <<: *default-restart
    logging: *default-logging
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --web.enable-remote-write-receiver
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks: [internal]
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3

  loki:
    image: grafana/loki:3.3.2
    container_name: nora-loki
    <<: *default-restart
    logging: *default-logging
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes:
      - ./observability/loki.yaml:/etc/loki/config.yaml:ro
      - loki_data:/loki
    networks: [internal]
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3100/ready"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ==========================================================================
  # THE ONLY CONTAINER THAT TOUCHES THE DOCKER SOCKET
  # ==========================================================================
  # Alloy used to mount /var/run/docker.sock directly, and the comment on that mount was
  # honest about what it meant: the Docker API is HTTP served over that socket, `:ro` blocks
  # writes to the FILE and nothing about the API, and the API can create a container with the
  # host root filesystem bind-mounted into it. Access to that socket is root on the host, full
  # stop. It was mounted into the one container in this stack that parses attacker-influenced
  # input for a living (`stage.multiline` in observability/config.alloy joins log lines
  # produced by users, with a regex).
  #
  # This is the fix that comment said was needed. haproxy in front of the socket, with an
  # allow-list of API paths and every method except GET refused outright; Alloy now speaks
  # TCP to this service and has no socket of its own.
  #
  # WHAT ALLOY ACTUALLY NEEDS, which is the whole allow-list:
  #   CONTAINERS=1  GET /containers/json          — discovery.docker enumerating targets
  #                 GET /containers/{id}/json     — the inspect behind the target labels
  #                 GET /containers/{id}/logs     — loki.source.docker, the log stream itself
  #   VERSION=1 and PING=1 are the image's defaults and are what the Docker client library
  #                 uses to negotiate an API version on connect. Removing them breaks the
  #                 client before it issues a single useful request.
  #   EVENTS=1      is also a default, and Alloy does NOT need it — `discovery.docker` polls on
  #                 `refresh_interval` rather than subscribing to the event stream. Left at the
  #                 default because /events is read-only and turning it off would be a
  #                 deviation from upstream to buy nothing. Turn it off if that ever stops
  #                 being true.
  # EVERYTHING ELSE IS OFF BY THE IMAGE'S OWN DEFAULTS — /exec (the direct route to
  # command execution in any container), /images, /volumes, /networks, /info, /secrets,
  # /swarm, and the start/stop/restart family. They are restated below rather than left
  # implicit, because "the default is safe" is a claim about a version, and this file pins a
  # digest precisely so that claims about a version stay true.
  #
  # POST=0 is the load-bearing one. The proxy's frontend opens with
  # `http-request deny unless METH_GET || { env(POST) -m bool }`, so with POST off the
  # entire API is read-only regardless of which path flags are set — a future flag turned on
  # by mistake still cannot create, delete or modify anything. It also means HEAD is refused,
  # which is why the deploy probe for this service in scripts/deploy.sh issues a GET.
  #
  # PINNED BY DIGEST, not by tag, and this is the one service in the file where that is not
  # merely tidy: this container holds the socket the whole change exists to contain. A tag is
  # a pointer the upstream owner can move; the digest is the image. The trailing comment is
  # the human-readable version, same convention as scripts/check-action-pins.sh enforces for
  # Actions.
  socket-proxy:
    image: tecnativa/docker-socket-proxy@sha256:1f5038b54f06c3e18422902cf00ba21803d1c97805aae032e5e6673d532d3459  # v0.5.0
    container_name: nora-socket-proxy
    <<: *default-restart
    logging: *default-logging
    environment:
      CONTAINERS: "1"
      POST: "0"
      # Restated defaults. See the paragraph above on why they are written out.
      ALLOW_RESTARTS: "0"
      ALLOW_START: "0"
      ALLOW_STOP: "0"
      AUTH: "0"
      BUILD: "0"
      COMMIT: "0"
      CONFIGS: "0"
      DISTRIBUTION: "0"
      EXEC: "0"
      GRPC: "0"
      IMAGES: "0"
      INFO: "0"
      NETWORKS: "0"
      NODES: "0"
      PLUGINS: "0"
      SECRETS: "0"
      SERVICES: "0"
      SESSION: "0"
      SWARM: "0"
      SYSTEM: "0"
      TASKS: "0"
      VOLUMES: "0"
      # Without this the image binds `[::]:2375 v4v6`. On a host with IPv6 disabled in the
      # kernel that bind fails and the container never comes up; the bridge it sits on has no
      # IPv6 address either way, so there is nothing to lose. It also makes the health probe
      # deterministic — the same IPv4-vs-IPv6 trap the `admin` service's healthcheck carries a
      # note about.
      DISABLE_IPV6: "1"
    volumes:
      # `:ro` here is NOT the control — see the paragraph above; it only protects the socket's
      # inode. The control is the haproxy allow-list this container runs. It is kept because
      # it costs nothing and this container has no reason to write to the file.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    # ONE network, and it is the one nothing else is on. The proxy is deliberately unreachable
    # from `internal`, `data` and `edge`.
    networks: [docker-api]
    # The container holding the socket is the one where a container escape costs the host, so
    # it gets the same two settings as alloy and for the same reasons. Both are safe HERE
    # specifically:
    #   no-new-privileges  — the entrypoint is /bin/sh and the process is haproxy; neither
    #                        execs a setuid binary.
    #   cap_drop: ALL      — haproxy runs as root (the image declares `USER root` and the
    #                        config has no `user`/`group` directive, so it never setuids),
    #                        binds :2375 (unprivileged, so no CAP_NET_BIND_SERVICE), and reads
    #                        the socket as its OWNER rather than by overriding permissions, so
    #                        no CAP_DAC_OVERRIDE either. The one capability-adjacent thing the
    #                        entrypoint does is raise its file-descriptor limit, and it does
    #                        that with `ulimit -n 10000 2>/dev/null || true` — it degrades
    #                        instead of failing.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # NO `healthcheck:` on purpose, and for a different reason than otel-collector's. This
    # image is alpine-based, so busybox wget is present and a healthcheck WOULD work — but
    # nothing in this file declares `depends_on: condition: service_healthy` on it, so the
    # healthcheck would buy nothing at boot while adding a way for the stack to refuse to
    # start. scripts/deploy.sh probes it directly instead (`probe_cmd`), which is where the
    # verdict is actually acted on.

  # Alloy sends stdout/stderr of ALL containers to Loki, discovering them through the
  # socket-proxy above.
  # Chosen over the `loki` log driver: the plugin breaks `docker logs` and, in
  # `mode=non-blocking`, silently drops lines under backpressure. Alloy has a WAL —
  # backpressure becomes delay, not loss.
  alloy:
    image: grafana/alloy:v1.7.1
    container_name: nora-alloy
    <<: *default-restart
    logging: *default-logging
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./observability/config.alloy:/etc/alloy/config.alloy:ro
    # `docker-api` is how it reaches the daemon now — through socket-proxy, over TCP, with no
    # socket of its own. `internal` is how it reaches Loki. It is on no other bridge.
    networks: [internal, docker-api]
    # Alloy PARSES untrusted input for a living: `stage.multiline` in observability/config.alloy
    # joins log lines produced by users, with a regex. That is the vector this service presents,
    # and it is why the hardening below is here even now that the socket is gone.
    #
    # Two settings, neither of which Alloy needs to do its job:
    #   no-new-privileges  — nothing here execs a setuid binary; this closes the standard
    #                        escalation step after a code-execution bug in a parser.
    #   cap_drop: ALL      — Alloy runs as root in this image and binds :12345 (unprivileged
    #                        port). It holds no capability it uses. If a future version does
    #                        need one, add it back by name with `cap_add` rather than deleting
    #                        this block — the symptom would be a container that fails at boot
    #                        with a permission error, which deploy.sh's health gate catches.
    #
    # WHAT CHANGED: this block used to end by saying it was NOT a fix for the socket mount, and
    # that the real fix was a socket proxy nobody had built. It is built — see `socket-proxy`
    # above. What remains here is defence in depth around the parser, not the containment of
    # the socket.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      loki:
        condition: service_healthy
      # `service_started` and not `service_healthy`: socket-proxy declares no healthcheck (the
      # reason is on that service). Alloy retries discovery every `refresh_interval` anyway, so
      # a proxy that is a second late costs one empty discovery pass, not a failed boot.
      socket-proxy:
        condition: service_started

  grafana:
    image: grafana/grafana:11.5.1
    container_name: nora-grafana
    <<: *default-restart
    logging: *default-logging
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: https://grafana.${NORA_PUBLIC_DOMAIN:-nora.systems}
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      # The destination of every alert this stack raises. The rules in
      # observability/grafana/provisioning/alerting/ evaluate and record state whether or not
      # this is set; what an empty value costs is the notification, not the detection.
      #
      # `:-` and not `:?` deliberately. Making it mandatory would mean a host that has not yet
      # chosen a webhook cannot boot Grafana at all, which trades a missing notification for a
      # missing dashboard — the wrong way round. secrets.env.example carries the entry and
      # what to put in it.
      NORA_ALERT_WEBHOOK_URL: ${NORA_ALERT_WEBHOOK_URL:-}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
    networks: [internal]
    security_opt:
      - no-new-privileges:true
    depends_on:
      - prometheus
      - loki
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ==========================================================================
  # BACKUP — replaces the 7-day PITR of Postgres Flexible Server
  # ==========================================================================
  # Hourly logical pg_dump + retention; there is no hypervisor snapshot leg — ADR 0036
  # withdraws it (no hypervisor, no second machine). RTO goes from minutes to hours —
  # an SLA change recorded in ADR 0034 §disponibilidade.
  backup:
    image: postgres:16-alpine
    container_name: nora-backup
    <<: *default-restart
    logging: *default-logging
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_ADMIN_USER:-nora_admin}
      PGPASSWORD: ${POSTGRES_ADMIN_PASSWORD:?POSTGRES_ADMIN_PASSWORD is required}
      PLATFORM_PGHOST: postgres-platform
      PLATFORM_PGPASSWORD: ${POSTGRES_PLATFORM_ADMIN_PASSWORD:-${POSTGRES_ADMIN_PASSWORD}}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-3600}
    volumes:
      - ${BACKUP_DIR:-/srv/nora/backups}:/backups
      - ./backup/run-backup.sh:/usr/local/bin/run-backup.sh:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/run-backup.sh"]
    networks: [data]
    security_opt:
      - no-new-privileges:true
    # NO healthcheck here either, and for a different reason from the collector's: this
    # service exposes no port and answers no request — a `test:` would have to invent a
    # liveness signal that the script does not publish. What it does publish is one logfmt
    # line per event, so scripts/deploy.sh's `fallback_probe` reads those instead: preflight
    # failing is a failed rollout, a started cycle is a pass. Before that it was the third
    # service crossing the health gate on `running` alone — the one whose silent failure
    # costs the most, since a backup service that loops without producing a dump looks
    # identical to a working one from the outside.
    depends_on:
      postgres:
        condition: service_healthy
