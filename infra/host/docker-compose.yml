# NORA — self-hosted production stack (single bare-metal host, no hypervisor + Docker Compose).
#
# Replaces the Azure Container Apps Environment that used to be defined in infra/bicep/main.bicep
# (ADR 0034; that directory is deleted — ADR 0036). Every service here was the 1:1 counterpart of a
# `container-app.bicep` module; the env vars were transcribed from that file's line 694-1540 (all
# 92 declarations, not just the API block).
#
# Topology:
#
#   Internet ──> Cloudflare edge ──(tunnel, egress-only)──> cloudflared
#                                                              │
#                                                            caddy            <- retry buffer
#                                                        ┌─────┼─────┐           of the rolling update
#                                                       web   api   admin
#                                                              │
#                                                           worker (internal)
#                                                              │
#                                              postgres  +  postgres-platform
#
# Usage:  ./scripts/deploy.sh          (health-gated rollout of every service)
#       docker compose --env-file .env up -d --wait
#
# Do NOT expose ports on the host: all traffic comes in through cloudflared. The only
# published ports are on 127.0.0.1 (local debug via SSH port-forward).

name: nora

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"
    tag: "{{.Name}}"

x-restart: &default-restart
  restart: unless-stopped

networks:
  edge:
    driver: bridge
  internal:
    driver: bridge
    internal: true   # no route to the internet: postgres and worker cannot get out on their own
  data:
    driver: bridge
    internal: true

volumes:
  pgdata:
  pgdata_platform:
  grafana_data:
  loki_data:
  prometheus_data:
  caddy_data:
  caddy_config:

services:
  # ==========================================================================
  # EDGE — cloudflared (ADR 0025, extended from admin to the whole stack)
  # ==========================================================================
  # Replaces: Container Apps external ingress + managed certificates + staticIp.
  # The visitor's TLS is Cloudflare's Universal SSL; the origin needs no cert
  # (SSL mode Full, as it already was — see the audit fix about the "window without TLS").
  cloudflared:
    image: cloudflare/cloudflared:2026.5.2
    container_name: nora-cloudflared
    <<: *default-restart
    logging: *default-logging
    command: tunnel --no-autoupdate --metrics 0.0.0.0:2000 run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?CLOUDFLARE_TUNNEL_TOKEN is required}
    # For the `ssh.nora.systems` Public Hostname, which routes to the host's own sshd so the
    # machine is reachable from networks that block outbound 22 (the tunnel speaks TLS/443).
    #
    # `ssh://localhost:22` does NOT work and is the mistake to avoid: this connector is a
    # CONTAINER, so its localhost is the container's own loopback, where nothing listens.
    # `host.docker.internal` resolves to the Docker bridge gateway, which is the host.
    # Verified on 2026-08-10 with an ephemeral container on this same network:
    #   getent -> 172.17.0.1, and `nc host.docker.internal 22` returns
    #   SSH-2.0-OpenSSH_9.6p1 Ubuntu-3ubuntu13.18
    #
    # INERT UNTIL THIS CONTAINER IS RECREATED, and inert until the route is switched to the
    # name. `extra_hosts` is written into /etc/hosts at container creation, and the live ingress
    # rule currently names the IP (`ssh://172.17.0.1:22`, see cloudflared/config.yml). Both
    # steps, and the fact that recreating this container drops the only ingress for a few
    # seconds, are in docs/operations/ssh-over-tunnel.md under "Applying extra_hosts".
    #
    # This adds no exposure by itself. A Public Hostname is only reachable once it exists in
    # the tunnel's ingress, and the one in front of ssh:// is gated by a Cloudflare Access
    # policy. sshd, port 22 and the firewall are untouched: the direct path keeps working
    # exactly as before.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # `internal` is not for serving traffic — it is so prometheus (which only lives on
    # it) can reach the :2000 metrics. Without it the `cloudflared` job in prometheus.yml
    # gives "no such host" and the stack loses precisely the signal that the tunnel is up
    # (cloudflared_tunnel_ha_connections; dropping to 0 is the 522 that took nora.systems down).
    # `internal: true` has no route to the internet, so this does not widen cloudflared's
    # exposure — it only adds the interface on the inside.
    networks: [edge, internal]
    depends_on:
      caddy:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "cloudflared", "--version"]
      interval: 60s
      timeout: 5s
      retries: 3

  # ==========================================================================
  # EDGE — Caddy (Host-based routing + retry buffer during the rolling update)
  # ==========================================================================
  # Why it exists: `docker compose up -d` tears the old container down BEFORE bringing the
  # new one up (there is no readiness gate like Container Apps' `activeRevisionsMode: Single`).
  # The Spring boot with Flyway takes ~30s. `lb_try_duration` in the Caddyfile turns that
  # 502 into a slow request. See docs/operations/host-deploy.md §rolling update.
  caddy:
    image: caddy:2.8-alpine
    container_name: nora-caddy
    <<: *default-restart
    logging: *default-logging
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      NORA_PUBLIC_DOMAIN: ${NORA_PUBLIC_DOMAIN:-nora.systems}
    networks: [edge, internal]
    healthcheck:
      # Do NOT use `--spider` against the admin API's :2019/config/: busybox wget's
      # `--spider` issues HEAD, and that handler only deals with GET/POST/PUT/PATCH/DELETE —
      # HEAD falls into the default and comes back 405. wget exits != 0, the container never
      # becomes healthy, and cloudflared (`condition: service_healthy`) never comes up: the
      # whole stack is unreachable with no obvious error. The /healthz of the :80 block is
      # served by `respond`, which handles HEAD without complaining. See caddy/Caddyfile:65-74 and :241-246.
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ==========================================================================
  # DATA — primary Postgres (replaces nora-pg-dev, B1ms Burstable)
  # ==========================================================================
  # pgvector/pgvector image: the extension is AVAILABLE but is NOT created. V021
  # stores embeddings as JSON in TEXT and computes cosine in Java precisely because
  # Azure's allow-list blocked pgvector — leaving Azure unblocks it, but changing that is
  # a RAG refactor, not an infra migration. See ADR 0034 §escopo-excluido.
  postgres:
    image: pgvector/pgvector:pg16
    container_name: nora-postgres
    <<: *default-restart
    logging: *default-logging
    environment:
      POSTGRES_DB: nora
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:-nora_admin}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?POSTGRES_ADMIN_PASSWORD is required}
      # pt-BR locale consistent with what the Flexible Server delivered.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5432:5432"   # loopback only — remote access via `ssh -L`
    networks: [data]
    shm_size: 256mb
    command:
      - postgres
      - -c
      - max_connections=100
      - -c
      - shared_buffers=512MB
      - -c
      - effective_cache_size=1536MB
      - -c
      - work_mem=8MB
      - -c
      - log_min_duration_statement=1000
      - -c
      - log_connections=on
      - -c
      - log_disconnections=on
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_ADMIN_USER:-nora_admin} -d nora"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ==========================================================================
  # DATA — platform Postgres (ADR 0022: isolated blast radius)
  # ==========================================================================
  # SEPARATE server, as in the now-deleted Bicep (`postgresPlatform`, main.bicep:609). On a
  # single host the isolation is weaker than Azure's was, but it preserves the
  # PLATFORM_DATASOURCE_URL contract and keeps dump/restore of the two databases independent.
  postgres-platform:
    image: pgvector/pgvector:pg16
    container_name: nora-postgres-platform
    <<: *default-restart
    logging: *default-logging
    profiles: ["platform"]
    environment:
      POSTGRES_DB: nora_platform
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:-nora_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PLATFORM_ADMIN_PASSWORD:-${POSTGRES_ADMIN_PASSWORD}}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"
    volumes:
      - pgdata_platform:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    networks: [data]
    shm_size: 128mb
    command:
      - postgres
      - -c
      - max_connections=50
      - -c
      - shared_buffers=256MB
      - -c
      - log_min_duration_statement=1000
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_ADMIN_USER:-nora_admin} -d nora_platform"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ==========================================================================
  # APP — NLP Worker (replaces nora-worker-dev; internal ingress, min 0 max 3)
  # ==========================================================================
  # No scale-to-zero: on a single host the cost of keeping 1 replica up is irrelevant and
  # it removes the cold start. The Dockerfile's `--workers 2` still applies.
  worker:
    image: ${REGISTRY:-ghcr.io}/${IMAGE_PREFIX:-sf0rzin/nora}-worker:${WORKER_TAG:-latest}
    container_name: nora-worker
    <<: *default-restart
    logging: *default-logging
    environment:
      NORA_ENV: ${NORA_ENV:-prod}
      USE_LLM_STUB: ${USE_LLM_STUB:-false}
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      LLM_API_KEY: ${OPENAI_API_KEY:-}
      LLM_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      # Observability: OTLP to the local collector (replaces APPLICATIONINSIGHTS_CONNECTION_STRING).
      OTEL_SERVICE_NAME: nora-worker
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      # Control plane (ADR 0024) — only with the platform profile.
      NORA_PLATFORM_INTERNAL_TOKEN: ${NORA_PLATFORM_INTERNAL_TOKEN:-}
      NORA_API_BASE_URL: http://api:8080
    # `edge` does NOT publish a port: there is no `ports:` here and the only entry point
    # is still cloudflared -> caddy. It exists because the `internal` and `data` networks
    # are `internal: true`, which blocks egress AND external DNS resolution. Without it the
    # stack comes up with ALL healthchecks green (they are local) and fails on the first real call.
    networks: [internal, edge]
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1536M
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ==========================================================================
  # APP — Spring Boot API (replaces nora-api-dev; 1 vCPU / 2Gi, min 1)
  # ==========================================================================
  api:
    image: ${REGISTRY:-ghcr.io}/${IMAGE_PREFIX:-sf0rzin/nora}-api:${API_TAG:-latest}
    container_name: nora-api
    <<: *default-restart
    logging: *default-logging
    environment:
      SPRING_PROFILES_ACTIVE: ${NORA_ENV:-prod}
      NORA_ENV: ${NORA_ENV:-prod}

      # ---- Primary datasource ----
      # sslmode REMOVED on purpose: the official Postgres image comes up with SSL OFF and
      # `?sslmode=require` makes Hikari fail at boot. Traffic never leaves the `data` bridge,
      # which is `internal: true`. See the audit fix about sslmode.
      DATASOURCE_URL: jdbc:postgresql://postgres:5432/nora
      DATASOURCE_USERNAME: ${DATASOURCE_USERNAME:-nora_admin}
      # Defaults to the admin password so nothing changes before the RLS cutover. After it,
      # DATASOURCE_USERNAME becomes nora_app and DATASOURCE_PASSWORD has to be able to become
      # nora_app's password -- without this indirection the username could be switched and the
      # password could not, which is a login failure at boot with a misleading message.
      DATASOURCE_PASSWORD: ${DATASOURCE_PASSWORD:-${POSTGRES_ADMIN_PASSWORD:?POSTGRES_ADMIN_PASSWORD is required}}

      # ---- RLS enforce (ADR 0026/0028) — separate flip, see rls-cutover ----
      NORA_RLS_ENFORCE: ${NORA_RLS_ENFORCE:-false}
      # Flyway ALWAYS points at the admin/owner: it needs DDL and needs to own the
      # tables so that nora_app (non-owner) is subject to RLS. After the cutover
      # DATASOURCE_* becomes nora_app and these three do NOT follow — that separation
      # is exactly what ADR 0028 asks for.
      #
      # Do not use `${SPRING_FLYWAY_URL:-}` here. An empty string is a DEFINED variable, and
      # a defined `spring.flyway.url` (even empty) satisfies FlywayUrlCondition: Spring
      # stops inheriting spring.datasource and builds its own SimpleDriverDataSource from
      # an empty URL. The boot dies on `Driver has not been set`, inside the
      # flywayInitializer, without naming the guilty variable. The comment in application.yml
      # already warned about this; the compose fell into the hole anyway, on the first real deploy.
      SPRING_FLYWAY_URL: ${SPRING_FLYWAY_URL:-jdbc:postgresql://postgres:5432/nora}
      # Defaults to the OWNER, not to DATASOURCE_USERNAME. It used to follow it, which turned
      # the documented cutover into a boot failure: setting DATASOURCE_USERNAME=nora_app also
      # pointed Flyway at nora_app, with the admin password (the line below defaults to that
      # independently), so Flyway failed to authenticate -- and had it authenticated, Flyway
      # would have been running as a NOBYPASSRLS non-owner, which cannot do DDL and defeats the
      # whole premise of ADR 0028. Flyway must be the owner; that is what makes nora_app subject
      # to the policies.
      SPRING_FLYWAY_USER: ${SPRING_FLYWAY_USER:-${POSTGRES_ADMIN_USER:-nora_admin}}
      SPRING_FLYWAY_PASSWORD: ${SPRING_FLYWAY_PASSWORD:-${POSTGRES_ADMIN_PASSWORD}}
      # All THREE roles matter: nora_app (NOBYPASSRLS), nora_telemetry (BYPASSRLS) and the
      # admin/owner. Without nora_telemetry the operator panel sees 0 rows SILENTLY.
      NORA_TELEMETRY_DATASOURCE_URL: ${NORA_TELEMETRY_DATASOURCE_URL:-}
      NORA_TELEMETRY_DATASOURCE_USERNAME: ${NORA_TELEMETRY_DATASOURCE_USERNAME:-}
      NORA_TELEMETRY_DATASOURCE_PASSWORD: ${NORA_TELEMETRY_DATASOURCE_PASSWORD:-}

      # ---- Auth ----
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required (min 32 chars)}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_RS256_PRIVATE_KEY_PEM: ${JWT_RS256_PRIVATE_KEY_PEM:-}
      JWT_RS256_KID: ${JWT_RS256_KID:-nora-key-1}
      AUTH_COOKIE_SECURE: "true"
      AUTH_COOKIE_DOMAIN: ${NORA_PUBLIC_DOMAIN:-nora.systems}
      EXPOSE_DEV_TOKENS: "false"

      # ---- Public URLs / CORS ----
      CORS_ALLOWED_ORIGINS: https://${NORA_PUBLIC_DOMAIN:-nora.systems},https://www.${NORA_PUBLIC_DOMAIN:-nora.systems}
      NORA_APP_PUBLIC_BASE_URL: https://${NORA_PUBLIC_DOMAIN:-nora.systems}
      NORA_FRONTEND_BASE_URL: https://${NORA_PUBLIC_DOMAIN:-nora.systems}

      # ---- Worker ----
      NLP_WORKER_BASE_URL: http://worker:8001

      # ---- Speech / STT (ADR 0035) ----
      # `local`: the desktop transcribes with on-device Whisper. POST /speech/token still
      # exists and answers 410 GONE + SPEECH_PROVIDER_GONE — a terminal signal for the old
      # client, instead of the generic 404 (which it would read as "API is down" and turn into
      # an infinite retry). SpeechRateLimiter applies in both modes.
      #
      # `azure`: restores the AzureSpeechTokenBroker. This was the ROLLBACK LEVER of the local
      # STT — change the value and redeploy, no code revert. It required the two vars below
      # filled in AND the Azure Speech resource existing; the subscription is gone (ADR 0036),
      # so this lever no longer has anything to roll back to.
      #
      # The beans are mutually exclusive via @ConditionalOnProperty. A third value leaves
      # the app WITHOUT a broker and the boot fails on an unsatisfied dependency.
      NORA_SPEECH_PROVIDER: ${NORA_SPEECH_PROVIDER:-local}
      AZURE_SPEECH_KEY: ${AZURE_SPEECH_KEY:-}
      AZURE_SPEECH_REGION: ${AZURE_SPEECH_REGION:-brazilsouth}

      # ---- Embeddings (RAG) ----
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}

      # ---- Email ----
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      NORA_EMAIL_FROM: ${NORA_EMAIL_FROM:-NORA <onboarding@resend.dev>}

      # ---- LGPD (ADR 0029) ----
      NORA_PRIVACY_RETENTION_DAYS: ${NORA_PRIVACY_RETENTION_DAYS:-0}
      NORA_PRIVACY_RETENTION_CRON: ${NORA_PRIVACY_RETENTION_CRON:-0 30 3 * * *}

      # ---- Observability (OTel; replaces the App Insights agent) ----
      OTEL_SERVICE_NAME: nora-api
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_METRICS_EXPORTER: otlp
      OTEL_LOGS_EXPORTER: none

      # ---- OAuth integrations (ADR 0031). Redirect URIs derive from the public domain. ----
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      GOOGLE_OAUTH_REDIRECT_URI: https://api.${NORA_PUBLIC_DOMAIN:-nora.systems}/integrations/google/oauth/callback
      SLACK_OAUTH_CLIENT_ID: ${SLACK_OAUTH_CLIENT_ID:-}
      SLACK_OAUTH_CLIENT_SECRET: ${SLACK_OAUTH_CLIENT_SECRET:-}
      SLACK_OAUTH_REDIRECT_URI: https://api.${NORA_PUBLIC_DOMAIN:-nora.systems}/integrations/slack/oauth/callback
      GITHUB_OAUTH_CLIENT_ID: ${GITHUB_OAUTH_CLIENT_ID:-}
      GITHUB_OAUTH_CLIENT_SECRET: ${GITHUB_OAUTH_CLIENT_SECRET:-}
      GITHUB_OAUTH_REDIRECT_URI: https://api.${NORA_PUBLIC_DOMAIN:-nora.systems}/integrations/github/oauth/callback
      NOTION_OAUTH_CLIENT_ID: ${NOTION_OAUTH_CLIENT_ID:-}
      NOTION_OAUTH_CLIENT_SECRET: ${NOTION_OAUTH_CLIENT_SECRET:-}
      NOTION_OAUTH_REDIRECT_URI: https://api.${NORA_PUBLIC_DOMAIN:-nora.systems}/integrations/notion/oauth/callback
      TODOIST_OAUTH_CLIENT_ID: ${TODOIST_OAUTH_CLIENT_ID:-}
      TODOIST_OAUTH_CLIENT_SECRET: ${TODOIST_OAUTH_CLIENT_SECRET:-}
      TODOIST_OAUTH_REDIRECT_URI: https://api.${NORA_PUBLIC_DOMAIN:-nora.systems}/integrations/todoist/oauth/callback
      LINEAR_OAUTH_CLIENT_ID: ${LINEAR_OAUTH_CLIENT_ID:-}
      LINEAR_OAUTH_CLIENT_SECRET: ${LINEAR_OAUTH_CLIENT_SECRET:-}
      LINEAR_OAUTH_REDIRECT_URI: https://api.${NORA_PUBLIC_DOMAIN:-nora.systems}/integrations/linear/oauth/callback
      MS_OAUTH_CLIENT_ID: ${MS_OAUTH_CLIENT_ID:-}
      MS_OAUTH_CLIENT_SECRET: ${MS_OAUTH_CLIENT_SECRET:-}
      MS_OAUTH_REDIRECT_URI: https://api.${NORA_PUBLIC_DOMAIN:-nora.systems}/integrations/microsoft/oauth/callback
      NORA_TELEGRAM_BOT_TOKEN: ${NORA_TELEGRAM_BOT_TOKEN:-}
      TRELLO_API_KEY: ${TRELLO_API_KEY:-}
      NORA_INTEGRATIONS_STATE_SECRET: ${NORA_INTEGRATIONS_STATE_SECRET:-}
      # AES-256-GCM, 32 bytes base64. NEVER pass "unset" here: TokenCipher validates
      # base64 and kills the boot (that was the 2026-06-11 incident with KV-reference).
      NORA_INTEGRATIONS_ENC_KEY: ${NORA_INTEGRATIONS_ENC_KEY:-}

      # ---- Control plane (ADR 0022/0023/0024) ----
      NORA_PLATFORM_ENABLED: ${NORA_PLATFORM_ENABLED:-false}
      PLATFORM_DATASOURCE_URL: jdbc:postgresql://postgres-platform:5432/nora_platform
      # Same reasoning as SPRING_FLYWAY_USER: this must NOT follow DATASOURCE_USERNAME. The RLS
      # cutover points that at nora_app, a role that exists in the `postgres` container and not
      # in this one, so the control plane would be pointed at a login that does not exist.
      PLATFORM_DATASOURCE_USERNAME: ${PLATFORM_DATASOURCE_USERNAME:-${POSTGRES_ADMIN_USER:-nora_admin}}
      PLATFORM_DATASOURCE_PASSWORD: ${POSTGRES_PLATFORM_ADMIN_PASSWORD:-${POSTGRES_ADMIN_PASSWORD}}
      NORA_PLATFORM_INTERNAL_TOKEN: ${NORA_PLATFORM_INTERNAL_TOKEN:-}
      # `:?` and not `:-`, unlike the line above, and the asymmetry is the whole point.
      #
      # PlatformProperties.adminTokenResolved() falls back to internalToken when adminToken is
      # blank. That fallback cannot be reached by an attacker — InternalTokenAuthFilter refuses
      # a blank expected token outright — but when internalToken IS set and adminToken is not,
      # the WORKER's service token authenticates /admin/platform/**. The operator console and
      # the worker stop being distinct principals, silently, on a host provisioned without this
      # one variable. Fail-open by construction is worth one line of compose to close.
      #
      # Measured on the running stack before making it mandatory, values not printed: both
      # tokens are set, 64 characters each, and DISTINCT. So this breaks nothing that is up.
      NORA_PLATFORM_ADMIN_TOKEN: ${NORA_PLATFORM_ADMIN_TOKEN:?NORA_PLATFORM_ADMIN_TOKEN is required - without it the worker's internal token authenticates the operator console}
      # Control plane health: replaces the App Insights Query REST API (KQL) with the
      # Prometheus Query API. See PrometheusHealthSource (ADR 0034).
      NORA_PLATFORM_HEALTH_PROMETHEUS_URL: http://prometheus:9090
      NORA_PLATFORM_HEALTH_WINDOW: ${NORA_PLATFORM_HEALTH_WINDOW:-PT1H}
      NORA_PLATFORM_BUSINESS_ENABLED: ${NORA_PLATFORM_BUSINESS_ENABLED:-true}

      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    # `edge` does NOT publish a port: there is no `ports:` here and the only entry point
    # is still cloudflared -> caddy. It exists because the `internal` and `data` networks
    # are `internal: true`, which blocks egress AND external DNS resolution. Without it the
    # stack comes up with ALL healthchecks green (they are local) and fails on the first real call.
    networks: [internal, data, edge]
    depends_on:
      postgres:
        condition: service_healthy
      worker:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2560M
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      # failureThreshold 12 in the Bicep was calibrated for the Spring + Flyway boot (~30s).
      retries: 12
      start_period: 45s

  # ==========================================================================
  # APP — Web Next.js / BFF (replaces nora-web-dev; 1 vCPU / 2Gi, min 1)
  # ==========================================================================
  # WATCH OUT: NEXT_PUBLIC_API_BASE_URL is baked into the bundle at BUILD-TIME. Setting it
  # here does NOT change the bundle. If the public domain changes, the image has to be
  # rebuilt with the --build-arg (see .github/workflows/build-images.yml). Since the domain
  # is still nora.systems, the current GHCR image serves without a rebuild.
  web:
    image: ${REGISTRY:-ghcr.io}/${IMAGE_PREFIX:-sf0rzin/nora}-web:${WEB_TAG:-latest}
    container_name: nora-web
    <<: *default-restart
    logging: *default-logging
    environment:
      NORA_ENV: ${NORA_ENV:-prod}
      NEXT_PUBLIC_API_BASE_URL: https://api.${NORA_PUBLIC_DOMAIN:-nora.systems}
      NEXT_PUBLIC_USE_MOCKS: "false"
      OTEL_SERVICE_NAME: nora-web
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      # Core chat (server-side BFF, ADR 0004/0024). Keys never go to the browser.
      LLM_API_KEY: ${OPENAI_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
      LLM_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      LLM_KEY_OPENAI: ${OPENAI_API_KEY:-}
      LLM_KEY_DEEPSEEK: ${DEEPSEEK_API_KEY:-}
      LLM_KEY_GOOGLE: ${GEMINI_API_KEY:-}
      NORA_PLATFORM_INTERNAL_TOKEN: ${NORA_PLATFORM_INTERNAL_TOKEN:-}
    # `edge` does NOT publish a port: there is no `ports:` here and the only entry point
    # is still cloudflared -> caddy. It exists because the `internal` and `data` networks
    # are `internal: true`, which blocks egress AND external DNS resolution. Without it the
    # stack comes up with ALL healthchecks green (they are local) and fails on the first real call.
    networks: [internal, edge]
    depends_on:
      api:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2048M
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ==========================================================================
  # APP — Admin / control plane (replaces nora-admin-dev, ADR 0023/0025)
  # ==========================================================================
  # Still with no direct public route: it is only reached via Caddy when cloudflared
  # delivers the Host admin.<domain>, and Cloudflare's Access Application is what
  # authenticates at the edge. access.ts enforces only when THREE things hold, and fails OPEN
  # if any is missing: NORA_ADMIN_USE_MOCKS == "false" (hardcoded below), CF_ACCESS_TEAM_DOMAIN
  # non-empty and CF_ACCESS_AUD non-empty (both `:?` below, so the stack refuses to start).
  #
  # This comment used to end "and today in production it arrives empty (it was `vars.` reading a
  # Secret)". That is no longer true — measured on the running container, 2026-08-12, values not
  # printed: NORA_ADMIN_USE_MOCKS=false, CF_ACCESS_TEAM_DOMAIN length 28, CF_ACCESS_AUD length 64.
  admin:
    image: ${REGISTRY:-ghcr.io}/${IMAGE_PREFIX:-sf0rzin/nora}-admin:${ADMIN_TAG:-latest}
    container_name: nora-admin
    <<: *default-restart
    logging: *default-logging
    profiles: ["platform"]
    environment:
      NORA_ENV: ${NORA_ENV:-prod}
      NORA_ADMIN_USE_MOCKS: "false"
      PLATFORM_API_BASE_URL: http://api:8080
      PLATFORM_INTERNAL_TOKEN: ${NORA_PLATFORM_ADMIN_TOKEN:-}
      CF_ACCESS_TEAM_DOMAIN: ${CF_ACCESS_TEAM_DOMAIN:?CF_ACCESS_TEAM_DOMAIN is required - without it access.ts fails OPEN}
      CF_ACCESS_AUD: ${CF_ACCESS_AUD:?CF_ACCESS_AUD is required - without it access.ts fails OPEN}
      OTEL_SERVICE_NAME: nora-admin
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    # `edge` does NOT publish a port: there is no `ports:` here and the only entry point
    # is still cloudflared -> caddy. It exists because the `internal` and `data` networks
    # are `internal: true`, which blocks egress AND external DNS resolution. Without it the
    # stack comes up with ALL healthchecks green (they are local) and fails on the first real call.
    networks: [internal, edge]
    depends_on:
      api:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    healthcheck:
      # 127.0.0.1, not `localhost`: Next standalone binds IPv4-only (0.0.0.0), but the
      # container's /etc/hosts also resolves `localhost` to ::1 and BusyBox wget tries
      # IPv6 first -- connection refused with the server up and answering.
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3002/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ==========================================================================
  # OBSERVABILITY — replaces Log Analytics + Application Insights
  # ==========================================================================
  # Equivalent coverage requires TWO legs, not one:
  #   - traces/metrics (what the -javaagent did)    -> otel-collector -> prometheus/tempo
  #   - stdout logs of the 4 apps (what appLogsConfiguration did) -> alloy -> loki
  # An OTel Collector alone does NOT cover log shipping.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.115.1
    container_name: nora-otel-collector
    <<: *default-restart
    logging: *default-logging
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./observability/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    networks: [internal]
    # NO healthcheck, and that is deliberate. The otel-collector-contrib image is
    # distroless: it has no shell, no wget and no curl, so any `test:` based on them
    # never runs and the container stays `unhealthy` FOREVER — `up -d --wait`
    # aborts and deploy.sh fails a collector that is working fine.
    # Nobody declares a `depends_on` on it, and with `--wait` a service without a
    # healthcheck is considered ready once it is `running`. The health_check extension
    # is still enabled in observability/otel-collector.yaml and answers on :13133 — it can
    # be probed from outside (`docker compose exec prometheus wget -qO- otel-collector:13133`),
    # just not from inside.

  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: nora-prometheus
    <<: *default-restart
    logging: *default-logging
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --web.enable-remote-write-receiver
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks: [internal]
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3

  loki:
    image: grafana/loki:3.3.2
    container_name: nora-loki
    <<: *default-restart
    logging: *default-logging
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes:
      - ./observability/loki.yaml:/etc/loki/config.yaml:ro
      - loki_data:/loki
    networks: [internal]
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3100/ready"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Alloy reads the Docker socket and sends stdout/stderr of ALL containers to Loki.
  # Chosen over the `loki` log driver: the plugin breaks `docker logs` and, in
  # `mode=non-blocking`, silently drops lines under backpressure. Alloy has a WAL —
  # backpressure becomes delay, not loss.
  alloy:
    image: grafana/alloy:v1.7.1
    container_name: nora-alloy
    <<: *default-restart
    logging: *default-logging
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./observability/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [internal]
    depends_on:
      loki:
        condition: service_healthy

  grafana:
    image: grafana/grafana:11.5.1
    container_name: nora-grafana
    <<: *default-restart
    logging: *default-logging
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: https://grafana.${NORA_PUBLIC_DOMAIN:-nora.systems}
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
    networks: [internal]
    depends_on:
      - prometheus
      - loki
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ==========================================================================
  # BACKUP — replaces the 7-day PITR of Postgres Flexible Server
  # ==========================================================================
  # Hourly logical pg_dump + retention; there is no hypervisor snapshot leg — ADR 0036
  # withdraws it (no hypervisor, no second machine). RTO goes from minutes to hours —
  # an SLA change recorded in ADR 0034 §disponibilidade.
  backup:
    image: postgres:16-alpine
    container_name: nora-backup
    <<: *default-restart
    logging: *default-logging
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_ADMIN_USER:-nora_admin}
      PGPASSWORD: ${POSTGRES_ADMIN_PASSWORD:?POSTGRES_ADMIN_PASSWORD is required}
      PLATFORM_PGHOST: postgres-platform
      PLATFORM_PGPASSWORD: ${POSTGRES_PLATFORM_ADMIN_PASSWORD:-${POSTGRES_ADMIN_PASSWORD}}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-3600}
    volumes:
      - ${BACKUP_DIR:-/srv/nora/backups}:/backups
      - ./backup/run-backup.sh:/usr/local/bin/run-backup.sh:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/run-backup.sh"]
    networks: [data]
    depends_on:
      postgres:
        condition: service_healthy
