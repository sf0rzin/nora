<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NORA Desktop</title>
    <style>
      /* Critical CSS — evita flash branco/escuro durante o boot */
      html, body, #root {
        height: 100%;
        margin: 0;
        background-color: #FDFDFC;
      }
      body {
        color: #15171A;
        font-family: "DM Sans", ui-sans-serif, system-ui, -apple-system, sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
        letter-spacing: -0.005em;
      }
      @font-face {
        font-family: "DM Sans";
        font-style: normal;
        font-weight: 400 700;
        font-display: swap;
        src: url("/fonts/dm-sans-latin.woff2") format("woff2");
        unicode-range:
          U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA,
          U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191,
          U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: "DM Sans";
        font-style: normal;
        font-weight: 400 700;
        font-display: swap;
        src: url("/fonts/dm-sans-latin-ext.woff2") format("woff2");
        unicode-range:
          U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF,
          U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020,
          U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
      }
      @keyframes nora-spin {
        to { transform: rotate(360deg); }
      }
      .nora-boot {
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
      }
      .nora-boot .bars {
        display: flex;
        align-items: center;
        gap: 3px;
        height: 30px;
      }
      .nora-boot .bars span {
        display: block;
        width: 4px;
        background: #15171A;
        border-radius: 2px;
        animation: nora-bars 1.4s ease-in-out infinite;
      }
      .nora-boot .bars span:nth-child(1) { height: 50%; animation-delay: 0s; }
      .nora-boot .bars span:nth-child(2) { height: 75%; animation-delay: 0.12s; }
      .nora-boot .bars span:nth-child(3) { height: 100%; animation-delay: 0.24s; }
      .nora-boot .bars span:nth-child(4) { height: 75%; animation-delay: 0.36s; }
      .nora-boot .bars span:nth-child(5) { height: 50%; animation-delay: 0.48s; }
      .nora-boot small {
        font-size: 12px;
        color: #6E7178;
        letter-spacing: 0.04em;
      }
      @keyframes nora-bars {
        0%, 100% { opacity: 0.55; transform: scaleY(0.85); }
        50%      { opacity: 1; transform: scaleY(1); }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="nora-boot">
        <div class="bars" aria-label="NORA">
          <span></span><span></span><span></span><span></span><span></span>
        </div>
        <small>Carregando NORA</small>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
