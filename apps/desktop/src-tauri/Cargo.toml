[package]
name = "nora-desktop"
version = "0.2.5"
description = "NORA Desktop - Meeting Intelligence"
authors = ["sf0rzin"]
edition = "2021"
# Absent until cargo-deny reported this crate as unlicensed. `-only` because the root
# LICENSE is the plain AGPLv3 text with no "or any later version" clause. No other
# manifest in this repository declares one either.
#
# NOT inert: tauri-bundler's BundleSettings::license defaults to the Cargo.toml license
# when `bundle.license` is unset in tauri.conf.json, which it is, and `bundle.targets` is
# "all". So AGPL-3.0-only reaches the generated package metadata where nothing appeared
# before. Correct, and worth knowing rather than discovering.
license = "AGPL-3.0-only"
# Never goes to crates.io — this is the desktop application, not a library. Inert for the
# build: nothing in .github/, scripts/ or apps/desktop/ runs `cargo publish` or
# `cargo package`, and it does not affect `cargo build` or `tauri build`.
#
# It IS load-bearing for the supply-chain gate, which is the non-obvious part. It is what
# makes `[licenses.private] ignore = true` in deny.toml apply to this crate. Delete it as
# redundant and `cargo deny check licenses` fails with `error[rejected]` on our own AGPL,
# because that allow list is for dependencies and deliberately does not contain it.
publish = false

[lib]
name = "nora_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

# ============================================================================
# FEATURES — STT backend selection
# ============================================================================
# `stt-local` is the only backend. The Azure Speech sidecar that used to sit
# beside it was deleted; `NORA_STT_BACKEND` still exists in stt.rs but now has
# exactly one valid value, and anything else falls back with a warning.
#
# The feature is kept rather than inlined because the GPU features below hang off
# the optional `whisper-rs` dependency it pulls in.
#
# GPU acceleration is explicit opt-in, all of it. There used to be a `metal` feature
# switched on automatically by a [target.'cfg(target_os = "macos")'.dependencies] section;
# that section went with macOS support. Vulkan/CUDA stay opt-in because they require the
# vendor SDK on the BUILD machine (not only on the runtime one), so on by default would
# break CI.
#   cargo build --features whisper-vulkan     # with the Vulkan SDK installed
#   cargo build --features whisper-cuda       # with the CUDA Toolkit installed
#
# CPU is always the fallback: with no GPU feature whisper.cpp runs on CPU.
[features]
default = ["stt-local"]

# Local STT, in-process, via whisper.cpp (whisper-rs crate).
stt-local = ["dep:whisper-rs", "dep:sha2"]

# `?` = "if the optional dep is active, turn on its feature" — without the `?` the
# GPU feature would force-enable whisper-rs even with stt-local turned off.
whisper-vulkan = ["whisper-rs?/vulkan"]
whisper-cuda = ["whisper-rs?/cuda"]
whisper-openblas = ["whisper-rs?/openblas"]

[dependencies]
# Pinned at "=0.16.0" on purpose: whisper-rs vendors whisper.cpp as a
# submodule and a minor bump has swapped the FullParams/State API before
# (0.13 -> 0.14 renamed the log gate). Bump only with a real cargo check behind it.
whisper-rs = { version = "=0.16.0", optional = true }
sha2 = { version = "0.11", optional = true }

tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
reqwest = { version = "0.12", features = ["json", "rustls-tls", "multipart"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "0.15"
tokio = { version = "1", features = ["full"] }
base64 = "0.23"
uuid = { version = "1", features = ["v4"] }
rubato = "4.0.0"
audioadapter-buffers = "4.0.0"
url = "2.5.8"
urlencoding = "2"
chrono = { version = "0.4", features = ["serde"] }
# Only the Windows backend (Credential Manager / DPAPI). `apple-native` (Keychain) and
# `sync-secret-service` (D-Bus) were the macOS and Linux stores and pulled their platform
# stacks into the lock for platforms this client no longer builds for.
keyring = { version = "3", features = ["windows-native"] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

# One target section, because there is one target. The Linux section here used to pull in
# `libc`, `x11` and `raw-window-handle`, and the macOS one `libc` plus a second
# `whisper-rs` entry that force-enabled the `metal` feature. Both went with the platforms.
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Media_Audio",
    "Win32_Media_KernelStreaming",
    "Win32_Media_Multimedia",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_System_Ole",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Dwm",
] }
