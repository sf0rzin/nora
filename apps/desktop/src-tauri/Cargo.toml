[package]
name = "nora-desktop"
version = "0.2.5"
description = "NORA Desktop - Meeting Intelligence"
authors = ["sf0rzin"]
edition = "2021"
# Absent until cargo-deny reported this crate as unlicensed. `-only` because the root
# LICENSE is the plain AGPLv3 text with no "or any later version" clause. No other
# manifest in this repository declares one either.
#
# NOT inert: tauri-bundler's BundleSettings::license defaults to the Cargo.toml license
# when `bundle.license` is unset in tauri.conf.json, which it is, and `bundle.targets` is
# "all". So AGPL-3.0-only reaches the generated package metadata where nothing appeared
# before. Correct, and worth knowing rather than discovering.
license = "AGPL-3.0-only"
# Never goes to crates.io — this is the desktop application, not a library. Inert for the
# build: nothing in .github/, scripts/ or apps/desktop/ runs `cargo publish` or
# `cargo package`, and it does not affect `cargo build` or `tauri build`.
#
# It IS load-bearing for the supply-chain gate, which is the non-obvious part. It is what
# makes `[licenses.private] ignore = true` in deny.toml apply to this crate. Delete it as
# redundant and `cargo deny check licenses` fails with `error[rejected]` on our own AGPL,
# because that allow list is for dependencies and deliberately does not contain it.
publish = false

[lib]
name = "nora_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

# ============================================================================
# NO [features] SECTION, AND THAT IS THE POINT OF ADR 0039/0045
# ============================================================================
# There used to be one here selecting the STT engine: `default = ["stt-local"]`,
# plus `whisper-vulkan` / `whisper-cuda` / `whisper-openblas` hanging off the
# optional `whisper-rs` dependency, which vendored whisper.cpp and compiled it
# from C++ on every build machine. Transcription is now the provider's realtime
# API over a WebSocket (`stt_cloud.rs`), so there is no engine to select, no GPU
# backend to opt into, no `sha2` for verifying a 465 MiB model download, and no
# CMake/MSBuild step in CI.
#
# Do not reintroduce a feature flag to "keep the option open". The option is
# recorded in ADR 0035, which is superseded and stays readable.

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
reqwest = { version = "0.12", features = ["json", "rustls-tls", "multipart"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "0.15"
tokio = { version = "1", features = ["full"] }
# Realtime STT transport (ADR 0039/0045). rustls with the bundled webpki roots, NOT native-tls:
# `reqwest` above is already built with `rustls-tls` and `default-features = false`, so pulling
# OpenSSL in here would add a C toolchain requirement to a build that has none.
tokio-tungstenite = { version = "0.28", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }
# `StreamExt`/`SinkExt` for the split halves of the socket. Already in the lock as a transitive
# dependency; declared because this crate now uses it directly.
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
base64 = "0.23"
uuid = { version = "1", features = ["v4"] }
rubato = "5.0.0"
audioadapter-buffers = "4.0.0"
url = "2.5.8"
urlencoding = "2"
chrono = { version = "0.4", features = ["serde"] }
# Only the Windows backend (Credential Manager / DPAPI). `apple-native` (Keychain) and
# `sync-secret-service` (D-Bus) were the macOS and Linux stores and pulled their platform
# stacks into the lock for platforms this client no longer builds for.
keyring = { version = "3", features = ["windows-native"] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

# One target section, because there is one target. The Linux section here used to pull in
# `libc`, `x11` and `raw-window-handle`, and the macOS one `libc` plus a second
# `whisper-rs` entry that force-enabled the `metal` feature. Both went with the platforms.
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Media_Audio",
    "Win32_Media_KernelStreaming",
    "Win32_Media_Multimedia",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_System_Ole",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Dwm",
] }
