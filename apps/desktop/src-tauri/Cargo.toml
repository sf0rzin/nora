[package]
name = "nora-desktop"
version = "0.2.5"
description = "NORA Desktop - Meeting Intelligence"
authors = ["NORA Team"]
edition = "2021"

[lib]
name = "nora_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

# ============================================================================
# FEATURES — STT backend selection
# ============================================================================
# During the Azure -> local transition BOTH backends compile by default. The
# effective backend is chosen at RUNTIME (env `NORA_STT_BACKEND`, see stt.rs),
# not at build-time; the feature only controls whether the code enters the binary.
#
# For a "pure local" build (without the Python sidecar in the bundle):
#   cargo build --no-default-features --features stt-local
#
# GPU acceleration: `whisper-metal` is turned on automatically on macOS by the
# [target.'cfg(target_os = "macos")'.dependencies] section below. Vulkan/CUDA
# stay explicit opt-in because they require the vendor SDK on the BUILD machine
# (not only on the runtime one) — on by default would break CI on all three targets.
#   cargo build --features whisper-vulkan     # Windows/Linux with Vulkan SDK
#   cargo build --features whisper-cuda       # Windows/Linux with CUDA Toolkit
#
# CPU is always the fallback: with no GPU feature whisper.cpp runs on CPU.
[features]
default = ["stt-local", "stt-azure"]

# Local STT, in-process, via whisper.cpp (whisper-rs crate).
stt-local = ["dep:whisper-rs", "dep:sha2"]

# STT via Python sidecar + Azure Speech SDK. LEGACY — kept behind a flag
# during the transition. Remove together with apps/desktop/sidecar/ once local
# is validated on real hardware on all three targets.
stt-azure = []

# `?` = "if the optional dep is active, turn on its feature" — without the `?` the
# GPU feature would force-enable whisper-rs even with stt-local turned off.
whisper-vulkan = ["whisper-rs?/vulkan"]
whisper-cuda = ["whisper-rs?/cuda"]
whisper-openblas = ["whisper-rs?/openblas"]

[dependencies]
# Pinned at "=0.16.0" on purpose: whisper-rs vendors whisper.cpp as a
# submodule and a minor bump has swapped the FullParams/State API before
# (0.13 -> 0.14 renamed the log gate). Bump only with cargo check on the 3 targets.
whisper-rs = { version = "=0.16.0", optional = true }
sha2 = { version = "0.10", optional = true }

tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
reqwest = { version = "0.12", features = ["json", "rustls-tls", "multipart"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "0.15"
tokio = { version = "1", features = ["full"] }
base64 = "0.23"
uuid = { version = "1", features = ["v4"] }
rubato = "2.0.0"
audioadapter-buffers = "3.0.0"
url = "2.5.8"
urlencoding = "2"
chrono = { version = "0.4", features = ["serde"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
x11 = { version = "2", features = ["xlib"] }
raw-window-handle = "0.6"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
# Metal by default on macOS: Cargo takes the UNION of the features of this section
# with those of [dependencies], so the macOS build gets "metal" and the others do
# not. whisper.cpp falls back to CPU on its own if the Metal device does not
# initialize, so this does not break old Intel. Does not apply to CoreML: the CoreML
# encoder needs a per-model .mlmodelc, which we do not download (see whisper_model.rs).
whisper-rs = { version = "=0.16.0", features = ["metal"], optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Media_Audio",
    "Win32_Media_KernelStreaming",
    "Win32_Media_Multimedia",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_System_Ole",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Dwm",
] }
