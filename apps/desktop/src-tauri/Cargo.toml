[package]
name = "nora-desktop"
version = "0.1.0"
description = "NORA Desktop - Meeting Intelligence"
authors = ["NORA Team"]
edition = "2021"

[lib]
name = "nora_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "0.15"
tokio = { version = "1", features = ["full"] }
