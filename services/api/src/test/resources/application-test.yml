spring:
  jpa:
    hibernate:
      ddl-auto: none

nora:
  security:
    jwt:
      secret: test-secret-with-at-least-32-chars-aaaa
      expires-seconds: 3600
    expose-dev-tokens: true
    # Very high rate limit in the test profile: dozens of ITs run in the same JVM
    # against the same loopback (127.0.0.1), and the default cap of 10 login/min blows up.
    # Anti brute-force defense is tested in AuthRateLimiterTest (client identity,
    # cap per IP and cap per target email), not here.
    rate-limit:
      login-per-minute: 100000
      login-per-minute-per-email: 100000
      signup-per-minute: 100000
      reset-per-10-minutes: 100000
    # Tests use MockMvc/RestAssured directly on the loopback, without the Cloudflare edge. Empty forces
    # the clientKey to fall back to the connection IP instead of looking for a header that never arrives.
    trusted-client-ip-header: ""
  app:
    public-base-url: http://localhost:3000
  analysis:
    auto-dispatch: false

logging:
  level:
    br.com.nora: INFO
