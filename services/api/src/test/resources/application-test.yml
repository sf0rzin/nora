spring:
  jpa:
    hibernate:
      ddl-auto: none

nora:
  security:
    jwt:
      secret: test-secret-with-at-least-32-chars-aaaa
      expires-seconds: 3600
    expose-dev-tokens: true
    # Very high rate limit in the test profile: dozens of ITs run in the same JVM
    # against the same loopback (127.0.0.1), and the default cap of 10 login/min blows up.
    # Anti brute-force defense is tested in AuthRateLimiterTest (client identity,
    # cap per IP and cap per target email), not here.
    # The account cap stays STRICTLY BELOW the origin cap even here, where both are set high
    # enough to be inert. Equal values are the dead configuration the cap shipped with -- a
    # login spends a token from both buckets, so at parity the origin one always empties
    # first and the account cap can never reject. Leaving the invariant violated in the
    # profile every integration test runs under is how it stops being an invariant.
    rate-limit:
      login-per-minute: 100000
      login-per-minute-per-email: 99999
      signup-per-minute: 100000
      reset-per-10-minutes: 100000
    # Tests use MockMvc/RestAssured directly on the loopback, without the Cloudflare edge. Empty forces
    # the clientKey to fall back to the connection IP instead of looking for a header that never arrives.
    trusted-client-ip-header: ""
  app:
    public-base-url: http://localhost:3000
  integrations:
    # The 26 @SpringBootTest classes boot the whole context, TokenCipher included, and none of
    # them sets NORA_INTEGRATIONS_ENC_KEY. Since an empty key is now fail-closed, the test
    # profile has to take the plaintext opt-in explicitly or every integration test dies on
    # context startup. What the tests exercise is the OAuth flow, not the cipher — the cipher's
    # own behaviour, including that the opt-in is required, is covered by TokenCipherTest.
    allow-plaintext-tokens: true
  analysis:
    auto-dispatch: false

logging:
  level:
    br.com.nora: INFO
