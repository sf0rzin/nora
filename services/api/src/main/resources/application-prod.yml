# Hardened defaults for the prod profile. Bicep injects SPRING_PROFILES_ACTIVE=prod.
# We keep config here so production has safe defaults even if an env var fails
# (fail-closed). JjwtJwtIssuer.java rejects the public JWT_SECRET placeholder
# outside the local/test profiles.

spring:
  jpa:
    show-sql: false
    properties:
      hibernate.format_sql: false

# Swagger/OpenAPI disabled in prod: apiApp has external ingress, so publishing
# the spec would expose the full API map to unauthenticated users (reconnaissance). Springdoc
# stays enabled in local/dev (useful for development). api-security audit 2026-06-03.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

nora:
  security:
    expose-dev-tokens: false
  auth:
    cookie-secure: true
  integrations:
    # Pinned, not read from env, on purpose: under the prod profile there is no legitimate
    # reason to store OAuth access/refresh tokens as `plain:` in the database, so the escape
    # hatch NORA_INTEGRATIONS_ALLOW_PLAINTEXT offers local dev is not reachable here. A prod
    # boot without NORA_INTEGRATIONS_ENC_KEY fails, naming the variable.
    allow-plaintext-tokens: false

logging:
  level:
    root: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
