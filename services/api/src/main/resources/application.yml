spring:
  application:
    name: nora-api
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    url: ${DATASOURCE_URL:jdbc:postgresql://localhost:5432/nora}
    username: ${DATASOURCE_USERNAME:nora}
    password: ${DATASOURCE_PASSWORD:nora_dev}
    hikari:
      maximum-pool-size: 10
  jpa:
    hibernate:
      # Flyway e a fonte da verdade do schema. Hibernate validate quebra com tipos
      # Postgres-especificos (citext, jsonb), entao desligamos a validacao.
      ddl-auto: none
    properties:
      hibernate.jdbc.time_zone: UTC
    open-in-view: false
    # Sob RLS enforce (ADR 0028) a API runtime conecta como nora_app (NOBYPASSRLS, SEM DDL);
    # o Flyway precisa rodar como ADMIN (owner, com DDL, e dono das tabelas pra que o nora_app
    # nao-owner seja sujeito a RLS). NAO definimos spring.flyway.{url,user,password} aqui de
    # proposito: setar um default forcaria o FlywayUrlCondition e o Flyway ignoraria o datasource
    # (quebrando dev/test, que usam DATASOURCE_* dinamico). Por default, spring.flyway herda o
    # spring.datasource. No cutover, o Bicep injeta SPRING_FLYWAY_URL/USER/PASSWORD (= admin) por
    # env (relaxed binding) -> aí sim o Flyway usa o admin enquanto o datasource aponta pro nora_app.
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  # Sem isso, requests para rotas inexistentes caem no DefaultServlet de static
  # resources (Whitelabel 404) em vez de chegar no `NoHandlerFoundException`
  # do `GlobalExceptionHandler`. Combinado com `add-mappings: false` para
  # desabilitar o mapping default dos static resources.
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
  forward-headers-strategy: framework

spring.servlet.multipart:
  max-file-size: 10MB
  max-request-size: 12MB

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

nora:
  security:
    # Row Level Security Postgres (ADR 0002 defense in depth).
    # V016 cria as policies. Quando enforce=true, TenantRlsAspect executa
    # SET LOCAL nora.current_tenant_id no inicio de cada @Transactional.
    # Default off porque exige que app rode com role Postgres sem BYPASSRLS
    # (ver V016 comments pra operacao de ativacao).
    rls:
      enforce: ${NORA_RLS_ENFORCE:false}
      # Caminho BYPASSRLS dedicado da telemetria de negocio operador-only (ADR 0026).
      # Vazio (default) = telemetria usa o datasource primario (owner bypassa RLS em
      # dev/CI e em prod ANTES do cutover). No passo de cutover do enforce, setar estas
      # 3 vars apontando o banco primario com o role nora_telemetry (BYPASSRLS),
      # provisionado por db/operational/R001__provision_app_roles.sql. Sem isso, sob
      # enforce a agregacao cross-tenant veria 0 linhas (fail-closed) SILENCIOSAMENTE.
      telemetry:
        url: ${NORA_TELEMETRY_DATASOURCE_URL:}
        username: ${NORA_TELEMETRY_DATASOURCE_USERNAME:}
        password: ${NORA_TELEMETRY_DATASOURCE_PASSWORD:}
    jwt:
      # HS256 (default, simetrico, secret compartilhado) ou RS256 (assimetrico, RSA com JWKS).
      # Em RS256 e obrigatorio JWT_RS256_PRIVATE_KEY_PEM. Ver RsaJwtIssuer + JwksController.
      algorithm: ${JWT_ALGORITHM:HS256}
      secret: ${JWT_SECRET:change-me-please-min-32-chars-long-aaaa}
      # Access JWT curto (15 minutos). Renovado proativamente pelo cliente via /auth/refresh.
      expires-seconds: ${JWT_EXPIRES_SECONDS:900}
      rsa:
        # PKCS#8 PEM (envelope -----BEGIN PRIVATE KEY----- ou base64 puro). Obrigatorio
        # quando algorithm=RS256. Em Azure, populado via Key Vault secret + Bicep.
        private-key-pem: ${JWT_RS256_PRIVATE_KEY_PEM:}
        # Identificador da chave (kid header do JWT + JWKS). Use rotation suffix tipo "nora-2026q2".
        kid: ${JWT_RS256_KID:nora-key-1}
    refresh-token:
      # Refresh token longo (30 dias). Stateful em refresh_tokens.
      expires-seconds: ${REFRESH_TOKEN_EXPIRES_SECONDS:2592000}
    email-verification:
      expires-seconds: ${EMAIL_VERIFICATION_EXPIRES_SECONDS:86400}
    password-reset:
      expires-seconds: ${PASSWORD_RESET_EXPIRES_SECONDS:3600}
    expose-dev-tokens: ${EXPOSE_DEV_TOKENS:false}
  auth:
    # Secure flag dos cookies httpOnly. Default false em dev (cookies em http://localhost),
    # true em prod via env. Round 2 / Subfase 1.3 A.
    cookie-secure: ${AUTH_COOKIE_SECURE:false}
    # Domain explicito p/ que web e api (subdomínios irmãos do mesmo Container Apps env,
    # ex.: salmonbeach-X.centralus.azurecontainerapps.io) compartilhem o cookie. Sem isso,
    # o cookie fica scoped só na api e o middleware do Next no domínio web redireciona infinito.
    # Vazio = sem Domain (comportamento legacy, OK em localhost ou com custom domain).
    cookie-domain: ${AUTH_COOKIE_DOMAIN:}
  app:
    public-base-url: ${NORA_APP_PUBLIC_BASE_URL:http://localhost:3000}
  privacy:
    # LGPD retenção (ADR 0029): sweeper purga meetings + transcript (raw_text = PII em repouso) +
    # filhos mais antigos que N dias. 0 = DESLIGADO (default — destrutivo, opt-in por ambiente).
    retention-days: ${NORA_PRIVACY_RETENTION_DAYS:0}
    retention-cron: ${NORA_PRIVACY_RETENTION_CRON:0 30 3 * * *}
  embedding:
    # RAG (busca semântica do chat). Provider-agnóstico (ADR 0004): gemini (default) ou openai.
    # Sem credencial pro provider ativo → embeddings DESLIGADOS (no-op; o chat cai no fallback).
    provider: ${NORA_EMBEDDING_PROVIDER:gemini}
    model: ${NORA_EMBEDDING_MODEL:text-embedding-004}
    dimension: ${NORA_EMBEDDING_DIMENSION:768}
    gemini-api-key: ${GEMINI_API_KEY:}
    openai-api-key: ${OPENAI_API_KEY:}
  frontend:
    base-url: ${NORA_FRONTEND_BASE_URL:http://localhost:3000}
  email:
    from: ${NORA_EMAIL_FROM:NORA <onboarding@resend.dev>}
    resend:
      api-key: ${RESEND_API_KEY:}
  integrations:
    # NORA Flows Fase 2 — OAuth com provedores externos (Gmail/Calendar e Slack).
    # Sem client-id/redirect-uri o hub mostra "não configurado" e start retorna 422 (fail-visible).
    state-secret: ${NORA_INTEGRATIONS_STATE_SECRET:}
    # AES-256-GCM p/ tokens em repouso: 32 bytes em base64. Vazio (dev) = armazena sem cifra c/ WARN.
    encryption-key: ${NORA_INTEGRATIONS_ENC_KEY:}
    google:
      client-id: ${GOOGLE_OAUTH_CLIENT_ID:}
      client-secret: ${GOOGLE_OAUTH_CLIENT_SECRET:}
      redirect-uri: ${GOOGLE_OAUTH_REDIRECT_URI:http://localhost:8080/integrations/google/oauth/callback}
    slack:
      client-id: ${SLACK_OAUTH_CLIENT_ID:}
      client-secret: ${SLACK_OAUTH_CLIENT_SECRET:}
      redirect-uri: ${SLACK_OAUTH_REDIRECT_URI:http://localhost:8080/integrations/slack/oauth/callback}
    # Onda 1 de provedores genéricos (OAuth2 code-flow padrão, sem refresh token na prática).
    github:
      client-id: ${GITHUB_OAUTH_CLIENT_ID:}
      client-secret: ${GITHUB_OAUTH_CLIENT_SECRET:}
      redirect-uri: ${GITHUB_OAUTH_REDIRECT_URI:http://localhost:8080/integrations/github/oauth/callback}
    notion:
      client-id: ${NOTION_OAUTH_CLIENT_ID:}
      client-secret: ${NOTION_OAUTH_CLIENT_SECRET:}
      redirect-uri: ${NOTION_OAUTH_REDIRECT_URI:http://localhost:8080/integrations/notion/oauth/callback}
    todoist:
      client-id: ${TODOIST_OAUTH_CLIENT_ID:}
      client-secret: ${TODOIST_OAUTH_CLIENT_SECRET:}
      redirect-uri: ${TODOIST_OAUTH_REDIRECT_URI:http://localhost:8080/integrations/todoist/oauth/callback}
    linear:
      client-id: ${LINEAR_OAUTH_CLIENT_ID:}
      client-secret: ${LINEAR_OAUTH_CLIENT_SECRET:}
      redirect-uri: ${LINEAR_OAUTH_REDIRECT_URI:http://localhost:8080/integrations/linear/oauth/callback}
  worker:
    base-url: ${NLP_WORKER_BASE_URL:http://localhost:8001}
  speech:
    azure:
      subscription-key: ${AZURE_SPEECH_KEY:}
      default-region: ${AZURE_SPEECH_REGION:brazilsouth}
      token-endpoint-template: "https://%s.api.cognitive.microsoft.com/sts/v1.0/issueToken"
      token-ttl-seconds: 540
      request-timeout-ms: 5000
    rate-limit:
      tokens-per-minute: 6

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:1420}
    allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
    allowed-headers: "*"
    allow-credentials: true
    max-age-seconds: 3600

  # Control plane de operador + telemetria de IA (ADR 0022/0023/0024). Default OFF: em
  # local/test/CI o módulo platform fica inteiramente inerte (sem 2º datasource, sem Flyway).
  # Prod liga via NORA_PLATFORM_ENABLED=true (Bicep). Banco de plataforma é SEPARADO.
  platform:
    enabled: ${NORA_PLATFORM_ENABLED:false}
    # Token serviço-a-serviço (worker/BFF -> /internal/platform/**)
    internal-token: ${NORA_PLATFORM_INTERNAL_TOKEN:}
    # Token do console (nora-admin -> /admin/platform/**). Vazio = cai no internal-token (WARN).
    admin-token: ${NORA_PLATFORM_ADMIN_TOKEN:}
    datasource:
      url: ${PLATFORM_DATASOURCE_URL:jdbc:postgresql://localhost:5433/nora_platform}
      username: ${PLATFORM_DATASOURCE_USERNAME:nora_platform}
      password: ${PLATFORM_DATASOURCE_PASSWORD:nora_platform_dev}
      max-pool-size: ${PLATFORM_DATASOURCE_MAX_POOL:4}
    # Fallback SOFT do resolver de modelo (ADR 0024) — usado quando o catálogo falha.
    fallback:
      provider: ${NORA_PLATFORM_FALLBACK_PROVIDER:openai}
      model: ${NORA_PLATFORM_FALLBACK_MODEL:gpt-4o-mini}
      base-url: ${NORA_PLATFORM_FALLBACK_BASE_URL:https://api.openai.com/v1}
    # Telemetria de saúde (b): App Insights REST query API. Vazio = health "unavailable".
    health:
      app-insights-app-id: ${NORA_PLATFORM_HEALTH_APP_ID:}
      api-key: ${NORA_PLATFORM_HEALTH_API_KEY:}
      window: ${NORA_PLATFORM_HEALTH_WINDOW:PT1H}
    # Telemetria de negócio (c) — cortável.
    business:
      enabled: ${NORA_PLATFORM_BUSINESS_ENABLED:true}

logging:
  level:
    root: ${LOG_LEVEL:INFO}
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
  # Injeta o contexto de correlacao (RequestIdFilter + JwtAuthenticationFilter) em toda linha de
  # log: req=<X-Request-Id> tenant=<tenantId> user=<userId>. ':-' = vazio quando ausente.
  pattern:
    level: "%5p [req=%X{requestId:-} tenant=%X{tenantId:-} user=%X{userId:-}]"
