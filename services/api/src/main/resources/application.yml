spring:
  application:
    name: nora-api
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    url: ${DATASOURCE_URL:jdbc:postgresql://localhost:5432/nora}
    username: ${DATASOURCE_USERNAME:nora}
    password: ${DATASOURCE_PASSWORD:nora_dev}
    hikari:
      maximum-pool-size: 10
  jpa:
    hibernate:
      # Flyway is the source of truth for the schema. Hibernate validate breaks with
      # Postgres-specific types (citext, jsonb), so we turn validation off.
      ddl-auto: none
    properties:
      hibernate.jdbc.time_zone: UTC
    open-in-view: false
    # Under RLS enforce (ADR 0028) the runtime API connects as nora_app (NOBYPASSRLS, NO DDL);
    # Flyway has to run as ADMIN (owner, with DDL, and owner of the tables so that non-owner
    # nora_app is subject to RLS). We do NOT set spring.flyway.{url,user,password} here on
    # purpose: setting a default would force FlywayUrlCondition and Flyway would ignore the datasource
    # (breaking dev/test, which use dynamic DATASOURCE_*). By default, spring.flyway inherits
    # spring.datasource. At cutover, Bicep injects SPRING_FLYWAY_URL/USER/PASSWORD (= admin) via
    # env (relaxed binding) -> then Flyway uses the admin while the datasource points at nora_app.
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  # Without this, requests to nonexistent routes fall into the static resources
  # DefaultServlet (Whitelabel 404) instead of reaching the `NoHandlerFoundException`
  # of `GlobalExceptionHandler`. Combined with `add-mappings: false` to
  # disable the default static resources mapping.
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
  forward-headers-strategy: framework

spring.servlet.multipart:
  max-file-size: 10MB
  max-request-size: 12MB

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

nora:
  security:
    # Postgres Row Level Security (ADR 0002 defense in depth).
    # V016 creates the policies. When enforce=true, TenantRlsAspect runs
    # SET LOCAL nora.current_tenant_id at the start of each @Transactional.
    # Default off because it requires the app to run with a Postgres role without BYPASSRLS
    # (see V016 comments for the activation procedure).
    rls:
      enforce: ${NORA_RLS_ENFORCE:false}
      # Dedicated BYPASSRLS path for the operator-only business telemetry (ADR 0026).
      # Empty (default) = telemetry uses the primary datasource (the owner bypasses RLS in
      # dev/CI and in prod BEFORE the cutover). In the enforce cutover step, set these
      # 3 vars pointing at the primary database with the nora_telemetry role (BYPASSRLS),
      # provisioned by db/operational/R001__provision_app_roles.sql. Without this, under
      # enforce the cross-tenant aggregation would see 0 rows (fail-closed) SILENTLY.
      telemetry:
        url: ${NORA_TELEMETRY_DATASOURCE_URL:}
        username: ${NORA_TELEMETRY_DATASOURCE_USERNAME:}
        password: ${NORA_TELEMETRY_DATASOURCE_PASSWORD:}
    jwt:
      # HS256 (default, symmetric, shared secret) or RS256 (asymmetric, RSA with JWKS).
      # With RS256, JWT_RS256_PRIVATE_KEY_PEM is mandatory. See RsaJwtIssuer + JwksController.
      algorithm: ${JWT_ALGORITHM:HS256}
      secret: ${JWT_SECRET:change-me-please-min-32-chars-long-aaaa}
      # Short access JWT (15 minutes). Proactively renewed by the client via /auth/refresh.
      expires-seconds: ${JWT_EXPIRES_SECONDS:900}
      rsa:
        # PKCS#8 PEM (envelope -----BEGIN PRIVATE KEY----- or plain base64). Mandatory
        # when algorithm=RS256. On Azure, populated via Key Vault secret + Bicep.
        private-key-pem: ${JWT_RS256_PRIVATE_KEY_PEM:}
        # Key identifier (JWT kid header + JWKS). Use a rotation suffix like "nora-2026q2".
        kid: ${JWT_RS256_KID:nora-key-1}
    refresh-token:
      # Long refresh token (30 days). Stateful in refresh_tokens.
      expires-seconds: ${REFRESH_TOKEN_EXPIRES_SECONDS:2592000}
    email-verification:
      expires-seconds: ${EMAIL_VERIFICATION_EXPIRES_SECONDS:86400}
    password-reset:
      expires-seconds: ${PASSWORD_RESET_EXPIRES_SECONDS:3600}
    expose-dev-tokens: ${EXPOSE_DEV_TOKENS:false}
  auth:
    # Secure flag of the httpOnly cookies. Default false in dev (cookies on http://localhost),
    # true in prod via env. Round 2 / Subphase 1.3 A.
    cookie-secure: ${AUTH_COOKIE_SECURE:false}
    # Explicit Domain so that web and api (sibling subdomains of the same Container Apps env,
    # e.g.: salmonbeach-X.centralus.azurecontainerapps.io) share the cookie. Without it,
    # the cookie is scoped to the api only and Next's middleware on the web domain redirects forever.
    # Empty = no Domain (legacy behaviour, OK on localhost or with a custom domain).
    cookie-domain: ${AUTH_COOKIE_DOMAIN:}
  app:
    public-base-url: ${NORA_APP_PUBLIC_BASE_URL:http://localhost:3000}
  analysis:
    # Fire-and-forget dispatch of the pipeline right after an upload. Declared here because it was
    # only ever a @Value default in MeetingService, and this section would otherwise read as if the
    # sweep keys below were all of nora.analysis. The test profile turns it off.
    auto-dispatch: ${NORA_ANALYSIS_AUTO_DISPATCH:true}
    # Stuck-analysis sweep: a meeting whose pipeline died mid-roundtrip (deploy, OOM, restart) stays
    # in PROCESSING forever, and re-analysis refuses PROCESSING by design. The sweeper moves such a
    # row to FAILED so the user can retry it. Non-destructive (a status is rewritten, nothing is
    # deleted), so unlike retention it is ON by default.
    # The window MUST stay well above nora.worker.timeout-millis or a slow-but-healthy analysis is
    # reaped as a dead one; StuckAnalysisSweeper refuses anything below timeout + 5 min and WARNs.
    stuck-window-minutes: ${NORA_ANALYSIS_STUCK_WINDOW_MINUTES:30}
    stuck-sweep-cron: ${NORA_ANALYSIS_STUCK_SWEEP_CRON:0 */5 * * * *}
  privacy:
    # LGPD retention (ADR 0029): the sweeper purges meetings + transcript (raw_text = PII at rest) +
    # children older than N days. The value is an AGE IN DAYS and the sentinel is at the BOTTOM of
    # the range:
    #   0 or negative -> retention OFF, nothing is ever purged (this default).
    #   N >= 1        -> retention ON, meetings created more than N days ago are purged.
    # There is no value meaning "purge immediately": lowering the number towards zero turns the
    # purge OFF, it does not accelerate it. The purge is an irreversible hard delete with CASCADE,
    # so OFF is the only safe default for an environment that forgot to set the variable.
    # RetentionSweeper logs which of the two states is active at boot.
    retention-days: ${NORA_PRIVACY_RETENTION_DAYS:0}
    retention-cron: ${NORA_PRIVACY_RETENTION_CRON:0 30 3 * * *}
  embedding:
    # RAG (chat semantic search). Provider-agnostic (ADR 0004): gemini (default) or openai.
    # No credential for the active provider → embeddings OFF (no-op; the chat falls back).
    provider: ${NORA_EMBEDDING_PROVIDER:gemini}
    model: ${NORA_EMBEDDING_MODEL:text-embedding-004}
    dimension: ${NORA_EMBEDDING_DIMENSION:768}
    gemini-api-key: ${GEMINI_API_KEY:}
    openai-api-key: ${OPENAI_API_KEY:}
  frontend:
    base-url: ${NORA_FRONTEND_BASE_URL:http://localhost:3000}
  email:
    from: ${NORA_EMAIL_FROM:NORA <onboarding@resend.dev>}
    resend:
      api-key: ${RESEND_API_KEY:}
  integrations:
    # NORA Flows Phase 2 — OAuth with external providers (Gmail/Calendar and Slack).
    # Without client-id/redirect-uri the hub shows "not configured" and start returns 422 (fail-visible).
    state-secret: ${NORA_INTEGRATIONS_STATE_SECRET:}
    # AES-256-GCM for tokens at rest: 32 bytes in base64. Empty = FAIL-CLOSED: the boot dies
    # naming the variable, because an empty key means OAuth access AND refresh tokens are
    # written to the database as `plain:...`. Degrading is a local-dev convenience, so it now
    # takes the explicit opt-in below (ADR 0031 kept the `plain:` path; it stopped being the
    # default). The compose on the host does not pass the opt-in on purpose.
    encryption-key: ${NORA_INTEGRATIONS_ENC_KEY:}
    allow-plaintext-tokens: ${NORA_INTEGRATIONS_ALLOW_PLAINTEXT:false}
    google:
      client-id: ${GOOGLE_OAUTH_CLIENT_ID:}
      client-secret: ${GOOGLE_OAUTH_CLIENT_SECRET:}
      redirect-uri: ${GOOGLE_OAUTH_REDIRECT_URI:http://localhost:8080/integrations/google/oauth/callback}
    slack:
      client-id: ${SLACK_OAUTH_CLIENT_ID:}
      client-secret: ${SLACK_OAUTH_CLIENT_SECRET:}
      redirect-uri: ${SLACK_OAUTH_REDIRECT_URI:http://localhost:8080/integrations/slack/oauth/callback}
    # Wave 1 of generic providers (standard OAuth2 code-flow, no refresh token in practice).
    github:
      client-id: ${GITHUB_OAUTH_CLIENT_ID:}
      client-secret: ${GITHUB_OAUTH_CLIENT_SECRET:}
      redirect-uri: ${GITHUB_OAUTH_REDIRECT_URI:http://localhost:8080/integrations/github/oauth/callback}
    notion:
      client-id: ${NOTION_OAUTH_CLIENT_ID:}
      client-secret: ${NOTION_OAUTH_CLIENT_SECRET:}
      redirect-uri: ${NOTION_OAUTH_REDIRECT_URI:http://localhost:8080/integrations/notion/oauth/callback}
    todoist:
      client-id: ${TODOIST_OAUTH_CLIENT_ID:}
      client-secret: ${TODOIST_OAUTH_CLIENT_SECRET:}
      redirect-uri: ${TODOIST_OAUTH_REDIRECT_URI:http://localhost:8080/integrations/todoist/oauth/callback}
    linear:
      client-id: ${LINEAR_OAUTH_CLIENT_ID:}
      client-secret: ${LINEAR_OAUTH_CLIENT_SECRET:}
      redirect-uri: ${LINEAR_OAUTH_REDIRECT_URI:http://localhost:8080/integrations/linear/oauth/callback}
    # Wave 2 — three different connection models:
    # Microsoft (Outlook + Calendar): generic OAuth2 code-flow WITH refresh (offline_access).
    microsoft:
      client-id: ${MS_OAUTH_CLIENT_ID:}
      client-secret: ${MS_OAUTH_CLIENT_SECRET:}
      redirect-uri: ${MS_OAUTH_REDIRECT_URI:http://localhost:8080/integrations/microsoft/oauth/callback}
    # Telegram: NO OAuth — the app's single bot; each tenant pairs by code (deep link /start).
    telegram:
      bot-token: ${NORA_TELEGRAM_BOT_TOKEN:}
    # Trello: NO server-side OAuth — the app key builds the authorize URL; the user pastes the token.
    trello:
      api-key: ${TRELLO_API_KEY:}
  worker:
    base-url: ${NLP_WORKER_BASE_URL:http://localhost:8001}
    # Sent as X-Internal-Token on every worker call (ADR 0023 §3-4). NOT the same secret as
    # nora.platform.internal-token below, which travels the other way (worker/BFF -> this API).
    # Empty = the header is not sent; the worker then refuses with 503 unless it was started
    # with NORA_WORKER_ALLOW_UNAUTHENTICATED=true. Empty is not a bypass.
    internal-token: ${NORA_WORKER_INTERNAL_TOKEN:}
    # Total timeout of the /analyze roundtrip. Declared here (it used to live only as a Java
    # default) because nora.analysis.stuck-window-minutes is floored against it: the two numbers
    # have to be readable side by side, or the floor gets silently invalidated by a raised timeout.
    timeout-millis: ${NLP_WORKER_TIMEOUT_MILLIS:120000}

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:1420}
    allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
    allowed-headers: "*"
    allow-credentials: true
    max-age-seconds: 3600

  # Operator control plane + AI telemetry (ADR 0022/0023/0024). Default OFF: in
  # local/test/CI the platform module is entirely inert (no 2nd datasource, no Flyway).
  # Prod turns it on via NORA_PLATFORM_ENABLED=true (Bicep). The platform database is SEPARATE.
  platform:
    enabled: ${NORA_PLATFORM_ENABLED:false}
    # Service-to-service token (worker/BFF -> /internal/platform/**)
    internal-token: ${NORA_PLATFORM_INTERNAL_TOKEN:}
    # Console token (nora-admin -> /admin/platform/**). Empty = falls back to internal-token (WARN).
    admin-token: ${NORA_PLATFORM_ADMIN_TOKEN:}
    datasource:
      url: ${PLATFORM_DATASOURCE_URL:jdbc:postgresql://localhost:5433/nora_platform}
      username: ${PLATFORM_DATASOURCE_USERNAME:nora_platform}
      password: ${PLATFORM_DATASOURCE_PASSWORD:nora_platform_dev}
      max-pool-size: ${PLATFORM_DATASOURCE_MAX_POOL:4}
    # SOFT fallback of the model resolver (ADR 0024) — used when the catalog fails.
    fallback:
      provider: ${NORA_PLATFORM_FALLBACK_PROVIDER:openai}
      model: ${NORA_PLATFORM_FALLBACK_MODEL:gpt-4o-mini}
      base-url: ${NORA_PLATFORM_FALLBACK_BASE_URL:https://api.openai.com/v1}
    # Health telemetry (b): Prometheus HTTP query API (ADR 0034; used to be App Insights + KQL).
    # Empty = health "unavailable" — the endpoint still answers 200, with services empty.
    # No api-key: Prometheus sits on the compose `internal` bridge, with no public exposure.
    health:
      prometheus-url: ${NORA_PLATFORM_HEALTH_PROMETHEUS_URL:}
      window: ${NORA_PLATFORM_HEALTH_WINDOW:PT1H}
    # Business telemetry (c) — cuttable.
    business:
      enabled: ${NORA_PLATFORM_BUSINESS_ENABLED:true}

logging:
  level:
    root: ${LOG_LEVEL:INFO}
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
  # Injects the correlation context (RequestIdFilter + JwtAuthenticationFilter) into every log
  # line: req=<X-Request-Id> tenant=<tenantId> user=<userId>. ':-' = empty when absent.
  pattern:
    level: "%5p [req=%X{requestId:-} tenant=%X{tenantId:-} user=%X{userId:-}]"
