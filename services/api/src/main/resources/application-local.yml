# Perfil local de desenvolvimento. Ativado por SPRING_PROFILES_ACTIVE=local.

# Dev convenience: carrega variaveis de `services/api/.env.local` automaticamente.
# Em producao, variaveis de ambiente reais continuam tendo precedencia.
springdotenv:
  filename: .env.local
  ignore-if-missing: true

spring:
  jpa:
    show-sql: false
nora:
  security:
    expose-dev-tokens: true   # retorna tokens de verificacao/reset no JSON para testes manuais
logging:
  level:
    br.com.nora: DEBUG
