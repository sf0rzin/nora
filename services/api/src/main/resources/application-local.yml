# Local development profile. Activated by SPRING_PROFILES_ACTIVE=local.

# Dev convenience: automatically loads variables from `services/api/.env.local`.
# In production, real environment variables still take precedence.
springdotenv:
  filename: .env.local
  ignore-if-missing: true

spring:
  jpa:
    show-sql: false
nora:
  security:
    expose-dev-tokens: true   # returns verification/reset tokens in the JSON for manual testing
logging:
  level:
    br.com.nora: DEBUG
