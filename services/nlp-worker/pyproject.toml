[project]
name = "nora-nlp-worker"
version = "0.1.0"
description = "NORA NLP worker (FastAPI + Pydantic) responsavel por analisar transcricoes."
requires-python = ">=3.12"
# Dependencia ADICIONAL nao declarada em `dependencies`:
#   - nlp-baseline (path local: ../../packages/nlp-baseline) --- ADR 0010.
#     Eh importada por `nora_nlp.services.baseline`. Como nao esta no PyPI,
#     instale antes do worker:
#       pip install -e ../../packages/nlp-baseline
#       pip install -e ".[dev]"
#     O Makefile da raiz faz isso automaticamente em `make worker-setup`.
#     Usuarios de uv tem o source declarado em [tool.uv.sources] abaixo.
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  "httpx>=0.27",
  "openai>=1.50",
  # NER backstop do PII Shield (PR #3 / ADR 0012). spaCy carrega o modelo
  # `pt_core_news_sm` (baixado no build do Docker, NUNCA em runtime) para pegar
  # PERSON_NAME fora-da-lista/minuscula/ALL-CAPS/estrangeiro/sobrenome e reduzir
  # FP de toponimo via LOC/GPE. Degrada gracioso se ausente: o shield segue so
  # com as heuristicas deterministicas (ver pii_shield._load_ner).
  "spacy>=3.7,<4",
]

# uv (https://docs.astral.sh/uv) resolve `nlp-baseline` a partir do path local.
# Pip puro ignora esta secao --- veja o Makefile / README do worker.
[tool.uv.sources]
nlp-baseline = { path = "../../packages/nlp-baseline", editable = true }

[project.optional-dependencies]
dev = [
  "ruff>=0.6",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "jsonschema>=4.23",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "F",   # pyflakes
  "I",   # isort
  "B",   # bugbear
  "UP",  # pyupgrade
  "SIM", # flake8-simplify
  "S",   # bandit basics
  "RUF", # ruff-specific
]
ignore = [
  "S101", # uso de assert é ok em testes
  "S104", # bind 0.0.0.0 é esperado em servico containerizado
  "B008", # Depends(...) em default e o padrao oficial do FastAPI
  "UP042", # str+Enum mantido para compatibilidade com serializacao Pydantic v2
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
