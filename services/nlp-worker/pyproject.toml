[project]
name = "nora-nlp-worker"
version = "0.1.0"
description = "NORA NLP worker (FastAPI + Pydantic) responsavel por analisar transcricoes."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  "httpx>=0.27",
  "openai>=1.50",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.6",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "jsonschema>=4.23",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "F",   # pyflakes
  "I",   # isort
  "B",   # bugbear
  "UP",  # pyupgrade
  "SIM", # flake8-simplify
  "S",   # bandit basics
  "RUF", # ruff-specific
]
ignore = [
  "S101", # uso de assert é ok em testes
  "S104", # bind 0.0.0.0 é esperado em servico containerizado
  "B008", # Depends(...) em default e o padrao oficial do FastAPI
  "UP042", # str+Enum mantido para compatibilidade com serializacao Pydantic v2
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
