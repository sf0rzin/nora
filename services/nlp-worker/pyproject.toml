[project]
name = "nora-nlp-worker"
version = "0.1.0"
description = "NORA NLP worker (FastAPI + Pydantic) responsible for analyzing transcripts."
requires-python = ">=3.12"
# ADDITIONAL dependency not declared in `dependencies`:
#   - nlp-baseline (local path: ../../packages/nlp-baseline) --- ADR 0010.
#     It is imported by `nora_nlp.services.baseline`. Since it is not on PyPI,
#     install it before the worker:
#       pip install -e ../../packages/nlp-baseline
#       pip install -e ".[dev]"
#     The root Makefile does this automatically in `make worker-setup`.
#     uv users have the source declared in [tool.uv.sources] below.
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  "httpx>=0.27",
  "openai>=1.50",
]

# uv (https://docs.astral.sh/uv) resolves `nlp-baseline` from the local path.
# Plain pip ignores this section --- see the Makefile / the worker's README.
[tool.uv.sources]
nlp-baseline = { path = "../../packages/nlp-baseline", editable = true }

[project.optional-dependencies]
dev = [
  "ruff>=0.6",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "jsonschema>=4.23",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "F",   # pyflakes
  "I",   # isort
  "B",   # bugbear
  "UP",  # pyupgrade
  "SIM", # flake8-simplify
  "S",   # bandit basics
  "RUF", # ruff-specific
]
ignore = [
  "S101", # using assert is fine in tests
  "S104", # binding 0.0.0.0 is expected in a containerized service
  "B008", # Depends(...) in a default is FastAPI's official pattern
  "UP042", # str+Enum kept for compatibility with Pydantic v2 serialization
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
