openapi: 3.1.0
info:
  title: NORA API
  version: 0.3.0
  description: |
    REST API for the NORA backend (Spring Boot 3 / Java 21). Covers authentication and session
    management with httpOnly cookies, self-service account operations, AWS-style IAM (groups +
    policies + attachments + audit), email invitations, workspace settings and commercial context,
    meeting upload/listing/detail/semantic search, extracted task management, the trends panel's
    temporal aggregation, the tenant's own usage figures, live analysis, chat sessions, NORA Flows
    (workflow CRUD, manual run and execution history), the OAuth integration hub, the LGPD erasure
    endpoint, the inbound MCP server and its tokens, and the operator control plane.

    ## Scope of this document
    Every route the 21 controllers under
    `services/api/src/main/java/br/com/nora/api/api/controllers/` expose is described here, and
    nothing else is. `scripts/check-openapi-coverage.sh` enforces that in both directions in CI:
    a route added to a controller and not to this file fails the build, and so does an operation
    left in this file after its handler was deleted. The file is written by hand — springdoc is on
    the classpath but its dump is not the deliverable.

    Two tag groups are NOT the tenant-facing product API and do not authenticate the way the rest
    of this document describes: `Platform Admin` and `Platform Internal`. Each operation says who
    authenticates it.

    ## Authentication
    Most endpoints require a JWT. There are two equivalent transport modes:

    - **Bearer** — header `Authorization: Bearer <accessToken>` (scheme `bearerAuth`).
    - **Cookie httpOnly** — `POST /auth/login` (and `POST /iam/invites/{token}/accept`) sets
      `Set-Cookie: nora_access` (`Path=/`, `SameSite=Lax`, `HttpOnly`) and `Set-Cookie: nora_refresh`
      (`Path=/auth`, `SameSite=Strict`, `HttpOnly`). The browser resends `nora_access` automatically.
      `nora_refresh` only reaches routes under `/auth` (refresh/logout). The `Secure` flag is enabled
      in prod via `nora.auth.cookie-secure`.

    The `accessToken` field remains present in the login JSON body for compatibility with legacy
    clients; new clients should rely on the cookies.

    ## IAM Authorization (ADR 0007)
    There are NO fixed roles. Authorization is based on **IAM policies** (AWS-style) evaluated by
    `(action, resource)`. Each protected endpoint declares in its description the IAM action it
    requires (e.g.: `meeting:read`, `iam:group:create`). The tenant Root bypasses this check. Denial
    returns `403 IAM_FORBIDDEN`.

    ## Error format
    All errors use the `Error` schema (`code`, `message`, `traceId`, `timestamp`, `details`).
    `code` is the source of truth for the UI. See `packages/shared-contracts/error-codes.md`.
servers:
  - url: http://localhost:8080
    description: Local dev
security:
  - bearerAuth: []
  - cookieAuth: []
tags:
  - name: Auth
    description: |
      Signup, email verification, login, refresh, logout, password reset and the authenticated
      session operations (identity, password change, log out of all devices).
  - name: Account
    description: |
      Operations on the caller's OWN account (`/users/me`): profile update and permanent LGPD
      deletion. There is no access to other users here — member management is IAM.
  - name: IAM
    description: Groups, policies, attachments and audit (AWS-style, ADR 0007).
  - name: Invitations
    description: User invitation by email and acceptance (US06, ADR 0011).
  - name: Tenant
    description: Workspace settings, commercial context and corporate email domain.
  - name: Meetings
    description: |
      Upload, split preview, listing, detail, semantic search (RAG), goal, reprocessing and live
      analysis.
  - name: Tasks
    description: Listing and updating extracted tasks.
  - name: Trends
    description: |
      Temporal aggregation over the tenant's meetings (US21): task load per period and the themes
      that keep coming back. Read-only, no model call — the task half is SQL over
      `meeting_action_items` and the theme half reads the `topics` each analysis already persisted,
      so the panel does not depend on the RAG index of ADR 0044 being backfilled.
  - name: Usage
    description: |
      The tenant's own consumption over a period (US33): meetings held and analysed, AI calls,
      tokens and an estimated cost. Not to be confused with `Platform Admin`, which answers the
      same shape of question for the operator across every tenant — this one is authenticated by
      the ordinary tenant JWT and its query names a single tenant in the WHERE clause.
  - name: Chat
    description: |
      Persisted chat sessions for the NORA assistant (migration V022). Scoped by tenant AND by the
      caller's own user id: a user only ever sees their own sessions.
  - name: Flows
    description: |
      NORA Flows — workflow CRUD, manual run and execution history (ADR 0030, migration V023).
      Workflows have no owner column: the whole set is tenant-wide.
  - name: Integrations
    description: |
      OAuth integration hub for the nine supported providers (ADR 0031, migrations V024-V026).
      Three connection modes: OAuth authorization-code flow, Telegram code pairing, and a Trello
      token pasted by the user.
  - name: Privacy
    description: LGPD operations — right to erasure over a meeting (ADR 0029).
  - name: Speech
    description: |
      Realtime speech-to-text session broker (ADR 0039, ADR 0045). Mints a short-lived credential
      the desktop uses to stream audio straight to the transcription provider. The provider account
      key stays on the server, and the audio never crosses NORA's infrastructure — which is why
      per-tenant usage here counts sessions issued, not minutes transcribed.
  - name: MCP
    description: |
      NORA as a Model Context Protocol server (ADR 0041, migration V029) — the **inbound**
      direction, where an external MCP client reads meetings, tasks, semantic search and Customer
      Confidence. `POST /mcp` is the protocol endpoint and does not follow the conventions of the
      rest of this document: it speaks JSON-RPC 2.0 over the Streamable HTTP transport, and it
      authenticates with a tenant-scoped MCP token rather than the session JWT. The three
      `/mcp/tokens` routes are ordinary REST and are where a logged-in user mints one.
  - name: Platform Admin
    description: |
      Operator control plane, NOT tenant-facing API (ADR 0022, ADR 0024, ADR 0025). Served on a
      separate security chain: an admin token, plus the operator's email in `X-Operator-Email`
      forwarded by the `apps/admin` console after Cloudflare Access authenticates them. There is no
      IAM principal on these requests and no JWT. Every operation that touches the platform
      database answers `503` when the control plane is degraded or switched off.
  - name: Platform Internal
    description: |
      Service-to-service control plane, NOT called by a browser (ADR 0024). Consumed by the NLP
      worker and by the backend itself, authenticated by an internal token on its own security
      chain. Hot path: these never return 5xx by design.
  - name: System
    description: Health check and JWKS.

paths:
  # ----------------------------------------------------------------------------
  # Auth
  # ----------------------------------------------------------------------------
  /auth/signup:
    post:
      tags: [Auth]
      security: []
      summary: Creates account (and tenant) and triggers email verification
      description: |
        Public. Rate-limited by IP (`429 RATE_LIMITED`, header `Retry-After`). Creates the user and
        the associated tenant. In non-production environments the verification token comes back in
        `emailVerificationDevToken` to ease testing.

        The endpoint responds `201` with the same body shape for any email, including one that
        already has an account: since it's public and unauthenticated, it does not confirm who is
        registered. In that case nothing is created and the address owner receives a notice by
        email. `409 EMAIL_ALREADY_TAKEN` remains only on invite acceptance
        (`/iam/invites/{id}/accept`), where the caller already holds a workspace credential.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SignupRequest' }
      responses:
        '201':
          description: Request accepted (email verification pending)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SignupResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/verify-email:
    post:
      tags: [Auth]
      security: []
      summary: Confirms the email using the verification token
      description: Public. Invalid/used/expired token returns `400 TOKEN_INVALID`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VerifyEmailRequest' }
      responses:
        '204': { description: Email verified }
        '400': { $ref: '#/components/responses/BadRequest' }

  /auth/login:
    post:
      tags: [Auth]
      security: []
      summary: Login with email and password
      description: |
        Public. Rate-limited by IP. On success, in addition to the `LoginResponse` body, responds
        with two `Set-Cookie` headers:

        - `nora_access` — short-lived access JWT. `Path=/`, `SameSite=Lax`, `HttpOnly`.
        - `nora_refresh` — long-lived opaque refresh token. `Path=/auth`, `SameSite=Strict`, `HttpOnly`.

        Invalid credentials return `401 INVALID_CREDENTIALS`; unverified email
        `401 EMAIL_NOT_VERIFIED`; deactivated account `403 USER_DISABLED`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Authenticated. Sets cookies `nora_access` and `nora_refresh`.
          headers:
            Set-Cookie:
              description: httpOnly cookies `nora_access` (Path=/) and `nora_refresh` (Path=/auth).
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/refresh:
    post:
      tags: [Auth]
      security: []
      summary: Renews the access token (rotates the refresh)
      description: |
        Reads the refresh token from the `nora_refresh` cookie (Path=/auth); if absent, accepts
        `Authorization: Bearer <refresh>`. Performs rotation: revokes the previous refresh token and
        rewrites both cookies (`nora_access` + `nora_refresh`). The new access token is returned only
        in the cookie; the body carries only metadata. Missing/expired/revoked returns
        `401 REFRESH_TOKEN_INVALID`.
      responses:
        '200':
          description: Tokens renewed. Rewrites cookies `nora_access` and `nora_refresh`.
          headers:
            Set-Cookie:
              description: New httpOnly cookies `nora_access` and `nora_refresh`.
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RefreshResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/logout:
    post:
      tags: [Auth]
      security: []
      summary: Idempotent logout
      description: |
        Revokes the refresh token present in the `nora_refresh` cookie (if any) and clears both
        cookies (`Max-Age=0`). Without a credential it's a no-op (`204`), never `401`.
      responses:
        '204':
          description: Session ended. Clears cookies `nora_access` and `nora_refresh`.
          headers:
            Set-Cookie:
              description: Clearing cookies (`Max-Age=0`).
              schema: { type: string }

  /auth/me:
    get:
      tags: [Auth]
      summary: Identity of the authenticated user
      description: |
        Self: reads only the caller's own user row, so there is no IAM action. Backs the Account
        tab in settings. The profile is written through `PATCH /users/me`.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/password/change:
    post:
      tags: [Auth]
      summary: Changes the password of the authenticated user
      description: |
        Self: changes only the caller's own password, so there is no IAM action. Requires the
        current password. Revokes ALL of the user's sessions (OWASP) and immediately issues a new
        pair for the CURRENT device — the two cookies are rewritten in the response, so this device
        stays logged in and every other one does not. A wrong `currentPassword` returns
        `401 INVALID_CREDENTIALS`; a `newPassword` that fails the policy returns `400`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordChangeRequest' }
      responses:
        '204':
          description: Password changed. Rewrites cookies `nora_access` and `nora_refresh`.
          headers:
            Set-Cookie:
              description: New httpOnly cookies `nora_access` and `nora_refresh`.
              schema: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/logout-all:
    post:
      tags: [Auth]
      summary: Logs out of all devices
      description: |
        Self: revokes only the caller's own sessions, so there is no IAM action. Revokes EVERY
        refresh token of the user and clears this client's cookies. The access token already
        issued stays valid until it expires (15 min) — the front end redirects to login at once.
      responses:
        '204':
          description: Sessions revoked. Clears cookies `nora_access` and `nora_refresh`.
          headers:
            Set-Cookie:
              description: Clearing cookies (`Max-Age=0`).
              schema: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/verify-email/resend:
    post:
      tags: [Auth]
      security: []
      summary: Resends the email verification link
      description: |
        Public — it exists for users who cannot log in, because login answers
        `401 EMAIL_NOT_VERIFIED`. Rate-limited by email with the same bucket as the password
        reset (same abuse vector: flooding somebody else's inbox). Always `202` with an
        indistinguishable message, whether or not an unverified account exists. In non-production
        environments the token comes back in `verificationDevToken`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResendVerificationRequest' }
      responses:
        '202':
          description: Accepted (response is indistinguishable whether or not the account exists)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResendVerificationResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /auth/password/reset/request:
    post:
      tags: [Auth]
      security: []
      summary: Requests a password reset
      description: |
        Public. Rate-limited by email. Always responds `202` with an indistinguishable message so as
        not to leak which emails exist. In non-production environments the token comes back in
        `passwordResetDevToken`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RequestPasswordResetRequest' }
      responses:
        '202':
          description: Accepted (response is indistinguishable whether or not the account exists)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RequestPasswordResetResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /auth/password/reset/confirm:
    post:
      tags: [Auth]
      security: []
      summary: Confirms the password reset with the token
      description: Public. Invalid/used/expired token returns `400 TOKEN_INVALID`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConfirmPasswordResetRequest' }
      responses:
        '204': { description: Password reset }
        '400': { $ref: '#/components/responses/BadRequest' }

  # ----------------------------------------------------------------------------
  # Account — the caller's own user (/users/me)
  # ----------------------------------------------------------------------------
  /users/me:
    patch:
      tags: [Account]
      summary: Updates the caller's own profile
      description: |
        Self: updates only the caller's own profile, so there is no IAM action. Today the only
        writable field is `displayName`; the email is immutable (it is the login identity and the
        invite target).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateMeRequest' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    delete:
      tags: [Account]
      summary: Permanently deletes the caller's account and workspace data (LGPD)
      description: |
        Self: deletes only the caller's own account, so there is no IAM action. Danger zone —
        PERMANENT deletion of the account and of all personal workspace data. The current password
        in the body is the real barrier (the typed-email confirmation in the UI is only UX); a
        wrong one returns `401 INVALID_CREDENTIALS`. A tenant shared with other users returns
        `409` — the workspace cannot be torn down under the people still in it. Clears both
        cookies on success.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeleteAccountRequest' }
      responses:
        '204':
          description: Account deleted. Clears cookies `nora_access` and `nora_refresh`.
          headers:
            Set-Cookie:
              description: Clearing cookies (`Max-Age=0`).
              schema: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }

  # ----------------------------------------------------------------------------
  # IAM — groups
  # ----------------------------------------------------------------------------
  /iam/groups:
    get:
      tags: [IAM]
      summary: Lists tenant groups
      description: 'IAM action: `iam:group:read`.'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/IamGroup' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [IAM]
      summary: Creates a group
      description: 'IAM action: `iam:group:create`. Duplicate name returns `409 IAM_NAME_TAKEN`.'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateGroupRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IamGroup' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /iam/groups/{id}:
    delete:
      tags: [IAM]
      summary: Deletes a group
      description: 'IAM action: `iam:group:delete`.'
      parameters: [{ $ref: '#/components/parameters/GroupId' }]
      responses:
        '204': { description: Removed }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /iam/groups/{id}/members:
    get:
      tags: [IAM]
      summary: Lists member IDs of the group
      description: 'IAM action: `iam:group:read`.'
      parameters: [{ $ref: '#/components/parameters/GroupId' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { type: string, format: uuid }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /iam/groups/{id}/members/{userId}:
    post:
      tags: [IAM]
      summary: Adds a user to the group
      description: 'IAM action: `iam:group:add-member`.'
      parameters:
        - { $ref: '#/components/parameters/GroupId' }
        - { $ref: '#/components/parameters/UserId' }
      responses:
        '204': { description: Added }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [IAM]
      summary: Removes a user from the group
      description: 'IAM action: `iam:group:remove-member`.'
      parameters:
        - { $ref: '#/components/parameters/GroupId' }
        - { $ref: '#/components/parameters/UserId' }
      responses:
        '204': { description: Removed }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ----------------------------------------------------------------------------
  # IAM — policies
  # ----------------------------------------------------------------------------
  /iam/policies:
    get:
      tags: [IAM]
      summary: Lists tenant policies
      description: 'IAM action: `iam:policy:read`.'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/IamPolicy' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [IAM]
      summary: Creates a policy
      description: |
        IAM action: `iam:policy:create`. `document` is an AWS-style policy document (statements
        with `effect`/`action`/`resource`). An invalid document returns `400`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreatePolicyRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IamPolicy' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /iam/policies/{id}:
    get:
      tags: [IAM]
      summary: Retrieves policy details
      description: 'IAM action: `iam:policy:read`.'
      parameters: [{ $ref: '#/components/parameters/PolicyId' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IamPolicy' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [IAM]
      summary: Updates a policy's document
      description: |
        IAM action: `iam:policy:update`. Replaces the `document` and increments `currentVersion`.
        A missing document returns `400`.
      parameters: [{ $ref: '#/components/parameters/PolicyId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdatePolicyRequest' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IamPolicy' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [IAM]
      summary: Deletes a policy
      description: 'IAM action: `iam:policy:delete`.'
      parameters: [{ $ref: '#/components/parameters/PolicyId' }]
      responses:
        '204': { description: Removed }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ----------------------------------------------------------------------------
  # IAM — attachments
  # ----------------------------------------------------------------------------
  /iam/groups/{groupId}/policies/{policyId}:
    post:
      tags: [IAM]
      summary: Attaches a policy to a group
      description: 'IAM action: `iam:attachment:create`.'
      parameters:
        - { $ref: '#/components/parameters/GroupIdPath' }
        - { $ref: '#/components/parameters/PolicyIdPath' }
      responses:
        '204': { description: Attached }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [IAM]
      summary: Detaches a policy from a group
      description: 'IAM action: `iam:attachment:delete`.'
      parameters:
        - { $ref: '#/components/parameters/GroupIdPath' }
        - { $ref: '#/components/parameters/PolicyIdPath' }
      responses:
        '204': { description: Detached }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /iam/users/{userId}/policies/{policyId}:
    post:
      tags: [IAM]
      summary: Attaches a policy to a user
      description: 'IAM action: `iam:attachment:create`.'
      parameters:
        - { $ref: '#/components/parameters/UserId' }
        - { $ref: '#/components/parameters/PolicyIdPath' }
      responses:
        '204': { description: Attached }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [IAM]
      summary: Detaches a policy from a user
      description: 'IAM action: `iam:attachment:delete`.'
      parameters:
        - { $ref: '#/components/parameters/UserId' }
        - { $ref: '#/components/parameters/PolicyIdPath' }
      responses:
        '204': { description: Detached }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ----------------------------------------------------------------------------
  # IAM — audit
  # ----------------------------------------------------------------------------
  /iam/audit:
    get:
      tags: [IAM]
      summary: Lists IAM audit events
      description: 'IAM action: `iam:audit:read`.'
      parameters:
        - in: query
          name: since
          required: false
          description: Filters events from this point in time onward (ISO-8601).
          schema: { type: string, format: date-time }
        - in: query
          name: limit
          required: false
          schema: { type: integer, default: 50 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AuditEvent' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ----------------------------------------------------------------------------
  # IAM — policy simulator (US43)
  # ----------------------------------------------------------------------------
  /iam/simulate:
    post:
      tags: [IAM]
      summary: Simulates an authorization decision for a user of the tenant
      description: |
        IAM action: `iam:policy:simulate`. Its own action rather than `iam:policy:read`, because
        the answer is derived from which policies are ATTACHED to which user, and no other endpoint
        exposes that graph.

        Answers what the authorization pipeline WOULD decide for `userId`, without performing the
        operation, and names the statement that decided. It is the same evaluation the real request
        takes — `PolicyEvaluator.isAllowed` is this decision's boolean — so the two cannot disagree.

        The tenant Root is reported as `ROOT_BYPASS` rather than a bare `true`: the bypass applies
        before any statement is read (ADR 0007, rule 1), so no statement explains it.

        `userId` is resolved inside the CALLER's tenant. A user of another tenant answers `404
        IAM_USER_NOT_FOUND`, never a decision — a decision would confirm the id exists.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SimulatePolicyRequest' }
      responses:
        '200':
          description: Decision with its explanation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SimulatePolicyResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ----------------------------------------------------------------------------
  # Invitations
  # ----------------------------------------------------------------------------
  /iam/users/invite:
    post:
      tags: [Invitations]
      summary: Invites a user by email
      description: |
        IAM action: `iam:user:invite`. The invite `token` is NEVER returned in the response. An
        email outside the allowed domain returns `422 EMAIL_DOMAIN_NOT_ALLOWED`; a duplicate pending
        invite returns `409 INVITE_DUPLICATE_PENDING`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InviteUserRequest' }
      responses:
        '201':
          description: Invite created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Invitation' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /iam/invites/{token}/accept:
    post:
      tags: [Invitations]
      security: []
      summary: Accepts an invite and creates the account
      description: |
        Public — the URL `token` is the credential. Creates the user, attaches them to the invite's
        groups and authenticates: returns `LoginResponse` and sets the `nora_access` and
        `nora_refresh` cookies (same as login). Non-existent invite `404 INVITE_NOT_FOUND`, already
        accepted `409 INVITE_ALREADY_ACCEPTED`, expired `410 INVITE_EXPIRED`.
      parameters:
        - in: path
          name: token
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AcceptInviteRequest' }
      responses:
        '200':
          description: Account created and authenticated. Sets cookies `nora_access` and `nora_refresh`.
          headers:
            Set-Cookie:
              description: httpOnly cookies `nora_access` and `nora_refresh`.
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '410': { $ref: '#/components/responses/Gone' }

  /iam/invites:
    get:
      tags: [Invitations]
      summary: Lists tenant invites
      description: 'IAM action: `iam:invite:read`. Optional filter by status. Pagination in the MVP is client-side.'
      parameters:
        - in: query
          name: status
          required: false
          schema: { $ref: '#/components/schemas/InvitationStatus' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InviteListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /iam/invites/{id}:
    delete:
      tags: [Invitations]
      summary: Revokes a pending invite
      description: 'IAM action: `iam:invite:revoke`.'
      parameters: [{ $ref: '#/components/parameters/InviteId' }]
      responses:
        '204': { description: Revoked }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ----------------------------------------------------------------------------
  # Tenant — workspace + commercial context + domain
  # ----------------------------------------------------------------------------
  /tenant:
    get:
      tags: [Tenant]
      summary: Retrieves the caller's workspace
      description: |
        IAM action: `tenant:read` on `nora:tenant/{tenantId}`. Backs the Workspace tab in
        settings. The tenant comes from the JWT — there is no path parameter and no way to read
        another workspace.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tenant' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /tenant/name:
    put:
      tags: [Tenant]
      summary: Renames the workspace
      description: |
        IAM action: `tenant:name:write`. Only the display name changes: the `slug` is IMMUTABLE
        because it lives in URLs and in already-sent invitations.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TenantNameUpdateRequest' }
      responses:
        '200':
          description: Renamed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tenant' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /tenant/context:
    get:
      tags: [Tenant]
      summary: Retrieves the tenant's commercial/product context
      description: |
        IAM action: `tenant:context:read`. 1-1 with the tenant from the JWT (no path param). If
        absent, returns `404 TENANT_CONTEXT_NOT_FOUND`.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TenantContext' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Tenant]
      summary: Creates or updates the tenant's commercial/product context
      description: |
        IAM action: `tenant:context:write`. Upserts the context injected into the LLM prompt
        (companyName, valueProposition, products, objectionHandling).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TenantContextInput' }
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TenantContext' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /tenant/context/versions:
    get:
      tags: [Tenant]
      summary: Lists the version history of the tenant's context
      description: |
        IAM action: `tenant:context:read` — the same action the live read uses, because opening a
        past version reveals nothing that reading the current one does not, and a separate action
        would leave every existing policy unable to audit the trail it is meant to audit.

        Metadata only; the document travels with `GET /tenant/context/versions/{version}`. Newest
        version first. A tenant that never saved a context gets `200` with an empty list, not a
        `404` — an empty history and a missing context are the same state here.

        **Versions are appended, never rewritten.** There is no restore operation in this API on
        purpose: a client restores by reading a version and `PUT`ting its document back, which
        records a new version with the real actor on it. A save whose document is identical to the
        current one writes no version at all.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TenantContextVersionList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /tenant/context/versions/{version}:
    get:
      tags: [Tenant]
      summary: Reads one version of the tenant's context, with its document
      description: |
        IAM action: `tenant:context:read`. Returns the document exactly as it stood when that
        version was written.

        `404` for a version this tenant does not have — including a number that exists under a
        different tenant, which must be indistinguishable from one that never existed. The lookup
        is scoped by the tenant claim in the JWT before it is scoped by number, and the error body
        carries the number only.
      parameters:
        - in: path
          name: version
          required: true
          description: Version number, from 1. Per tenant, not global.
          schema: { type: integer, minimum: 1 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TenantContextVersionDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /tenant/domain:
    get:
      tags: [Tenant]
      summary: Retrieves the tenant's allowed email domain
      description: 'IAM action: `tenant:domain:read`.'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TenantDomain' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      tags: [Tenant]
      summary: Updates the tenant's allowed email domain
      description: |
        IAM action: `tenant:domain:write`. `allowedEmailDomain` may be `null` to remove the
        restriction. An invalid domain returns `422 TENANT_DOMAIN_INVALID`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TenantDomainUpdateRequest' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TenantDomainUpdateResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  # ----------------------------------------------------------------------------
  # Meetings
  # ----------------------------------------------------------------------------
  /meetings/search:
    get:
      tags: [Meetings]
      summary: Semantic search over the tenant's meetings (RAG)
      description: |
        IAM action: `meeting:read`. Returns the meetings most RELEVANT to `q` by embedding
        similarity — not the most recent ones. This is what the chat calls to build context and
        citations before answering.

        Two properties a caller must plan for:

        - **It can legitimately return an empty list.** Embedding is off when there is no
          credential configured, and a tenant whose meetings were analysed before the index existed
          — or while the provider was failing — has nothing stored for them until an operator runs
          `POST /admin/platform/embeddings/backfill`. The caller needs a fallback —
          `GET /meetings` is the one the product uses.
        - **Similarity is computed in Java**, over vectors stored as JSON. The `pgvector`
          extension is NOT created in the database, despite the image name.

        Authorization is per item: candidates are loaded first and then filtered with each
        meeting's own attributes in hand, so an attribute-scoped `Deny` applies here exactly as it
        does to `GET /meetings`.
      parameters:
        - in: query
          name: q
          required: true
          description: Natural-language query. Embedded and compared against the tenant's index.
          schema: { type: string }
        - in: query
          name: k
          description: How many meetings to return. Clamped server-side to the range 1..10.
          schema: { type: integer, default: 5, minimum: 1, maximum: 10 }
      responses:
        '200':
          description: OK (possibly an empty list — see the description)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MeetingSearchResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /meetings:
    get:
      tags: [Meetings]
      summary: Lists meetings visible to the user
      description: |
        IAM action: `meeting:read` (tenant-level pre-check + fine-grained per-meeting filtering).
        Pagination based on `page`/`size`; optional filters `search`, `status`, `from`, `to`.
      parameters:
        - in: query
          name: page
          schema: { type: integer, default: 0, minimum: 0 }
        - in: query
          name: size
          schema: { type: integer, default: 20, minimum: 1, maximum: 100 }
        - in: query
          name: search
          description: Text search (title).
          schema: { type: string }
        - in: query
          name: status
          schema: { $ref: '#/components/schemas/ProcessingStatus' }
        - in: query
          name: from
          description: Lower bound for `startedAt` (ISO-8601).
          schema: { type: string, format: date-time }
        - in: query
          name: to
          description: Upper bound for `startedAt` (ISO-8601).
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MeetingsPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Meetings]
      summary: Uploads a meeting (multipart) and queues processing
      description: |
        IAM action: `meeting:upload`. `multipart/form-data` with the `file` part (TXT/VTT/SRT, max
        10MB) and the `metadata` part (JSON string `MeetingUploadMetadata`). Returns `202` while the
        NLP worker processes it asynchronously. A binary file/invalid extension returns `400`;
        exceeding the size limit returns `413 PAYLOAD_TOO_LARGE`.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, metadata]
              properties:
                file:
                  type: string
                  format: binary
                  description: TXT/VTT/SRT transcript (UTF-8, max 10MB).
                metadata:
                  type: string
                  description: Serialized JSON of `MeetingUploadMetadata`.
            encoding:
              metadata:
                contentType: application/json
      responses:
        '202':
          description: Accepted; processing queued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MeetingUploadResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }

  /meetings/split-preview:
    post:
      tags: [Meetings]
      summary: Proposes meeting boundaries inside a single concatenated transcript
      description: |
        IAM action: `meeting:upload`. For a `.txt` file holding several meetings back to back:
        calls the worker's `/split` and returns the proposed boundaries. It creates NOTHING and
        persists NOTHING — the confirmation and the actual slicing happen client-side, and each
        resulting slice is then sent through `POST /meetings`.

        `startLine`/`endLine` are 1-based and inclusive over the ORIGINAL file. `preview` has
        already been through the worker's PII Shield (ADR 0012), so it never carries raw PII.

        `.txt` only: VTT and SRT carry their own timestamps and cues and return `400`. Same 10MB
        ceiling as the upload (`413 PAYLOAD_TOO_LARGE`).
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: Concatenated transcript, `.txt` only (UTF-8, max 10MB).
      parameters:
        - in: query
          name: language
          description: Transcript language hint passed through to the worker.
          schema: { type: string, example: pt-BR }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SplitPreviewResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '502': { $ref: '#/components/responses/BadGateway' }

  /meetings/{id}:
    get:
      tags: [Meetings]
      summary: Retrieves meeting details with analysis, goal and productivity
      description: |
        IAM action: `meeting:read`. Resolved per tenant (404 if it belongs to another tenant). The
        `analysis`, `goal` and `productivity` fields may come back `null` when not yet available.
      parameters: [{ $ref: '#/components/parameters/MeetingId' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MeetingDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /meetings/{id}/goal:
    put:
      tags: [Meetings]
      summary: Sets or updates the meeting's declared goal
      description: |
        IAM action: `meeting:update` (ADR 0005). If the meeting has already been analyzed, its
        status reverts to `PENDING` for later reprocessing.
      parameters: [{ $ref: '#/components/parameters/MeetingId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MeetingGoalRequest' }
      responses:
        '200':
          description: Goal saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MeetingGoal' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Meetings]
      summary: Removes the meeting's goal (and productivity)
      description: 'IAM action: `meeting:update` (ADR 0005). Idempotent.'
      parameters: [{ $ref: '#/components/parameters/MeetingId' }]
      responses:
        '204': { description: Removed }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /meetings/{id}/reprocess:
    post:
      tags: [Meetings]
      summary: Reprocesses a meeting's analysis
      description: 'IAM action: `meeting:reprocess`. Re-queues processing; returns `202`.'
      parameters: [{ $ref: '#/components/parameters/MeetingId' }]
      responses:
        '202':
          description: Reprocessing queued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MeetingUploadResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /meetings/live-analyze:
    post:
      tags: [Meetings]
      summary: Analyzes a live transcript chunk
      description: |
        IAM action: `meeting:analyze:live`. Receives a transcript chunk (and optionally the
        previous highlights) and returns incremental highlights. If the NLP worker is unavailable,
        returns `502 ANALYSIS_WORKER_UNAVAILABLE`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LiveAnalyzeRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LiveAnalyzeResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '502': { $ref: '#/components/responses/BadGateway' }

  # ----------------------------------------------------------------------------
  # Tasks
  # ----------------------------------------------------------------------------
  /tasks:
    get:
      tags: [Tasks]
      summary: Lists tasks extracted from the tenant's meetings
      description: 'IAM action: `task:read`. Optional filter by `status`.'
      parameters:
        - in: query
          name: status
          schema: { $ref: '#/components/schemas/ActionItemStatus' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskListResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /tasks/{id}:
    patch:
      tags: [Tasks]
      summary: Updates a task's status, title and/or due date
      description: |
        IAM action: `task:write`. At least one of `status`/`title`/`dueDate` must be provided. A
        non-existent task returns `404 TASK_NOT_FOUND`.

        `dueDate` is an ISO date (`yyyy-MM-dd`). Omitting the field leaves the stored value alone;
        sending an empty string clears it — the date comes from the extraction, so it has to be
        removable and not only correctable. A value that does not parse returns
        `400 TASK_INVALID_DUE_DATE`.
      parameters: [{ $ref: '#/components/parameters/TaskId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaskUpdateRequest' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Task' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ----------------------------------------------------------------------------
  # Trends — temporal aggregation (US21)
  # ----------------------------------------------------------------------------
  /trends:
    get:
      tags: [Trends]
      summary: Task load over time and recurring themes
      description: |
        IAM action: `meeting:read`. Aggregates over the meetings the caller is allowed to open,
        never over the tenant as a whole unless those two sets are the same.

        **Aggregate authorization.** A count computed by `WHERE tenant_id = ?` respects the tenant
        but not the per-item policy — a user carrying a conditional `Deny` over some meetings would
        see those meetings inside a number they can never drill into, and a number is information.
        So the endpoint resolves the caller's position first: when no statement can tell two
        meetings of the tenant apart (Root, or a plain `meeting:read` Allow over the wildcard) the
        aggregate runs tenant-wide, which is provably the same set; otherwise the visible meetings
        are resolved item by item and every aggregate is restricted to those ids. The answer says
        which path ran, in `scopeStrategy`.

        **Empty state is part of the contract, not of the UI.** `dataState` separates "no meetings
        in range" and "meetings but none analysed" from a real period of zero activity, and
        `themes.sufficient` is false when the range holds fewer than `themes.minimumMeetings`
        analysed meetings — a ranking over three meetings is a list, not a trend. A client must
        read those flags rather than infer emptiness from a series of zeros.

        **Time zone.** Buckets are cut in the zone reported in `timezone`, not in UTC, so a Friday
        evening meeting counts in the week it happened. Every `bucketStart` is a local date in that
        zone.

        **Themes.** `themes.source` is `ANALYSIS_TOPICS`: the `topics` array each analysis already
        wrote. `themes.matching` is `LEXICAL` — spellings are folded (case, accents, punctuation)
        but synonyms are not merged, so "preco" and "precificacao" stay two entries. The field
        exists so that replacing the source later is a visible change and not a silent one.
      parameters:
        - in: query
          name: granularity
          description: Bucket size. Defaults to `WEEK`.
          schema: { $ref: '#/components/schemas/TrendsGranularity' }
        - in: query
          name: from
          description: |
            Start of the range, inclusive, ISO-8601 offset date-time. Absent means the last 12
            weeks (or 6 months). A range longer than the ceiling — 52 weeks or 24 months — is
            clamped forward rather than refused, and the applied range comes back in the response.
          schema: { type: string, format: date-time }
        - in: query
          name: to
          description: End of the range, exclusive. Absent means now.
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: OK — read `dataState` before drawing anything
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TrendsResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ----------------------------------------------------------------------------
  # Usage — the tenant's own consumption over a period (US33)
  # ----------------------------------------------------------------------------
  /usage:
    get:
      tags: [Usage]
      summary: Meetings, AI calls, tokens and estimated cost over a period
      description: |
        IAM action: `meeting:read`. The tenant-facing half of the telemetry pipeline whose operator
        half is `GET /admin/platform/telemetry/business`. **The two are different endpoints on
        different planes**: that one is reached through Cloudflare Access with an operator identity
        and aggregates every tenant; this one takes the ordinary tenant JWT and its query binds one
        tenant in the WHERE clause. The operator aggregation is not reused — it carries no tenant
        predicate at all.

        **Two halves, two guarantees.** Meetings and analyses come from the primary database and
        are restricted to the meetings the caller may open, exactly as `GET /trends` does it:
        `scopeStrategy` reports whether the IAM decision was uniform over the tenant or whether the
        visible meetings had to be resolved item by item. The AI half comes from the control plane
        of ADR 0022, which is optional infrastructure, so it carries its own `ai.state`.

        **`ai.state` is the field that must be read before any AI number is drawn.**
        `AVAILABLE` — the numbers are a measurement. `UNAVAILABLE` — the control plane is off or
        degraded, so the zeros mean "unknown" and not "no consumption".
        `WITHHELD_RESTRICTED_SCOPE` — the caller's IAM position distinguishes meetings and
        `usage_events` carries no meeting id, so a tenant-wide total would disclose activity from
        meetings the caller may not open; there is no honest per-item answer, so none is given.

        **The cost is an estimate and says so.** `ai.costBasis` is `CATALOG_LIST_PRICE`: the model
        catalog's list price multiplied by the measured token counts, in `ai.currency` (USD). It is
        not an invoice. `ai.unmeteredCalls` counts the calls that contribute to `ai.calls` and to
        nothing else — today that is live transcription, whose events are session issuances rather
        than minutes transcribed (ADR 0045 §4), so their tokens and cost are structurally zero.
        Every `byService` entry repeats the distinction in `metered`.

        **Empty state is part of the contract.** `dataState` separates `NO_DATA` and
        `NO_ANALYSED_MEETINGS` from a real period of zero activity. When `ai.state` is not
        `AVAILABLE` it is decided over the meetings half alone, because an absent measurement is
        not a zero.

        **Time zone.** Buckets are cut in the zone reported in `timezone`, not in UTC. Every
        `bucketStart` is a local date in that zone.
      parameters:
        - in: query
          name: granularity
          description: Bucket size. Defaults to `MONTH` — consumption is read per billing period.
          schema: { $ref: '#/components/schemas/TrendsGranularity' }
        - in: query
          name: from
          description: |
            Start of the range, inclusive, ISO-8601 offset date-time. Absent means the last 6
            months (or 12 weeks). A range longer than the ceiling — 24 months or 52 weeks — is
            clamped forward rather than refused, and the applied range comes back in the response.
          schema: { type: string, format: date-time }
        - in: query
          name: to
          description: End of the range, exclusive. Absent means now.
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: OK — read `dataState` and `ai.state` before drawing anything
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UsageResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ----------------------------------------------------------------------------
  # Chat — persisted assistant sessions (migration V022)
  # ----------------------------------------------------------------------------
  /chat/sessions:
    get:
      tags: [Chat]
      summary: Lists the caller's chat sessions
      description: |
        Self: returns only sessions owned by the caller, so there is no IAM action — the scope is
        `(tenant_id, user_id)` in the repository, under the RLS policy of ADR 0028. Ordered by
        `updatedAt` descending; this is what fills the chat sidebar.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ChatSessionSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Chat]
      summary: Creates a chat session
      description: |
        Self: creates a session owned by the caller. The body is optional — with no `title` the
        session is created untitled and the front end derives one from the first message.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChatSessionCreateRequest' }
      responses:
        '201':
          description: Created (`messageCount` is 0 and `lastSnippet` is absent)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChatSessionSummary' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /chat/sessions/{id}:
    get:
      tags: [Chat]
      summary: Retrieves a session with its full message history
      description: |
        Self: scoped by the caller's own user id. A session belonging to another user — or to
        another tenant — returns `404`, not `403`: existence is not disclosed.
      parameters: [{ $ref: '#/components/parameters/ChatSessionId' }]
      responses:
        '200':
          description: OK (messages in chronological order)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChatSessionDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Chat]
      summary: Renames a chat session
      description: 'Self: scoped by the caller''s own user id. `title` is required and non-blank.'
      parameters: [{ $ref: '#/components/parameters/ChatSessionId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChatSessionRenameRequest' }
      responses:
        '200':
          description: Renamed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChatSessionSummary' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Chat]
      summary: Deletes a chat session and its messages
      description: 'Self: scoped by the caller''s own user id. The messages cascade with the session.'
      parameters: [{ $ref: '#/components/parameters/ChatSessionId' }]
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /chat/sessions/{id}/messages:
    post:
      tags: [Chat]
      summary: Appends a message to the session
      description: |
        Self: scoped by the caller's own user id. This endpoint only PERSISTS a turn — it does not
        call the model. The completion is produced by the web BFF (`apps/web/src/app/api/chat/`),
        which keeps the provider key on the server; the client stores the user turn and then the
        assistant turn through this same route.
      parameters: [{ $ref: '#/components/parameters/ChatSessionId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChatMessageCreateRequest' }
      responses:
        '201':
          description: Message stored
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChatMessage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ----------------------------------------------------------------------------
  # Flows — workflow engine (ADR 0030, migration V023)
  # ----------------------------------------------------------------------------
  /workflows:
    get:
      tags: [Flows]
      summary: Lists the tenant's workflows
      description: |
        IAM action: `workflow:read` on `nora:tenant/{tenantId}:workflow/*`. The annotation is a
        cheap pre-gate and the visible set is then decided per item, so a `Deny` written against a
        single workflow id is honoured here too.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Workflow' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Flows]
      summary: Creates a workflow
      description: |
        IAM action: `workflow:write`. The trigger is NOT sent as a field: it is derived from the
        trigger node inside `definition`, so the canvas graph stays the single source of truth. A
        definition whose trigger is unknown, or is `schedule.cron`, returns
        `422 WORKFLOW_INVALID_DEFINITION` — the value survives in the enum only so rows persisted
        before the rule keep reading, and nothing in the backend schedules a workflow.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkflowUpsertRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Workflow' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /workflows/{id}:
    get:
      tags: [Flows]
      summary: Retrieves one workflow with its canvas graph
      description: 'IAM action: `workflow:read` on the workflow''s own ARN.'
      parameters: [{ $ref: '#/components/parameters/WorkflowId' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Workflow' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Flows]
      summary: Replaces a workflow
      description: |
        IAM action: `workflow:write`. Full replacement, same body as create; the trigger is
        re-derived from the definition and the same `schedule.cron` refusal applies.
      parameters: [{ $ref: '#/components/parameters/WorkflowId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkflowUpsertRequest' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Workflow' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
    delete:
      tags: [Flows]
      summary: Deletes a workflow
      description: 'IAM action: `workflow:write`. The execution history cascades with it.'
      parameters: [{ $ref: '#/components/parameters/WorkflowId' }]
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /workflows/{id}/test:
    post:
      tags: [Flows]
      summary: Runs the workflow now and returns the execution log
      description: |
        IAM action: `workflow:test` — a distinct action, neither read nor write, because it
        EXECUTES the wired actions for real (email, Slack message, issue creation) against the
        tenant's own integrations. Synchronous: the response is the execution, log included. This
        is the canvas "Test" button.
      parameters: [{ $ref: '#/components/parameters/WorkflowId' }]
      responses:
        '200':
          description: Executed (check `status` — a failed run is still a `200` with the log)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkflowExecution' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /workflows/{id}/executions:
    get:
      tags: [Flows]
      summary: Execution history of a workflow
      description: 'IAM action: `workflow:read`. Most recent first.'
      parameters: [{ $ref: '#/components/parameters/WorkflowId' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/WorkflowExecution' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ----------------------------------------------------------------------------
  # Integrations — OAuth hub (ADR 0031, migrations V024-V026)
  # ----------------------------------------------------------------------------
  /integrations:
    get:
      tags: [Integrations]
      summary: Connection status of every supported provider
      description: |
        IAM action: `integration:read` on `nora:tenant/{tenantId}:integration/*`. One entry per
        provider, always all nine. `configured` says whether the DEPLOYMENT has credentials for
        that provider at all; `connected` says whether THIS tenant has linked an account.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/IntegrationStatus' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /integrations/{provider}/oauth/start:
    post:
      tags: [Integrations]
      summary: Starts the OAuth flow for a provider
      description: |
        IAM action: `integration:write`. Returns the provider's authorization URL for the front end
        to redirect to; the signed `state` inside it carries tenant and user. An unknown provider
        returns `404 INTEGRATION_UNKNOWN_PROVIDER`; a provider the deployment has no credentials
        for returns `422 INTEGRATION_NOT_CONFIGURED`.

        Not for Telegram or Trello, which do not use OAuth — see the two routes below.
      parameters: [{ $ref: '#/components/parameters/IntegrationProviderPath' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OAuthStartResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /integrations/{provider}/oauth/callback:
    get:
      tags: [Integrations]
      security: []
      summary: OAuth callback (browser redirect target — never returns JSON)
      description: |
        PUBLIC by design: the provider redirects the user's browser here, so there is no NORA
        credential on the request. The signed `state` IS the credential — it identifies tenant and
        user and blocks forgery.

        This operation ALWAYS answers `302` to the front end's `/integrations` page, never JSON and
        never a 5xx: consent denied, an unknown provider, a missing `code` and an internal failure
        all come back as `?error=<reason>` on that redirect. Success is `?connected=<provider>`.
        Listed here because it is part of the HTTP surface, not because a client calls it.
      parameters:
        - { $ref: '#/components/parameters/IntegrationProviderPath' }
        - in: query
          name: code
          description: Authorization code from the provider. Absent when the user denied consent.
          schema: { type: string }
        - in: query
          name: state
          description: Signed state minted by `/oauth/start`.
          schema: { type: string }
        - in: query
          name: error
          description: Error identifier sent by the provider (e.g. `access_denied`).
          schema: { type: string }
      responses:
        '302':
          description: |
            Redirect to `{frontendBaseUrl}/integrations`, carrying `?connected=<provider>` or
            `?error=<reason>`.
          headers:
            Location:
              schema: { type: string }

  /integrations/{provider}:
    delete:
      tags: [Integrations]
      summary: Disconnects a provider from the tenant
      description: |
        IAM action: `integration:write`. Drops the stored connection, encrypted tokens included.
        Workflow actions wired to that provider start failing with `INTEGRATION_NOT_CONNECTED` at
        run time — disconnecting does not rewrite the flows.
      parameters: [{ $ref: '#/components/parameters/IntegrationProviderPath' }]
      responses:
        '204': { description: Disconnected }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /integrations/telegram/pairing/start:
    post:
      tags: [Integrations]
      summary: Starts Telegram pairing (no OAuth)
      description: |
        IAM action: `integration:write`. Telegram has no OAuth: this mints a short-lived pairing
        code for the tenant and returns the bot deep link (`t.me/<bot>?start=<code>`) for the hub
        to display. The user opens it and sends `/start <code>` to the bot; the connection is then
        completed by `/integrations/telegram/pairing/verify`.

        A literal path, deliberately distinct from `/integrations/{provider}/oauth/start`.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TelegramPairingStart' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /integrations/telegram/pairing/verify:
    post:
      tags: [Integrations]
      summary: Completes Telegram pairing
      description: |
        IAM action: `integration:write`. Looks for the tenant's `/start <code>` in the bot's
        `getUpdates` and stores the connection — the `access_token` column holds the bot `chat_id`,
        not an OAuth token. If the user has not sent `/start` yet, returns
        `409 INTEGRATION_PAIRING_PENDING` with an actionable message; the hub polls this route.
      responses:
        '200':
          description: Paired
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IntegrationStatus' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /integrations/trello/token:
    post:
      tags: [Integrations]
      summary: Stores a Trello token pasted by the user
      description: |
        IAM action: `integration:write`. Trello has no server-side OAuth here: the user pastes a
        token, the backend validates it against Trello and persists the connection encrypted at
        rest. An invalid token returns `502 INTEGRATION_PROVIDER_ERROR` with guidance.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TrelloTokenRequest' }
      responses:
        '200':
          description: Connected
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IntegrationStatus' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '502': { $ref: '#/components/responses/BadGateway' }

  # ----------------------------------------------------------------------------
  # Privacy — LGPD (ADR 0029)
  # ----------------------------------------------------------------------------
  /privacy/meetings/{id}:
    delete:
      tags: [Privacy]
      summary: Permanently erases a meeting and every linked personal datum
      description: |
        IAM action: `meeting:update` — the same gate as the destructive goal removal. This is a
        PHYSICAL hard delete, distinct from the default soft delete of ADR 0021: the database
        cascade purges the transcript (`raw_text`, which is where the PII lives), participants,
        tags and analyses. There is no recycle bin and no undo.

        The authorization check runs inside the service transaction, on the resolved meeting, so it
        sees the meeting's attributes — an attribute-scoped `Deny` fires here. A meeting that does
        not exist in the caller's tenant returns `404`, which is also what a cross-tenant id gets:
        existence is not disclosed.
      parameters: [{ $ref: '#/components/parameters/MeetingId' }]
      responses:
        '204': { description: Erased }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ----------------------------------------------------------------------------
  # Realtime STT — the session broker (ADR 0039 / ADR 0045)
  # ----------------------------------------------------------------------------
  /stt/sessions:
    post:
      tags: [Speech]
      summary: Mints a short-lived realtime transcription session
      description: |
        IAM action: `stt:session:create` over the tenant. Exchanges the server-held provider key
        for one ephemeral client secret and returns only that secret plus the parameters the client
        needs to stream matching audio. **The provider account key is never part of any response.**

        One call per stream. The desktop opens one session per track (`mic` and `system`), so a
        recording with system audio on calls this twice, and a connection dropped mid-meeting is
        recovered by calling it again — the credential is not renewable into a second session, so
        every reconnection is a fresh authorization check and a fresh telemetry row.

        `expiresAt` is when the secret can no longer **open** a connection. An already-open session
        is not terminated by it, so clients must not build a renewal loop around this value.

        Attribution, stated the way ADR 0039 requires: the audio goes desktop → provider and never
        crosses NORA's infrastructure, so what this endpoint records is a **session issued**, never
        a minute transcribed. Cost figures derived from it are estimates.

        `429 STT_RATE_LIMITED` when the caller's per-minute session budget is spent,
        `502 STT_BROKER_ERROR` when the provider refuses, `503 STT_NOT_CONFIGURED` when the
        deployment has no provider credential at all.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SttSessionRequest' }
      responses:
        '200':
          description: Session created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SttSessionResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '502': { $ref: '#/components/responses/BadGateway' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  # ----------------------------------------------------------------------------
  # MCP — the inbound adapter (ADR 0041, migration V029)
  #
  # `POST /mcp` is not a REST operation and is documented as what it is: one path
  # carrying JSON-RPC 2.0. `security: []` on it means "neither of the two schemes
  # this document defines" — it takes an MCP token, not the session JWT.
  # ----------------------------------------------------------------------------
  /mcp:
    post:
      tags: [MCP]
      security: []
      summary: MCP endpoint (JSON-RPC 2.0 over the Streamable HTTP transport)
      description: |
        The single MCP endpoint. Authenticated by `Authorization: Bearer <mcp-token>`, minted at
        `POST /mcp/tokens`; the session JWT is **not** accepted here, and an MCP token is not
        accepted anywhere else. A request without a live credential returns `401`.

        **Protocol versions.** This server implements `2025-11-25` and `2025-06-18` — the
        revisions that open a connection with an `initialize` handshake, which is what deployed
        MCP clients speak. An `initialize` naming any other version is refused with JSON-RPC error
        `-32602` whose `data.supported` lists what is implemented; the server never echoes a
        version it does not serve. The transport's `MCP-Protocol-Version` header is optional, and
        a value outside that list is answered `400` with the same `data.supported` payload — which
        is also the signal a client of the newer, handshake-free revision uses to fall back.

        **Methods.** `initialize`, `ping`, `tools/list`, `tools/call`. Anything else is JSON-RPC
        error `-32601`. A message with no `id` is a notification and is answered `202` with no
        body. `GET` and `DELETE` on this path return `405`: there is no server-initiated SSE
        stream and no session to terminate, because every tool is a request/response read and the
        credential travels on each request.

        **Tools (read-only first cut, ADR 0041 §4).** `list_meetings`, `get_meeting`,
        `search_meetings`, `list_tasks`, `get_customer_confidence`. Each one resolves the same IAM
        principal the web surface resolves and evaluates the same action against the same policies
        — `meeting:read` for the four meeting-shaped tools, `task:read` for the task listing. There
        is no MCP-specific permission vocabulary, and the testable invariant is that an MCP client
        can never see more than the user it acts for can see in the web application. A denial or an
        unreadable resource comes back as a tool result with `isError: true`, not as a JSON-RPC
        error, which is the channel the specification reserves for failures a model can act on.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/McpJsonRpcRequest' }
      responses:
        '200':
          description: JSON-RPC response (result or error)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/McpJsonRpcResponse' }
        '202':
          description: Notification accepted; no body
        '400':
          description: |
            Not a JSON-RPC 2.0 message, or an `MCP-Protocol-Version` header this server does not
            implement. The body is a JSON-RPC error object with a null `id`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/McpJsonRpcResponse' }
        '401':
          description: Missing, unknown, revoked or expired MCP token
        '403':
          description: |
            `Origin` header present and not one of the configured trusted origins. Required by the
            Streamable HTTP transport as a defence against DNS rebinding; non-browser clients send
            no `Origin` and never meet it.
        '405':
          description: Method not allowed on the MCP endpoint (`GET`, `DELETE`)

  /mcp/tokens:
    post:
      tags: [MCP]
      summary: Mints an MCP token for the caller
      description: |
        Self-service: acts only on the caller's own credentials, so it requires no IAM action. The
        minted token grants strictly what the caller already holds — every tool call re-evaluates
        the same policies against the same principal — which is why there is no separate permission
        to gate it with.

        **The plaintext is in this response and nowhere else.** Only its SHA-256 hash is persisted
        (the pattern of `refresh_tokens` and, since V018, of the invitation token), so a token that
        is not copied out of this response has to be revoked and replaced. It is prefixed
        `nora_mcp_` so it is recognisable to a secret scanner and to the edge that resolves it.

        `expiresInDays` is optional; absent means the token lives until it is revoked, which is
        what an MCP client sitting in a configuration file needs. Values outside 1..365 are
        clamped. A user may hold 20 active tokens; the 21st returns `409 MCP_TOKEN_LIMIT_REACHED`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/McpTokenCreateRequest' }
      responses:
        '201':
          description: Created — the only response that ever carries the plaintext
          content:
            application/json:
              schema: { $ref: '#/components/schemas/McpTokenCreated' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
    get:
      tags: [MCP]
      summary: Lists the caller's MCP tokens
      description: |
        Self-service, newest first. Carries no secret material: a revoked token stays in the list
        with `active: false`, because a credential that vanished from the UI is one nobody can
        confirm is dead. `lastUsedAt` is what identifies a token no client is using any more.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/McpTokenListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /mcp/tokens/{id}:
    delete:
      tags: [MCP]
      summary: Revokes one of the caller's MCP tokens
      description: |
        Self-service and idempotent: revoking an already revoked token answers `204` rather than
        failing for having succeeded. A token belonging to anyone else is `404`, never `403`, so an
        id cannot be probed for existence. Revocation takes effect on the next request the token
        makes — there is no cache in front of the lookup.
      parameters: [{ $ref: '#/components/parameters/McpTokenId' }]
      responses:
        '204':
          description: Revoked
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ----------------------------------------------------------------------------
  # Platform Admin — operator control plane (ADR 0022 / 0024 / 0025)
  #
  # NOT tenant API. Admin-token security chain, operator email in X-Operator-Email,
  # no IAM principal and no JWT. `security: []` below means "none of the two schemes
  # this document defines", not "public".
  # ----------------------------------------------------------------------------
  /admin/platform/models:
    get:
      tags: [Platform Admin]
      security: []
      summary: Lists the LLM catalog
      description: |
        Operator only. The catalog lives in the separate platform database (ADR 0022); it is
        global, with no tenant dimension. Prices are USD per 1M tokens.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PlatformModel' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    post:
      tags: [Platform Admin]
      security: []
      summary: Registers a model in the catalog
      description: |
        Operator only; the email in `X-Operator-Email` is written to the platform audit log.
        `modality` defaults to `text` when absent or unrecognised, `enabled` defaults to true, and
        absent prices default to 0. The pair `(provider, model)` is unique — a repeat returns
        `409 PLATFORM_CONFLICT`.
      parameters: [{ $ref: '#/components/parameters/OperatorEmailHeader' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateModelRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlatformModel' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /admin/platform/models/{id}:
    delete:
      tags: [Platform Admin]
      security: []
      summary: Removes a model from the catalog
      description: |
        Operator only; audited with `X-Operator-Email`. A model still bound to a service in
        `llm_config` returns `409 PLATFORM_CONFLICT` — unbind it first, so that removing a model
        cannot silently leave a service pointing at nothing.
      parameters:
        - { $ref: '#/components/parameters/PlatformModelId' }
        - { $ref: '#/components/parameters/OperatorEmailHeader' }
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /admin/platform/flags:
    get:
      tags: [Platform Admin]
      security: []
      summary: Lists the platform feature flags
      description: Operator only. On/off switches per service (ADR 0024).
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/FeatureFlag' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /admin/platform/config:
    get:
      tags: [Platform Admin]
      security: []
      summary: Lists the service to model bindings
      description: |
        Operator only. One row per bindable service (`chat`, `analysis`, `multimodal`), enriched
        with the bound model's provider and model id.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ServiceBinding' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /admin/platform/config/{service}:
    put:
      tags: [Platform Admin]
      security: []
      summary: Binds a service to a catalog model
      description: |
        Operator only; audited with `X-Operator-Email`. `modelId` is required, and `enabled`
        defaults to true. Two routing constraints are enforced here and return
        `422 PLATFORM_VALIDATION`:

        - `analysis` may only be bound to a model with `supportsStrictJsonSchema: true` (ADR 0003 —
          the analysis output is schema-validated);
        - `multimodal` may only be bound to a model whose `modality` is `multimodal` (ADR 0024).

        An unknown `service` returns `400`; an unknown `modelId` returns `404`.
      parameters:
        - { $ref: '#/components/parameters/BindableService' }
        - { $ref: '#/components/parameters/OperatorEmailHeader' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BindRequest' }
      responses:
        '200':
          description: Bound
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceBinding' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /admin/platform/telemetry/cost:
    get:
      tags: [Platform Admin]
      security: []
      summary: Aggregated AI cost report
      description: |
        Operator only. Aggregates `usage_events` over the half-open window `[from, to)`, which
        defaults to the last 24 hours. Both bounds accept an ISO-8601 date or date-time; anything
        else returns `400`. Events with `status=stub` are counted but contribute no cost.
      parameters:
        - { $ref: '#/components/parameters/TelemetryFrom' }
        - { $ref: '#/components/parameters/TelemetryTo' }
        - in: query
          name: groupBy
          description: Aggregation dimension. Echoed back in the response.
          schema: { type: string, enum: [tenant, model, service] }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CostReport' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /admin/platform/telemetry/health:
    get:
      tags: [Platform Admin]
      security: []
      summary: System health snapshot
      description: |
        Operator only. `source` names the adapter that answered — `prometheus` since ADR 0034. When
        the source is not configured or not reachable this still answers `200` with
        `source: unavailable` and an empty `services` list, on purpose, so the console degrades
        instead of breaking. That value is the one the UI branches on.
      responses:
        '200':
          description: 'OK (possibly `source: unavailable` — see the description)'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthSnapshot' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /admin/platform/telemetry/business:
    get:
      tags: [Platform Admin]
      security: []
      summary: Cross-tenant business metrics
      description: |
        Operator only. Reads the primary database with no tenant context — this is the one place
        that deliberately crosses the tenant boundary, and it aggregates. Same window rules as the
        cost report. `enabled: false` means the workstream is switched off, and then every counter
        is zero. `productivityAvg` and `customerConfidenceAvg` may be `null`: they are not computed
        yet.
      parameters:
        - { $ref: '#/components/parameters/TelemetryFrom' }
        - { $ref: '#/components/parameters/TelemetryTo' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BusinessSnapshot' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /admin/platform/embeddings/backfill:
    get:
      tags: [Platform Admin]
      security: []
      summary: What an embeddings backfill would do
      description: |
        Operator only, and free: it makes no call to the embedding provider, only SQL over
        `meetings` and `meeting_embeddings`. Answers the question the RAG index cannot answer by
        itself — which tenants are invisible to `GET /meetings/search`, and why.

        A meeting counts as pending when it has an analysed summary and either no vector at all
        (`missingVector`) or a vector produced by a different provider/model (`staleModel`). The
        search only compares vectors from the same space, so those two are equally invisible.

        `enabled: false` means no embedding credential is configured: the counters are still real,
        but `POST` would be refused with `409`. `source` names the database role that answered —
        `telemetry` (BYPASSRLS) or `primary`. Under RLS enforce without the telemetry datasource
        the primary role sees no rows, so a `primary` source with all-zero counters is not
        evidence that there is nothing to do. This endpoint does NOT require the platform database.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmbeddingBackfillPreview' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    post:
      tags: [Platform Admin]
      security: []
      summary: Runs a bounded embeddings backfill for one tenant
      description: |
        Operator only. Indexes up to `limit` pending meetings of `tenantId`, one embedding call
        each, using the summary already stored on the meeting — it never re-runs the LLM analysis,
        which is what `POST /meetings/{id}/reprocess` costs today for the same effect.

        Every call is billed, so the shape is deliberate: `tenantId` is required (never implicitly
        every tenant), `limit` defaults to 25 and is clamped to 100, and a run also stops early
        when it exhausts a 60s budget or hits 3 consecutive provider failures — `stoppedReason`
        says which. Idempotent: a meeting that already carries a vector from the current model is
        not a candidate, so repeating a run costs nothing.

        `remaining` is re-measured after the run rather than subtracted, and the usage is recorded
        through the same cost telemetry as every other AI call, under `service=embedding-backfill`.
        The operator's e-mail (`X-Operator-Email`) is written to the audit log.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmbeddingBackfillRequest' }
      responses:
        '200':
          description: OK — the run finished or stopped early, see `stoppedReason`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmbeddingBackfillRun' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  # ----------------------------------------------------------------------------
  # Platform Internal — service to service (ADR 0024)
  #
  # NOT called by a browser. Internal-token security chain.
  # ----------------------------------------------------------------------------
  /internal/platform/llm-config:
    get:
      tags: [Platform Internal]
      security: []
      summary: Resolves the LLM config bound to a service
      description: |
        Called by the NLP worker and by the backend, not by a client. Returns NO API key: the
        consumer resolves the key itself from the provider name (ADR 0024, decision C).

        Hot path — it does a SOFT fallback rather than failing, so a control plane that is down
        degrades the answer instead of taking the analysis pipeline with it.
      parameters:
        - in: query
          name: service
          required: true
          description: Which binding to resolve. Anything else returns `400`.
          schema: { type: string, enum: [chat, analysis, multimodal] }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResolvedLlmConfig' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /internal/platform/usage:
    post:
      tags: [Platform Internal]
      security: []
      summary: Records one AI usage event
      description: |
        Called by the NLP worker after a model call. Fire-and-forget: it always answers `202` and
        never blocks the caller. `tenantId` is a best-effort telemetry dimension with no foreign
        key — the tenants table lives in the primary database, and a malformed id is stored as "no
        tenant" rather than rejected. `status` is one of `ok`, `error`, `stub`, `fallback`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UsageRequest' }
      responses:
        '202': { description: Accepted (recorded asynchronously) }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ----------------------------------------------------------------------------
  # System
  # ----------------------------------------------------------------------------
  /healthz:
    get:
      tags: [System]
      security: []
      summary: Health check
      description: Public. Kept separate from the actuator for a stable response.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [service, status, timestamp]
                properties:
                  service: { type: string, example: nora-api }
                  status: { type: string, example: ok }
                  timestamp: { type: string, format: date-time }

  /.well-known/jwks.json:
    get:
      tags: [System]
      security: []
      summary: JSON Web Key Set (RFC 7517)
      description: |
        Public. Exposes the RSA public key used to validate JWTs. Available ONLY in RS256 mode; in
        HS256 the controller is not registered and the route returns 404.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Jwks' }
        '404': { $ref: '#/components/responses/NotFound' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    cookieAuth:
      type: apiKey
      in: cookie
      name: nora_access
      description: |
        httpOnly cookie set by `POST /auth/login` (and by `POST /iam/invites/{token}/accept`).
        Equivalent to Bearer; the browser resends it automatically. Renewed via `POST /auth/refresh`.

  parameters:
    MeetingId:
      in: path
      name: id
      required: true
      schema: { type: string, format: uuid }
    TaskId:
      in: path
      name: id
      required: true
      schema: { type: string, format: uuid }
    GroupId:
      in: path
      name: id
      required: true
      schema: { type: string, format: uuid }
    PolicyId:
      in: path
      name: id
      required: true
      schema: { type: string, format: uuid }
    InviteId:
      in: path
      name: id
      required: true
      schema: { type: string, format: uuid }
    UserId:
      in: path
      name: userId
      required: true
      schema: { type: string, format: uuid }
    GroupIdPath:
      in: path
      name: groupId
      required: true
      schema: { type: string, format: uuid }
    PolicyIdPath:
      in: path
      name: policyId
      required: true
      schema: { type: string, format: uuid }
    ChatSessionId:
      in: path
      name: id
      required: true
      schema: { type: string, format: uuid }
    WorkflowId:
      in: path
      name: id
      required: true
      schema: { type: string, format: uuid }
    IntegrationProviderPath:
      in: path
      name: provider
      required: true
      description: Provider wire name. An unknown value returns `404 INTEGRATION_UNKNOWN_PROVIDER`.
      schema: { $ref: '#/components/schemas/IntegrationProvider' }
    PlatformModelId:
      in: path
      name: id
      required: true
      schema: { type: string, format: uuid }
    BindableService:
      in: path
      name: service
      required: true
      description: Bindable service. Anything else returns `400 PLATFORM_VALIDATION`.
      schema: { type: string, enum: [chat, analysis, multimodal] }
    OperatorEmailHeader:
      in: header
      name: X-Operator-Email
      required: false
      description: |
        Email of the operator, forwarded by the `apps/admin` console after Cloudflare Access
        authenticates them. Written to the platform audit log. Not a credential — the admin token
        is; this only says WHO acted.
      schema: { type: string, format: email }
    TelemetryFrom:
      in: query
      name: from
      description: |
        Inclusive lower bound of the window. ISO-8601 date or date-time. Defaults to 24h before
        `to`. Unparseable values return `400`.
      schema: { type: string }
    TelemetryTo:
      in: query
      name: to
      description: |
        Exclusive upper bound of the window. ISO-8601 date or date-time. Defaults to now (UTC).
      schema: { type: string }
    McpTokenId:
      in: path
      name: id
      required: true
      schema: { type: string, format: uuid }

  responses:
    BadRequest:
      description: Invalid request (`VALIDATION_FAILED`, `MALFORMED_REQUEST`, `TOKEN_INVALID`, ...)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Not authenticated (`UNAUTHENTICATED`, `INVALID_CREDENTIALS`, `REFRESH_TOKEN_INVALID`, ...)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: No permission (`FORBIDDEN`, `IAM_FORBIDDEN`, `USER_DISABLED`)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: |
        Conflict (`EMAIL_ALREADY_TAKEN`, `IAM_NAME_TAKEN`, `INVITE_ALREADY_ACCEPTED`,
        `INTEGRATION_PAIRING_PENDING`, `PLATFORM_CONFLICT`, ...)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Gone:
      description: Expired resource (`INVITE_EXPIRED`)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    PayloadTooLarge:
      description: Upload exceeds the limit (`PAYLOAD_TOO_LARGE`, `TRANSCRIPT_TOO_LARGE`)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    UnsupportedMediaType:
      description: Unsupported media type (`UNSUPPORTED_MEDIA_TYPE`)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    UnprocessableEntity:
      description: |
        Unprocessable entity (`EMAIL_DOMAIN_NOT_ALLOWED`, `TENANT_DOMAIN_INVALID`,
        `WORKFLOW_INVALID_DEFINITION`, `INTEGRATION_NOT_CONFIGURED`, `PLATFORM_VALIDATION`)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    RateLimited:
      description: Rate limit exceeded (`RATE_LIMITED`). Header `Retry-After`.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    BadGateway:
      description: Upstream dependency failed (`ANALYSIS_WORKER_UNAVAILABLE`, `INTEGRATION_PROVIDER_ERROR`, ...)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ServiceUnavailable:
      description: |
        Control plane degraded or switched off (`PLATFORM_UNAVAILABLE`). Only the `Platform Admin`
        operations answer this: they read and write the separate platform database, and when it is
        unreachable they say so instead of guessing.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    # ---- error ----
    Error:
      type: object
      required: [code, message, traceId, timestamp]
      properties:
        code: { type: string, example: MEETING_NOT_FOUND }
        message: { type: string }
        traceId: { type: string }
        timestamp: { type: string, format: date-time }
        details:
          type: array
          items:
            type: object
            properties:
              field: { type: string }
              issue: { type: string }

    # ---- shared enums ----
    ProcessingStatus:
      type: string
      enum: [PENDING, PROCESSING, COMPLETED, FAILED]
    ActionItemStatus:
      type: string
      enum: [OPEN, IN_PROGRESS, DONE]
    Priority:
      type: string
      enum: [LOW, MEDIUM, HIGH]
    InvitationStatus:
      type: string
      enum: [PENDING, ACCEPTED, EXPIRED, REVOKED]

    # ---- auth ----
    SignupRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, minLength: 10, maxLength: 128 }
        displayName: { type: string, maxLength: 120 }
    SignupResponse:
      type: object
      required: [userId, tenantId, message]
      properties:
        userId: { type: string, format: uuid }
        tenantId: { type: string, format: uuid }
        message: { type: string }
        emailVerificationDevToken:
          type: string
          description: Present only in non-production environments.
    VerifyEmailRequest:
      type: object
      required: [token]
      properties:
        token: { type: string }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, maxLength: 128 }
    LoginResponse:
      type: object
      required: [accessToken, refreshToken, tokenType, expiresInSeconds, userId, tenantId, email, displayName]
      description: |
        Login response body (and invite-acceptance body). Also accompanied by `Set-Cookie` headers
        (`nora_access`, `nora_refresh`). `accessToken`/`refreshToken` in the body exist for legacy
        compatibility; new clients should rely on the httpOnly cookies.
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        tokenType: { type: string, example: Bearer }
        expiresInSeconds: { type: integer, format: int64, description: TTL of the access token in seconds. }
        userId: { type: string, format: uuid }
        tenantId: { type: string, format: uuid }
        email: { type: string, format: email }
        displayName: { type: string }
    RefreshResponse:
      type: object
      required: [tokenType, expiresInSeconds]
      description: |
        The new access token is returned in the `nora_access` cookie; the body carries only metadata
        for the client to schedule the next refresh.
      properties:
        tokenType: { type: string, example: Bearer }
        expiresInSeconds: { type: integer, format: int64 }
    RequestPasswordResetRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email }
    RequestPasswordResetResponse:
      type: object
      required: [message]
      properties:
        message: { type: string }
        passwordResetDevToken:
          type: string
          description: Present only in non-production environments.
    ConfirmPasswordResetRequest:
      type: object
      required: [token, newPassword]
      properties:
        token: { type: string }
        newPassword: { type: string, minLength: 10, maxLength: 128 }
    PasswordChangeRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword: { type: string }
        newPassword: { type: string, minLength: 10, maxLength: 128 }
    ResendVerificationRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email, maxLength: 254 }
    ResendVerificationResponse:
      type: object
      required: [message]
      properties:
        message: { type: string }
        verificationDevToken:
          type: [string, 'null']
          description: Present only in non-production environments; always `null` in production.
    Me:
      type: object
      required: [userId, tenantId, email, emailVerified, createdAt]
      description: Identity of the authenticated user. Returned by `GET /auth/me` and `PATCH /users/me`.
      properties:
        userId: { type: string, format: uuid }
        tenantId: { type: string, format: uuid }
        email: { type: string, format: email }
        displayName: { type: [string, 'null'] }
        emailVerified: { type: boolean }
        createdAt: { type: string, format: date-time }

    # ---- account (/users/me) ----
    UpdateMeRequest:
      type: object
      required: [displayName]
      description: The email is not writable — it is the login identity and the invite target.
      properties:
        displayName: { type: string, maxLength: 120 }
    DeleteAccountRequest:
      type: object
      required: [password]
      description: |
        The current password is the real confirmation for the permanent deletion; the typed-email
        step in the UI is only UX.
      properties:
        password: { type: string }

    # ---- IAM ----
    IamGroup:
      type: object
      required: [id, name, createdBy, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: [string, 'null'] }
        createdBy: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CreateGroupRequest:
      type: object
      required: [name]
      properties:
        name: { type: string }
        description: { type: string }
    IamPolicy:
      type: object
      required: [id, name, document, currentVersion, createdBy, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: [string, 'null'] }
        document:
          $ref: '#/components/schemas/PolicyDocument'
        currentVersion: { type: integer }
        createdBy: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CreatePolicyRequest:
      type: object
      required: [name, document]
      properties:
        name: { type: string }
        description: { type: string }
        document: { $ref: '#/components/schemas/PolicyDocument' }
    UpdatePolicyRequest:
      type: object
      required: [document]
      properties:
        document: { $ref: '#/components/schemas/PolicyDocument' }
    PolicyDocument:
      type: object
      description: |
        AWS-style policy document. A list of statements evaluated by `(action, resource)`.
        Accepted/returned as free-form JSON; the canonical shape below is illustrative.
      properties:
        version: { type: string, example: '2025-01-01' }
        statements:
          type: array
          items:
            type: object
            properties:
              effect: { type: string, enum: [ALLOW, DENY] }
              action:
                type: array
                items: { type: string, example: 'meeting:read' }
              resource:
                type: array
                items: { type: string, example: 'nora:tenant/{tenantId}:meeting/*' }
      additionalProperties: true
    AuditEvent:
      type: object
      required: [id, actorUserId, action, createdAt]
      properties:
        id: { type: string, format: uuid }
        actorUserId: { type: string, format: uuid }
        action: { type: string, example: 'iam:policy:create' }
        targetType: { type: [string, 'null'], example: POLICY }
        targetId: { type: [string, 'null'], format: uuid }
        payload:
          type: [object, 'null']
          additionalProperties: true
        createdAt: { type: string, format: date-time }
    SimulatePolicyRequest:
      type: object
      required: [userId, action, resource]
      properties:
        userId:
          type: string
          format: uuid
          description: Subject of the simulation. Must be a user of the caller's own tenant.
        action: { type: string, example: 'meeting:read' }
        resource: { type: string, example: 'nora:tenant/{tenantId}:meeting/{meetingId}' }
        context:
          type: [object, 'null']
          description: |
            Attributes the statement conditions read (`StringEquals`, `StringIn`, `StringLike`,
            `DateGreaterThan`, `DateLessThan`). An attribute missing from here makes a condition
            that reads it not match, which is fail-closed — the same rule the real request path
            applies.
          additionalProperties: { type: string }
    SimulatePolicyResponse:
      type: object
      required: [userId, action, resource, allowed, reason, statementsEvaluated]
      properties:
        userId: { type: string, format: uuid }
        action: { type: string, example: 'meeting:read' }
        resource: { type: string, example: 'nora:tenant/{tenantId}:meeting/{meetingId}' }
        allowed: { type: boolean }
        reason:
          type: string
          enum: [NO_STATEMENTS, NO_MATCHING_STATEMENT, EXPLICIT_DENY, ALLOW, ROOT_BYPASS]
          description: |
            How the decision was reached. `ROOT_BYPASS` is the tenant Root: allowed before any
            statement is consulted (ADR 0007, rule 1). `NO_STATEMENTS` means no policy is attached
            to the user; `NO_MATCHING_STATEMENT` means statements were evaluated and none matched.
        policyId: { type: [string, 'null'], format: uuid }
        policyName: { type: [string, 'null'] }
        statementIndex:
          type: [integer, 'null']
          description: Position of the deciding statement inside that policy's document.
        statement:
          type: [object, 'null']
          description: The deciding statement, with the field names the policy document uses.
          properties:
            effect: { type: string, enum: [ALLOW, DENY] }
            action:
              type: array
              items: { type: string }
            resource:
              type: array
              items: { type: string }
            condition:
              type: [object, 'null']
              additionalProperties: true
        statementsEvaluated:
          type: integer
          description: How many statements applied to the user. `0` for a Root.

    # ---- invitations ----
    InviteUserRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        groupIds:
          type: array
          items: { type: string, format: uuid }
        expiresInDays: { type: [integer, 'null'] }
    AcceptInviteRequest:
      type: object
      required: [password]
      properties:
        displayName:
          type: string
          maxLength: 120
          description: Optional; if omitted, uses the local part of the email.
        password: { type: string, minLength: 10, maxLength: 128 }
    Invitation:
      type: object
      required: [id, tenantId, email, status, invitedBy, invitedAt, expiresAt, groupIds]
      description: The invite token is NEVER returned.
      properties:
        id: { type: string, format: uuid }
        tenantId: { type: string, format: uuid }
        email: { type: string, format: email }
        status: { $ref: '#/components/schemas/InvitationStatus' }
        invitedBy: { type: string, format: uuid }
        invitedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        groupIds:
          type: array
          items: { type: string, format: uuid }
        acceptedAt: { type: [string, 'null'], format: date-time }
        acceptedUserId: { type: [string, 'null'], format: uuid }
    InviteListResponse:
      type: object
      required: [items, total, page, size]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Invitation' }
        total: { type: integer }
        page: { type: integer }
        size: { type: integer }

    # ---- tenant (workspace) ----
    Tenant:
      type: object
      required: [id, name, slug, plan, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug:
          type: string
          description: Immutable — it appears in URLs and in invitations already sent.
        plan:
          type: string
          enum: [FREE, PRO, ENTERPRISE]
          description: |
            The `Tenant.Plan` enum as persisted. These are the database's names, not the two
            commercial tiers (Core / Enterprise) the product speaks in.
        createdAt: { type: string, format: date-time }
    TenantNameUpdateRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 120 }

    # ---- tenant context ----
    TenantContextInput:
      type: object
      required: [companyName]
      properties:
        companyName: { type: string, maxLength: 200 }
        industry: { type: string, maxLength: 200 }
        valueProposition: { type: string, maxLength: 2000 }
        idealCustomerProfile: { type: string, maxLength: 2000 }
        products:
          type: array
          items: { $ref: '#/components/schemas/Product' }
        competitors:
          type: array
          items: { type: string, maxLength: 200 }
        objectionHandling:
          type: array
          items: { type: string, maxLength: 500 }
    TenantContext:
      type: object
      required: [tenantId, companyName]
      properties:
        tenantId: { type: string, format: uuid }
        companyName: { type: string }
        industry: { type: [string, 'null'] }
        valueProposition: { type: [string, 'null'] }
        idealCustomerProfile: { type: [string, 'null'] }
        products:
          type: array
          items: { $ref: '#/components/schemas/Product' }
        competitors:
          type: array
          items: { type: string }
        objectionHandling:
          type: array
          items: { type: string }
        updatedAt: { type: string, format: date-time }
    Product:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 200 }
        description: { type: string, maxLength: 1000 }
        keyDifferentiators:
          type: array
          items: { type: string, maxLength: 200 }

    # ---- tenant context history (US31, migration V028) ----
    TenantContextVersion:
      type: object
      required: [version, createdAt]
      properties:
        version:
          type: integer
          minimum: 1
          description: |
            Numbered per context, not globally: every tenant's history starts at 1. A version is
            appended only when the document actually changes — re-saving an unchanged form does
            not create one.
        createdBy:
          type: [string, 'null']
          format: uuid
          description: '`null` when the author''s user row was removed.'
        createdByName:
          type: [string, 'null']
          description: 'Display name of the author, `null` in the same case as `createdBy`.'
        createdAt:
          type: string
          format: date-time
          description: |
            When this version was written. For **version 1 of a context that predates migration
            V028** this is the parent row's `updated_at` — it describes that context's LAST edit
            rather than its first, because the real value was never recorded. Every version from 2
            onwards is exact.
    TenantContextVersionList:
      type: object
      required: [items, total, currentVersion]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/TenantContextVersion' }
          description: Newest version first.
        total: { type: integer }
        currentVersion:
          type: integer
          description: |
            Version currently in force — the one `GET /tenant/context` returns a document for.
            `0` when the tenant has never saved a context, which is the same case as an empty
            `items`.
    TenantContextVersionDetail:
      type: object
      required: [version, document]
      properties:
        version: { $ref: '#/components/schemas/TenantContextVersion' }
        document:
          allOf:
            - $ref: '#/components/schemas/TenantContext'
          description: |
            The context exactly as it stood when this version was written. Same shape the live
            `GET /tenant/context` returns, so a client renders a past version with the code it
            already has; its `updatedAt` is this version's timestamp, not the current row's.

    # ---- tenant domain ----
    TenantDomain:
      type: object
      required: [tenantId]
      properties:
        tenantId: { type: string, format: uuid }
        allowedEmailDomain:
          type: [string, 'null']
          description: '`null` when there is no domain restriction.'
    TenantDomainUpdateRequest:
      type: object
      properties:
        allowedEmailDomain:
          type: [string, 'null']
          maxLength: 255
          description: '`null` to remove the restriction.'
    TenantDomainUpdateResponse:
      type: object
      required: [tenantId, updatedAt, updatedBy]
      properties:
        tenantId: { type: string, format: uuid }
        allowedEmailDomain: { type: [string, 'null'] }
        updatedAt: { type: string, format: date-time }
        updatedBy: { type: string, format: uuid }

    # ---- meetings ----
    MeetingUploadMetadata:
      type: object
      required: [title, transcriptFormat]
      properties:
        title: { type: string, maxLength: 200 }
        startedAt: { type: string, format: date-time }
        endedAt: { type: string, format: date-time }
        language: { type: string, example: pt-BR }
        transcriptFormat: { type: string, enum: [TXT, VTT, SRT] }
        participants:
          type: array
          items: { $ref: '#/components/schemas/Participant' }
        tags:
          type: array
          items: { type: string }
        attributes:
          type: object
          additionalProperties: { type: string }
          description: 'Free-form attributes (max 20) used for fine-grained IAM filtering.'
    Participant:
      type: object
      required: [displayName]
      properties:
        displayName: { type: string }
        email: { type: [string, 'null'], format: email }
        isInternal: { type: boolean }
    MeetingUploadResponse:
      type: object
      required: [id, tenantId, title, ownerId, processingStatus, createdAt]
      properties:
        id: { type: string, format: uuid }
        tenantId: { type: string, format: uuid }
        title: { type: string }
        startedAt: { type: [string, 'null'], format: date-time }
        endedAt: { type: [string, 'null'], format: date-time }
        ownerId: { type: string, format: uuid }
        processingStatus: { $ref: '#/components/schemas/ProcessingStatus' }
        createdAt: { type: string, format: date-time }
    MeetingListItem:
      type: object
      required: [id, title, processingStatus, actionItemCount, riskCount, opportunityCount]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        startedAt: { type: [string, 'null'], format: date-time }
        durationSeconds: { type: [integer, 'null'], format: int64 }
        ownerName: { type: [string, 'null'] }
        processingStatus: { $ref: '#/components/schemas/ProcessingStatus' }
        summarySnippet: { type: [string, 'null'] }
        actionItemCount: { type: integer }
        riskCount: { type: integer }
        opportunityCount: { type: integer }
        tags:
          type: array
          items: { type: string }
    MeetingsPage:
      type: object
      required: [items, page, size, totalItems, totalPages]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/MeetingListItem' }
        page: { type: integer }
        size: { type: integer }
        totalItems: { type: integer, format: int64 }
        totalPages: { type: integer }
    MeetingDetail:
      type: object
      required: [id, tenantId, title, processingStatus, createdAt]
      properties:
        id: { type: string, format: uuid }
        tenantId: { type: string, format: uuid }
        title: { type: string }
        startedAt: { type: [string, 'null'], format: date-time }
        endedAt: { type: [string, 'null'], format: date-time }
        durationSeconds: { type: [integer, 'null'], format: int64 }
        language: { type: [string, 'null'] }
        owner:
          type: [object, 'null']
          properties:
            id: { type: string, format: uuid }
            displayName: { type: [string, 'null'] }
        participants:
          type: array
          items: { $ref: '#/components/schemas/Participant' }
        tags:
          type: array
          items: { type: string }
        processingStatus: { $ref: '#/components/schemas/ProcessingStatus' }
        analysis:
          oneOf:
            - { $ref: '#/components/schemas/MeetingAnalysis' }
            - { type: 'null' }
        goal:
          oneOf:
            - { $ref: '#/components/schemas/MeetingGoal' }
            - { type: 'null' }
        productivity:
          oneOf:
            - { $ref: '#/components/schemas/ProductivityAssessment' }
            - { type: 'null' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: [string, 'null'], format: date-time }
    MeetingAnalysis:
      type: object
      required: [id, meetingId, summary, generatedAt]
      properties:
        id: { type: string, format: uuid }
        meetingId: { type: string, format: uuid }
        summary: { type: string }
        sentimentOverall:
          type: string
          enum: [POSITIVE, NEUTRAL, NEGATIVE, MIXED]
        topics:
          type: array
          items: { type: string }
        decisions:
          type: array
          items:
            type: object
            required: [text, confidence]
            properties:
              text: { type: string }
              confidence: { type: number, minimum: 0, maximum: 1 }
        actionItems:
          type: array
          items: { $ref: '#/components/schemas/ActionItem' }
        risks:
          type: array
          items: { $ref: '#/components/schemas/Risk' }
        opportunities:
          type: array
          items: { $ref: '#/components/schemas/Opportunity' }
        metadata:
          type: object
          properties:
            modelVersion: { type: string }
            promptVersion: { type: string }
            tokensInput: { type: integer }
            tokensOutput: { type: integer }
            processingMillis: { type: integer }
            piiRedactionsApplied: { type: integer }
        generatedAt: { type: string, format: date-time }
    ActionItem:
      type: object
      required: [title]
      properties:
        title: { type: string }
        assignee: { type: [string, 'null'] }
        dueDate: { type: [string, 'null'], format: date }
        priority: { $ref: '#/components/schemas/Priority' }
        sourceQuote: { type: [string, 'null'] }
        status: { $ref: '#/components/schemas/ActionItemStatus' }
    Risk:
      type: object
      required: [text, severity]
      properties:
        text: { type: string }
        severity: { $ref: '#/components/schemas/Priority' }
        category:
          type: string
          enum: [COMPETITION, PRICE, CHURN, TIMELINE, TECHNICAL, COMPLIANCE, OTHER]
        sourceQuote: { type: [string, 'null'] }
    Opportunity:
      type: object
      required: [text]
      properties:
        text: { type: string }
        estimatedValue: { $ref: '#/components/schemas/Priority' }
        category:
          type: string
          enum: [UPSELL, CROSS_SELL, REFERRAL, EXPANSION, OTHER]
        sourceQuote: { type: [string, 'null'] }
    MeetingGoalRequest:
      type: object
      required: [purpose, expectedOutcomes]
      properties:
        purpose: { type: string, minLength: 3, maxLength: 500 }
        expectedOutcomes:
          type: array
          minItems: 1
          maxItems: 10
          items: { type: string, minLength: 3, maxLength: 240 }
        projectStateSnapshot: { type: [string, 'null'], maxLength: 2000 }
    MeetingGoal:
      type: object
      required: [id, meetingId, purpose, expectedOutcomes]
      properties:
        id: { type: string, format: uuid }
        meetingId: { type: string, format: uuid }
        purpose: { type: string }
        expectedOutcomes:
          type: array
          items: { type: string }
        projectStateSnapshot: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ProductivityAssessment:
      type: object
      required: [score, band, coverage]
      description: Persisted Productivity Score (ADR 0005).
      properties:
        score: { type: integer, minimum: 0, maximum: 100 }
        band:
          type: string
          enum: [LOW, MEDIUM, HIGH]
        coverage:
          type: array
          items:
            type: object
            required: [expectedOutcome, status]
            properties:
              expectedOutcome: { type: string }
              status:
                type: string
                enum: [ADDRESSED, PARTIAL, MISSED]
              evidence: { type: [string, 'null'] }
        offTopicRatio: { type: [number, 'null'] }
        decisionDensity: { type: [number, 'null'] }
        rationale: { type: [string, 'null'] }
    SttSessionRequest:
      type: object
      description: |
        Optional. Everything that costs money — provider, model, audio format, VAD — is resolved
        server-side; the client only says what language it expects to hear.
      properties:
        language:
          type: string
          description: |
            BCP-47 tag as the desktop knows it. Narrowed to the ISO-639-1 primary subtag before it
            reaches the provider. Absent or unusable falls back to `nora.stt.default-language`.
          example: pt-BR
    SttSessionResponse:
      type: object
      required: [clientSecret, expiresAt, websocketUrl, provider, model, language, audioFormat, sampleRate]
      properties:
        clientSecret:
          type: string
          description: |
            Short-lived credential presented to the provider over the WebSocket. Treat it as a
            secret: it is not renewable, it is scoped to one session, and it must not be persisted.
          example: ek_68af296e8e408191a1120ab6383263c2
        expiresAt:
          type: string
          format: date-time
          description: |
            When the credential can no longer **open** a connection. An already-open session
            outlives it — do not build a renewal loop around this value.
        websocketUrl:
          type: string
          description: Provider endpoint to connect to. Resolved server-side so a provider endpoint
            move does not need a desktop release.
          example: wss://api.openai.com/v1/realtime?intent=transcription
        provider: { type: string, example: openai }
        model: { type: string, example: gpt-live-transcribe }
        language:
          type: string
          description: Primary language subtag actually sent to the provider.
          example: pt
        audioFormat: { type: string, example: audio/pcm }
        sampleRate:
          type: integer
          description: |
            Sample rate in Hz the client must stream. It matches the desktop capture pipeline's
            target (`TARGET_SAMPLE_RATE`); a mismatch does not fail anywhere, it just transcribes
            as gibberish.
          example: 24000
    McpJsonRpcRequest:
      type: object
      description: |
        A single JSON-RPC 2.0 message. `id` absent makes it a notification, which is answered
        `202` with no body. Batches are not accepted: the Streamable HTTP transport carries one
        message per POST.
      required: [jsonrpc, method]
      properties:
        jsonrpc: { type: string, const: '2.0' }
        id:
          description: |
            Request identifier, echoed verbatim in the response. Absent on a notification.
          oneOf:
            - { type: string }
            - { type: integer }
        method:
          type: string
          enum: [initialize, ping, tools/list, tools/call, notifications/initialized]
        params:
          type: object
          additionalProperties: true
          description: |
            Method-dependent. `initialize` takes `protocolVersion`, `capabilities` and
            `clientInfo`; `tools/call` takes `name` and `arguments`.
    McpJsonRpcResponse:
      type: object
      description: |
        Exactly one of `result` or `error` is present. A tool that fails for a reason the caller
        can act on — a bad argument, a meeting it may not read — is a SUCCESS at this level, with
        `isError: true` inside `result`.
      required: [jsonrpc, id]
      properties:
        jsonrpc: { type: string, const: '2.0' }
        id:
          oneOf:
            - { type: string }
            - { type: integer }
            - { type: 'null' }
        result:
          type: object
          additionalProperties: true
          description: |
            For `tools/call`: `content` (a text block carrying the serialized payload),
            `structuredContent` (the same payload as JSON) and `isError`.
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: integer
              description: |
                JSON-RPC reserved codes. `-32600` malformed message or unimplemented protocol
                version header, `-32601` unknown method, `-32602` unimplemented protocol version
                on `initialize` or unknown tool.
            message: { type: string }
            data:
              type: object
              additionalProperties: true
              description: |
                On a protocol-version refusal: `supported` (the revisions this server implements)
                and `requested`.
    McpTokenCreateRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
          description: Label the user recognises when deciding which token to revoke.
          example: Claude Desktop
        expiresInDays:
          type: integer
          minimum: 1
          maximum: 365
          description: |
            Optional hard expiry. Absent means the token lives until it is revoked. Values outside
            the range are clamped rather than refused — this is a convenience, not a control.
    McpTokenCreated:
      type: object
      required: [id, name, token, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        token:
          type: string
          description: |
            The plaintext, readable here and nowhere else — only its SHA-256 hash is stored.
            Prefixed `nora_mcp_`.
          example: nora_mcp_0S3Xk1u2h9Tq0vP4nZ7mFbA6cJ8eR5yWq1tL3dK0gYs
        createdAt: { type: string, format: date-time }
        expiresAt:
          oneOf:
            - { type: string, format: date-time }
            - { type: 'null' }
    McpToken:
      type: object
      required: [id, name, createdAt, active]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        createdAt: { type: string, format: date-time }
        expiresAt:
          oneOf:
            - { type: string, format: date-time }
            - { type: 'null' }
        revokedAt:
          oneOf:
            - { type: string, format: date-time }
            - { type: 'null' }
        lastUsedAt:
          description: Last successful resolution. Null on a token no client has ever used.
          oneOf:
            - { type: string, format: date-time }
            - { type: 'null' }
        active:
          type: boolean
          description: Neither revoked nor past its expiry.
    McpTokenListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/McpToken' }
    LiveAnalyzeRequest:
      type: object
      required: [transcriptChunk]
      properties:
        transcriptChunk: { type: string, minLength: 20, maxLength: 500000 }
        previousHighlights:
          oneOf:
            - { $ref: '#/components/schemas/LiveHighlights' }
            - { type: 'null' }
        language: { type: string, example: pt-BR }
    LiveAnalyzeResponse:
      allOf:
        - $ref: '#/components/schemas/LiveHighlights'
        - type: object
          properties:
            metadata:
              type: object
              properties:
                processingMillis: { type: integer }
                tokensInput: { type: integer }
                tokensOutput: { type: integer }
                piiRedactionsApplied: { type: integer }
                modelVersion: { type: string }
    LiveHighlights:
      type: object
      properties:
        decisions:
          type: array
          items: { $ref: '#/components/schemas/LiveHighlightItem' }
        nextSteps:
          type: array
          items: { $ref: '#/components/schemas/LiveHighlightItem' }
        observations:
          type: array
          items: { $ref: '#/components/schemas/LiveHighlightItem' }
        tasks:
          type: array
          items: { $ref: '#/components/schemas/LiveTaskItem' }
    LiveHighlightItem:
      type: object
      properties:
        text: { type: string }
        confidence: { type: [number, 'null'] }
        sourceQuote: { type: [string, 'null'] }
    LiveTaskItem:
      type: object
      properties:
        title: { type: string }
        assignee: { type: [string, 'null'] }
        priority: { type: [string, 'null'] }
        sourceQuote: { type: [string, 'null'] }

    MeetingSearchResponse:
      type: object
      required: [items]
      description: |
        Semantic search result, ordered by embedding similarity. No score is returned: the ranking
        is the answer, and exposing a raw cosine value would invite thresholds the product does not
        calibrate.
      properties:
        items:
          type: array
          items:
            type: object
            required: [id, title, processingStatus]
            properties:
              id: { type: string, format: uuid }
              title: { type: string }
              summarySnippet: { type: [string, 'null'] }
              startedAt: { type: [string, 'null'], format: date-time }
              processingStatus: { $ref: '#/components/schemas/ProcessingStatus' }
    SplitPreviewResponse:
      type: object
      required: [segments, totalLines, metadata]
      description: Proposed meeting boundaries inside one concatenated `.txt`. Nothing is persisted.
      properties:
        segments:
          type: array
          items: { $ref: '#/components/schemas/SplitSegment' }
        totalLines:
          type: integer
          description: Line count of the uploaded file, the denominator for the boundaries.
        metadata:
          type: object
          properties:
            modelVersion: { type: string }
            promptVersion: { type: string }
            tokensInput: { type: integer }
            tokensOutput: { type: integer }
            processingMillis: { type: integer }
            piiRedactionsApplied: { type: integer }
    SplitSegment:
      type: object
      required: [index, startLine, endLine, confidence]
      properties:
        index: { type: integer, description: Position of the segment in the file, from 0. }
        title: { type: [string, 'null'], description: Title proposed by the model. }
        startLine: { type: integer, description: 1-based, inclusive, over the ORIGINAL file. }
        endLine: { type: integer, description: 1-based, inclusive, over the ORIGINAL file. }
        confidence: { type: number, minimum: 0, maximum: 1 }
        preview:
          type: [string, 'null']
          description: Excerpt ALREADY redacted by the worker's PII Shield (ADR 0012).

    # ---- tasks ----
    Task:
      type: object
      required: [id, title, status, priority]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        assignee: { type: [string, 'null'] }
        dueDate: { type: [string, 'null'], format: date }
        priority: { $ref: '#/components/schemas/Priority' }
        status: { $ref: '#/components/schemas/ActionItemStatus' }
        meetingId: { type: string, format: uuid }
        meetingTitle: { type: [string, 'null'] }
        updatedAt: { type: string, format: date-time }
    TaskListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Task' }
    TaskUpdateRequest:
      type: object
      description: |
        At least one of `status`/`title`/`dueDate` must be provided. An absent `dueDate` leaves the
        stored value alone; an empty string clears it.
      properties:
        status: { $ref: '#/components/schemas/ActionItemStatus' }
        title: { type: string }
        dueDate:
          type: string
          description: ISO date `yyyy-MM-dd`, or an empty string to clear the current value.
          example: '2026-09-01'

    # ---- trends (US21) ----
    TrendsGranularity:
      type: string
      enum: [WEEK, MONTH]
      description: Bucket size. Weeks are ISO — they start on Monday, in `timezone`.
    TrendsDataState:
      type: string
      enum: [NO_MEETINGS, NO_ANALYSED_MEETINGS, OK]
      description: |
        What the panel is allowed to claim. `OK` with every counter at zero means a real period
        with no activity; the other two mean there is nothing to draw, and for different reasons.
    TrendsScopeStrategy:
      type: string
      enum: [TENANT_UNIFORM, PER_MEETING_FILTER]
      description: |
        Which aggregate-authorization path produced the numbers. `TENANT_UNIFORM` means no
        statement of this caller distinguishes two meetings of the tenant, so the aggregate ran
        tenant-wide over a provably identical set. `PER_MEETING_FILTER` means the visible meetings
        were resolved one by one and the aggregate was restricted to them.
    TrendsPoint:
      type: object
      required: [bucketStart, opened, completed]
      properties:
        bucketStart:
          type: string
          format: date
          description: First day of the bucket, a LOCAL date in `timezone`.
        opened:
          type: integer
          description: Action items created in the bucket (`meeting_action_items.created_at`).
        completed:
          type: integer
          description: |
            Action items that entered DONE in the bucket (`completed_at`, migration V030). Rows
            already DONE when V030 ran carry their previous `updated_at`, which is an upper bound
            on the real instant rather than a measurement.
    TrendsTaskLoad:
      type: object
      required: [buckets, open, overdue, byPriority, hasData]
      properties:
        buckets:
          type: array
          items: { $ref: '#/components/schemas/TrendsPoint' }
          description: Dense — every bucket of the range is present, including the empty ones.
        open:
          type: integer
          description: |
            Items not DONE right now. A snapshot, deliberately NOT limited to the range: a backlog
            is a state at a point in time and not an interval.
        overdue:
          type: integer
          description: Of those, how many have a due date in the past.
        byPriority:
          type: object
          description: Open items by priority. Always carries all three keys, zeros included.
          properties:
            HIGH: { type: integer }
            MEDIUM: { type: integer }
            LOW: { type: integer }
        hasData:
          type: boolean
          description: False when the scope holds no action item at all.
    TrendsTheme:
      type: object
      required: [label, meetings]
      properties:
        label:
          type: string
          description: The spelling written most often for this theme, not the folded key.
        meetings:
          type: integer
          description: Distinct meetings the theme appeared in — not a count of mentions.
    TrendsThemeBucket:
      type: object
      required: [bucketStart, meetings, sufficient, items]
      properties:
        bucketStart: { type: string, format: date }
        meetings:
          type: integer
          description: Analysed meetings in the bucket, whether or not they carried any topic.
        sufficient:
          type: boolean
          description: False when the bucket held too few analysed meetings to rank; `items` is
            then empty on purpose.
        items:
          type: array
          items: { $ref: '#/components/schemas/TrendsTheme' }
    TrendsThemes:
      type: object
      required: [source, matching, minimumMeetings, sufficient, overall, buckets]
      properties:
        source:
          type: string
          description: Where the themes come from. `ANALYSIS_TOPICS` today.
          example: ANALYSIS_TOPICS
        matching:
          type: string
          description: How two spellings are decided to be one theme. `LEXICAL` — never semantic.
          example: LEXICAL
        minimumMeetings:
          type: integer
          description: Analysed meetings in the range below which no ranking is returned at all.
        sufficient:
          type: boolean
          description: Whether the range cleared `minimumMeetings`. False means `overall` is empty
            because the data is thin, not because there are no themes.
        overall:
          type: array
          items: { $ref: '#/components/schemas/TrendsTheme' }
        buckets:
          type: array
          items: { $ref: '#/components/schemas/TrendsThemeBucket' }
    TrendsResponse:
      type: object
      required:
        [granularity, timezone, from, to, scopeStrategy, dataState, meetings, analysedMeetings,
         taskLoad, themes]
      properties:
        granularity: { $ref: '#/components/schemas/TrendsGranularity' }
        timezone:
          type: string
          description: IANA zone the buckets were cut in, so the numbers can be reproduced.
          example: America/Sao_Paulo
        from: { type: string, format: date-time, description: Applied range start, inclusive. }
        to: { type: string, format: date-time, description: Applied range end, exclusive. }
        scopeStrategy: { $ref: '#/components/schemas/TrendsScopeStrategy' }
        dataState: { $ref: '#/components/schemas/TrendsDataState' }
        meetings:
          type: integer
          description: Meetings in the range the caller is allowed to open.
        analysedMeetings:
          type: integer
          description: How many of those carry a persisted analysis.
        taskLoad: { $ref: '#/components/schemas/TrendsTaskLoad' }
        themes: { $ref: '#/components/schemas/TrendsThemes' }

    # ---- tenant usage (US33) ----
    UsageDataState:
      type: string
      enum: [NO_DATA, NO_ANALYSED_MEETINGS, OK]
      description: |
        What the screen is allowed to claim. `OK` with a counter at zero means a real zero;
        `NO_DATA` means no meeting and no AI call the API can see, and `NO_ANALYSED_MEETINGS` means
        meetings exist but none is analysed. When `ai.state` is not `AVAILABLE` this is decided
        over the meetings half alone — an absent measurement is not a zero.
    UsageAiState:
      type: string
      enum: [AVAILABLE, UNAVAILABLE, WITHHELD_RESTRICTED_SCOPE]
      description: |
        Whether the AI half is a measurement, an absence of one, or a refusal. `UNAVAILABLE`: the
        control plane of ADR 0022 is off or degraded, so the counters below mean "unknown".
        `WITHHELD_RESTRICTED_SCOPE`: the caller's IAM position distinguishes meetings and
        `usage_events` carries no meeting id, so a tenant-wide total would disclose activity from
        meetings they may not open.
    UsageMeetingBucket:
      type: object
      required: [bucketStart, meetings, analysedMeetings]
      properties:
        bucketStart:
          type: string
          format: date
          description: First day of the bucket, a LOCAL date in `timezone`.
        meetings:
          type: integer
          description: Meetings of the bucket the caller may open, analysed or not.
        analysedMeetings:
          type: integer
          description: How many of those carry a persisted analysis.
    UsageAiBucket:
      type: object
      required: [bucketStart, calls, promptTokens, completionTokens, costUsd]
      properties:
        bucketStart: { type: string, format: date }
        calls:
          type: integer
          description: Recorded AI events of the bucket, failures included, stub runs excluded.
        promptTokens: { type: integer }
        completionTokens: { type: integer }
        costUsd:
          type: number
          description: Catalog list price × measured tokens for this bucket. Not an invoice.
    UsageServiceUsage:
      type: object
      required: [service, metered, calls, promptTokens, completionTokens, costUsd]
      properties:
        service:
          type: string
          description: '`analysis`, `chat`, `embedding`, `stt` — whatever `UsageRecorder` wrote.'
          example: analysis
        metered:
          type: boolean
          description: |
            False when the service's events carry no token count by construction, so its zero cost
            is a property of the design and not an observation. `stt` is the case that exists: with
            the ephemeral-credential design of ADR 0039/0045 the audio never crosses NORA's
            infrastructure, so what is recorded is a session issued and never a minute transcribed.
        calls: { type: integer }
        promptTokens: { type: integer }
        completionTokens: { type: integer }
        costUsd: { type: number }
    UsageAi:
      type: object
      required:
        [state, costBasis, currency, calls, unmeteredCalls, promptTokens, completionTokens,
         costUsd, byService, buckets]
      properties:
        state: { $ref: '#/components/schemas/UsageAiState' }
        costBasis:
          type: string
          description: Where the money figure comes from. `CATALOG_LIST_PRICE` today.
          example: CATALOG_LIST_PRICE
        currency:
          type: string
          description: ISO 4217 code of every `costUsd`. Always `USD` — the catalog's currency.
          example: USD
        calls:
          type: integer
          description: Recorded AI events in the range, failures included, stub runs excluded.
        unmeteredCalls:
          type: integer
          description: |
            How many of `calls` came from a service whose cost is not measurable, so a reader can
            see how much of the total the money figure does not cover.
        promptTokens: { type: integer }
        completionTokens: { type: integer }
        costUsd: { type: number }
        byService:
          type: array
          items: { $ref: '#/components/schemas/UsageServiceUsage' }
          description: Busiest first, ties broken by name.
        buckets:
          type: array
          items: { $ref: '#/components/schemas/UsageAiBucket' }
          description: |
            Dense over the same axis as `meetingBuckets` — every bucket of the range is present,
            including the empty ones. Empty when `state` is not `AVAILABLE`.
    UsageResponse:
      type: object
      required:
        [granularity, timezone, from, to, scopeStrategy, dataState, meetings, analysedMeetings,
         meetingBuckets, ai]
      properties:
        granularity: { $ref: '#/components/schemas/TrendsGranularity' }
        timezone:
          type: string
          description: IANA zone the buckets were cut in, so the numbers can be reproduced.
          example: America/Sao_Paulo
        from: { type: string, format: date-time, description: Applied range start, inclusive. }
        to: { type: string, format: date-time, description: Applied range end, exclusive. }
        scopeStrategy:
          allOf: [{ $ref: '#/components/schemas/TrendsScopeStrategy' }]
          description: |
            Same two aggregate-authorization paths `GET /trends` reports, with the same meaning.
        dataState: { $ref: '#/components/schemas/UsageDataState' }
        meetings:
          type: integer
          description: Meetings in the range the caller is allowed to open.
        analysedMeetings:
          type: integer
          description: How many of those carry a persisted analysis.
        meetingBuckets:
          type: array
          items: { $ref: '#/components/schemas/UsageMeetingBucket' }
          description: Dense — every bucket of the range is present, including the empty ones.
        ai: { $ref: '#/components/schemas/UsageAi' }

    # ---- chat ----
    ChatRole:
      type: string
      enum: [user, assistant]
      description: |
        Wire form of `ChatRole`, lowercase. Only these two exist: there is no stored `system` turn —
        the system prompt is assembled by the web BFF on every request and never persisted.
    ChatSessionSummary:
      type: object
      required: [id, createdAt, updatedAt, messageCount]
      description: Sidebar item, and the body returned by create and rename.
      properties:
        id: { type: string, format: uuid }
        title: { type: [string, 'null'], description: Absent until the front end derives one. }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        messageCount: { type: integer }
        lastSnippet:
          type: string
          description: Omitted (not null) when empty — the response drops null fields.
    ChatSessionDetail:
      type: object
      required: [id, createdAt, updatedAt, messages]
      properties:
        id: { type: string, format: uuid }
        title: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        messages:
          type: array
          description: Chronological order, oldest first.
          items: { $ref: '#/components/schemas/ChatMessage' }
    ChatMessage:
      type: object
      required: [id, role, content, createdAt]
      properties:
        id: { type: string, format: uuid }
        role: { $ref: '#/components/schemas/ChatRole' }
        content: { type: string }
        createdAt: { type: string, format: date-time }
    ChatSessionCreateRequest:
      type: object
      description: Whole body optional. Without `title` the session starts untitled.
      properties:
        title: { type: string }
    ChatSessionRenameRequest:
      type: object
      required: [title]
      properties:
        title: { type: string }
    ChatMessageCreateRequest:
      type: object
      required: [role, content]
      properties:
        role: { $ref: '#/components/schemas/ChatRole' }
        content: { type: string }

    # ---- flows (workflows) ----
    TriggerType:
      type: string
      enum:
        - meeting.analysis_completed
        - action_item.created
        - meeting.risk_detected
        - schedule.cron
      description: |
        Wire form of `TriggerType`, as stored in `workflows.trigger_type` and in the canvas trigger
        node.

        The first three are dispatched: each is published by `AnalysisService` and handled by
        `WorkflowEngine`. `schedule.cron` is NOT — nothing in the backend schedules a workflow, so
        a flow saved with it would sit active and never run. It is still listed here because rows
        persisted before that rule keep reading, but it is REFUSED on save with
        `422 WORKFLOW_INVALID_DEFINITION`, and the canvas catalog does not offer it.
    Workflow:
      type: object
      required: [id, name, triggerType, active, definition, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, maxLength: 120 }
        triggerType: { $ref: '#/components/schemas/TriggerType' }
        active: { type: boolean }
        definition: { $ref: '#/components/schemas/WorkflowDefinition' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    WorkflowUpsertRequest:
      type: object
      required: [name, definition]
      description: |
        The trigger is NOT a field: it is parsed out of the trigger node inside `definition`, so
        the canvas graph stays the single source of truth. `active` absent means true — a workflow
        is created already running.
      properties:
        name: { type: string, maxLength: 120 }
        active: { type: [boolean, 'null'] }
        definition: { $ref: '#/components/schemas/WorkflowDefinition' }
    WorkflowDefinition:
      type: object
      description: |
        The React Flow canvas graph (ADR 0032), stored verbatim in `workflows.definition_json`.
        Free-form JSON on the wire; the backend only reads the trigger node and the action nodes it
        knows about, through `WorkflowDefinitionParser`. The shape below is illustrative.
      properties:
        nodes:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              kind: { type: string, example: trigger }
              type: { type: string, example: meeting.analysis_completed }
              config:
                type: object
                additionalProperties: true
        edges:
          type: array
          items:
            type: object
            properties:
              source: { type: string }
              target: { type: string }
      additionalProperties: true
    WorkflowExecutionStatus:
      type: string
      enum: [RUNNING, SUCCESS, FAILED]
    WorkflowExecution:
      type: object
      required: [id, workflowId, status, log, createdAt]
      properties:
        id: { type: string, format: uuid }
        workflowId: { type: string, format: uuid }
        eventType:
          type: [string, 'null']
          description: Event that fired the run. Absent for a manual run through `/test`.
        status: { $ref: '#/components/schemas/WorkflowExecutionStatus' }
        log:
          type: array
          description: |
            Step-by-step log the canvas renders line by line. Defaults to `[]`. Note that the
            `message` of each step is pt-BR: it is product copy shown in the flow-run log, not an
            engineering log line.
          items:
            type: object
            properties:
              at: { type: string, format: date-time }
              nodeId: { type: string }
              level: { type: string, example: info }
              message: { type: string }
        createdAt: { type: string, format: date-time }
        finishedAt: { type: [string, 'null'], format: date-time }

    # ---- integrations ----
    IntegrationProvider:
      type: string
      enum: [google, slack, github, notion, todoist, linear, microsoft, telegram, trello]
      description: |
        The nine supported providers (migrations V024 -> V025 -> V026, which is also the order they
        were added in). Six connect through the OAuth authorization-code flow; `telegram` pairs by
        code and `trello` takes a pasted token, so neither uses `/oauth/start`.
    IntegrationStatus:
      type: object
      required: [provider, configured, connected]
      properties:
        provider: { $ref: '#/components/schemas/IntegrationProvider' }
        configured:
          type: boolean
          description: |
            Whether THIS DEPLOYMENT holds credentials for the provider. False means nobody can
            connect it here, no matter their permissions.
        connected:
          type: boolean
          description: Whether THIS TENANT has a stored connection. At most one per provider.
        externalAccount:
          type: [string, 'null']
          description: Human-readable identifier of the linked account, for the hub to display.
        connectedAt: { type: [string, 'null'], format: date-time }
    OAuthStartResponse:
      type: object
      required: [authorizeUrl]
      properties:
        authorizeUrl:
          type: string
          format: uri
          description: Provider authorization URL, carrying the signed `state`.
    TelegramPairingStart:
      type: object
      required: [deepLink, code]
      properties:
        deepLink: { type: string, format: uri, example: 'https://t.me/nora_bot?start=ABC123' }
        code: { type: string, description: Short-lived pairing code, also embedded in the deep link. }
    TrelloTokenRequest:
      type: object
      required: [token]
      properties:
        token:
          type: string
          description: |
            Token the user generated in Trello and pasted. Validated against Trello before being
            stored, encrypted at rest with AES-GCM (`TokenCipher`).

    # ---- control plane (operator + internal) ----
    Modality:
      type: string
      enum: [text, multimodal]
    PlatformModel:
      type: object
      required: [id, provider, model, displayName, baseUrl, modality, supportsStrictJsonSchema, enabled]
      description: |
        Catalog entry, from the platform database (ADR 0022) — global, with no tenant dimension.
        Prices are USD per 1M tokens.
      properties:
        id: { type: string, format: uuid }
        provider: { type: string, example: openai }
        model: { type: string, description: Provider-side model id., example: gpt-4o-mini }
        displayName: { type: string }
        baseUrl: { type: string, format: uri }
        modality: { $ref: '#/components/schemas/Modality' }
        supportsStrictJsonSchema:
          type: boolean
          description: Required to be true for the `analysis` binding (ADR 0003).
        priceInputPerMTok: { type: number }
        priceOutputPerMTok: { type: number }
        priceCachedInputPerMTok:
          type: [number, 'null']
          description: '`null` when the provider has no cache-hit price.'
        enabled: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CreateModelRequest:
      type: object
      required: [provider, model, displayName, baseUrl]
      properties:
        provider: { type: string }
        model: { type: string }
        displayName: { type: string }
        baseUrl: { type: string, format: uri }
        modality:
          type: string
          description: 'Absent or unrecognised is read as `text` — it does not fail.'
        supportsStrictJsonSchema: { type: [boolean, 'null'], description: 'Absent is false.' }
        priceInputPerMTok: { type: [number, 'null'], description: 'Absent is 0.' }
        priceOutputPerMTok: { type: [number, 'null'], description: 'Absent is 0.' }
        priceCachedInputPerMTok: { type: [number, 'null'] }
        enabled: { type: [boolean, 'null'], description: 'Absent is true.' }
    FeatureFlag:
      type: object
      required: [key, enabled]
      properties:
        key: { type: string }
        enabled: { type: boolean }
        description: { type: [string, 'null'] }
        updatedBy: { type: [string, 'null'] }
        updatedAt: { type: [string, 'null'], format: date-time }
    ServiceBinding:
      type: object
      required: [service, enabled]
      properties:
        service: { type: string, enum: [chat, analysis, multimodal] }
        modelId: { type: [string, 'null'], format: uuid }
        provider: { type: [string, 'null'], description: 'Denormalised from the bound model.' }
        model: { type: [string, 'null'], description: 'Denormalised from the bound model.' }
        enabled: { type: boolean }
        updatedAt: { type: [string, 'null'], format: date-time }
        updatedBy: { type: [string, 'null'], description: 'Operator email from `X-Operator-Email`.' }
    BindRequest:
      type: object
      required: [modelId]
      properties:
        modelId: { type: string, format: uuid }
        enabled: { type: [boolean, 'null'], description: 'Absent is true.' }
    CostReport:
      type: object
      required: [from, to, rows, totals]
      properties:
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        groupBy: { type: [string, 'null'], description: 'Echo of the query parameter.' }
        rows:
          type: array
          items:
            type: object
            required: [key, promptTokens, completionTokens, costUsd, events]
            properties:
              key: { type: string, description: 'Value of the grouping dimension.' }
              promptTokens: { type: integer, format: int64 }
              completionTokens: { type: integer, format: int64 }
              costUsd: { type: number }
              events: { type: integer, format: int64 }
        totals:
          type: object
          required: [promptTokens, completionTokens, costUsd, events]
          properties:
            promptTokens: { type: integer, format: int64 }
            completionTokens: { type: integer, format: int64 }
            costUsd:
              type: number
              description: 'Events with `status=stub` are counted but contribute no cost.'
            events: { type: integer, format: int64 }
    HealthSnapshot:
      type: object
      required: [window, source, services, degraded]
      properties:
        window: { type: string, description: 'Window the metrics cover.' }
        source:
          type: string
          description: |
            Adapter that answered — `prometheus` since ADR 0034. The literal `unavailable` means
            the source is not configured or not reachable; the response is still `200` and
            `services` is empty. It is the only value the console branches on.
          example: prometheus
        services:
          type: array
          items:
            type: object
            required: [role, requests, failed, failureRate]
            properties:
              role: { type: string, example: api }
              requests: { type: integer, format: int64 }
              failed: { type: integer, format: int64 }
              failureRate: { type: number }
              p95LatencyMs: { type: [number, 'null'] }
        degraded: { type: boolean }
        note: { type: [string, 'null'] }
    BusinessSnapshot:
      type: object
      required: [from, to, enabled, analyses, tenantsActive]
      properties:
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        enabled:
          type: boolean
          description: 'False when the workstream is switched off; every counter is then 0.'
        analyses: { type: integer, format: int64 }
        tenantsActive: { type: integer, format: int64 }
        productivityAvg: { type: [number, 'null'], description: 'Not computed yet — `null` in v1.' }
        customerConfidenceAvg: { type: [number, 'null'], description: 'Not computed yet — `null` in v1.' }
    EmbeddingBackfillPreview:
      type: object
      required: [enabled, model, source, defaultLimit, maxLimit, tenants]
      properties:
        enabled:
          type: boolean
          description: 'False when no embedding credential is configured; `POST` then returns 409.'
        model: { type: string, example: 'gemini:text-embedding-004' }
        source:
          type: string
          enum: [telemetry, primary]
          description: 'Database role that answered. `primary` under RLS enforce sees no rows.'
        defaultLimit: { type: integer, description: 'Batch size a `POST` uses when it omits `limit`.' }
        maxLimit: { type: integer, description: 'Hard ceiling per run.' }
        analysedMeetings: { type: integer, format: int64 }
        indexed: { type: integer, format: int64, description: 'Vector present, current model.' }
        missingVector: { type: integer, format: int64, description: 'Analysed and never indexed.' }
        staleModel:
          type: integer
          format: int64
          description: 'Vector from another provider/model — as invisible as no vector at all.'
        tenants:
          type: array
          description: 'Worst first. Truncated when `tenantsTruncated` is true.'
          items: { $ref: '#/components/schemas/EmbeddingTenantIndexStatus' }
        tenantsTruncated: { type: boolean }
    EmbeddingTenantIndexStatus:
      type: object
      required: [tenantId]
      properties:
        tenantId: { type: string, format: uuid }
        analysedMeetings: { type: integer, format: int64 }
        indexed: { type: integer, format: int64 }
        missingVector: { type: integer, format: int64 }
        staleModel: { type: integer, format: int64 }
    EmbeddingBackfillRequest:
      type: object
      required: [tenantId]
      properties:
        tenantId:
          type: string
          format: uuid
          description: 'Required. A backfill spends per meeting, so it is never implicitly global.'
        limit:
          type: integer
          minimum: 1
          description: 'Meetings to index in this run. Omitted = 25; anything above 100 is clamped.'
    EmbeddingBackfillRun:
      type: object
      required: [tenantId, model, limit, candidates, attempted, indexed, failed, remaining]
      properties:
        tenantId: { type: string, format: uuid }
        model: { type: string }
        limit: { type: integer, description: 'Effective ceiling after clamping.' }
        candidates: { type: integer, description: 'Rows the pending query returned.' }
        attempted: { type: integer, description: 'Rows the loop reached before any early stop.' }
        indexed: { type: integer }
        failed: { type: integer }
        remaining:
          type: integer
          format: int64
          description: 'Re-measured after the run, not subtracted — run again to keep going.'
        stoppedReason:
          type: [string, 'null']
          description: 'Null when the batch finished. Otherwise the budget or the failure streak.'
    ResolvedLlmConfig:
      type: object
      required: [provider, model, baseUrl, enabled]
      description: |
        Carries NO API key on purpose: the consumer resolves the key from the provider name (ADR
        0024, decision C), so the control plane never moves a secret over the wire.
      properties:
        provider: { type: string }
        model: { type: string }
        baseUrl: { type: string, format: uri }
        enabled: { type: boolean }
    UsageRequest:
      type: object
      required: [service]
      properties:
        service: { type: string, example: analysis }
        provider: { type: string }
        model: { type: string }
        tenantId:
          type: [string, 'null']
          description: |
            Best-effort telemetry dimension, no foreign key — the tenants table lives in the
            primary database. A malformed value is stored as "no tenant" rather than rejected.
        promptTokens: { type: [integer, 'null'], minimum: 0 }
        completionTokens: { type: [integer, 'null'], minimum: 0 }
        costUsd: { type: [number, 'null'] }
        latencyMs: { type: [integer, 'null'] }
        status: { type: string, enum: [ok, error, stub, fallback] }

    # ---- system ----
    Jwks:
      type: object
      required: [keys]
      properties:
        keys:
          type: array
          items:
            type: object
            properties:
              kty: { type: string, example: RSA }
              use: { type: string, example: sig }
              alg: { type: string, example: RS256 }
              kid: { type: string }
              n: { type: string, description: base64url modulus (no padding). }
              e: { type: string, description: base64url exponent (no padding). }
