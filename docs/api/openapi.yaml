openapi: 3.1.0
info:
  title: NORA API
  version: 0.2.0
  description: |
    REST API for the NORA backend (Spring Boot 3 / Java 21). Covers authentication with httpOnly
    cookies, AWS-style IAM (groups + policies + attachments + audit), email invitations, tenant
    commercial context, corporate domain, meeting upload/listing/detail, extracted task management
    and live analysis.

    ## Authentication
    Most endpoints require a JWT. There are two equivalent transport modes:

    - **Bearer** — header `Authorization: Bearer <accessToken>` (scheme `bearerAuth`).
    - **Cookie httpOnly** — `POST /auth/login` (and `POST /iam/invites/{token}/accept`) sets
      `Set-Cookie: nora_access` (`Path=/`, `SameSite=Lax`, `HttpOnly`) and `Set-Cookie: nora_refresh`
      (`Path=/auth`, `SameSite=Strict`, `HttpOnly`). The browser resends `nora_access` automatically.
      `nora_refresh` only reaches routes under `/auth` (refresh/logout). The `Secure` flag is enabled
      in prod via `nora.auth.cookie-secure`.

    The `accessToken` field remains present in the login JSON body for compatibility with legacy
    clients; new clients should rely on the cookies.

    ## IAM Authorization (ADR 0007)
    There are NO fixed roles. Authorization is based on **IAM policies** (AWS-style) evaluated by
    `(action, resource)`. Each protected endpoint declares in its description the IAM action it
    requires (e.g.: `meeting:read`, `iam:group:create`). The tenant Root bypasses this check. Denial
    returns `403 IAM_FORBIDDEN`.

    ## Error format
    All errors use the `Error` schema (`code`, `message`, `traceId`, `timestamp`, `details`).
    `code` is the source of truth for the UI. See `packages/shared-contracts/error-codes.md`.
servers:
  - url: http://localhost:8080
    description: Local dev
security:
  - bearerAuth: []
  - cookieAuth: []
tags:
  - name: Auth
    description: Signup, email verification, login, refresh, logout and password reset.
  - name: IAM
    description: Groups, policies, attachments and audit (AWS-style, ADR 0007).
  - name: Invitations
    description: User invitation by email and acceptance (US06, ADR 0011).
  - name: Tenant
    description: Tenant commercial context and corporate domain.
  - name: Meetings
    description: Upload, listing, detail, goal, reprocessing and live analysis.
  - name: Tasks
    description: Listing and updating extracted tasks.
  - name: System
    description: Health check and JWKS.

paths:
  # ----------------------------------------------------------------------------
  # Auth
  # ----------------------------------------------------------------------------
  /auth/signup:
    post:
      tags: [Auth]
      security: []
      summary: Creates account (and tenant) and triggers email verification
      description: |
        Public. Rate-limited by IP (`429 RATE_LIMITED`, header `Retry-After`). Creates the user and
        the associated tenant. In non-production environments the verification token comes back in
        `emailVerificationDevToken` to ease testing.

        The endpoint responds `201` with the same body shape for any email, including one that
        already has an account: since it's public and unauthenticated, it does not confirm who is
        registered. In that case nothing is created and the address owner receives a notice by
        email. `409 EMAIL_ALREADY_TAKEN` remains only on invite acceptance
        (`/iam/invites/{id}/accept`), where the caller already holds a workspace credential.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SignupRequest' }
      responses:
        '201':
          description: Request accepted (email verification pending)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SignupResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/verify-email:
    post:
      tags: [Auth]
      security: []
      summary: Confirms the email using the verification token
      description: Public. Invalid/used/expired token returns `400 TOKEN_INVALID`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VerifyEmailRequest' }
      responses:
        '204': { description: Email verified }
        '400': { $ref: '#/components/responses/BadRequest' }

  /auth/login:
    post:
      tags: [Auth]
      security: []
      summary: Login with email and password
      description: |
        Public. Rate-limited by IP. On success, in addition to the `LoginResponse` body, responds
        with two `Set-Cookie` headers:

        - `nora_access` — short-lived access JWT. `Path=/`, `SameSite=Lax`, `HttpOnly`.
        - `nora_refresh` — long-lived opaque refresh token. `Path=/auth`, `SameSite=Strict`, `HttpOnly`.

        Invalid credentials return `401 INVALID_CREDENTIALS`; unverified email
        `401 EMAIL_NOT_VERIFIED`; deactivated account `403 USER_DISABLED`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Authenticated. Sets cookies `nora_access` and `nora_refresh`.
          headers:
            Set-Cookie:
              description: httpOnly cookies `nora_access` (Path=/) and `nora_refresh` (Path=/auth).
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/refresh:
    post:
      tags: [Auth]
      security: []
      summary: Renews the access token (rotates the refresh)
      description: |
        Reads the refresh token from the `nora_refresh` cookie (Path=/auth); if absent, accepts
        `Authorization: Bearer <refresh>`. Performs rotation: revokes the previous refresh token and
        rewrites both cookies (`nora_access` + `nora_refresh`). The new access token is returned only
        in the cookie; the body carries only metadata. Missing/expired/revoked returns
        `401 REFRESH_TOKEN_INVALID`.
      responses:
        '200':
          description: Tokens renewed. Rewrites cookies `nora_access` and `nora_refresh`.
          headers:
            Set-Cookie:
              description: New httpOnly cookies `nora_access` and `nora_refresh`.
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RefreshResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/logout:
    post:
      tags: [Auth]
      security: []
      summary: Idempotent logout
      description: |
        Revokes the refresh token present in the `nora_refresh` cookie (if any) and clears both
        cookies (`Max-Age=0`). Without a credential it's a no-op (`204`), never `401`.
      responses:
        '204':
          description: Session ended. Clears cookies `nora_access` and `nora_refresh`.
          headers:
            Set-Cookie:
              description: Clearing cookies (`Max-Age=0`).
              schema: { type: string }

  /auth/password/reset/request:
    post:
      tags: [Auth]
      security: []
      summary: Requests a password reset
      description: |
        Public. Rate-limited by email. Always responds `202` with an indistinguishable message so as
        not to leak which emails exist. In non-production environments the token comes back in
        `passwordResetDevToken`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RequestPasswordResetRequest' }
      responses:
        '202':
          description: Accepted (response is indistinguishable whether or not the account exists)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RequestPasswordResetResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /auth/password/reset/confirm:
    post:
      tags: [Auth]
      security: []
      summary: Confirms the password reset with the token
      description: Public. Invalid/used/expired token returns `400 TOKEN_INVALID`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConfirmPasswordResetRequest' }
      responses:
        '204': { description: Password reset }
        '400': { $ref: '#/components/responses/BadRequest' }

  # ----------------------------------------------------------------------------
  # IAM — groups
  # ----------------------------------------------------------------------------
  /iam/groups:
    get:
      tags: [IAM]
      summary: Lists tenant groups
      description: 'IAM action: `iam:group:read`.'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/IamGroup' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [IAM]
      summary: Creates a group
      description: 'IAM action: `iam:group:create`. Duplicate name returns `409 IAM_NAME_TAKEN`.'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateGroupRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IamGroup' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /iam/groups/{id}:
    delete:
      tags: [IAM]
      summary: Deletes a group
      description: 'IAM action: `iam:group:delete`.'
      parameters: [{ $ref: '#/components/parameters/GroupId' }]
      responses:
        '204': { description: Removed }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /iam/groups/{id}/members:
    get:
      tags: [IAM]
      summary: Lists member IDs of the group
      description: 'IAM action: `iam:group:read`.'
      parameters: [{ $ref: '#/components/parameters/GroupId' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { type: string, format: uuid }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /iam/groups/{id}/members/{userId}:
    post:
      tags: [IAM]
      summary: Adds a user to the group
      description: 'IAM action: `iam:group:add-member`.'
      parameters:
        - { $ref: '#/components/parameters/GroupId' }
        - { $ref: '#/components/parameters/UserId' }
      responses:
        '204': { description: Added }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [IAM]
      summary: Removes a user from the group
      description: 'IAM action: `iam:group:remove-member`.'
      parameters:
        - { $ref: '#/components/parameters/GroupId' }
        - { $ref: '#/components/parameters/UserId' }
      responses:
        '204': { description: Removed }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ----------------------------------------------------------------------------
  # IAM — policies
  # ----------------------------------------------------------------------------
  /iam/policies:
    get:
      tags: [IAM]
      summary: Lists tenant policies
      description: 'IAM action: `iam:policy:read`.'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/IamPolicy' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [IAM]
      summary: Creates a policy
      description: |
        IAM action: `iam:policy:create`. `document` is an AWS-style policy document (statements
        with `effect`/`action`/`resource`). An invalid document returns `400`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreatePolicyRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IamPolicy' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /iam/policies/{id}:
    get:
      tags: [IAM]
      summary: Retrieves policy details
      description: 'IAM action: `iam:policy:read`.'
      parameters: [{ $ref: '#/components/parameters/PolicyId' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IamPolicy' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [IAM]
      summary: Updates a policy's document
      description: |
        IAM action: `iam:policy:update`. Replaces the `document` and increments `currentVersion`.
        A missing document returns `400`.
      parameters: [{ $ref: '#/components/parameters/PolicyId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdatePolicyRequest' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IamPolicy' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [IAM]
      summary: Deletes a policy
      description: 'IAM action: `iam:policy:delete`.'
      parameters: [{ $ref: '#/components/parameters/PolicyId' }]
      responses:
        '204': { description: Removed }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ----------------------------------------------------------------------------
  # IAM — attachments
  # ----------------------------------------------------------------------------
  /iam/groups/{groupId}/policies/{policyId}:
    post:
      tags: [IAM]
      summary: Attaches a policy to a group
      description: 'IAM action: `iam:attachment:create`.'
      parameters:
        - { $ref: '#/components/parameters/GroupIdPath' }
        - { $ref: '#/components/parameters/PolicyIdPath' }
      responses:
        '204': { description: Attached }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [IAM]
      summary: Detaches a policy from a group
      description: 'IAM action: `iam:attachment:delete`.'
      parameters:
        - { $ref: '#/components/parameters/GroupIdPath' }
        - { $ref: '#/components/parameters/PolicyIdPath' }
      responses:
        '204': { description: Detached }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /iam/users/{userId}/policies/{policyId}:
    post:
      tags: [IAM]
      summary: Attaches a policy to a user
      description: 'IAM action: `iam:attachment:create`.'
      parameters:
        - { $ref: '#/components/parameters/UserId' }
        - { $ref: '#/components/parameters/PolicyIdPath' }
      responses:
        '204': { description: Attached }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [IAM]
      summary: Detaches a policy from a user
      description: 'IAM action: `iam:attachment:delete`.'
      parameters:
        - { $ref: '#/components/parameters/UserId' }
        - { $ref: '#/components/parameters/PolicyIdPath' }
      responses:
        '204': { description: Detached }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ----------------------------------------------------------------------------
  # IAM — audit
  # ----------------------------------------------------------------------------
  /iam/audit:
    get:
      tags: [IAM]
      summary: Lists IAM audit events
      description: 'IAM action: `iam:audit:read`.'
      parameters:
        - in: query
          name: since
          required: false
          description: Filters events from this point in time onward (ISO-8601).
          schema: { type: string, format: date-time }
        - in: query
          name: limit
          required: false
          schema: { type: integer, default: 50 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AuditEvent' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ----------------------------------------------------------------------------
  # Invitations
  # ----------------------------------------------------------------------------
  /iam/users/invite:
    post:
      tags: [Invitations]
      summary: Invites a user by email
      description: |
        IAM action: `iam:user:invite`. The invite `token` is NEVER returned in the response. An
        email outside the allowed domain returns `422 EMAIL_DOMAIN_NOT_ALLOWED`; a duplicate pending
        invite returns `409 INVITE_DUPLICATE_PENDING`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InviteUserRequest' }
      responses:
        '201':
          description: Invite created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Invitation' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /iam/invites/{token}/accept:
    post:
      tags: [Invitations]
      security: []
      summary: Accepts an invite and creates the account
      description: |
        Public — the URL `token` is the credential. Creates the user, attaches them to the invite's
        groups and authenticates: returns `LoginResponse` and sets the `nora_access` and
        `nora_refresh` cookies (same as login). Non-existent invite `404 INVITE_NOT_FOUND`, already
        accepted `409 INVITE_ALREADY_ACCEPTED`, expired `410 INVITE_EXPIRED`.
      parameters:
        - in: path
          name: token
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AcceptInviteRequest' }
      responses:
        '200':
          description: Account created and authenticated. Sets cookies `nora_access` and `nora_refresh`.
          headers:
            Set-Cookie:
              description: httpOnly cookies `nora_access` and `nora_refresh`.
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '410': { $ref: '#/components/responses/Gone' }

  /iam/invites:
    get:
      tags: [Invitations]
      summary: Lists tenant invites
      description: 'IAM action: `iam:invite:read`. Optional filter by status. Pagination in the MVP is client-side.'
      parameters:
        - in: query
          name: status
          required: false
          schema: { $ref: '#/components/schemas/InvitationStatus' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InviteListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /iam/invites/{id}:
    delete:
      tags: [Invitations]
      summary: Revokes a pending invite
      description: 'IAM action: `iam:invite:revoke`.'
      parameters: [{ $ref: '#/components/parameters/InviteId' }]
      responses:
        '204': { description: Revoked }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ----------------------------------------------------------------------------
  # Tenant — commercial context + domain
  # ----------------------------------------------------------------------------
  /tenant/context:
    get:
      tags: [Tenant]
      summary: Retrieves the tenant's commercial/product context
      description: |
        IAM action: `tenant:context:read`. 1-1 with the tenant from the JWT (no path param). If
        absent, returns `404 TENANT_CONTEXT_NOT_FOUND`.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TenantContext' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Tenant]
      summary: Creates or updates the tenant's commercial/product context
      description: |
        IAM action: `tenant:context:write`. Upserts the context injected into the LLM prompt
        (companyName, valueProposition, products, objectionHandling).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TenantContextInput' }
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TenantContext' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /tenant/domain:
    get:
      tags: [Tenant]
      summary: Retrieves the tenant's allowed email domain
      description: 'IAM action: `tenant:domain:read`.'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TenantDomain' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      tags: [Tenant]
      summary: Updates the tenant's allowed email domain
      description: |
        IAM action: `tenant:domain:write`. `allowedEmailDomain` may be `null` to remove the
        restriction. An invalid domain returns `422 TENANT_DOMAIN_INVALID`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TenantDomainUpdateRequest' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TenantDomainUpdateResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  # ----------------------------------------------------------------------------
  # Meetings
  # ----------------------------------------------------------------------------
  /meetings:
    get:
      tags: [Meetings]
      summary: Lists meetings visible to the user
      description: |
        IAM action: `meeting:read` (tenant-level pre-check + fine-grained per-meeting filtering).
        Pagination based on `page`/`size`; optional filters `search`, `status`, `from`, `to`.
      parameters:
        - in: query
          name: page
          schema: { type: integer, default: 0, minimum: 0 }
        - in: query
          name: size
          schema: { type: integer, default: 20, minimum: 1, maximum: 100 }
        - in: query
          name: search
          description: Text search (title).
          schema: { type: string }
        - in: query
          name: status
          schema: { $ref: '#/components/schemas/ProcessingStatus' }
        - in: query
          name: from
          description: Lower bound for `startedAt` (ISO-8601).
          schema: { type: string, format: date-time }
        - in: query
          name: to
          description: Upper bound for `startedAt` (ISO-8601).
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MeetingsPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Meetings]
      summary: Uploads a meeting (multipart) and queues processing
      description: |
        IAM action: `meeting:upload`. `multipart/form-data` with the `file` part (TXT/VTT/SRT, max
        10MB) and the `metadata` part (JSON string `MeetingUploadMetadata`). Returns `202` while the
        NLP worker processes it asynchronously. A binary file/invalid extension returns `400`;
        exceeding the size limit returns `413 PAYLOAD_TOO_LARGE`.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, metadata]
              properties:
                file:
                  type: string
                  format: binary
                  description: TXT/VTT/SRT transcript (UTF-8, max 10MB).
                metadata:
                  type: string
                  description: Serialized JSON of `MeetingUploadMetadata`.
            encoding:
              metadata:
                contentType: application/json
      responses:
        '202':
          description: Accepted; processing queued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MeetingUploadResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }

  /meetings/{id}:
    get:
      tags: [Meetings]
      summary: Retrieves meeting details with analysis, goal and productivity
      description: |
        IAM action: `meeting:read`. Resolved per tenant (404 if it belongs to another tenant). The
        `analysis`, `goal` and `productivity` fields may come back `null` when not yet available.
      parameters: [{ $ref: '#/components/parameters/MeetingId' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MeetingDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /meetings/{id}/goal:
    put:
      tags: [Meetings]
      summary: Sets or updates the meeting's declared goal
      description: |
        IAM action: `meeting:update` (ADR 0005). If the meeting has already been analyzed, its
        status reverts to `PENDING` for later reprocessing.
      parameters: [{ $ref: '#/components/parameters/MeetingId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MeetingGoalRequest' }
      responses:
        '200':
          description: Goal saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MeetingGoal' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Meetings]
      summary: Removes the meeting's goal (and productivity)
      description: 'IAM action: `meeting:update` (ADR 0005). Idempotent.'
      parameters: [{ $ref: '#/components/parameters/MeetingId' }]
      responses:
        '204': { description: Removed }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /meetings/{id}/reprocess:
    post:
      tags: [Meetings]
      summary: Reprocesses a meeting's analysis
      description: 'IAM action: `meeting:reprocess`. Re-queues processing; returns `202`.'
      parameters: [{ $ref: '#/components/parameters/MeetingId' }]
      responses:
        '202':
          description: Reprocessing queued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MeetingUploadResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /meetings/live-analyze:
    post:
      tags: [Meetings]
      summary: Analyzes a live transcript chunk
      description: |
        IAM action: `meeting:analyze:live`. Receives a transcript chunk (and optionally the
        previous highlights) and returns incremental highlights. If the NLP worker is unavailable,
        returns `502 ANALYSIS_WORKER_UNAVAILABLE`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LiveAnalyzeRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LiveAnalyzeResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '502': { $ref: '#/components/responses/BadGateway' }

  # ----------------------------------------------------------------------------
  # Tasks
  # ----------------------------------------------------------------------------
  /tasks:
    get:
      tags: [Tasks]
      summary: Lists tasks extracted from the tenant's meetings
      description: 'IAM action: `task:read`. Optional filter by `status`.'
      parameters:
        - in: query
          name: status
          schema: { $ref: '#/components/schemas/ActionItemStatus' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskListResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /tasks/{id}:
    patch:
      tags: [Tasks]
      summary: Updates a task's status, title and/or due date
      description: |
        IAM action: `task:write`. At least one of `status`/`title`/`dueDate` must be provided. A
        non-existent task returns `404 TASK_NOT_FOUND`.

        `dueDate` is an ISO date (`yyyy-MM-dd`). Omitting the field leaves the stored value alone;
        sending an empty string clears it — the date comes from the extraction, so it has to be
        removable and not only correctable. A value that does not parse returns
        `400 TASK_INVALID_DUE_DATE`.
      parameters: [{ $ref: '#/components/parameters/TaskId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaskUpdateRequest' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Task' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ----------------------------------------------------------------------------
  # System
  # ----------------------------------------------------------------------------
  /healthz:
    get:
      tags: [System]
      security: []
      summary: Health check
      description: Public. Kept separate from the actuator for a stable response.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [service, status, timestamp]
                properties:
                  service: { type: string, example: nora-api }
                  status: { type: string, example: ok }
                  timestamp: { type: string, format: date-time }

  /.well-known/jwks.json:
    get:
      tags: [System]
      security: []
      summary: JSON Web Key Set (RFC 7517)
      description: |
        Public. Exposes the RSA public key used to validate JWTs. Available ONLY in RS256 mode; in
        HS256 the controller is not registered and the route returns 404.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Jwks' }
        '404': { $ref: '#/components/responses/NotFound' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    cookieAuth:
      type: apiKey
      in: cookie
      name: nora_access
      description: |
        httpOnly cookie set by `POST /auth/login` (and by `POST /iam/invites/{token}/accept`).
        Equivalent to Bearer; the browser resends it automatically. Renewed via `POST /auth/refresh`.

  parameters:
    MeetingId:
      in: path
      name: id
      required: true
      schema: { type: string, format: uuid }
    TaskId:
      in: path
      name: id
      required: true
      schema: { type: string, format: uuid }
    GroupId:
      in: path
      name: id
      required: true
      schema: { type: string, format: uuid }
    PolicyId:
      in: path
      name: id
      required: true
      schema: { type: string, format: uuid }
    InviteId:
      in: path
      name: id
      required: true
      schema: { type: string, format: uuid }
    UserId:
      in: path
      name: userId
      required: true
      schema: { type: string, format: uuid }
    GroupIdPath:
      in: path
      name: groupId
      required: true
      schema: { type: string, format: uuid }
    PolicyIdPath:
      in: path
      name: policyId
      required: true
      schema: { type: string, format: uuid }

  responses:
    BadRequest:
      description: Invalid request (`VALIDATION_FAILED`, `MALFORMED_REQUEST`, `TOKEN_INVALID`, ...)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Not authenticated (`UNAUTHENTICATED`, `INVALID_CREDENTIALS`, `REFRESH_TOKEN_INVALID`, ...)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: No permission (`FORBIDDEN`, `IAM_FORBIDDEN`, `USER_DISABLED`)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: Conflict (`EMAIL_ALREADY_TAKEN`, `IAM_NAME_TAKEN`, `INVITE_ALREADY_ACCEPTED`, ...)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Gone:
      description: Expired resource (`INVITE_EXPIRED`)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    PayloadTooLarge:
      description: Upload exceeds the limit (`PAYLOAD_TOO_LARGE`, `TRANSCRIPT_TOO_LARGE`)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    UnsupportedMediaType:
      description: Unsupported media type (`UNSUPPORTED_MEDIA_TYPE`)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    UnprocessableEntity:
      description: Unprocessable entity (`EMAIL_DOMAIN_NOT_ALLOWED`, `TENANT_DOMAIN_INVALID`)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    RateLimited:
      description: Rate limit exceeded (`RATE_LIMITED`). Header `Retry-After`.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    BadGateway:
      description: Upstream dependency failed (`ANALYSIS_WORKER_UNAVAILABLE`, ...)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    # ---- error ----
    Error:
      type: object
      required: [code, message, traceId, timestamp]
      properties:
        code: { type: string, example: MEETING_NOT_FOUND }
        message: { type: string }
        traceId: { type: string }
        timestamp: { type: string, format: date-time }
        details:
          type: array
          items:
            type: object
            properties:
              field: { type: string }
              issue: { type: string }

    # ---- shared enums ----
    ProcessingStatus:
      type: string
      enum: [PENDING, PROCESSING, COMPLETED, FAILED]
    ActionItemStatus:
      type: string
      enum: [OPEN, IN_PROGRESS, DONE]
    Priority:
      type: string
      enum: [LOW, MEDIUM, HIGH]
    InvitationStatus:
      type: string
      enum: [PENDING, ACCEPTED, EXPIRED, REVOKED]

    # ---- auth ----
    SignupRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, minLength: 10, maxLength: 128 }
        displayName: { type: string, maxLength: 120 }
    SignupResponse:
      type: object
      required: [userId, tenantId, message]
      properties:
        userId: { type: string, format: uuid }
        tenantId: { type: string, format: uuid }
        message: { type: string }
        emailVerificationDevToken:
          type: string
          description: Present only in non-production environments.
    VerifyEmailRequest:
      type: object
      required: [token]
      properties:
        token: { type: string }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, maxLength: 128 }
    LoginResponse:
      type: object
      required: [accessToken, refreshToken, tokenType, expiresInSeconds, userId, tenantId, email, displayName]
      description: |
        Login response body (and invite-acceptance body). Also accompanied by `Set-Cookie` headers
        (`nora_access`, `nora_refresh`). `accessToken`/`refreshToken` in the body exist for legacy
        compatibility; new clients should rely on the httpOnly cookies.
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        tokenType: { type: string, example: Bearer }
        expiresInSeconds: { type: integer, format: int64, description: TTL of the access token in seconds. }
        userId: { type: string, format: uuid }
        tenantId: { type: string, format: uuid }
        email: { type: string, format: email }
        displayName: { type: string }
    RefreshResponse:
      type: object
      required: [tokenType, expiresInSeconds]
      description: |
        The new access token is returned in the `nora_access` cookie; the body carries only metadata
        for the client to schedule the next refresh.
      properties:
        tokenType: { type: string, example: Bearer }
        expiresInSeconds: { type: integer, format: int64 }
    RequestPasswordResetRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email }
    RequestPasswordResetResponse:
      type: object
      required: [message]
      properties:
        message: { type: string }
        passwordResetDevToken:
          type: string
          description: Present only in non-production environments.
    ConfirmPasswordResetRequest:
      type: object
      required: [token, newPassword]
      properties:
        token: { type: string }
        newPassword: { type: string, minLength: 10, maxLength: 128 }

    # ---- IAM ----
    IamGroup:
      type: object
      required: [id, name, createdBy, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: [string, 'null'] }
        createdBy: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CreateGroupRequest:
      type: object
      required: [name]
      properties:
        name: { type: string }
        description: { type: string }
    IamPolicy:
      type: object
      required: [id, name, document, currentVersion, createdBy, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: [string, 'null'] }
        document:
          $ref: '#/components/schemas/PolicyDocument'
        currentVersion: { type: integer }
        createdBy: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CreatePolicyRequest:
      type: object
      required: [name, document]
      properties:
        name: { type: string }
        description: { type: string }
        document: { $ref: '#/components/schemas/PolicyDocument' }
    UpdatePolicyRequest:
      type: object
      required: [document]
      properties:
        document: { $ref: '#/components/schemas/PolicyDocument' }
    PolicyDocument:
      type: object
      description: |
        AWS-style policy document. A list of statements evaluated by `(action, resource)`.
        Accepted/returned as free-form JSON; the canonical shape below is illustrative.
      properties:
        version: { type: string, example: '2025-01-01' }
        statements:
          type: array
          items:
            type: object
            properties:
              effect: { type: string, enum: [ALLOW, DENY] }
              action:
                type: array
                items: { type: string, example: 'meeting:read' }
              resource:
                type: array
                items: { type: string, example: 'nora:tenant/{tenantId}:meeting/*' }
      additionalProperties: true
    AuditEvent:
      type: object
      required: [id, actorUserId, action, createdAt]
      properties:
        id: { type: string, format: uuid }
        actorUserId: { type: string, format: uuid }
        action: { type: string, example: 'iam:policy:create' }
        targetType: { type: [string, 'null'], example: POLICY }
        targetId: { type: [string, 'null'], format: uuid }
        payload:
          type: [object, 'null']
          additionalProperties: true
        createdAt: { type: string, format: date-time }

    # ---- invitations ----
    InviteUserRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        groupIds:
          type: array
          items: { type: string, format: uuid }
        expiresInDays: { type: [integer, 'null'] }
    AcceptInviteRequest:
      type: object
      required: [password]
      properties:
        displayName:
          type: string
          maxLength: 120
          description: Optional; if omitted, uses the local part of the email.
        password: { type: string, minLength: 10, maxLength: 128 }
    Invitation:
      type: object
      required: [id, tenantId, email, status, invitedBy, invitedAt, expiresAt, groupIds]
      description: The invite token is NEVER returned.
      properties:
        id: { type: string, format: uuid }
        tenantId: { type: string, format: uuid }
        email: { type: string, format: email }
        status: { $ref: '#/components/schemas/InvitationStatus' }
        invitedBy: { type: string, format: uuid }
        invitedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        groupIds:
          type: array
          items: { type: string, format: uuid }
        acceptedAt: { type: [string, 'null'], format: date-time }
        acceptedUserId: { type: [string, 'null'], format: uuid }
    InviteListResponse:
      type: object
      required: [items, total, page, size]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Invitation' }
        total: { type: integer }
        page: { type: integer }
        size: { type: integer }

    # ---- tenant context ----
    TenantContextInput:
      type: object
      required: [companyName]
      properties:
        companyName: { type: string, maxLength: 200 }
        industry: { type: string, maxLength: 200 }
        valueProposition: { type: string, maxLength: 2000 }
        idealCustomerProfile: { type: string, maxLength: 2000 }
        products:
          type: array
          items: { $ref: '#/components/schemas/Product' }
        competitors:
          type: array
          items: { type: string, maxLength: 200 }
        objectionHandling:
          type: array
          items: { type: string, maxLength: 500 }
    TenantContext:
      type: object
      required: [tenantId, companyName]
      properties:
        tenantId: { type: string, format: uuid }
        companyName: { type: string }
        industry: { type: [string, 'null'] }
        valueProposition: { type: [string, 'null'] }
        idealCustomerProfile: { type: [string, 'null'] }
        products:
          type: array
          items: { $ref: '#/components/schemas/Product' }
        competitors:
          type: array
          items: { type: string }
        objectionHandling:
          type: array
          items: { type: string }
        updatedAt: { type: string, format: date-time }
    Product:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 200 }
        description: { type: string, maxLength: 1000 }
        keyDifferentiators:
          type: array
          items: { type: string, maxLength: 200 }

    # ---- tenant domain ----
    TenantDomain:
      type: object
      required: [tenantId]
      properties:
        tenantId: { type: string, format: uuid }
        allowedEmailDomain:
          type: [string, 'null']
          description: '`null` when there is no domain restriction.'
    TenantDomainUpdateRequest:
      type: object
      properties:
        allowedEmailDomain:
          type: [string, 'null']
          maxLength: 255
          description: '`null` to remove the restriction.'
    TenantDomainUpdateResponse:
      type: object
      required: [tenantId, updatedAt, updatedBy]
      properties:
        tenantId: { type: string, format: uuid }
        allowedEmailDomain: { type: [string, 'null'] }
        updatedAt: { type: string, format: date-time }
        updatedBy: { type: string, format: uuid }

    # ---- meetings ----
    MeetingUploadMetadata:
      type: object
      required: [title, transcriptFormat]
      properties:
        title: { type: string, maxLength: 200 }
        startedAt: { type: string, format: date-time }
        endedAt: { type: string, format: date-time }
        language: { type: string, example: pt-BR }
        transcriptFormat: { type: string, enum: [TXT, VTT, SRT] }
        participants:
          type: array
          items: { $ref: '#/components/schemas/Participant' }
        tags:
          type: array
          items: { type: string }
        attributes:
          type: object
          additionalProperties: { type: string }
          description: 'Free-form attributes (max 20) used for fine-grained IAM filtering.'
    Participant:
      type: object
      required: [displayName]
      properties:
        displayName: { type: string }
        email: { type: [string, 'null'], format: email }
        isInternal: { type: boolean }
    MeetingUploadResponse:
      type: object
      required: [id, tenantId, title, ownerId, processingStatus, createdAt]
      properties:
        id: { type: string, format: uuid }
        tenantId: { type: string, format: uuid }
        title: { type: string }
        startedAt: { type: [string, 'null'], format: date-time }
        endedAt: { type: [string, 'null'], format: date-time }
        ownerId: { type: string, format: uuid }
        processingStatus: { $ref: '#/components/schemas/ProcessingStatus' }
        createdAt: { type: string, format: date-time }
    MeetingListItem:
      type: object
      required: [id, title, processingStatus, actionItemCount, riskCount, opportunityCount]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        startedAt: { type: [string, 'null'], format: date-time }
        durationSeconds: { type: [integer, 'null'], format: int64 }
        ownerName: { type: [string, 'null'] }
        processingStatus: { $ref: '#/components/schemas/ProcessingStatus' }
        summarySnippet: { type: [string, 'null'] }
        actionItemCount: { type: integer }
        riskCount: { type: integer }
        opportunityCount: { type: integer }
        tags:
          type: array
          items: { type: string }
    MeetingsPage:
      type: object
      required: [items, page, size, totalItems, totalPages]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/MeetingListItem' }
        page: { type: integer }
        size: { type: integer }
        totalItems: { type: integer, format: int64 }
        totalPages: { type: integer }
    MeetingDetail:
      type: object
      required: [id, tenantId, title, processingStatus, createdAt]
      properties:
        id: { type: string, format: uuid }
        tenantId: { type: string, format: uuid }
        title: { type: string }
        startedAt: { type: [string, 'null'], format: date-time }
        endedAt: { type: [string, 'null'], format: date-time }
        durationSeconds: { type: [integer, 'null'], format: int64 }
        language: { type: [string, 'null'] }
        owner:
          type: [object, 'null']
          properties:
            id: { type: string, format: uuid }
            displayName: { type: [string, 'null'] }
        participants:
          type: array
          items: { $ref: '#/components/schemas/Participant' }
        tags:
          type: array
          items: { type: string }
        processingStatus: { $ref: '#/components/schemas/ProcessingStatus' }
        analysis:
          oneOf:
            - { $ref: '#/components/schemas/MeetingAnalysis' }
            - { type: 'null' }
        goal:
          oneOf:
            - { $ref: '#/components/schemas/MeetingGoal' }
            - { type: 'null' }
        productivity:
          oneOf:
            - { $ref: '#/components/schemas/ProductivityAssessment' }
            - { type: 'null' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: [string, 'null'], format: date-time }
    MeetingAnalysis:
      type: object
      required: [id, meetingId, summary, generatedAt]
      properties:
        id: { type: string, format: uuid }
        meetingId: { type: string, format: uuid }
        summary: { type: string }
        sentimentOverall:
          type: string
          enum: [POSITIVE, NEUTRAL, NEGATIVE, MIXED]
        topics:
          type: array
          items: { type: string }
        decisions:
          type: array
          items:
            type: object
            required: [text, confidence]
            properties:
              text: { type: string }
              confidence: { type: number, minimum: 0, maximum: 1 }
        actionItems:
          type: array
          items: { $ref: '#/components/schemas/ActionItem' }
        risks:
          type: array
          items: { $ref: '#/components/schemas/Risk' }
        opportunities:
          type: array
          items: { $ref: '#/components/schemas/Opportunity' }
        metadata:
          type: object
          properties:
            modelVersion: { type: string }
            promptVersion: { type: string }
            tokensInput: { type: integer }
            tokensOutput: { type: integer }
            processingMillis: { type: integer }
            piiRedactionsApplied: { type: integer }
        generatedAt: { type: string, format: date-time }
    ActionItem:
      type: object
      required: [title]
      properties:
        title: { type: string }
        assignee: { type: [string, 'null'] }
        dueDate: { type: [string, 'null'], format: date }
        priority: { $ref: '#/components/schemas/Priority' }
        sourceQuote: { type: [string, 'null'] }
        status: { $ref: '#/components/schemas/ActionItemStatus' }
    Risk:
      type: object
      required: [text, severity]
      properties:
        text: { type: string }
        severity: { $ref: '#/components/schemas/Priority' }
        category:
          type: string
          enum: [COMPETITION, PRICE, CHURN, TIMELINE, TECHNICAL, COMPLIANCE, OTHER]
        sourceQuote: { type: [string, 'null'] }
    Opportunity:
      type: object
      required: [text]
      properties:
        text: { type: string }
        estimatedValue: { $ref: '#/components/schemas/Priority' }
        category:
          type: string
          enum: [UPSELL, CROSS_SELL, REFERRAL, EXPANSION, OTHER]
        sourceQuote: { type: [string, 'null'] }
    MeetingGoalRequest:
      type: object
      required: [purpose, expectedOutcomes]
      properties:
        purpose: { type: string, minLength: 3, maxLength: 500 }
        expectedOutcomes:
          type: array
          minItems: 1
          maxItems: 10
          items: { type: string, minLength: 3, maxLength: 240 }
        projectStateSnapshot: { type: [string, 'null'], maxLength: 2000 }
    MeetingGoal:
      type: object
      required: [id, meetingId, purpose, expectedOutcomes]
      properties:
        id: { type: string, format: uuid }
        meetingId: { type: string, format: uuid }
        purpose: { type: string }
        expectedOutcomes:
          type: array
          items: { type: string }
        projectStateSnapshot: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ProductivityAssessment:
      type: object
      required: [score, band, coverage]
      description: Persisted Productivity Score (ADR 0005).
      properties:
        score: { type: integer, minimum: 0, maximum: 100 }
        band:
          type: string
          enum: [LOW, MEDIUM, HIGH]
        coverage:
          type: array
          items:
            type: object
            required: [expectedOutcome, status]
            properties:
              expectedOutcome: { type: string }
              status:
                type: string
                enum: [ADDRESSED, PARTIAL, MISSED]
              evidence: { type: [string, 'null'] }
        offTopicRatio: { type: [number, 'null'] }
        decisionDensity: { type: [number, 'null'] }
        rationale: { type: [string, 'null'] }
    LiveAnalyzeRequest:
      type: object
      required: [transcriptChunk]
      properties:
        transcriptChunk: { type: string, minLength: 20, maxLength: 500000 }
        previousHighlights:
          oneOf:
            - { $ref: '#/components/schemas/LiveHighlights' }
            - { type: 'null' }
        language: { type: string, example: pt-BR }
    LiveAnalyzeResponse:
      allOf:
        - $ref: '#/components/schemas/LiveHighlights'
        - type: object
          properties:
            metadata:
              type: object
              properties:
                processingMillis: { type: integer }
                tokensInput: { type: integer }
                tokensOutput: { type: integer }
                piiRedactionsApplied: { type: integer }
                modelVersion: { type: string }
    LiveHighlights:
      type: object
      properties:
        decisions:
          type: array
          items: { $ref: '#/components/schemas/LiveHighlightItem' }
        nextSteps:
          type: array
          items: { $ref: '#/components/schemas/LiveHighlightItem' }
        observations:
          type: array
          items: { $ref: '#/components/schemas/LiveHighlightItem' }
        tasks:
          type: array
          items: { $ref: '#/components/schemas/LiveTaskItem' }
    LiveHighlightItem:
      type: object
      properties:
        text: { type: string }
        confidence: { type: [number, 'null'] }
        sourceQuote: { type: [string, 'null'] }
    LiveTaskItem:
      type: object
      properties:
        title: { type: string }
        assignee: { type: [string, 'null'] }
        priority: { type: [string, 'null'] }
        sourceQuote: { type: [string, 'null'] }

    # ---- tasks ----
    Task:
      type: object
      required: [id, title, status, priority]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        assignee: { type: [string, 'null'] }
        dueDate: { type: [string, 'null'], format: date }
        priority: { $ref: '#/components/schemas/Priority' }
        status: { $ref: '#/components/schemas/ActionItemStatus' }
        meetingId: { type: string, format: uuid }
        meetingTitle: { type: [string, 'null'] }
        updatedAt: { type: string, format: date-time }
    TaskListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Task' }
    TaskUpdateRequest:
      type: object
      description: |
        At least one of `status`/`title`/`dueDate` must be provided. An absent `dueDate` leaves the
        stored value alone; an empty string clears it.
      properties:
        status: { $ref: '#/components/schemas/ActionItemStatus' }
        title: { type: string }
        dueDate:
          type: string
          description: ISO date `yyyy-MM-dd`, or an empty string to clear the current value.
          example: '2026-09-01'

    # ---- system ----
    Jwks:
      type: object
      required: [keys]
      properties:
        keys:
          type: array
          items:
            type: object
            properties:
              kty: { type: string, example: RSA }
              use: { type: string, example: sig }
              alg: { type: string, example: RS256 }
              kid: { type: string }
              n: { type: string, description: base64url modulus (no padding). }
              e: { type: string, description: base64url exponent (no padding). }
