version: 2

# Dependabot scans dependencies and opens PRs for security/version updates.
# We keep updates WEEKLY, grouped by ecosystem, to reduce noise —
# critical patches are surfaced in alerts (Security tab) regardless.

updates:
  # Java / Maven (backend)
  - package-ecosystem: maven
    directory: /services/api
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - backend
    groups:
      spring:
        patterns:
          - "org.springframework.*"
          - "org.springframework.boot:*"
      hibernate:
        patterns:
          - "org.hibernate*"
          - "jakarta.persistence*"
    ignore:
      # Spring Boot 4 = Spring Framework 7 + Jakarta EE 11 + Hibernate 7.
      # The stack is on 3.5.16 (services/api/pom.xml). We evaluate manually.
      - dependency-name: org.springframework.boot:spring-boot-starter-parent
        update-types: ["version-update:semver-major"]
      # springdoc-openapi 3.x targets Spring Boot 4 / Spring Framework 7. It COMPILES against
      # Boot 3.5 — which is why this looks like an ordinary bump — and then no application
      # context starts: it pulls Boot 4's org.springframework.boot.webmvc.autoconfigure.error
      # .ErrorMvcAutoConfiguration in alongside Boot 3.5's
      # org.springframework.boot.autoconfigure.web.servlet.error.ErrorMvcAutoConfiguration, and
      # the duplicate `conventionErrorViewResolver` bean definition aborts startup. Measured on
      # PR #387 with `mvn verify`: compile SUCCESS, then 116 errors out of 539 tests, every one
      # of them a failed context load.
      # UNBLOCKER: moving the parent to Spring Boot 4 — the ignore directly above this one.
      # Take both together or neither.
      - dependency-name: org.springdoc:springdoc-openapi-starter-webmvc-ui
        update-types: ["version-update:semver-major"]

  # Python / pip (worker + baseline)
  - package-ecosystem: pip
    directory: /services/nlp-worker
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - worker

  - package-ecosystem: pip
    directory: /packages/nlp-baseline
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - baseline

  # Node / npm (web + admin + desktop)
  - package-ecosystem: npm
    directory: /apps/web
    schedule:
      interval: weekly
      day: tuesday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - web
    ignore:
      # Next 16 is breaking — we evaluate manually
      - dependency-name: next
        update-types: ["version-update:semver-major"]
      # React 19 incompatible with Next 14 (needs Next 15)
      - dependency-name: react
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-major"]
      - dependency-name: react-dom
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react-dom"
        update-types: ["version-update:semver-major"]
      # TypeScript 6 not yet GA stable for the current stack
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # TS-ESLint 8 requires ESLint 9 + flat config migration
      - dependency-name: "@typescript-eslint/eslint-plugin"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@typescript-eslint/parser"
        update-types: ["version-update:semver-major"]
      # ESLint 9/10 requires @typescript-eslint 8 + flat config (ignored above);
      # eslint 10 vs peer @typescript-eslint/parser@7 (eslint ^8) broke the weekly run.
      # A coordinated ESLint 9 flat-config migration is a dedicated issue.
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
      # eslint-config-next 16 requires Next 16 (which we also ignore)
      - dependency-name: eslint-config-next
        update-types: ["version-update:semver-major"]
      # Monaco 0.55 breaking API changes (worker loader)
      - dependency-name: monaco-editor
        versions: [">=0.55.0"]
      # @types/node ahead of the Node 20 LTS we use
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # eslint-config-prettier 10 requires ESLint 9 + flat config
      - dependency-name: eslint-config-prettier
        update-types: ["version-update:semver-major"]
      # tailwind-merge 3 is in sync with tailwindcss 4 (which we ignore)
      - dependency-name: tailwind-merge
        update-types: ["version-update:semver-major"]
      # ...except tailwindcss was NOT actually ignored here — only in /apps/desktop below.
      # The comment above has been referring to an entry that did not exist, which is how
      # PR #392 kept reappearing. Measured on that PR's branch: `npm run build` fails with
      #   It looks like you're trying to use `tailwindcss` directly as a PostCSS plugin.
      #   The PostCSS plugin has moved to a separate package [...] install `@tailwindcss/postcss`
      # Tailwind 4 is a real migration, not a bump: @tailwindcss/postcss, `@import "tailwindcss"`
      # replacing the three `@tailwind` directives in src/app/globals.css, config moving from
      # tailwind.config.ts into `@theme` in CSS, and a changed plugin API — against an editorial
      # design system with hand-written CSS, so it needs a rendered-page comparison and not just
      # a green build. ADR 0013 pins raw Tailwind 3.x.
      # UNBLOCKER: a deliberate migration with before/after page comparison.
      - dependency-name: tailwindcss
        update-types: ["version-update:semver-major"]

  # Operator console (ADR 0023/0025). It had no entry here at all until 2026-08-16, so its
  # dependencies — including `jose`, which is the library that verifies the Cloudflare Access
  # JWT — were the only npm tree in the repository nothing watched for advisories.
  #
  # The ignores below are NOT copied wholesale from /apps/web: they are the majors this
  # package.json is actually pinned away from. apps/admin has no monaco-editor and no
  # tailwind-merge, so the two entries covering those are absent rather than inherited.
  - package-ecosystem: npm
    directory: /apps/admin
    schedule:
      interval: weekly
      day: tuesday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - admin
    ignore:
      # The console pins `next 16.3.0` exactly and apps/web ignores this same major. A Next
      # major is a migration for both Next apps at once, and the operator console is not where
      # it gets rehearsed.
      - dependency-name: next
        update-types: ["version-update:semver-major"]
      # React 19: same shared migration as the entry in /apps/web, which pins react 18.3.1.
      - dependency-name: react
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-major"]
      - dependency-name: react-dom
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react-dom"
        update-types: ["version-update:semver-major"]
      # TypeScript 6 not yet GA stable for this stack (`typescript ^5.6.3` here).
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # The ESLint 9 flat-config knot, identical to /apps/web's: this package.json pins
      # `eslint ^8.57.1` with `@typescript-eslint ^7.18.0`, and TS-ESLint 8 requires ESLint 9.
      # `eslint-config-prettier` 10 and `eslint-config-next` 16 both require ESLint 9 as well,
      # so all five move together or none of them does.
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
      - dependency-name: "@typescript-eslint/eslint-plugin"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@typescript-eslint/parser"
        update-types: ["version-update:semver-major"]
      - dependency-name: eslint-config-prettier
        update-types: ["version-update:semver-major"]
      - dependency-name: eslint-config-next
        update-types: ["version-update:semver-major"]
      # @types/node ahead of the Node LTS the Dockerfile and the CI job use.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # Tailwind 4 is a migration, not a bump (PostCSS plugin moved out, `@theme` in CSS).
      # ADR 0013 pins raw Tailwind 3.x; `tailwindcss ^3.4.13` here.
      - dependency-name: tailwindcss
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /apps/desktop
    schedule:
      interval: weekly
      day: tuesday
    open-pull-requests-limit: 5
    # `labels:` appeared TWICE in this mapping until 2026-08-16 — once here and once after
    # `ignore:` — with identical content. YAML takes the last, so this one was silently dropped;
    # js-yaml in strict mode refuses the whole file over it. Keep exactly one per block.
    labels:
      - dependencies
      - desktop
    ignore:
      # Tailwind 4 breaks PostCSS/config; ADR 0013 pins raw Tailwind 3.x
      - dependency-name: tailwindcss
        update-types: ["version-update:semver-major"]
      # React 19 is a migration shared with the two Next apps, not a per-app bump: all three
      # front-ends pin React 18 and ignore this major together.
      - dependency-name: react
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-major"]
      - dependency-name: react-dom
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react-dom"
        update-types: ["version-update:semver-major"]
      # TWO ENTRIES USED TO SIT HERE and neither did what its comment claimed. Removed on
      # 2026-08-16, recorded so nobody restores them from a changelog reading:
      #   - `react-router-dom` — not a dependency of this app and, as far as package.json goes,
      #     never was. The local UI that would have used it was deleted in PR #465.
      #   - `@vitejs/plugin-react` — the comment read "Vite plugin v6 requires Vite 6 (we are on
      #     Vite 5)". Measured against apps/desktop/package.json: it pins `vite ^8.1.5` and
      #     `@vitejs/plugin-react ^6.0.3`, so BOTH halves of that sentence were false and the
      #     rule was holding back updates past a version already installed. What actually
      #     catches a plugin major that breaks the build is `desktop-rust` in ci.yml, which runs
      #     `npm ci && npm run build` on every PR touching apps/desktop.

  # Rust / Cargo (Tauri backend)
  - package-ecosystem: cargo
    directory: /apps/desktop/src-tauri
    schedule:
      interval: weekly
      day: tuesday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - desktop
    ignore:
      # cpal 0.17 breaks the audio API used by audio_capture.rs
      - dependency-name: cpal
        versions: [">=0.16.0"]

  # GitHub Actions (supply chain)
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: wednesday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - ci
    ignore:
      # upload-artifact v5+ changed merge semantics (PR paths break)
      - dependency-name: actions/upload-artifact
        update-types: ["version-update:semver-major"]
      # tauri-action 1.0.0 changes how `latest.json` is produced, and this repository has no
      # way to exercise that before a real release.
      #
      # What actually matters, checked against both action.yml files rather than inferred from
      # the changelog:
      #   - #1315 — the download URLs written into `latest.json` move to the GitHub URL form.
      #     `latest.json` is what every installed client polls
      #     (`plugins.updater.endpoints` in tauri.conf.json), so a client that cannot fetch the
      #     new URL form stops updating and nothing fails on our side.
      #   - #1277 — the action now rewrites the name and body of an existing release.
      #   - #1189 — an asset's `label` is now used internally to build those download URLs.
      #   - #1194 — macOS `.app.tar.gz`/`.sig` filenames gain the version. Not this matrix,
      #     which is Windows and nothing else.
      # The rest of our `with:` block survives 1.0.0 unrenamed.
      #
      # NOT a reason, and recorded because an earlier version of this comment said it was:
      # #1208 renamed `includeUpdaterJson` to `uploadUpdaterJson`, and `desktop-release.yml`
      # still passes the old name — but BOTH default to 'true' (verified in action.yml at
      # v0.6.2 and v1.0.0), so the removed input is an "unexpected input" warning and
      # `latest.json` is still uploaded. The claim that the updater would go quiet was wrong.
      #
      # UNBLOCKER: a release rehearsal. `desktop-release.yml` has `workflow_dispatch` with a
      # `tag` input, so this needs no throwaway git tag — but two things have to be fixed first
      # or the rehearsal is worse than not running it:
      #   (a) `releaseDraft: false` and `prerelease: false` are hardcoded with no input to
      #       override them, so a dispatch publishes a NON-draft release that GitHub resolves
      #       as "Latest" — hijacking `releases/latest/download/latest.json`, the endpoint the
      #       rehearsal exists to protect;
      #   (b) `actions/checkout` has no `ref:`, so a dispatch builds the selected BRANCH while
      #       `tagName` uses the input — the rehearsal would not test what it claims to.
      # And before any of that: the signing key in `TAURI_SIGNING_PRIVATE_KEY` no longer
      # matches `plugins.updater.pubkey` (key id D899BC42EAD59B16 vs E314FF3F6A268266), so a
      # release today produces bundles no installed client accepts. Fix that first.
      #
      # Closed PR #419 carries the audit, with the correction.
      - dependency-name: tauri-apps/tauri-action
        update-types: ["version-update:semver-major"]
