version: 2

# Dependabot scans dependencies and opens PRs for security/version updates.
# Mantemos updates SEMANALMENTE em grupos por ecosystem para reduzir ruido —
# patches críticos sao surfacados em alerts (Security tab) independente.

updates:
  # Java / Maven (backend)
  - package-ecosystem: maven
    directory: /services/api
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - backend
    groups:
      spring:
        patterns:
          - "org.springframework.*"
          - "org.springframework.boot:*"
      hibernate:
        patterns:
          - "org.hibernate*"
          - "jakarta.persistence*"
    ignore:
      # Spring Boot 4 = Spring Framework 7 + Jakarta EE 11 + Hibernate 7.
      # Stack pina 3.3.5 (ver CLAUDE.md). Avaliamos manualmente.
      - dependency-name: org.springframework.boot:spring-boot-starter-parent
        update-types: ["version-update:semver-major"]

  # Python / pip (worker + baseline)
  - package-ecosystem: pip
    directory: /services/nlp-worker
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - worker

  - package-ecosystem: pip
    directory: /packages/nlp-baseline
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - baseline

  # Node / npm (web + desktop)
  - package-ecosystem: npm
    directory: /apps/web
    schedule:
      interval: weekly
      day: tuesday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - web
    ignore:
      # Next 16 e breaking — avaliamos manualmente
      - dependency-name: next
        update-types: ["version-update:semver-major"]
      # React 19 incompativel com Next 14 (precisa Next 15)
      - dependency-name: react
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-major"]
      - dependency-name: react-dom
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react-dom"
        update-types: ["version-update:semver-major"]
      # TypeScript 6 ainda nao GA stable pro stack atual
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # TS-ESLint 8 requer ESLint 9 + flat config migration
      - dependency-name: "@typescript-eslint/eslint-plugin"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@typescript-eslint/parser"
        update-types: ["version-update:semver-major"]
      # eslint-config-next 16 requer Next 16 (que tambem ignoramos)
      - dependency-name: eslint-config-next
        update-types: ["version-update:semver-major"]
      # Monaco 0.55 breaking API changes (worker loader)
      - dependency-name: monaco-editor
        versions: [">=0.55.0"]
      # @types/node ahead da LTS Node 20 que usamos
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # eslint-config-prettier 10 requer ESLint 9 + flat config
      - dependency-name: eslint-config-prettier
        update-types: ["version-update:semver-major"]
      # tailwind-merge 3 e sync com tailwindcss 4 (que ignoramos)
      - dependency-name: tailwind-merge
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /apps/desktop
    schedule:
      interval: weekly
      day: tuesday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - desktop
    ignore:
      # Tailwind 4 breaks PostCSS/config; ADR 0013 pina Tailwind cru 3.x
      - dependency-name: tailwindcss
        update-types: ["version-update:semver-major"]
      # React 19 + react-router 7 (Remix merge) breaking
      - dependency-name: react
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-major"]
      - dependency-name: react-dom
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: react-router-dom
        update-types: ["version-update:semver-major"]
      # Vite plugin v6 requer Vite 6 (estamos em Vite 5)
      - dependency-name: "@vitejs/plugin-react"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: pip
    directory: /apps/desktop/sidecar
    schedule:
      interval: weekly
      day: tuesday
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - desktop

  # Rust / Cargo (Tauri backend)
  - package-ecosystem: cargo
    directory: /apps/desktop/src-tauri
    schedule:
      interval: weekly
      day: tuesday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - desktop
    ignore:
      # cpal 0.17 quebra API de audio (sidecar Azure Speech depende)
      - dependency-name: cpal
        versions: [">=0.16.0"]

  # GitHub Actions (supply chain)
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: wednesday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - ci
    ignore:
      # upload-artifact v5+ mudou semantica de merge (PR caminhos quebram)
      - dependency-name: actions/upload-artifact
        update-types: ["version-update:semver-major"]
