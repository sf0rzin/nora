name: rls-cutover

# Stage 2 of the RLS enforce cutover (ADR 0026 / ADR 0028): provision the runtime roles.
#
# ============================================================================
# DECISION: THIS WORKFLOW NO LONGER CONNECTS TO ANY DATABASE.
# It VALIDATES R001 on an ephemeral Postgres and EMITS the runbook. What runs against
# the real database is infra/host/scripts/rls-cutover.sh, running ON THE HOST.
# ============================================================================
#
# WHY (not a preference — there is no network path):
#   The previous version did `azure/login`, opened a temporary firewall rule for the
#   runner IP on the Postgres Flexible Server and talked to the public FQDN
#   `nora-pg-dev-wgl3a3.postgres.database.azure.com` (hardcoded on line 40, consumed by
#   three psql invocations). On the host none of that exists: Postgres sits on the `data`
#   bridge (internal: true) and publishes only 127.0.0.1:5432 — the host loopback. There
#   is no firewall to open because there is no port to open.
#
#   The three alternatives for keeping psql on the runner would be reverse tunnel, VPN on
#   the runner or self-hosted runner. All reintroduce exactly what the move to the pull
#   model eliminated in a PUBLIC repo (ADR 0017). The deploy became pull; so does this.
#
#   Between the two proposed options — (a) a workflow that only generates the SQL, (b)
#   drop the workflow and move everything into the script — we chose a HYBRID, because
#   each half pays a different bill:
#     * the SCRIPT on the host (infra/host/scripts/rls-cutover.sh) is the only place
#       with database access, so EXECUTION has to live there;
#     * the WORKFLOW stays useful for what only CI does well: it applies R001 on a
#       throwaway Postgres and PROVES the three roles come out with the right flags
#       BEFORE anyone runs this in production — plus it keeps the auditable record of
#       who asked for the cutover and when, which ADR 0028 requires.
#   Removing the whole workflow would cost both things and save nothing, since it no
#   longer holds any secret at all.
#
# WHAT LEFT THIS FILE:
#   - `azure/login` and `permissions: id-token: write`
#   - the hardcoded Azure FQDN
#   - opening/closing the firewall on the Flexible Server
#   - the Secrets PG_ADMIN_PASSWORD / NORA_APP_PASSWORD / RLS_TELEMETRY_PASSWORD.
#     A workflow that does not connect to a database has no reason to hold a db password.
#     The passwords now live encrypted in infra/host/secrets.env.sops (SOPS + age), and
#     the private key only exists on the host at /etc/nora/age.key. See README-migration.md
#     for the list of what to delete.
#
# THERE ARE THREE ROLES, NOT TWO:
#   1. nora_admin / owner  — DDL + Flyway. Already exists; it is what RUNS R001.
#   2. nora_app            — LOGIN, NOBYPASSRLS. API runtime.
#   3. nora_telemetry      — LOGIN, BYPASSRLS. Operator panel (cross-tenant).
#   Forgetting 3 raises no error: the read falls under RLS and the panel shows ZERO.
#   Silent fail-closed. The `validate-r001` job below fails if any of the three is wrong.
#
# It does NOT turn on enforce (stage 3 = NORA_RLS_ENFORCE=true in the host .env + recreate api).

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type PLAN to generate the cutover plan'
        required: true
        default: ''
      target_db:
        description: 'Target database on the host (default: nora)'
        required: false
        default: 'nora'

# No `id-token: write`: there is no federated login into any cloud anymore.
permissions:
  contents: read

concurrency:
  group: rls-cutover-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-r001:
    name: Valida R001 num Postgres efemero
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Same image as the host compose (pgvector/pgvector:pg16) — validating on a Postgres
    # different from production would be testing another database.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: nora
          POSTGRES_USER: nora_admin
          POSTGRES_PASSWORD: efemero-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nora_admin -d nora"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: nora_admin
      PGDATABASE: nora
      PGPASSWORD: efemero-ci
      R001: services/api/src/main/resources/db/operational/R001__provision_app_roles.sql

    steps:
      - uses: actions/checkout@v6

      - name: Guard — explicit confirmation
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          if [ "$CONFIRM" != "PLAN" ]; then
            echo "::error::Invalid confirmation. Type exactly PLAN."
            exit 1
          fi

      - name: Instala psql client
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client

      # R001 does GRANT on objects the Flyway migrations create (schema nora,
      # nora.current_tenant_id(), users, meetings, meeting_analyses). On an empty database
      # it would fail on a missing object, not on a defect of its own.
      #
      # We create here the MINIMUM that R001 references. This is a validation fixture, not
      # a copy of the schema — if R001 starts touching a new table, this step fails on
      # purpose: that is the signal that the runbook and the fixture have to follow.
      - name: Minimal fixture (objects the R001 references)
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 <<'SQL'
          CREATE SCHEMA IF NOT EXISTS nora;
          CREATE OR REPLACE FUNCTION nora.current_tenant_id() RETURNS uuid
            LANGUAGE sql STABLE AS
            $$ SELECT nullif(current_setting('nora.current_tenant_id', true), '')::uuid $$;
          CREATE TABLE IF NOT EXISTS users            (id uuid PRIMARY KEY DEFAULT gen_random_uuid());
          CREATE TABLE IF NOT EXISTS meetings         (id uuid PRIMARY KEY DEFAULT gen_random_uuid(), tenant_id uuid NOT NULL);
          CREATE TABLE IF NOT EXISTS meeting_analyses (id uuid PRIMARY KEY DEFAULT gen_random_uuid(), tenant_id uuid NOT NULL);
          ALTER TABLE meetings ENABLE ROW LEVEL SECURITY;
          DROP POLICY IF EXISTS meetings_tenant_isolation ON meetings;
          CREATE POLICY meetings_tenant_isolation ON meetings
            USING (tenant_id = nora.current_tenant_id());
          SQL
          echo "Fixture criada."

      - name: Aplica o R001 (idempotente)
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 \
            -v app_password='ci-app-pw' \
            -v telemetry_password='ci-tel-pw' \
            -f "$R001"
          echo "Second apply — idempotency proof:"
          psql -v ON_ERROR_STOP=1 \
            -v app_password='ci-app-pw' \
            -v telemetry_password='ci-tel-pw' \
            -f "$R001"

      - name: Assert — the THREE roles
        run: |
          set -euo pipefail

          echo "== role 1/3: owner (DDL/Flyway) =="
          owner=$(psql -tAc "SELECT pg_get_userbyid(datdba) FROM pg_database WHERE datname=current_database()")
          echo "  owner=$owner"
          [ "$owner" = "nora_admin" ] || { echo "::error::owner inesperado: $owner"; exit 1; }

          echo "== roles 2/3 e 3/3: flags =="
          psql -tA -F'|' -c \
            "SELECT rolname, rolcanlogin, rolbypassrls FROM pg_roles
              WHERE rolname IN ('nora_app','nora_telemetry') ORDER BY rolname"

          ok=$(psql -tAc \
            "SELECT count(*) FROM pg_roles
              WHERE (rolname='nora_app'       AND rolcanlogin AND NOT rolbypassrls)
                 OR (rolname='nora_telemetry' AND rolcanlogin AND     rolbypassrls)")
          if [ "$ok" != "2" ]; then
            echo "::error::Flags erradas (esperado 2 matches, veio $ok)."
            echo "::error::nora_app precisa ser NOBYPASSRLS; nora_telemetry precisa ser BYPASSRLS."
            exit 1
          fi

          echo "== nora_app: NOBYPASSRLS => RLS applies (0 rows under a random tenant, no error) =="
          PGPASSWORD=ci-app-pw psql -U nora_app -tA <<'SQL'
          SELECT 'users_visiveis=' || count(*) FROM users;
          SET nora.current_tenant_id = '00000000-0000-0000-0000-000000000000';
          SELECT 'meetings_do_tenant_random=' || count(*) FROM meetings;
          SQL

          # The old workflow NEVER tested this: it checked nora_telemetry's flags in
          # pg_roles and stopped there. A missing GRANT SELECT on meeting_analyses does
          # not show in pg_roles — it shows as a zeroed operator panel, with no error.
          echo "== nora_telemetry: connects and READS meeting_analyses (the smoke test that was missing) =="
          tel=$(PGPASSWORD=ci-tel-pw psql -U nora_telemetry -tAc "SELECT count(*) FROM meeting_analyses")
          echo "  meeting_analyses visible = $tel"
          case "$tel" in
            ''|*[!0-9]*) echo "::error::nora_telemetry could not read meeting_analyses."; exit 1 ;;
          esac

          echo "OK — the three roles check out."

      - name: Generate the host execution runbook
        env:
          TARGET_DB: ${{ inputs.target_db }}
        run: |
          set -euo pipefail
          mkdir -p out
          db="${TARGET_DB:-nora}"
          cp "$R001" out/
          cat > out/RUNBOOK.md <<EOF
          # RLS cutover — stage 2 (provision the roles)

          Generated by \`rls-cutover.yml\` run \`${GITHUB_RUN_ID}\`, commit \`${GITHUB_SHA}\`.
          The R001 of this commit was applied to an ephemeral Postgres and the THREE roles were
          verified. No real database was touched by this workflow.

          ## Run (on the production host, as the stack operator)

          \`\`\`bash
          cd /opt/nora/infra/host
          git fetch --all && git checkout ${GITHUB_SHA}

          # Secrets: SOPS + age. The private key only exists here, at /etc/nora/age.key.
          # Decrypt to tmpfs — never to disk.
          sops -d secrets.env.sops > /dev/shm/nora.env
          set -a; . /dev/shm/nora.env; set +a

          ./scripts/rls-cutover.sh --dry-run --db ${db}   # check prerequisites
          ./scripts/rls-cutover.sh --yes     --db ${db}   # provision

          shred -u /dev/shm/nora.env
          \`\`\`

          ## The THREE roles

          | # | Role | Flags | Purpose | If missing |
          |---|---|---|---|---|
          | 1 | \`nora_admin\` (owner) | — | DDL + Flyway; runs the R001 | \`ALTER DEFAULT PRIVILEGES\` does not cover future migrations |
          | 2 | \`nora_app\` | LOGIN, **NOBYPASSRLS** | API runtime | the enforce is worthless |
          | 3 | \`nora_telemetry\` | LOGIN, **BYPASSRLS** | operator dashboard | the dashboard silently shows **ZERO** |

          ## Stage 3 — turn the enforce on (SEPARATE, after validating stage 2)

          In the host \`.env\`:

          \`\`\`dotenv
          NORA_RLS_ENFORCE=true
          DATASOURCE_USERNAME=nora_app
          DATASOURCE_PASSWORD=<NORA_APP_PASSWORD>
          NORA_TELEMETRY_DATASOURCE_URL=jdbc:postgresql://postgres:5432/${db}
          NORA_TELEMETRY_DATASOURCE_USERNAME=nora_telemetry
          NORA_TELEMETRY_DATASOURCE_PASSWORD=<NORA_TELEMETRY_PASSWORD>
          SPRING_FLYWAY_USER=nora_admin
          \`\`\`

          Then \`docker compose up -d --wait api\`.

          > The JDBC URL does **not** carry \`?sslmode=require\`: the official image starts with SSL OFF
          > and Hikari fails at boot. The traffic never leaves the \`data\` (internal: true).
          EOF
          echo "runbook generated."

      - name: Upload the plan
        uses: actions/upload-artifact@v4
        with:
          name: rls-cutover-plan-${{ github.run_id }}
          path: out/
          retention-days: 30
          if-no-files-found: error

      - name: Summary
        if: always()
        run: |
          {
            echo "## RLS cutover — validated plan"
            echo ""
            echo "R001 applied **twice** to an ephemeral Postgres (\`pgvector/pgvector:pg16\`,"
            echo "the same image as the host) and the **three** roles verified. No real database touched."
            echo ""
            echo "| # | Role | Expected flags |"
            echo "|---|---|---|"
            echo "| 1 | \`nora_admin\` (owner) | runs the R001; owns the tables |"
            echo "| 2 | \`nora_app\` | LOGIN, NOBYPASSRLS |"
            echo "| 3 | \`nora_telemetry\` | LOGIN, BYPASSRLS |"
            echo ""
            echo "### Run on the host"
            echo ""
            echo '```bash'
            echo "cd /opt/nora/infra/host"
            echo "sops -d secrets.env.sops > /dev/shm/nora.env"
            echo "set -a; . /dev/shm/nora.env; set +a"
            echo "./scripts/rls-cutover.sh --yes"
            echo "shred -u /dev/shm/nora.env"
            echo '```'
            echo ""
            echo "Full step-by-step in the artifact \`rls-cutover-plan-${GITHUB_RUN_ID}\`."
          } >> "$GITHUB_STEP_SUMMARY"
