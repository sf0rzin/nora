name: secrets-seed

# Exports the third-party keys that live in GitHub Secrets to the Proxmox host,
# ENCRYPTED with the host's public age key — without anyone (human or agent)
# having to see the cleartext value along the way.
#
# WHY THIS EXISTS
# ---------------
# The LLM/email/OAuth keys were already in GitHub Secrets since the Azure era. On
# Proxmox they need to get into `secrets.env.sops`, which is generated ON THE HOST by
# `secrets-bootstrap.sh`. Without this workflow there are only two paths, both bad:
# typing the key by hand on the VM (only works with an interactive terminal) or making
# the value pass through a chat/transcript (which is where a secret must not be).
#
# Here the runner is the only place where the value appears in cleartext, and for
# seconds. The artifact that comes out is already encrypted to a private key that only
# exists at /etc/nora/age.key on the VM.
#
# THE ARTIFACT IS PUBLIC — AND THAT IS FINE
# -----------------------------------------
# The repository is public (ADR 0017), so the artifact is downloadable by anyone.
# That is acceptable for the same reason versioning `secrets.env.sops` is: without the
# age private key, the content is noise. `retention-days: 1` narrows the window anyway.
#
# HOW TO USE
# ----------
#   gh workflow run secrets-seed.yml
#   gh run download <run-id> -n nora-llm-keys -D /tmp/seed
#   scp /tmp/seed/llm-keys.age nora@<host>:/dev/shm/
#   # on the VM:
#   sudo age -d -i /etc/nora/age.key -o /dev/shm/llm-keys.env /dev/shm/llm-keys.age
#   cd /opt/nora/infra/proxmox
#   sudo ./scripts/secrets-bootstrap.sh --from-file /dev/shm/llm-keys.env
#   shred -u /dev/shm/llm-keys.env /dev/shm/llm-keys.age
#
# `secrets-bootstrap.sh` preserves what already exists in the `.sops` and only
# adds/updates what comes from `--from-file` — rerunning does not regenerate the
# Postgres passwords.

on:
  workflow_dispatch:
    inputs:
      recipient:
        description: 'Chave age pública de destino. Vazio = lê do infra/proxmox/.sops.yaml.'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  seed:
    name: seed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Resolver destinatário age
        id: rcpt
        env:
          INPUT_RECIPIENT: ${{ inputs.recipient }}
        run: |
          set -euo pipefail
          rcpt="$INPUT_RECIPIENT"
          if [ -z "$rcpt" ]; then
            # Single source of truth: the same recipient SOPS uses on the host.
            rcpt="$(grep -oE 'age1[0-9a-z]{58}' infra/proxmox/.sops.yaml | head -1)"
          fi
          case "$rcpt" in
            age1*) ;;
            *) echo "::error::não achei uma chave age válida (nem no input, nem no .sops.yaml)"; exit 1 ;;
          esac
          # The public one is not a secret — logging it helps check it is the right host.
          echo "destinatário: $rcpt"
          echo "recipient=$rcpt" >> "$GITHUB_OUTPUT"

      - name: Instalar age
        run: sudo apt-get update -qq && sudo apt-get install -y -qq age

      - name: Cifrar as chaves
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          RECIPIENT: ${{ steps.rcpt.outputs.recipient }}
        run: |
          set -euo pipefail
          umask 077
          out=$(mktemp -d)
          plain="$out/llm-keys.env"

          # No `set -x` at any point in this step: the Actions masking covers
          # the log, but it is not worth trusting as the only barrier.
          for k in OPENAI_API_KEY GEMINI_API_KEY DEEPSEEK_API_KEY RESEND_API_KEY \
                   GOOGLE_OAUTH_CLIENT_ID GOOGLE_OAUTH_CLIENT_SECRET; do
            v="${!k:-}"
            # A missing key goes in empty on purpose: the bootstrap treats empty as
            # "do not touch", so an empty line never wipes a good value on the host.
            [ -n "$v" ] || { echo "  $k: ausente nos secrets — pulando"; continue; }
            printf '%s=%s\n' "$k" "$v" >> "$plain"
            echo "  $k: ok (${#v} chars)"
          done

          [ -s "$plain" ] || { echo "::error::nenhuma chave disponível para exportar"; exit 1; }

          age -r "$RECIPIENT" -o "$out/llm-keys.age" "$plain"
          shred -u "$plain"
          echo "artifact=$(stat -c%s "$out/llm-keys.age") bytes"
          mkdir -p dist && mv "$out/llm-keys.age" dist/

      - uses: actions/upload-artifact@v4
        with:
          name: nora-llm-keys
          path: dist/llm-keys.age
          retention-days: 1
          if-no-files-found: error
