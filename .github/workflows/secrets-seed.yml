name: secrets-seed

# Exporta as chaves de terceiros que vivem em GitHub Secrets para o host Proxmox,
# CIFRADAS com a chave age pública do host — sem que ninguém (humano ou agente)
# precise ver o valor em claro no caminho.
#
# POR QUE ISTO EXISTE
# -------------------
# As chaves de LLM/e-mail/OAuth já estavam em GitHub Secrets desde a era Azure. No
# Proxmox elas precisam entrar no `secrets.env.sops`, que é gerado NO HOST pelo
# `secrets-bootstrap.sh`. Sem este workflow só há dois caminhos, e os dois são ruins:
# digitar a chave à mão na VM (só funciona com terminal interativo) ou fazer o valor
# passar por um chat/transcript (que é onde segredo não deve estar).
#
# Aqui o runner é o único lugar onde o valor aparece em claro, e por segundos. O
# artifact que sai já está cifrado para uma chave privada que só existe em
# /etc/nora/age.key na VM.
#
# O ARTIFACT É PÚBLICO — E TUDO BEM
# ---------------------------------
# O repositório é público (ADR 0017), então o artifact é baixável por qualquer um.
# Isso é aceitável pela mesma razão que versionar `secrets.env.sops` é: sem a chave
# privada age, o conteúdo é ruído. `retention-days: 1` reduz a janela mesmo assim.
#
# COMO USAR
# ---------
#   gh workflow run secrets-seed.yml
#   gh run download <run-id> -n nora-llm-keys -D /tmp/seed
#   scp /tmp/seed/llm-keys.age nora@<host>:/dev/shm/
#   # na VM:
#   sudo age -d -i /etc/nora/age.key -o /dev/shm/llm-keys.env /dev/shm/llm-keys.age
#   cd /opt/nora/infra/proxmox
#   sudo ./scripts/secrets-bootstrap.sh --from-file /dev/shm/llm-keys.env
#   shred -u /dev/shm/llm-keys.env /dev/shm/llm-keys.age
#
# O `secrets-bootstrap.sh` preserva o que já existe no `.sops` e só adiciona/atualiza
# o que vier do `--from-file` — rodar de novo não regenera as senhas do Postgres.

on:
  workflow_dispatch:
    inputs:
      recipient:
        description: 'Chave age pública de destino. Vazio = lê do infra/proxmox/.sops.yaml.'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  seed:
    name: seed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Resolver destinatário age
        id: rcpt
        env:
          INPUT_RECIPIENT: ${{ inputs.recipient }}
        run: |
          set -euo pipefail
          rcpt="$INPUT_RECIPIENT"
          if [ -z "$rcpt" ]; then
            # Fonte única de verdade: o mesmo recipient que o SOPS usa no host.
            rcpt="$(grep -oE 'age1[0-9a-z]{58}' infra/proxmox/.sops.yaml | head -1)"
          fi
          case "$rcpt" in
            age1*) ;;
            *) echo "::error::não achei uma chave age válida (nem no input, nem no .sops.yaml)"; exit 1 ;;
          esac
          # A pública não é segredo — logar ajuda a conferir que é o host certo.
          echo "destinatário: $rcpt"
          echo "recipient=$rcpt" >> "$GITHUB_OUTPUT"

      - name: Instalar age
        run: sudo apt-get update -qq && sudo apt-get install -y -qq age

      - name: Cifrar as chaves
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          RECIPIENT: ${{ steps.rcpt.outputs.recipient }}
        run: |
          set -euo pipefail
          umask 077
          out=$(mktemp -d)
          plain="$out/llm-keys.env"

          # Sem `set -x` em nenhum ponto deste step: o mascaramento do Actions cobre
          # o log, mas não vale confiar nele como única barreira.
          for k in OPENAI_API_KEY GEMINI_API_KEY DEEPSEEK_API_KEY RESEND_API_KEY \
                   GOOGLE_OAUTH_CLIENT_ID GOOGLE_OAUTH_CLIENT_SECRET; do
            v="${!k:-}"
            # Chave ausente entra vazia de propósito: o bootstrap trata vazio como
            # "não mexe", então uma linha vazia nunca apaga um valor já bom no host.
            [ -n "$v" ] || { echo "  $k: ausente nos secrets — pulando"; continue; }
            printf '%s=%s\n' "$k" "$v" >> "$plain"
            echo "  $k: ok (${#v} chars)"
          done

          [ -s "$plain" ] || { echo "::error::nenhuma chave disponível para exportar"; exit 1; }

          age -r "$RECIPIENT" -o "$out/llm-keys.age" "$plain"
          shred -u "$plain"
          echo "artifact=$(stat -c%s "$out/llm-keys.age") bytes"
          mkdir -p dist && mv "$out/llm-keys.age" dist/

      - uses: actions/upload-artifact@v4
        with:
          name: nora-llm-keys
          path: dist/llm-keys.age
          retention-days: 1
          if-no-files-found: error
