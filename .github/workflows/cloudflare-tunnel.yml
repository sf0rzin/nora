name: cloudflare-tunnel

# Provisions the nora-admin Cloudflare Tunnel (operator identity v2, ADR 0025).
# Creates the tunnel (remotely-managed), configures the route to Next via the cloudflared
# sidecar (localhost:3002) and points DNS admin.nora.systems at <tunnel-id>.cfargotunnel.com.
# Runs manually (workflow_dispatch). Idempotent — a re-run only reconciles.
#
# Lane split (ADR 0025):
#   - THIS workflow owns the TUNNEL + the DNS of admin.nora.systems (CNAME -> cfargotunnel).
#   - cloudflare-setup.yml (sibling lane) owns the Access App + Policy + IdP.
#   - ⚠️ Do NOT run cloudflare-setup.yml with `admin_hostname` filled in: its DNS step
#     would overwrite the tunnel CNAME. Always run with admin_hostname EMPTY.
#
# Required secrets:
#   - CLOUDFLARE_API_TOKEN  Token scoped to nora.systems. Minimum permissions:
#                             Account: Cloudflare Tunnel  Edit
#                             Zone:    DNS                Edit
#                             Zone:    Zone               Read
#                           (same token as cloudflare-setup.yml, with Tunnel:Edit added)
#
# Output: the Access App AUD (for Variable CF_ACCESS_AUD) comes out in the last step's log.
# The connector token does NOT: this repo is public (ADR 0017) and a run's log is readable
# by any visitor. The step prints the command for the operator to fetch it straight from the
# API and pipe it into `gh secret set`, without the value touching any log.

on:
  workflow_dispatch:
    inputs:
      tunnel_name:
        description: 'Name of the Cloudflare tunnel'
        required: true
        default: 'nora-admin'
      origin_service:
        description: 'Origin served by cloudflared (sidecar -> Next). Port = targetPort of nora-admin.'
        required: true
        default: 'http://localhost:3002'

permissions:
  contents: read

env:
  CF_API: https://api.cloudflare.com/client/v4
  CF_ACCOUNT_ID: 76e6b917a3ef8fcaff2b20ffb2c8afd6
  DOMAIN: nora.systems
  SUBDOMAIN: admin

jobs:
  tunnel:
    name: tunnel
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Verify token is active
        run: |
          set -euo pipefail
          response=$(curl -fsSL -H "Authorization: Bearer $CF_TOKEN" "$CF_API/user/tokens/verify")
          status=$(echo "$response" | jq -r '.result.status // "unknown"')
          if [ "$status" != "active" ]; then
            echo "::error::Token not active (status=$status). Check the CLOUDFLARE_API_TOKEN permissions."
            echo "$response" | jq .
            exit 1
          fi
          echo "Token active."

      - name: Resolve Zone ID
        id: zone
        run: |
          set -euo pipefail
          response=$(curl -fsSL -H "Authorization: Bearer $CF_TOKEN" "$CF_API/zones?name=$DOMAIN")
          zone_id=$(echo "$response" | jq -r '.result[0].id // empty')
          if [ -z "$zone_id" ]; then
            echo "::error::Zone '$DOMAIN' not found in the CF account."
            echo "$response" | jq .
            exit 1
          fi
          echo "zone_id=$zone_id" >> "$GITHUB_OUTPUT"
          echo "Zone $DOMAIN -> $zone_id"

      - name: Ensure tunnel (remotely-managed)
        id: tunnel
        env:
          TUNNEL_NAME: ${{ inputs.tunnel_name }}
        run: |
          set -euo pipefail
          # Looks for an active tunnel by name (not deleted).
          tunnel_id=$(curl -fsSL -H "Authorization: Bearer $CF_TOKEN" \
            "$CF_API/accounts/$CF_ACCOUNT_ID/cfd_tunnel?name=$TUNNEL_NAME&is_deleted=false" \
            | jq -r '.result[0].id // empty')
          if [ -n "$tunnel_id" ]; then
            echo "Tunnel '$TUNNEL_NAME' already exists ($tunnel_id); reusing it."
          else
            echo "Creating tunnel '$TUNNEL_NAME' (config_src=cloudflare)"
            payload=$(jq -nc --arg name "$TUNNEL_NAME" '{name:$name, config_src:"cloudflare"}')
            response=$(curl -fsSL -X POST -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" \
              "$CF_API/accounts/$CF_ACCOUNT_ID/cfd_tunnel" -d "$payload")
            tunnel_id=$(echo "$response" | jq -r '.result.id // empty')
            if [ -z "$tunnel_id" ]; then
              echo "::error::Failed to create the tunnel."
              echo "$response" | jq .
              exit 1
            fi
          fi
          echo "tunnel_id=$tunnel_id" >> "$GITHUB_OUTPUT"
          echo "Tunnel ID: $tunnel_id"

      # ---------------------------------------------------------------------
      # SAFETY LOCK (2026-08-08)
      # ---------------------------------------------------------------------
      # The next step does a PUT on /configurations, and PUT REPLACES the whole ingress
      # with the ONE-hostname topology of the Container Apps era. If pointed at the
      # production tunnel (`nora-prod`, 5 hostnames -> caddy:80), it would erase the other
      # 4 routes and take nora.systems off the air — no error, with `success: true`.
      #
      # This lock reads the CURRENT configuration and aborts if there is more than one real
      # route. For DNS there is no need to go through here: use `cloudflare-dns-cutover.yml`,
      # which does not touch the tunnel.
      - name: Guard — do not overwrite a multi-route tunnel
        env:
          TUNNEL_ID: ${{ steps.tunnel.outputs.tunnel_id }}
        run: |
          set -euo pipefail
          current="$(curl -fsSL -H "Authorization: Bearer $CF_TOKEN" \
            "$CF_API/accounts/$CF_ACCOUNT_ID/cfd_tunnel/$TUNNEL_ID/configurations" || echo '{}')"
          # The catch-all rule (no hostname) does not count: it exists in any config.
          routes="$(echo "$current" | jq '[.result.config.ingress[]? | select(.hostname)] | length')"
          echo "routes with a hostname on this tunnel today: ${routes:-0}"
          if [ "${routes:-0}" -gt 1 ]; then
            echo "$current" | jq -r '.result.config.ingress[]? | select(.hostname) | "  - \(.hostname) -> \(.service)"'
            echo "::error::this tunnel serves ${routes} hostnames. The next step would replace ALL of them with a single one."
            echo "If the intent was to change DNS, use the cloudflare-dns-cutover.yml workflow."
            exit 1
          fi

      - name: Configure tunnel route
        env:
          TUNNEL_ID: ${{ steps.tunnel.outputs.tunnel_id }}
          ORIGIN: ${{ inputs.origin_service }}
        run: |
          set -euo pipefail
          fqdn="$SUBDOMAIN.$DOMAIN"
          # Route: admin.nora.systems -> origin (the cloudflared sidecar serves Next on
          # localhost), with a catch-all 404 for any other hostname.
          payload=$(jq -nc --arg host "$fqdn" --arg svc "$ORIGIN" \
            '{config:{ingress:[{hostname:$host, service:$svc}, {service:"http_status:404"}]}}')
          echo "Configuring route $fqdn -> $ORIGIN"
          curl -fsSL -X PUT -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" \
            "$CF_API/accounts/$CF_ACCOUNT_ID/cfd_tunnel/$TUNNEL_ID/configurations" -d "$payload" \
            | jq '{success, ingress: .result.config.ingress}'

      - name: Upsert DNS CNAME -> cfargotunnel
        env:
          ZONE_ID: ${{ steps.zone.outputs.zone_id }}
          TUNNEL_ID: ${{ steps.tunnel.outputs.tunnel_id }}
        run: |
          set -euo pipefail
          fqdn="$SUBDOMAIN.$DOMAIN"
          target="$TUNNEL_ID.cfargotunnel.com"
          existing=$(curl -fsSL -H "Authorization: Bearer $CF_TOKEN" \
            "$CF_API/zones/$ZONE_ID/dns_records?type=CNAME&name=$fqdn" \
            | jq -r '.result[0].id // empty')
          payload=$(jq -nc --arg name "$SUBDOMAIN" --arg content "$target" \
            '{type:"CNAME", name:$name, content:$content, proxied:true, ttl:1, comment:"NORA admin — Cloudflare Tunnel (ADR 0025)"}')
          if [ -n "$existing" ]; then
            echo "CNAME $fqdn exists ($existing); pointing -> $target"
            curl -fsSL -X PUT -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" \
              "$CF_API/zones/$ZONE_ID/dns_records/$existing" -d "$payload" \
              | jq '{success, name: .result.name, content: .result.content, proxied: .result.proxied}'
          else
            echo "Creating CNAME $fqdn -> $target (proxied)"
            curl -fsSL -X POST -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" \
              "$CF_API/zones/$ZONE_ID/dns_records" -d "$payload" \
              | jq '{success, name: .result.name, content: .result.content, proxied: .result.proxied}'
          fi

      - name: AUD + connector token instructions
        env:
          TUNNEL_ID: ${{ steps.tunnel.outputs.tunnel_id }}
        run: |
          set -euo pipefail
          # The connector token is NOT fetched here, on purpose.
          #
          # It grants the power to register a connector on the production tunnel — whoever
          # holds it starts receiving real traffic from the hostnames in ../../infra/host/cloudflared/config.yml.
          # This repository is PUBLIC (ADR 0017), and a run's log is readable by any
          # visitor. A value obtained at runtime does not enter the Actions automatic masking,
          # which only covers registered Secrets — so printing it here would be publishing it.
          #
          # The path below keeps the value out of any log: the operator fetches it straight
          # from the API and pipes it into `gh secret set`, without going through the terminal
          # or an artifact.

          # The AUD is not a secret: it is the public identifier of the Access App, used only as
          # the expected `audience` in the JWT validation. The repo already keeps it as a Variable,
          # not a Secret.
          aud=$(curl -fsSL -H "Authorization: Bearer $CF_TOKEN" \
            "$CF_API/accounts/$CF_ACCOUNT_ID/access/apps?per_page=100" \
            | jq -r --arg fqdn "$SUBDOMAIN.$DOMAIN" '.result[] | select(.domain==$fqdn) | .aud' | head -1)

          echo "================ MANUAL ACTIONS (PO) ================"
          echo ">>> GitHub Variable CF_ACCESS_AUD ="
          echo "${aud:-<Access App has no AUD yet — run cloudflare-setup.yml first>}"
          echo ""
          echo ">>> GitHub Secret CLOUDFLARE_TUNNEL_TOKEN — run on YOUR machine:"
          echo ""
          echo "    export CF_TOKEN=<the same CLOUDFLARE_API_TOKEN>"
          echo "    curl -fsSL -H \"Authorization: Bearer \$CF_TOKEN\" \\"
          echo "      \"$CF_API/accounts/$CF_ACCOUNT_ID/cfd_tunnel/$TUNNEL_ID/token\" \\"
          echo "      | jq -r .result | gh secret set CLOUDFLARE_TUNNEL_TOKEN --repo ${{ github.repository }}"
          echo ""
          echo "    (the value goes straight from curl into the secret — it never appears in the shell or in history)"
          echo "==================================================="

      - name: Summary
        if: always()
        env:
          TUNNEL_ID: ${{ steps.tunnel.outputs.tunnel_id }}
          ORIGIN: ${{ inputs.origin_service }}
        run: |
          {
            echo "## Cloudflare Tunnel — nora-admin (ADR 0025)"
            echo ""
            echo "| Item | Value |"
            echo "|---|---|"
            echo "| Tunnel ID | \`$TUNNEL_ID\` |"
            echo "| Hostname | \`$SUBDOMAIN.$DOMAIN\` |"
            echo "| Route | \`$ORIGIN\` |"
            echo "| DNS | \`$SUBDOMAIN.$DOMAIN\` → \`$TUNNEL_ID.cfargotunnel.com\` (proxied) |"
            echo ""
            echo "### Next steps"
            echo "1. Take the **AUD** from the log of the \`AUD + connector token instructions\` step and set the **Variable** \`CF_ACCESS_AUD\`."
            echo "2. Set the **Secret** \`CLOUDFLARE_TUNNEL_TOKEN\` with the command printed in that same step — the token never reaches the log, because the repo is public."
            echo "3. Merging the PR → \`deploy-infra.yml\` brings up nora-admin (internal) + the cloudflared sidecar."
            echo "4. **Cloudflare lane:** ensure the Access App + allowlist via \`cloudflare-setup.yml\` **WITHOUT** \`admin_hostname\`."
            echo ""
            echo "> ⚠️ Never run \`cloudflare-setup.yml\` with \`admin_hostname\` filled in — it overwrites the tunnel CNAME."
          } >> "$GITHUB_STEP_SUMMARY"
