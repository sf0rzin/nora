name: deploy-infra

# Deploy do Bicep IaC no Azure via OIDC (sem client secret).
#
# Secrets necessários (já configurados):
#   - AZURE_CLIENT_ID         App registration 'sp-nora-github-deploy'
#   - AZURE_TENANT_ID         Tenant fiap.com.br
#   - AZURE_SUBSCRIPTION_ID   Azure for Students
#   - PG_ADMIN_PASSWORD       gerado random na Subfase 1.7
#   - JWT_SECRET              gerado random na Subfase 1.7
#   - OPENAI_API_KEY          opcional (vazio = worker em modo stub)
#   - DEEPSEEK_API_KEY        opcional (chat multi-provider — troca p/ DeepSeek ao vivo)
#   - GEMINI_API_KEY          opcional (chat/multimodal — Gemini)
#   - RESEND_API_KEY          opcional (vazio = backend cai em LogEmailSender)
#   Control plane (ADR 0022/0023/0024/0025) — só usados quando enablePlatform=true no bicepparam:
#   - PG_PLATFORM_ADMIN_PASSWORD   senha do 2º Postgres (plataforma)
#   - NORA_PLATFORM_INTERNAL_TOKEN token serviço-a-serviço (/internal/platform/**)
#   - NORA_PLATFORM_ADMIN_TOKEN    token do console (/admin/platform/**)
#   - EASYAUTH_CLIENT_ID           inerte (ADR 0025 trocou Entra por Cloudflare); pode ficar vazio
#   - EASYAUTH_CLIENT_SECRET       inerte (idem)
#   - CLOUDFLARE_TUNNEL_TOKEN      connector token do Cloudflare Tunnel (ADR 0025; sai do cloudflare-tunnel.yml)
#
# Variaveis (Variables tab > Environment dev):
#   - NORA_EMAIL_FROM         opcional (default 'NORA <onboarding@resend.dev>')
#   - CF_ACCESS_AUD           AUD tag da Access App admin.nora.systems (Tier 2, ADR 0025; não-secreto)
#
# Service Principal escopado: role Contributor em rg-nora-dev (não na subscription).
# Federated credentials:
#   - github-main-branch     (subject: repo:sys0xFF/nora:ref:refs/heads/main)
#   - github-pull-requests   (subject: repo:sys0xFF/nora:pull_request)
#   - github-environment-dev (subject: repo:sys0xFF/nora:environment:dev)
#       Obrigatorio porque o job `deploy` usa `environment: dev`.
#
# Fluxo:
#   - PR pra main com mudança em infra/bicep/**: roda 'az deployment group what-if' (preview)
#   - Push em main: deploy real
#   - workflow_dispatch: deploy manual

on:
  push:
    branches: [main]
    paths:
      - 'infra/bicep/**'
      - '.github/workflows/deploy-infra.yml'
  pull_request:
    branches: [main]
    paths:
      - 'infra/bicep/**'
      - '.github/workflows/deploy-infra.yml'
  workflow_dispatch:

permissions:
  contents: read

# Previne deploys concorrentes no mesmo RG. Sem isso, dois pushes simultaneos disparam
# duas Container App revisions em paralelo, causando race no rollout.
concurrency:
  group: deploy-infra-${{ github.ref }}
  cancel-in-progress: false

env:
  AZURE_RG: rg-nora-dev

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      can-deploy: ${{ steps.check.outputs.can-deploy }}
    steps:
      - uses: actions/checkout@v6
      - name: Install Bicep
        run: |
          az bicep install
          az bicep version
      - name: Bicep build (lint)
        working-directory: infra/bicep
        run: |
          mkdir -p .out
          az bicep build --file main.bicep --outdir .out
          for f in modules/*.bicep; do
            az bicep build --file "$f" --outdir .out
          done
      - name: Check if can deploy
        id: check
        run: echo "can-deploy=true" >> $GITHUB_OUTPUT

  what-if:
    name: what-if (PR preview)
    if: github.event_name == 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v6

      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Bicep what-if
        env:
          PG_ADMIN_PASSWORD: ${{ secrets.PG_ADMIN_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NORA_EMAIL_FROM: ${{ vars.NORA_EMAIL_FROM }}
          # Control plane (ADR 0022/0023/0024) — usados quando enablePlatform=true.
          PG_PLATFORM_ADMIN_PASSWORD: ${{ secrets.PG_PLATFORM_ADMIN_PASSWORD }}
          NORA_PLATFORM_INTERNAL_TOKEN: ${{ secrets.NORA_PLATFORM_INTERNAL_TOKEN }}
          NORA_PLATFORM_ADMIN_TOKEN: ${{ secrets.NORA_PLATFORM_ADMIN_TOKEN }}
          EASYAUTH_CLIENT_ID: ${{ secrets.EASYAUTH_CLIENT_ID }}
          EASYAUTH_CLIENT_SECRET: ${{ secrets.EASYAUTH_CLIENT_SECRET }}
          # Operator identity v2 (ADR 0025): Cloudflare Tunnel + Access. Token sai do cloudflare-tunnel.yml.
          CLOUDFLARE_TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
          CF_ACCESS_AUD: ${{ vars.CF_ACCESS_AUD }}
        run: |
          az deployment group what-if \
            --resource-group ${{ env.AZURE_RG }} \
            --template-file infra/bicep/main.bicep \
            --parameters infra/bicep/main.dev.bicepparam \
            --result-format FullResourcePayloads | tee what-if.txt

      - name: Post what-if summary
        run: |
          echo "## What-If — preview do deploy" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          head -100 what-if.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  deploy:
    name: deploy (main push)
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: dev   # GitHub environment. Permite adicionar approval rule via UI futuramente.
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Bicep
        id: deploy
        env:
          PG_ADMIN_PASSWORD: ${{ secrets.PG_ADMIN_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NORA_EMAIL_FROM: ${{ vars.NORA_EMAIL_FROM }}
          # Control plane (ADR 0022/0023/0024) — usados quando enablePlatform=true.
          PG_PLATFORM_ADMIN_PASSWORD: ${{ secrets.PG_PLATFORM_ADMIN_PASSWORD }}
          NORA_PLATFORM_INTERNAL_TOKEN: ${{ secrets.NORA_PLATFORM_INTERNAL_TOKEN }}
          NORA_PLATFORM_ADMIN_TOKEN: ${{ secrets.NORA_PLATFORM_ADMIN_TOKEN }}
          EASYAUTH_CLIENT_ID: ${{ secrets.EASYAUTH_CLIENT_ID }}
          EASYAUTH_CLIENT_SECRET: ${{ secrets.EASYAUTH_CLIENT_SECRET }}
          # Operator identity v2 (ADR 0025): Cloudflare Tunnel + Access. Token sai do cloudflare-tunnel.yml.
          CLOUDFLARE_TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
          CF_ACCESS_AUD: ${{ vars.CF_ACCESS_AUD }}
        run: |
          DEPLOY_NAME="deploy-$(date +%Y%m%d-%H%M%S)-${GITHUB_SHA::7}"
          az deployment group create \
            --resource-group ${{ env.AZURE_RG }} \
            --template-file infra/bicep/main.bicep \
            --parameters infra/bicep/main.dev.bicepparam \
            --name "$DEPLOY_NAME"
          az deployment group show \
            --resource-group ${{ env.AZURE_RG }} \
            --name "$DEPLOY_NAME" \
            --query properties.outputs \
            -o json > outputs.json
          cat outputs.json

      - name: Summary
        run: |
          echo "## Deploy outputs" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          WEB_URL=$(jq -r '.webUrl.value' outputs.json)
          API_URL=$(jq -r '.apiUrl.value' outputs.json)
          PG_FQDN=$(jq -r '.postgresFqdn.value' outputs.json)
          KV_URI=$(jq -r '.keyVaultUri.value' outputs.json)
          SEARCH_ENDPOINT=$(jq -r '.searchEndpoint.value' outputs.json)
          echo "| Recurso | Valor |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Web URL | $WEB_URL |" >> $GITHUB_STEP_SUMMARY
          echo "| API URL | $API_URL |" >> $GITHUB_STEP_SUMMARY
          echo "| Postgres FQDN | $PG_FQDN |" >> $GITHUB_STEP_SUMMARY
          echo "| Key Vault URI | $KV_URI |" >> $GITHUB_STEP_SUMMARY
          echo "| Search Endpoint | ${SEARCH_ENDPOINT:-_(off)_} |" >> $GITHUB_STEP_SUMMARY

      - name: Post-deploy health check
        run: |
          API_URL=$(jq -r '.apiUrl.value' outputs.json)
          WEB_URL=$(jq -r '.webUrl.value' outputs.json)
          echo "Aguardando API ficar healthy em $API_URL/actuator/health ..."
          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null "$API_URL/actuator/health"; then
              echo "API healthy apos ${i}x5s"
              break
            fi
            if [ "$i" = "30" ]; then
              echo "::error::API nao ficou healthy em 150s"
              exit 1
            fi
            sleep 5
          done
          echo "Aguardando web ficar healthy em $WEB_URL ..."
          for i in $(seq 1 12); do
            if curl -fsS -o /dev/null "$WEB_URL"; then
              echo "Web healthy apos ${i}x5s"
              break
            fi
            sleep 5
          done

      - name: Upload outputs as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-outputs-${{ github.sha }}
          path: outputs.json
          # Outputs contem JDBC URL, KV URI, App Insights name etc. 7 dias e suficiente
          # pra debug imediato sem manter mapa de infra indefinidamente.
          retention-days: 7
