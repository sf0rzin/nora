name: cloudflare-dns-cutover

# Points NORA's public hostnames at the Proxmox host's Cloudflare Tunnel.
#
# WHY A NEW WORKFLOW AND NOT cloudflare-tunnel.yml
# ------------------------------------------------
# `cloudflare-tunnel.yml` is from the Container Apps era: it CREATES a tunnel and
# OVERWRITES the whole ingress configuration with the old topology (one hostname, origin at
# `localhost:3002`). Running it today would take down the 5 routes of the `nora-prod`
# tunnel. This workflow does DNS only: it does not touch tunnel, ingress, Access, nor
# anything beyond the listed records.
#
# WHAT IT DOES
# ------------
# For each hostname, it ensures a proxied CNAME pointing at
# `<tunnel_id>.cfargotunnel.com`. Previous A/AAAA records (the dead Azure origin)
# are replaced -- a name cannot have A and CNAME at the same time.
#
# Idempotent: if the record is already right, it makes no write call.
#
# SECURITY
# --------
# Runs with `apply: false` by default and only prints the plan. Public DNS is a change
# visible from outside and hard to "not have happened" -- worth seeing the diff first.

on:
  workflow_dispatch:
    inputs:
      tunnel_id:
        description: 'UUID of the target Cloudflare Tunnel'
        required: true
        default: '0aacc478-1eea-4953-bd0f-deb100e6e6cd'
      hostnames:
        description: 'Hostnames (CSV) to point at the tunnel'
        required: true
        default: 'nora.systems,www.nora.systems,api.nora.systems,admin.nora.systems,grafana.nora.systems'
      apply:
        description: 'false = plan only; true = write to DNS'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

env:
  CF_API: https://api.cloudflare.com/client/v4
  DOMAIN: nora.systems

jobs:
  cutover:
    name: cutover
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TUNNEL_ID: ${{ inputs.tunnel_id }}
      HOSTNAMES: ${{ inputs.hostnames }}
      APPLY: ${{ inputs.apply }}
    steps:
      - name: Resolver zone id
        id: zone
        run: |
          set -uo pipefail
          # No `-f`: with it curl exits 22 on any 4xx and swallows the body, which is where
          # Cloudflare says what was missing. CF's error body contains no secret --
          # it carries a code and a message ("Invalid API Token", "Authentication error").
          resp="$(curl -sS -w '\n%{http_code}' -H "Authorization: Bearer $CF_TOKEN" \
                    "$CF_API/zones?name=$DOMAIN")"
          code="$(echo "$resp" | tail -1)"
          body="$(echo "$resp" | sed '$d')"

          if [ "$code" != "200" ]; then
            echo "HTTP $code de GET /zones"
            echo "$body" | jq -c '{success, errors, messages}' 2>/dev/null || echo "$body" | head -c 500
            echo
            echo "::error::CLOUDFLARE_API_TOKEN cannot read the zone $DOMAIN."
            echo "Minimum permissions for this workflow: Zone:Zone:Read + Zone:DNS:Edit em $DOMAIN."
            echo "If the token is account-owned, it does NOT validate at /user/tokens/verify --"
            echo "use /accounts/<account_id>/tokens/verify. A 403 here is a permission problem, not a format one."
            exit 1
          fi

          zid="$(echo "$body" | jq -r '.result[0].id // empty')"
          [ -n "$zid" ] || { echo "::error::the token can read zones, but $DOMAIN is not among them."; exit 1; }
          echo "zone_id=$zid" >> "$GITHUB_OUTPUT"
          echo "zone $DOMAIN = $zid"

      - name: Plan and apply
        env:
          ZONE_ID: ${{ steps.zone.outputs.zone_id }}
        run: |
          set -euo pipefail
          target="${TUNNEL_ID}.cfargotunnel.com"
          echo "target: $target"
          echo "mode: $([ "$APPLY" = true ] && echo 'APPLY (writes)' || echo 'DRY-RUN (plan only)')"
          echo

          api() { curl -fsSL -H "Authorization: Bearer $CF_TOKEN" -H 'Content-Type: application/json' "$@"; }

          changed=0
          IFS=',' read -ra HOSTS <<< "$HOSTNAMES"
          for host in "${HOSTS[@]}"; do
            host="$(echo "$host" | tr -d '[:space:]')"
            [ -n "$host" ] || continue

            # Every record occupying this name. A and CNAME are mutually
            # exclusive, so the old A records must go for the CNAME to come in.
            recs="$(api "$CF_API/zones/$ZONE_ID/dns_records?name=$host&per_page=100")"
            n="$(echo "$recs" | jq '[.result[] | select(.type=="A" or .type=="AAAA" or .type=="CNAME")] | length')"
            already_ok="$(echo "$recs" | jq --arg t "$target" \
              '[.result[] | select(.type=="CNAME" and .content==$t and .proxied==true)] | length')"

            if [ "$already_ok" -ge 1 ] && [ "$n" -eq 1 ]; then
              printf '  %-26s ok (already points at the tunnel)\n' "$host"
              continue
            fi

            current="$(echo "$recs" | jq -r '[.result[] | select(.type=="A" or .type=="AAAA" or .type=="CNAME") | "\(.type):\(.content)"] | join(", ") // "none"')"
            printf '  %-26s %s  ->  CNAME:%s\n' "$host" "${current:-none}" "$target"
            changed=$((changed+1))
            [ "$APPLY" = true ] || continue

            body="$(jq -nc --arg n "$host" --arg c "$target" \
              '{type:"CNAME", name:$n, content:$c, ttl:1, proxied:true}')"

            # Converts the FIRST existing record and removes the rest; if there was
            # none, creates one. Converting instead of delete+create avoids the window
            # with no record.
            first="$(echo "$recs" | jq -r '[.result[] | select(.type=="A" or .type=="AAAA" or .type=="CNAME")][0].id // empty')"
            if [ -n "$first" ]; then
              api -X PUT "$CF_API/zones/$ZONE_ID/dns_records/$first" --data "$body" > /dev/null
              echo "$recs" | jq -r '[.result[] | select(.type=="A" or .type=="AAAA" or .type=="CNAME")][1:][].id' \
                | while read -r extra; do
                    [ -n "$extra" ] || continue
                    api -X DELETE "$CF_API/zones/$ZONE_ID/dns_records/$extra" > /dev/null
                    echo "      removed duplicate record $extra"
                  done
            else
              api -X POST "$CF_API/zones/$ZONE_ID/dns_records" --data "$body" > /dev/null
            fi
            echo "      applied"
          done

          echo
          if [ "$changed" -eq 0 ]; then
            echo "nothing to do — every hostname already points at the tunnel."
          elif [ "$APPLY" = true ]; then
            echo "$changed hostname(s) updated."
          else
            echo "$changed hostname(s) would change. Run again with apply=true to write."
          fi

      - name: HTTP verification
        if: ${{ inputs.apply }}
        run: |
          set -uo pipefail
          echo "Waiting for edge propagation (proxied: usually seconds)..."
          sleep 20
          IFS=',' read -ra HOSTS <<< "$HOSTNAMES"
          for host in "${HOSTS[@]}"; do
            host="$(echo "$host" | tr -d '[:space:]')"
            [ -n "$host" ] || continue
            code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "https://$host/" || echo 000)"
            printf '  %-26s HTTP %s\n' "$host" "$code"
          done
          echo
          echo "Reference: / and /www expect 200, api expects 401 (no session),"
          echo "admin expects the Cloudflare Access login, grafana expects 302 to /login."
