name: cloudflare-setup

# Configura Cloudflare Access pra proteger admin.nora.systems com login obrigatorio
# (allowlist por email). Roda manual via workflow_dispatch; idempotente — re-run apenas
# reconcilia diff (upsert em Access App, Policy, IdP).
#
# Lanes (ADR 0025 — Cloudflare Tunnel + Access):
#   - ESTE workflow e dono do Access App + Policy + IdP em admin.nora.systems.
#   - cloudflare-tunnel.yml (lane irma) e dono do CNAME admin.nora.systems -> cfargotunnel.com.
#   - ⚠️ NUNCA passe `admin_hostname` em produção: sobrescreveria o CNAME do tunel e
#     derrubaria o acesso. Input mantido apenas para back-compat pre-ADR 0025; o step de
#     CNAME tem guard que ABORTA se detectar tunel ativo.
#
# Secrets necessarios:
#   - CLOUDFLARE_API_TOKEN  Token escopado em nora.systems. Permissoes minimas
#                            (caminho critico — DNS + Access App + Policy funcionam):
#                              Account: Access (Apps and Policies) Edit
#                              Account: Access (Service Tokens) Edit
#                              Zone: DNS Edit
#                              Zone: Zone Read
#                            Permissoes opcionais (full automation, inclui IdP):
#                              Account: Access (Organizations, Identity Providers, and Groups) Edit
#                            Sem a permissao opcional, o workflow degrada graciosamente:
#                              - team_domain e construido do input (nao verificado via API)
#                              - OTP IdP nao e criado (adicionar manualmente no painel CF)
#
# Pre-requisito manual (uma vez):
#   - Zero Trust habilitado na conta CF (https://one.dash.cloudflare.com/ -> onboarding,
#     criar team com nome = input team_name). Plano Free serve.
#
# Pos-step manual opcional (Google/GitHub OAuth):
#   - Workflow tenta criar One-Time PIN como IdP fallback (sem OAuth).
#   - Pra Google/GitHub OAuth, ver docs/operations/cloudflare-access.md.

on:
  workflow_dispatch:
    inputs:
      admin_hostname:
        description: 'LEGACY (pre-ADR 0025). DEIXE VAZIO. Workflow aborta se CNAME ja aponta pro Cloudflare Tunnel.'
        required: false
        default: ''
      team_name:
        description: 'Nome do team Zero Trust (vira <name>.cloudflareaccess.com). Apenas leitura — team deve existir.'
        required: true
        default: 'stratfy'
      access_emails:
        description: 'Emails autorizados (CSV, sem espacos extras)'
        required: true
        default: 'axonogenesis@proton.me,gmaciel0204@gmail.com'

permissions:
  contents: read

env:
  CF_API: https://api.cloudflare.com/client/v4
  CF_ACCOUNT_ID: 76e6b917a3ef8fcaff2b20ffb2c8afd6
  DOMAIN: nora.systems
  SUBDOMAIN: admin

jobs:
  setup:
    name: setup
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Verify token is active
        run: |
          set -euo pipefail
          response=$(curl -fsSL -H "Authorization: Bearer $CF_TOKEN" "$CF_API/user/tokens/verify")
          status=$(echo "$response" | jq -r '.result.status // "unknown"')
          if [ "$status" != "active" ]; then
            echo "::error::Token nao ativo (status=$status). Verifica permissoes do CLOUDFLARE_API_TOKEN."
            echo "$response" | jq .
            exit 1
          fi
          echo "Token ativo. Permissoes verificadas pelo proprio scope nas chamadas seguintes."

      - name: Resolve Zone ID
        id: zone
        run: |
          set -euo pipefail
          response=$(curl -fsSL -H "Authorization: Bearer $CF_TOKEN" "$CF_API/zones?name=$DOMAIN")
          zone_id=$(echo "$response" | jq -r '.result[0].id // empty')
          zone_status=$(echo "$response" | jq -r '.result[0].status // empty')
          if [ -z "$zone_id" ]; then
            echo "::error::Zone '$DOMAIN' nao encontrada. Confere que o dominio esta adicionado na conta CF e Active."
            echo "$response" | jq .
            exit 1
          fi
          if [ "$zone_status" != "active" ]; then
            echo "::warning::Zone '$DOMAIN' encontrada mas status=$zone_status (esperado: active). DNS pode ainda nao estar propagado."
          fi
          echo "zone_id=$zone_id" >> "$GITHUB_OUTPUT"
          echo "Zone $DOMAIN -> $zone_id (status=$zone_status)"

      - name: Upsert CNAME admin.nora.systems (LEGACY pre-ADR 0025)
        if: inputs.admin_hostname != ''
        env:
          ZONE_ID: ${{ steps.zone.outputs.zone_id }}
          TARGET: ${{ inputs.admin_hostname }}
        run: |
          set -euo pipefail
          fqdn="$SUBDOMAIN.$DOMAIN"
          # Guard ADR 0025: se o CNAME ja aponta pro Cloudflare Tunnel (*.cfargotunnel.com),
          # ABORTA. Sobrescrever derrubaria o admin (origem deixou de ser publica;
          # o tunel e o unico caminho de entrada).
          existing_content=$(curl -fsSL -H "Authorization: Bearer $CF_TOKEN" \
            "$CF_API/zones/$ZONE_ID/dns_records?type=CNAME&name=$fqdn" \
            | jq -r '.result[0].content // empty')
          if [[ "$existing_content" == *.cfargotunnel.com ]]; then
            echo "::error::ABORT: CNAME $fqdn aponta pro Cloudflare Tunnel ($existing_content)."
            echo "::error::Sobrescrever derrubaria o admin (ADR 0025: origem do nora-admin e internal — so o tunel entra)."
            # Pos-migracao (ADR 0034) o tunel deixou de ser sidecar de Container App e virou
            # o servico `cloudflared` do infra/proxmox/docker-compose.yml. Nao ha mais
            # "ingress public" pra migrar: NENHUM servico da stack publica porta — as unicas
            # portas do compose sao 127.0.0.1 (loopback, debug via ssh -L). O tunel nao e
            # uma opcao de exposicao, e a UNICA. Este input so existe por back-compat.
            echo "::error::Nao ha caminho alternativo: na stack do Proxmox o tunel e o unico ingress"
            echo "::error::(nenhum container publica porta na interface externa). Rode SEM admin_hostname."
            exit 1
          fi
          existing=$(curl -fsSL -H "Authorization: Bearer $CF_TOKEN" \
            "$CF_API/zones/$ZONE_ID/dns_records?type=CNAME&name=$fqdn" \
            | jq -r '.result[0].id // empty')
          payload=$(jq -nc \
            --arg name "$SUBDOMAIN" \
            --arg content "$TARGET" \
            '{type:"CNAME", name:$name, content:$content, proxied:true, ttl:1, comment:"NORA admin console — gated por Cloudflare Access (legacy pre-ADR 0025)"}')
          if [ -n "$existing" ]; then
            echo "CNAME $fqdn existe ($existing) apontando pra $existing_content; atualizando target -> $TARGET"
            curl -fsSL -X PUT -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" \
              "$CF_API/zones/$ZONE_ID/dns_records/$existing" -d "$payload" \
              | jq '{success, name: .result.name, content: .result.content, proxied: .result.proxied}'
          else
            echo "Criando CNAME $fqdn -> $TARGET (proxied)"
            curl -fsSL -X POST -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" \
              "$CF_API/zones/$ZONE_ID/dns_records" -d "$payload" \
              | jq '{success, name: .result.name, content: .result.content, proxied: .result.proxied}'
          fi

      - name: Resolve team domain
        id: team
        run: |
          set -euo pipefail
          # Tenta verificar via API. Se token nao tiver 'Access: Organizations Read',
          # cai no input direto — steps subsequentes (Access App / Policy) validam
          # funcionalmente se o team realmente existe.
          response=$(curl -sSL -H "Authorization: Bearer $CF_TOKEN" \
            "$CF_API/accounts/$CF_ACCOUNT_ID/access/organizations" \
            || echo '{"success":false,"errors":[{"code":-1,"message":"curl falhou"}]}')
          success=$(echo "$response" | jq -r '.success // false')
          team_domain=$(echo "$response" | jq -r '.result.auth_domain // empty')
          if [ "$success" = "true" ] && [ -n "$team_domain" ]; then
            echo "Team verificado via API: $team_domain"
          else
            err_code=$(echo "$response" | jq -r '.errors[0].code // "unknown"')
            err_msg=$(echo "$response" | jq -r '.errors[0].message // "unknown"')
            team_domain="${{ inputs.team_name }}.cloudflareaccess.com"
            echo "::warning::API /access/organizations rejeitou (code=$err_code: $err_msg). Construindo team_domain do input: $team_domain"
            echo "::warning::Pra verificacao via API, adiciona 'Access: Organizations, IdPs, and Groups Read' no token CF."
            echo "::warning::Se o team realmente NAO existir, o step 'Upsert Access Application' vai falhar mais a frente."
          fi
          echo "team_domain=$team_domain" >> "$GITHUB_OUTPUT"

      - name: Upsert Access Application
        id: app
        run: |
          set -euo pipefail
          fqdn="$SUBDOMAIN.$DOMAIN"
          app_id=$(curl -fsSL -H "Authorization: Bearer $CF_TOKEN" \
            "$CF_API/accounts/$CF_ACCOUNT_ID/access/apps?per_page=100" \
            | jq -r --arg fqdn "$fqdn" '.result[] | select(.domain==$fqdn) | .id' | head -1)
          payload=$(jq -nc \
            --arg name "nora-admin" \
            --arg domain "$fqdn" \
            '{name:$name, domain:$domain, type:"self_hosted", session_duration:"24h", auto_redirect_to_identity:false, app_launcher_visible:true}')
          if [ -n "$app_id" ]; then
            echo "Access App $app_id existe pra $fqdn; atualizando."
            curl -fsSL -X PUT -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" \
              "$CF_API/accounts/$CF_ACCOUNT_ID/access/apps/$app_id" -d "$payload" \
              | jq '{success, id: .result.id, domain: .result.domain}'
          else
            echo "Criando Access App pra $fqdn"
            response=$(curl -fsSL -X POST -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" \
              "$CF_API/accounts/$CF_ACCOUNT_ID/access/apps" -d "$payload")
            app_id=$(echo "$response" | jq -r .result.id)
            echo "$response" | jq '{success, id: .result.id, domain: .result.domain}'
          fi
          echo "app_id=$app_id" >> "$GITHUB_OUTPUT"

      - name: Upsert allowlist policy
        env:
          APP_ID: ${{ steps.app.outputs.app_id }}
        run: |
          set -euo pipefail
          emails_json=$(echo "${{ inputs.access_emails }}" \
            | tr ',' '\n' \
            | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' \
            | grep -v '^$' \
            | jq -R . \
            | jq -s 'map({email:{email:.}})')
          echo "Allowlist: $emails_json"
          policy_id=$(curl -fsSL -H "Authorization: Bearer $CF_TOKEN" \
            "$CF_API/accounts/$CF_ACCOUNT_ID/access/apps/$APP_ID/policies" \
            | jq -r '.result[] | select(.name=="operators-allowlist") | .id' | head -1)
          payload=$(jq -nc \
            --argjson incl "$emails_json" \
            '{name:"operators-allowlist", decision:"allow", include:$incl, precedence:1}')
          if [ -n "$policy_id" ]; then
            echo "Policy $policy_id existe; atualizando allowlist."
            curl -fsSL -X PUT -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" \
              "$CF_API/accounts/$CF_ACCOUNT_ID/access/apps/$APP_ID/policies/$policy_id" -d "$payload" \
              | jq '{success, name: .result.name, emails_count: (.result.include | length)}'
          else
            echo "Criando policy operators-allowlist"
            curl -fsSL -X POST -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" \
              "$CF_API/accounts/$CF_ACCOUNT_ID/access/apps/$APP_ID/policies" -d "$payload" \
              | jq '{success, name: .result.name, emails_count: (.result.include | length)}'
          fi

      - name: Ensure One-Time PIN identity provider (fallback login)
        id: otp_idp
        run: |
          set -euo pipefail
          # OTP nao tem config externa — Cloudflare manda codigo pro email do operador.
          # Endpoint precisa de 'Access: Organizations, IdPs, and Groups Edit' no token.
          # Se o token nao tiver, skipa com warning (user adiciona via UI ou expande token).
          response=$(curl -sSL -H "Authorization: Bearer $CF_TOKEN" \
            "$CF_API/accounts/$CF_ACCOUNT_ID/access/identity_providers" \
            || echo '{"success":false,"errors":[{"code":-1,"message":"curl falhou"}]}')
          success=$(echo "$response" | jq -r '.success // false')
          if [ "$success" != "true" ]; then
            err_code=$(echo "$response" | jq -r '.errors[0].code // "unknown"')
            err_msg=$(echo "$response" | jq -r '.errors[0].message // "unknown"')
            echo "::warning::API /access/identity_providers rejeitou (code=$err_code: $err_msg). OTP IdP nao sera criado via workflow."
            echo "::warning::OPCAO A: adiciona 'Access: Organizations, IdPs, and Groups Edit' no token CF e re-roda."
            echo "::warning::OPCAO B: adiciona manualmente em https://one.dash.cloudflare.com/ -> Settings -> Authentication -> Add new -> One-time PIN."
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          existing=$(echo "$response" | jq -r '.result[] | select(.type=="onetimepin") | .id' | head -1)
          if [ -n "$existing" ]; then
            echo "OTP IdP ja configurado ($existing)."
          else
            echo "Criando OTP IdP"
            payload='{"name":"One-Time PIN","type":"onetimepin","config":{}}'
            curl -fsSL -X POST -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" \
              "$CF_API/accounts/$CF_ACCOUNT_ID/access/identity_providers" -d "$payload" \
              | jq '{success, name: .result.name, type: .result.type}'
          fi
          echo "skipped=false" >> "$GITHUB_OUTPUT"

      - name: Summary
        if: always()
        env:
          TEAM_DOMAIN: ${{ steps.team.outputs.team_domain }}
          ZONE_ID: ${{ steps.zone.outputs.zone_id }}
          APP_ID: ${{ steps.app.outputs.app_id }}
          ADMIN_HOSTNAME: ${{ inputs.admin_hostname }}
          ACCESS_EMAILS: ${{ inputs.access_emails }}
          OTP_SKIPPED: ${{ steps.otp_idp.outputs.skipped }}
        run: |
          dns_state="⏳ pendente — re-roda com admin_hostname quando o Container App admin existir"
          if [ -n "$ADMIN_HOSTNAME" ]; then
            dns_state="✅ apontado pra \`$ADMIN_HOSTNAME\`"
          fi
          otp_state="✅ configurado via workflow"
          if [ "$OTP_SKIPPED" = "true" ]; then
            otp_state="⚠️ skipped (token sem permissao — adicionar manualmente, ver abaixo)"
          fi
          {
            echo "## Cloudflare Access — Setup"
            echo ""
            echo "| Item | Valor |"
            echo "|---|---|"
            echo "| Zone | \`$DOMAIN\` (\`$ZONE_ID\`) |"
            echo "| Hostname protegido | \`$SUBDOMAIN.$DOMAIN\` |"
            echo "| Team domain | \`$TEAM_DOMAIN\` |"
            echo "| Access App ID | \`$APP_ID\` |"
            echo "| Allowlist | \`$ACCESS_EMAILS\` |"
            echo "| DNS CNAME | $dns_state |"
            echo "| OTP IdP | $otp_state |"
            echo ""
            if [ "$OTP_SKIPPED" = "true" ]; then
              echo "### ⚠️ Acao manual necessaria: adicionar IdP"
              echo ""
              echo "Sem IdP, ninguem consegue logar. Duas opcoes:"
              echo ""
              echo "**A) Adicionar OTP via UI (mais rapido, 30s)**"
              echo "1. https://one.dash.cloudflare.com/ → Settings → Authentication"
              echo "2. Login methods → Add new → **One-time PIN** → Save"
              echo ""
              echo "**B) Expandir token e re-rodar workflow**"
              echo "1. CF dashboard → My Profile → API Tokens → edita o CLOUDFLARE_API_TOKEN"
              echo "2. Adiciona permissao: **Account → Access: Organizations, Identity Providers, and Groups → Edit**"
              echo "3. Re-roda este workflow"
              echo ""
            else
              echo "### Login ja funcional"
              echo ""
              echo "**One-Time PIN por email** — sem OAuth setup. Quando \`https://$SUBDOMAIN.$DOMAIN\` "
              echo "estiver acessivel, Cloudflare pede email e manda codigo (so emails da allowlist passam)."
              echo ""
            fi
            echo "### Adicionar Google + GitHub OAuth (opcional)"
            echo ""
            echo "Callback URL pros dois providers (vai pedir no console deles):"
            echo ""
            echo '```'
            echo "https://$TEAM_DOMAIN/cdn-cgi/access/callback"
            echo '```'
            echo ""
            echo "Passo-a-passo em [\`docs/operations/cloudflare-access.md\`](../docs/operations/cloudflare-access.md)."
          } >> "$GITHUB_STEP_SUMMARY"
