name: cloudflare-setup

# Configures Cloudflare Access to protect admin.nora.systems with mandatory login
# (allowlist by email). Runs manually via workflow_dispatch; idempotent — a re-run only
# reconciles the diff (upsert on Access App, Policy, IdP).
#
# Lanes (ADR 0025 — Cloudflare Tunnel + Access):
#   - THIS workflow owns the Access App + Policy + IdP on admin.nora.systems.
#   - cloudflare-tunnel.yml (sibling lane) owns the CNAME admin.nora.systems -> cfargotunnel.com.
#   - ⚠️ NEVER pass `admin_hostname` in production: it would overwrite the tunnel CNAME and
#     take down access. The input is kept only for pre-ADR 0025 back-compat; the CNAME
#     step has a guard that ABORTS if it detects an active tunnel.
#
# Required secrets:
#   - CLOUDFLARE_API_TOKEN  Token scoped to nora.systems. Minimum permissions
#                            (critical path — DNS + Access App + Policy work):
#                              Account: Access (Apps and Policies) Edit
#                              Account: Access (Service Tokens) Edit
#                              Zone: DNS Edit
#                              Zone: Zone Read
#                            Optional permissions (full automation, includes IdP):
#                              Account: Access (Organizations, Identity Providers, and Groups) Edit
#                            Without the optional permission, the workflow degrades gracefully:
#                              - team_domain is built from the input (not verified via API)
#                              - the OTP IdP is not created (add it manually in the CF panel)
#
# Manual prerequisite (once):
#   - Zero Trust enabled on the CF account (https://one.dash.cloudflare.com/ -> onboarding,
#     create a team with name = input team_name). The Free plan works.
#
# Optional manual post-step (Google/GitHub OAuth):
#   - The workflow tries to create One-Time PIN as a fallback IdP (no OAuth).
#   - For Google/GitHub OAuth, see docs/operations/cloudflare-access.md.

on:
  workflow_dispatch:
    inputs:
      admin_hostname:
        description: 'LEGACY (pre-ADR 0025). LEAVE EMPTY. The workflow aborts if the CNAME already points at the Cloudflare Tunnel.'
        required: false
        default: ''
      team_name:
        description: 'Zero Trust team name (becomes <name>.cloudflareaccess.com). Read only — the team must already exist.'
        required: true
        default: 'stratfy'
      access_emails:
        description: 'Authorized e-mails (CSV, no extra spaces)'
        required: true
        default: 'axonogenesis@proton.me,gmaciel0204@gmail.com'

permissions:
  contents: read

env:
  CF_API: https://api.cloudflare.com/client/v4
  CF_ACCOUNT_ID: 76e6b917a3ef8fcaff2b20ffb2c8afd6
  DOMAIN: nora.systems
  SUBDOMAIN: admin

jobs:
  setup:
    name: setup
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Verify token is active
        run: |
          set -euo pipefail
          response=$(curl -fsSL -H "Authorization: Bearer $CF_TOKEN" "$CF_API/user/tokens/verify")
          status=$(echo "$response" | jq -r '.result.status // "unknown"')
          if [ "$status" != "active" ]; then
            echo "::error::Token not active (status=$status). Check the CLOUDFLARE_API_TOKEN permissions."
            echo "$response" | jq .
            exit 1
          fi
          echo "Token active. Permissions are verified by the scope of the calls that follow."

      - name: Resolve Zone ID
        id: zone
        run: |
          set -euo pipefail
          response=$(curl -fsSL -H "Authorization: Bearer $CF_TOKEN" "$CF_API/zones?name=$DOMAIN")
          zone_id=$(echo "$response" | jq -r '.result[0].id // empty')
          zone_status=$(echo "$response" | jq -r '.result[0].status // empty')
          if [ -z "$zone_id" ]; then
            echo "::error::Zone '$DOMAIN' not found. Check that the domain is added to the CF account and Active."
            echo "$response" | jq .
            exit 1
          fi
          if [ "$zone_status" != "active" ]; then
            echo "::warning::Zone '$DOMAIN' found but status=$zone_status (expected: active). DNS may not have propagated yet."
          fi
          echo "zone_id=$zone_id" >> "$GITHUB_OUTPUT"
          echo "Zone $DOMAIN -> $zone_id (status=$zone_status)"

      - name: Upsert CNAME admin.nora.systems (LEGACY pre-ADR 0025)
        if: inputs.admin_hostname != ''
        env:
          ZONE_ID: ${{ steps.zone.outputs.zone_id }}
          TARGET: ${{ inputs.admin_hostname }}
        run: |
          set -euo pipefail
          fqdn="$SUBDOMAIN.$DOMAIN"
          # ADR 0025 guard: if the CNAME already points at the Cloudflare Tunnel
          # (*.cfargotunnel.com), ABORT. Overwriting would take down the admin (the origin
          # stopped being public; the tunnel is the only way in).
          existing_content=$(curl -fsSL -H "Authorization: Bearer $CF_TOKEN" \
            "$CF_API/zones/$ZONE_ID/dns_records?type=CNAME&name=$fqdn" \
            | jq -r '.result[0].content // empty')
          if [[ "$existing_content" == *.cfargotunnel.com ]]; then
            echo "::error::ABORT: CNAME $fqdn points at the Cloudflare Tunnel ($existing_content)."
            echo "::error::Overwriting would take the admin down (ADR 0025: the nora-admin origin is internal — only the tunnel gets in)."
            # Post-migration (ADR 0034) the tunnel stopped being a Container App sidecar and
            # became the `cloudflared` service of infra/proxmox/docker-compose.yml. There is
            # no "public ingress" left to migrate: NO service in the stack publishes a port —
            # the only ports in the compose are 127.0.0.1 (loopback, debug via ssh -L). The
            # tunnel is not an exposure option, it is the ONLY one. This input exists purely
            # for back-compat.
            echo "::error::There is no alternative path: on the Proxmox stack the tunnel is the only ingress"
            echo "::error::(no container publishes a port on the external interface). Run WITHOUT admin_hostname."
            exit 1
          fi
          existing=$(curl -fsSL -H "Authorization: Bearer $CF_TOKEN" \
            "$CF_API/zones/$ZONE_ID/dns_records?type=CNAME&name=$fqdn" \
            | jq -r '.result[0].id // empty')
          payload=$(jq -nc \
            --arg name "$SUBDOMAIN" \
            --arg content "$TARGET" \
            '{type:"CNAME", name:$name, content:$content, proxied:true, ttl:1, comment:"NORA admin console — gated por Cloudflare Access (legacy pre-ADR 0025)"}')
          if [ -n "$existing" ]; then
            echo "CNAME $fqdn exists ($existing) pointing at $existing_content; updating target -> $TARGET"
            curl -fsSL -X PUT -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" \
              "$CF_API/zones/$ZONE_ID/dns_records/$existing" -d "$payload" \
              | jq '{success, name: .result.name, content: .result.content, proxied: .result.proxied}'
          else
            echo "Creating CNAME $fqdn -> $TARGET (proxied)"
            curl -fsSL -X POST -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" \
              "$CF_API/zones/$ZONE_ID/dns_records" -d "$payload" \
              | jq '{success, name: .result.name, content: .result.content, proxied: .result.proxied}'
          fi

      - name: Resolve team domain
        id: team
        env:
          # Via env, never interpolated directly into the script: `${{ }}` is expanded by the
          # template engine BEFORE the shell exists, so an input with quotes/`;`/`$(...)`
          # would become a command executed with the job's CF_TOKEN in scope. Same pattern
          # as the "Upsert CNAME" step above.
          TEAM_NAME: ${{ inputs.team_name }}
        run: |
          set -euo pipefail
          # Tries to verify via API. If the token lacks 'Access: Organizations Read',
          # falls back to the raw input — subsequent steps (Access App / Policy) validate
          # functionally whether the team really exists.
          response=$(curl -sSL -H "Authorization: Bearer $CF_TOKEN" \
            "$CF_API/accounts/$CF_ACCOUNT_ID/access/organizations" \
            || echo '{"success":false,"errors":[{"code":-1,"message":"curl falhou"}]}')
          success=$(echo "$response" | jq -r '.success // false')
          team_domain=$(echo "$response" | jq -r '.result.auth_domain // empty')
          if [ "$success" = "true" ] && [ -n "$team_domain" ]; then
            echo "Team verificado via API: $team_domain"
          else
            err_code=$(echo "$response" | jq -r '.errors[0].code // "unknown"')
            err_msg=$(echo "$response" | jq -r '.errors[0].message // "unknown"')
            team_domain="${TEAM_NAME}.cloudflareaccess.com"
            echo "::warning::API /access/organizations rejeitou (code=$err_code: $err_msg). Construindo team_domain do input: $team_domain"
            echo "::warning::For API verification, add 'Access: Organizations, IdPs, and Groups Read' to the CF token."
            echo "::warning::If the team really does NOT exist, the 'Upsert Access Application' step will fail further ahead."
          fi
          echo "team_domain=$team_domain" >> "$GITHUB_OUTPUT"

      - name: Upsert Access Application
        id: app
        run: |
          set -euo pipefail
          fqdn="$SUBDOMAIN.$DOMAIN"
          app_id=$(curl -fsSL -H "Authorization: Bearer $CF_TOKEN" \
            "$CF_API/accounts/$CF_ACCOUNT_ID/access/apps?per_page=100" \
            | jq -r --arg fqdn "$fqdn" '.result[] | select(.domain==$fqdn) | .id' | head -1)
          payload=$(jq -nc \
            --arg name "nora-admin" \
            --arg domain "$fqdn" \
            '{name:$name, domain:$domain, type:"self_hosted", session_duration:"24h", auto_redirect_to_identity:false, app_launcher_visible:true}')
          if [ -n "$app_id" ]; then
            echo "Access App $app_id exists for $fqdn; updating."
            curl -fsSL -X PUT -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" \
              "$CF_API/accounts/$CF_ACCOUNT_ID/access/apps/$app_id" -d "$payload" \
              | jq '{success, id: .result.id, domain: .result.domain}'
          else
            echo "Creating Access App for $fqdn"
            response=$(curl -fsSL -X POST -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" \
              "$CF_API/accounts/$CF_ACCOUNT_ID/access/apps" -d "$payload")
            app_id=$(echo "$response" | jq -r .result.id)
            echo "$response" | jq '{success, id: .result.id, domain: .result.domain}'
          fi
          echo "app_id=$app_id" >> "$GITHUB_OUTPUT"

      - name: Upsert allowlist policy
        env:
          APP_ID: ${{ steps.app.outputs.app_id }}
          # See the note on the "Resolve team domain" step: input never goes straight into the script.
          ACCESS_EMAILS: ${{ inputs.access_emails }}
        run: |
          set -euo pipefail
          emails_json=$(printf '%s\n' "$ACCESS_EMAILS" \
            | tr ',' '\n' \
            | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' \
            | grep -v '^$' \
            | jq -R . \
            | jq -s 'map({email:{email:.}})')
          echo "Allowlist: $emails_json"
          policy_id=$(curl -fsSL -H "Authorization: Bearer $CF_TOKEN" \
            "$CF_API/accounts/$CF_ACCOUNT_ID/access/apps/$APP_ID/policies" \
            | jq -r '.result[] | select(.name=="operators-allowlist") | .id' | head -1)
          payload=$(jq -nc \
            --argjson incl "$emails_json" \
            '{name:"operators-allowlist", decision:"allow", include:$incl, precedence:1}')
          if [ -n "$policy_id" ]; then
            echo "Policy $policy_id exists; updating the allowlist."
            curl -fsSL -X PUT -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" \
              "$CF_API/accounts/$CF_ACCOUNT_ID/access/apps/$APP_ID/policies/$policy_id" -d "$payload" \
              | jq '{success, name: .result.name, emails_count: (.result.include | length)}'
          else
            echo "Creating the operators-allowlist policy"
            curl -fsSL -X POST -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" \
              "$CF_API/accounts/$CF_ACCOUNT_ID/access/apps/$APP_ID/policies" -d "$payload" \
              | jq '{success, name: .result.name, emails_count: (.result.include | length)}'
          fi

      - name: Ensure One-Time PIN identity provider (fallback login)
        id: otp_idp
        run: |
          set -euo pipefail
          # OTP has no external config — Cloudflare sends a code to the operator's email.
          # The endpoint needs 'Access: Organizations, IdPs, and Groups Edit' on the token.
          # If the token lacks it, skip with a warning (user adds it via UI or widens the token).
          response=$(curl -sSL -H "Authorization: Bearer $CF_TOKEN" \
            "$CF_API/accounts/$CF_ACCOUNT_ID/access/identity_providers" \
            || echo '{"success":false,"errors":[{"code":-1,"message":"curl falhou"}]}')
          success=$(echo "$response" | jq -r '.success // false')
          if [ "$success" != "true" ]; then
            err_code=$(echo "$response" | jq -r '.errors[0].code // "unknown"')
            err_msg=$(echo "$response" | jq -r '.errors[0].message // "unknown"')
            echo "::warning::API /access/identity_providers rejected the call (code=$err_code: $err_msg). The OTP IdP will not be created by the workflow."
            echo "::warning::OPTION A: add 'Access: Organizations, IdPs, and Groups Edit' to the CF token and re-run."
            echo "::warning::OPTION B: add it manually at https://one.dash.cloudflare.com/ -> Settings -> Authentication -> Add new -> One-time PIN."
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          existing=$(echo "$response" | jq -r '.result[] | select(.type=="onetimepin") | .id' | head -1)
          if [ -n "$existing" ]; then
            echo "OTP IdP already configured ($existing)."
          else
            echo "Creating the OTP IdP"
            payload='{"name":"One-Time PIN","type":"onetimepin","config":{}}'
            curl -fsSL -X POST -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" \
              "$CF_API/accounts/$CF_ACCOUNT_ID/access/identity_providers" -d "$payload" \
              | jq '{success, name: .result.name, type: .result.type}'
          fi
          echo "skipped=false" >> "$GITHUB_OUTPUT"

      - name: Summary
        if: always()
        env:
          TEAM_DOMAIN: ${{ steps.team.outputs.team_domain }}
          ZONE_ID: ${{ steps.zone.outputs.zone_id }}
          APP_ID: ${{ steps.app.outputs.app_id }}
          ADMIN_HOSTNAME: ${{ inputs.admin_hostname }}
          ACCESS_EMAILS: ${{ inputs.access_emails }}
          OTP_SKIPPED: ${{ steps.otp_idp.outputs.skipped }}
        run: |
          dns_state="⏳ pending — re-run with admin_hostname once the admin Container App exists"
          if [ -n "$ADMIN_HOSTNAME" ]; then
            dns_state="✅ pointing at \`$ADMIN_HOSTNAME\`"
          fi
          otp_state="✅ configurado via workflow"
          if [ "$OTP_SKIPPED" = "true" ]; then
            otp_state="⚠️ skipped (token lacks the permission — add it manually, see below)"
          fi
          {
            echo "## Cloudflare Access — Setup"
            echo ""
            echo "| Item | Valor |"
            echo "|---|---|"
            echo "| Zone | \`$DOMAIN\` (\`$ZONE_ID\`) |"
            echo "| Hostname protegido | \`$SUBDOMAIN.$DOMAIN\` |"
            echo "| Team domain | \`$TEAM_DOMAIN\` |"
            echo "| Access App ID | \`$APP_ID\` |"
            echo "| Allowlist | \`$ACCESS_EMAILS\` |"
            echo "| DNS CNAME | $dns_state |"
            echo "| OTP IdP | $otp_state |"
            echo ""
            if [ "$OTP_SKIPPED" = "true" ]; then
              echo "### ⚠️ Manual action required: add an IdP"
              echo ""
              echo "Without an IdP nobody can log in. Two options:"
              echo ""
              echo "**A) Add OTP via the UI (faster, 30s)**"
              echo "1. https://one.dash.cloudflare.com/ → Settings → Authentication"
              echo "2. Login methods → Add new → **One-time PIN** → Save"
              echo ""
              echo "**B) Widen the token and re-run the workflow**"
              echo "1. CF dashboard → My Profile → API Tokens → edit CLOUDFLARE_API_TOKEN"
              echo "2. Add the permission: **Account → Access: Organizations, Identity Providers, and Groups → Edit**"
              echo "3. Re-run this workflow"
              echo ""
            else
              echo "### Login already working"
              echo ""
              echo "**One-Time PIN by e-mail** — no OAuth setup. Once \`https://$SUBDOMAIN.$DOMAIN\` "
              echo "is reachable, Cloudflare asks for an e-mail and sends a code (only allowlisted e-mails get through)."
              echo ""
            fi
            echo "### Add Google + GitHub OAuth (optional)"
            echo ""
            echo "Callback URL for both providers (their consoles will ask for it):"
            echo ""
            echo '```'
            echo "https://$TEAM_DOMAIN/cdn-cgi/access/callback"
            echo '```'
            echo ""
            echo "Step by step in [\`docs/operations/cloudflare-access.md\`](../docs/operations/cloudflare-access.md)."
          } >> "$GITHUB_STEP_SUMMARY"
