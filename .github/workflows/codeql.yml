name: codeql

# Análise estática de segurança (CodeQL) — cobre as 3 linguagens do monorepo.
# Grátis em repo privado. Resultados aparecem em Security > Code scanning alerts.
#
# Triggers: push/PR em main (só quando código relevante muda) + varredura semanal
# (pega CVEs novas em queries que evoluem sem o código mudar).

on:
  push:
    branches: [main]
    paths:
      - 'services/api/**'
      - 'services/nlp-worker/**'
      - 'packages/**'
      - 'apps/web/**'
      - 'apps/admin/**'
      - '.github/workflows/codeql.yml'
  pull_request:
    branches: [main]
    paths:
      - 'services/api/**'
      - 'services/nlp-worker/**'
      - 'packages/**'
      - 'apps/web/**'
      - 'apps/admin/**'
  schedule:
    - cron: '21 3 * * 1' # segunda 03:21 UTC

permissions:
  contents: read

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: java-kotlin
            build-mode: none
          - language: python
            build-mode: none
          - language: javascript-typescript
            build-mode: none
    steps:
      - uses: actions/checkout@v6

      - name: Inicializa CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended

      - name: Análise
        uses: github/codeql-action/analyze@v3
        with:
          category: '/language:${{ matrix.language }}'
