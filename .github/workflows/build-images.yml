name: build-images

# Builda + pusha imagens Docker pra GHCR E deploya os serviços mudados nos Container Apps.
#
# Triggers:
#   - push em main: rebuild + deploy só dos serviços que mudaram (path filter)
#   - workflow_dispatch: rebuild + deploy todos manualmente
#
# Imagens publicadas:
#   - ghcr.io/sys0xff/nora-{api,worker,web,admin}:{latest, sha-XXXXXXX}
#
# ROLLOUT (job deploy-apps): cada serviço mudado é deployado no Container App na tag
# IMUTÁVEL :sha-<short> via `az containerapp update` (OIDC). Isso fecha o gap em que
# merges de código só faziam push da imagem mas nunca chegavam em prod — o deploy-infra
# só dispara em mudanças de infra/bicep/**, e re-deployar :latest não muda o template
# (sem revisão nova). Trocar pra uma tag :sha nova SEMPRE força revisão nova. Divisão de
# responsabilidade: build-images = imagem dos apps; deploy-infra = infra/env (bicep).
#
# IMPORTANTE: por padrão, pacotes no GHCR ficam privados. Após o primeiro push,
# ir em github.com/sys0xff/<package>/settings → "Change visibility" → Public
# (caso queira que Container Apps puxe sem autenticação).

on:
  push:
    branches: [main]
    paths:
      - 'services/api/**'
      - 'services/nlp-worker/**'
      - 'packages/nlp-baseline/**'
      - 'apps/web/**'
      - 'apps/admin/**'
      - '.github/workflows/build-images.yml'
  pull_request:
    branches: [main]
    paths:
      - 'services/api/**'
      - 'services/nlp-worker/**'
      - 'packages/nlp-baseline/**'
      - 'apps/web/**'
      - 'apps/admin/**'
      - '.github/workflows/build-images.yml'
      - 'services/*/Dockerfile'
      - 'apps/*/Dockerfile'
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  pull-requests: read
  id-token: write # OIDC pro deploy-apps (az login federado, sem secret)

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: sys0xff/nora

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      worker: ${{ steps.filter.outputs.worker }}
      web: ${{ steps.filter.outputs.web }}
      admin: ${{ steps.filter.outputs.admin }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api:
              - 'services/api/**'
            worker:
              - 'services/nlp-worker/**'
              - 'packages/nlp-baseline/**'
            web:
              - 'apps/web/**'
            admin:
              - 'apps/admin/**'

  api:
    needs: changes
    if: needs.changes.outputs.api == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-api
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
            type=ref,event=branch

      - uses: docker/build-push-action@v7
        with:
          context: services/api
          file: services/api/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max
          provenance: false

  worker:
    needs: changes
    if: needs.changes.outputs.worker == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-worker
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
            type=ref,event=branch

      - uses: docker/build-push-action@v7
        with:
          context: .  # repo root — Dockerfile do worker precisa de packages/nlp-baseline
          file: services/nlp-worker/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=worker
          cache-to: type=gha,scope=worker,mode=max
          provenance: false

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-web
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
            type=ref,event=branch

      - uses: docker/build-push-action@v7
        with:
          context: apps/web
          file: apps/web/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
          provenance: false
          # NEXT_PUBLIC_* sao baked in build-time. Setar via NEXT_PUBLIC_API_BASE_URL aqui
          # (override por workflow vars/secrets se for build pra ambiente diferente).
          # Fallback aponta pro Azure Container Apps do dev — quando subir custom domain,
          # setar `vars.NEXT_PUBLIC_API_BASE_URL` no repo/environment pra sobrescrever.
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=${{ vars.NEXT_PUBLIC_API_BASE_URL || 'https://nora-api-dev.salmonbeach-349d395f.centralus.azurecontainerapps.io' }}
            NEXT_PUBLIC_USE_MOCKS=false

  admin:
    needs: changes
    if: needs.changes.outputs.admin == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-admin
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
            type=ref,event=branch

      - uses: docker/build-push-action@v7
        with:
          context: apps/admin
          file: apps/admin/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=admin
          cache-to: type=gha,scope=admin,mode=max
          provenance: false

  # Faz o ROLLOUT real: deploya cada serviço que mudou pro seu Container App na tag
  # IMUTÁVEL :sha-<short> (não :latest). Trocar a imagem pra uma tag nova força uma
  # revisão nova → o código efetivamente entra em prod. Antes deste job, merges de
  # código só faziam push da imagem e nunca eram deployados (o deploy-infra só dispara
  # em mudanças de infra/bicep/**, e :latest não muda o template → sem revisão nova).
  # É LEVE de propósito (só `az containerapp update`, sem bicep) — não toca o
  # azure.extensions do Postgres, então não esbarra no flaky ServerIsBusy.
  deploy-apps:
    name: Deploy apps mudados (Container Apps)
    needs: [changes, api, worker, web, admin]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy serviços mudados na tag :sha-<short>
        env:
          EVENT: ${{ github.event_name }}
          CH_API: ${{ needs.changes.outputs.api }}
          CH_WORKER: ${{ needs.changes.outputs.worker }}
          CH_WEB: ${{ needs.changes.outputs.web }}
          CH_ADMIN: ${{ needs.changes.outputs.admin }}
          R_API: ${{ needs.api.result }}
          R_WORKER: ${{ needs.worker.result }}
          R_WEB: ${{ needs.web.result }}
          R_ADMIN: ${{ needs.admin.result }}
        run: |
          set -euo pipefail
          SHORT=${GITHUB_SHA::7}
          RG=rg-nora-dev
          IMG=ghcr.io/sys0xff/nora
          # deploy <app> <container> <changed> <build-result> <imgname>
          deploy() {
            local app=$1 cont=$2 changed=$3 result=$4 name=$5
            if [ "$changed" != "true" ] && [ "$EVENT" != "workflow_dispatch" ]; then
              echo "↷ $app: não mudou — mantém imagem atual"; return
            fi
            if [ "$result" != "success" ]; then
              echo "::warning::$app: build=$result — NÃO deploya"; return
            fi
            echo "→ $app: deploy $IMG-$name:sha-$SHORT (container $cont)"
            az containerapp update -g "$RG" -n "$app" --container-name "$cont" \
              --image "$IMG-$name:sha-$SHORT" -o none
          }
          deploy nora-api-dev    api    "$CH_API"    "$R_API"    api
          deploy nora-worker-dev worker "$CH_WORKER" "$R_WORKER" worker
          deploy nora-web-dev    web    "$CH_WEB"    "$R_WEB"    web
          deploy nora-admin-dev  admin  "$CH_ADMIN"  "$R_ADMIN"  admin
          echo "Rollout concluído (serviços não-mudados foram preservados)."

  summary:
    needs: [api, worker, web, admin]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - name: Build summary
        run: |
          echo "## Build Images — resultados" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Imagem | Status | Tag SHA |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| api | ${{ needs.api.result }} | ghcr.io/${{ env.IMAGE_PREFIX }}-api:sha-${GITHUB_SHA::7} |" >> $GITHUB_STEP_SUMMARY
          echo "| worker | ${{ needs.worker.result }} | ghcr.io/${{ env.IMAGE_PREFIX }}-worker:sha-${GITHUB_SHA::7} |" >> $GITHUB_STEP_SUMMARY
          echo "| web | ${{ needs.web.result }} | ghcr.io/${{ env.IMAGE_PREFIX }}-web:sha-${GITHUB_SHA::7} |" >> $GITHUB_STEP_SUMMARY
          echo "| admin | ${{ needs.admin.result }} | ghcr.io/${{ env.IMAGE_PREFIX }}-admin:sha-${GITHUB_SHA::7} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Pull com: \`docker pull ghcr.io/${{ env.IMAGE_PREFIX }}-<api|worker|web>:latest\`" >> $GITHUB_STEP_SUMMARY
