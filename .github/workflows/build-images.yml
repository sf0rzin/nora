name: build-images

# Builds + pushes Docker images to GHCR and PUBLISHES a "release pointer". This workflow does
# NOT talk to the host — it pushes no deploy anywhere (ADR 0034 / Azure -> self-hosted
# migration; ADR 0036 corrects the substrate).
#
# NOTE, BEFORE THE REST OF THIS FILE TALKS ABOUT "the pull agent": it exists now. This note
# used to say the opposite — the pointer had no consumer and rolling forward was a manual
# `deploy.sh --tag`. The consumer is `deploy.sh --follow-release`, installed by
# bootstrap-host.sh as `nora-deploy.timer`, and it reads the GIT TAG rather than the artifact
# below. deploy-host.yml's header has the full path.
#
# Triggers:
#   - push on main: rebuild of the services that changed (path filter) + release pointer
#   - pull_request: ONLY a validation build (push:false — no image leaves, no pointer
#     is published). Safe in a public repo: on a fork PR the GITHUB_TOKEN is read-only
#     and the release-pointer job is blocked by the event/ref guard.
#   - workflow_dispatch: rebuild everything manually
#
# Published images:
#   - ghcr.io/sf0rzin/nora-{api,worker,web,admin}:{latest, sha-XXXXXXX}
#
# Each pushed manifest is SIGNED (keyless cosign, Sigstore OIDC) and carries SLSA provenance
# plus an SBOM. Nothing verifies the signature yet — the host pulls by digest and trusts
# GHCR — and the `api` job's signing step says exactly what closing that would take.
#
# ROLLOUT (release-pointer job): replaced the old `deploy-apps`, which did
# `azure/login` + `az containerapp update` via OIDC. The model is now PULL: this job only
# ANNOUNCES which IMMUTABLE `sha-<short>` tags were built. Applying them is the pull agent's
# job — `deploy.sh --follow-release` on `nora-deploy.timer` — and it reads the git tag
# deploy-host.yml publishes from this announcement, not this artifact.
#
# Why the immutable tag is still the mechanism: `docker compose up -d` compares the
# RESOLVED image of the service. With `:latest` the reference does not change, Compose
# considers the container up-to-date and recreates NOTHING — the new code never lands.
# Switching API_TAG to a new `sha-<short>` changes the reference and forces the recreate.
# Same rationale as before (there it was "force a new Container App revision"), other engine.
#
# IMPORTANT: we only emit a tag for the services that CHANGED. An unchanged service had no
# image built at this SHA — emitting `sha-<short>` for it would point at a tag that does
# not exist in GHCR and `docker compose pull` would fail. Service absent from the pointer =
# the host keeps the tag already in its `.env`.
#
# IMPORTANT: by default, GHCR packages are born PRIVATE. To make them public:
# github.com/users/sf0rzin/packages → (package) → Package settings → Change visibility.
#
# Not mandatory: the host authenticates via `docker login ghcr.io` with a PAT scoped
# `read:packages` (GHCR_PULL_TOKEN in secrets.env.sops), done by `ghcr_login()` in
# infra/host/scripts/deploy.sh. Public is convenience, not a requirement.

on:
  push:
    branches: [main]
    paths:
      - 'services/api/**'
      - 'services/nlp-worker/**'
      - 'packages/nlp-baseline/**'
      - 'apps/web/**'
      - 'apps/admin/**'
      - '.github/workflows/build-images.yml'
  pull_request:
    branches: [main]
    paths:
      - 'services/api/**'
      - 'services/nlp-worker/**'
      - 'packages/nlp-baseline/**'
      - 'apps/web/**'
      - 'apps/admin/**'
      - '.github/workflows/build-images.yml'
      - 'services/*/Dockerfile'
      - 'apps/*/Dockerfile'
  workflow_dispatch:

# `id-token: write` is NOT here, and its absence is the point. It used to be granted at this
# level for the federated `azure/login` (OIDC); when Azure left the path, it left with it,
# because a token every job in a public-repo workflow can mint is a wider surface than any of
# them needs.
#
# Keyless cosign brought the need for an OIDC token back — but only for the four build jobs,
# and only to prove to Sigstore which workflow is signing. So each of those jobs declares its
# own `permissions:` block containing it, and `changes`, `release-pointer` and `summary` still
# cannot mint one. A job-level block REPLACES this one rather than adding to it, which is why
# those four restate `contents` and `packages`.
permissions:
  contents: read
  packages: write
  pull-requests: read

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: sf0rzin/nora

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      worker: ${{ steps.filter.outputs.worker }}
      web: ${{ steps.filter.outputs.web }}
      admin: ${{ steps.filter.outputs.admin }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            api:
              - 'services/api/**'
            worker:
              - 'services/nlp-worker/**'
              - 'packages/nlp-baseline/**'
            web:
              - 'apps/web/**'
            admin:
              - 'apps/admin/**'

  api:
    needs: changes
    if: needs.changes.outputs.api == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # `id-token: write` is what keyless cosign needs: it lets the job mint a short-lived OIDC
    # token describing THIS workflow, at THIS ref, in THIS repository, which Sigstore's Fulcio
    # exchanges for a certificate valid for ten minutes. See the signing step below for why
    # that is preferable to holding a signing key. `contents` and `packages` are restated
    # because a job-level block replaces the workflow-level one outright.
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-api
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
            type=ref,event=branch

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        id: build
        with:
          context: services/api
          file: services/api/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max
          # SLSA PROVENANCE + SBOM. These four builds carried `provenance: false` and no
          # `sbom:` at all, so nothing published alongside an image said what produced it or
          # what is inside it. That is the cheap half of image supply chain, and it was off.
          #
          # `mode=max` rather than `true`: the minimal mode records the build definition and
          # little else, while max also records the materials — which base image, which source
          # commit, which build args. "Which release am I actually running" and "does this image
          # contain the vulnerable version of X" become answerable from the registry
          # (`docker buildx imagetools inspect --format "{{ json .Provenance }}"`) instead of by
          # rebuilding and hoping it is reproducible.
          #
          # BOTH ARE OFF ON PULL REQUESTS, and that is not caution about cost: with
          # `push: false` the build uses the local docker exporter, which cannot carry
          # attestations, and buildx fails the step outright. A PR build validates the
          # Dockerfile; only a pushed image needs to be attestable.
          #
          # An attestation says what produced the image and what is inside it. It does NOT say
          # that this repository is what published it — that is the signature's job, and it is
          # the two steps below.
          provenance: ${{ github.event_name != 'pull_request' && 'mode=max' || 'false' }}
          sbom: ${{ github.event_name != 'pull_request' }}

      # ----------------------------------------------------------------------
      # SIGNATURE — keyless cosign, over OIDC
      # ----------------------------------------------------------------------
      # The gap the provenance note above used to end on: nothing said that the image in GHCR
      # was published by THIS workflow. Provenance is a claim carried alongside the image;
      # whoever can push the image can push the claim. A signature is the part that cannot be
      # forged without the identity.
      #
      # KEYLESS, and that word is doing real work. The alternative is a cosign key pair whose
      # private half lives in a repository secret — which means a signing key that never
      # expires, sitting next to the credential that publishes the images, so an actor who
      # takes one takes both and can sign whatever they push. Keyless has no key: the job
      # mints a ten-minute OIDC token, Fulcio issues a certificate BINDING THE SIGNATURE TO
      # THIS WORKFLOW FILE AT THIS REF, and the certificate is thrown away. There is nothing
      # to leak, nothing to rotate, and nothing to pay for — Fulcio and Rekor are public
      # infrastructure with no account attached.
      #
      # It signs BY DIGEST, never by tag. `sha-<short>` and `latest` are pointers; signing a
      # pointer signs whatever it resolves to at that instant, which is exactly the thing an
      # attacker moves. `${{ steps.build.outputs.digest }}` is the manifest buildx just
      # pushed, so the signature covers that manifest and every tag that resolves to it.
      #
      # ONLY WHEN THE IMAGE WAS ACTUALLY PUSHED. On a pull request `push:` is false, there is
      # no manifest in the registry to sign, and `digest` is empty — signing would fail on a
      # build that is doing its job. On a fork's pull request GitHub does not grant
      # `id-token: write` at all, so the guard is also what keeps that case from failing on a
      # permission error rather than on the code.
      #
      # WHAT IS STILL MISSING, so this is not mistaken for end-to-end: the host does not
      # VERIFY. `deploy.sh` runs `docker compose pull` on the `sha-<short>` tag and trusts
      # whatever GHCR returns for it. Verification would be a `cosign verify
      # --certificate-identity-regexp ... --certificate-oidc-issuer
      # https://token.actions.githubusercontent.com` in front of that pull, and it needs cosign
      # installed on the host and an outbound path to Rekor — a host change, not a CI one.
      # Signing first is still the right order: a signature nobody checks yet can be checked
      # later, while an unsigned image can never be verified retroactively.
      - name: Install cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign the image (keyless)
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-api
        run: |
          set -euo pipefail
          # An empty digest means the build did not push. Fail loudly: silently skipping would
          # leave an unsigned image in the registry and a green check next to it.
          [ -n "$DIGEST" ] || { echo "::error::build produced no digest — nothing to sign"; exit 1; }
          cosign sign --yes "${IMAGE}@${DIGEST}"

  worker:
    needs: changes
    if: needs.changes.outputs.worker == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # Keyless cosign — see the `api` job for why `id-token: write` is here and job-level.
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-worker
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
            type=ref,event=branch

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        id: build
        with:
          context: .  # repo root — the worker Dockerfile needs packages/nlp-baseline
          file: services/nlp-worker/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=worker
          cache-to: type=gha,scope=worker,mode=max
          # Provenance + SBOM, off on pull requests — see the note in the `api` job above.
          provenance: ${{ github.event_name != 'pull_request' && 'mode=max' || 'false' }}
          sbom: ${{ github.event_name != 'pull_request' }}

      # Keyless signature over the pushed manifest — see the `api` job for the full reasoning.
      - name: Install cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign the image (keyless)
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-worker
        run: |
          set -euo pipefail
          [ -n "$DIGEST" ] || { echo "::error::build produced no digest — nothing to sign"; exit 1; }
          cosign sign --yes "${IMAGE}@${DIGEST}"

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # Keyless cosign — see the `api` job for why `id-token: write` is here and job-level.
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-web
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
            type=ref,event=branch

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        id: build
        with:
          context: apps/web
          file: apps/web/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
          # Provenance + SBOM, off on pull requests — see the note in the `api` job above.
          provenance: ${{ github.event_name != 'pull_request' && 'mode=max' || 'false' }}
          sbom: ${{ github.event_name != 'pull_request' }}
          # NEXT_PUBLIC_* are baked in at build-time. Set via NEXT_PUBLIC_API_BASE_URL here
          # (override by workflow vars/secrets if building for a different environment).
          # The fallback is now the public domain served by Cloudflare Tunnel -> caddy -> api
          # (infra/host/docker-compose.yml). The old fallback was the Azure Container
          # Apps FQDN, which is dead. Set `vars.NEXT_PUBLIC_API_BASE_URL` to change it.
          # WARNING: changing the public domain requires a REBUILD of this image — setting
          # the env in the compose does NOT alter an already compiled Next bundle.
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=${{ vars.NEXT_PUBLIC_API_BASE_URL || 'https://api.nora.systems' }}
            NEXT_PUBLIC_USE_MOCKS=false

      # Keyless signature over the pushed manifest — see the `api` job for the full reasoning.
      - name: Install cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign the image (keyless)
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-web
        run: |
          set -euo pipefail
          [ -n "$DIGEST" ] || { echo "::error::build produced no digest — nothing to sign"; exit 1; }
          cosign sign --yes "${IMAGE}@${DIGEST}"

  admin:
    needs: changes
    if: needs.changes.outputs.admin == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # Keyless cosign — see the `api` job for why `id-token: write` is here and job-level.
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-admin
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
            type=ref,event=branch

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        id: build
        with:
          context: apps/admin
          file: apps/admin/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=admin
          cache-to: type=gha,scope=admin,mode=max
          # Provenance + SBOM, off on pull requests — see the note in the `api` job above.
          provenance: ${{ github.event_name != 'pull_request' && 'mode=max' || 'false' }}
          sbom: ${{ github.event_name != 'pull_request' }}

      # Keyless signature over the pushed manifest — see the `api` job for the full reasoning.
      - name: Install cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign the image (keyless)
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-admin
        run: |
          set -euo pipefail
          [ -n "$DIGEST" ] || { echo "::error::build produced no digest — nothing to sign"; exit 1; }
          cosign sign --yes "${IMAGE}@${DIGEST}"

  # ANNOUNCES the rollout — does not execute it. Replaced the old `deploy-apps` (azure/login
  # + `az containerapp update`). There is no host credential, SSH, self-hosted runner nor
  # inbound port here: the job only materializes "which immutable tags exist for this SHA" in
  # two formats. The two formats are:
  #
  #   - artifact `nora-release-pointer` (release.json + deploy.env) — consumed by
  #     deploy-host.yml, which validates every manifest in it before turning it into the git
  #     tags. It is NOT what the host reads: an artifact needs a PAT and expires in 90 days,
  #     while the tag is public and permanent, so `deploy.sh --follow-release` reads the tag.
  #   - step summary — human reading in the run.
  #
  # Publishing the long-lived "canonical pointer" (git tag `release/prod/*`, which does not
  # expire in 90 days like the artifact) belongs to deploy-host.yml, which consumes this
  # artifact.
  #
  # Only services that CHANGED and whose build passed enter the pointer. Absent service = the
  # host preserves its current tag (see the header comment: emitting sha-<short> for a service
  # that was not built would break `docker compose pull`).
  release-pointer:
    name: Publica release pointer (tags sha-<short>)
    needs: [changes, api, worker, web, admin]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Renamed from `nora-azure-rollout-*`. The group still exists for a reason that survived
    # the migration: two merges in a row on main publish two pointers and the pull agent
    # consumes "the most recent" — without serialization, the publish order can invert and
    # the host converge on the OLDER SHA. cancel-in-progress:false queues instead of
    # cancelling, so no pointer is lost.
    concurrency:
      group: nora-release-pointer-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Monta release pointer
        id: pointer
        env:
          EVENT: ${{ github.event_name }}
          CH_API: ${{ needs.changes.outputs.api }}
          CH_WORKER: ${{ needs.changes.outputs.worker }}
          CH_WEB: ${{ needs.changes.outputs.web }}
          CH_ADMIN: ${{ needs.changes.outputs.admin }}
          R_API: ${{ needs.api.result }}
          R_WORKER: ${{ needs.worker.result }}
          R_WEB: ${{ needs.web.result }}
          R_ADMIN: ${{ needs.admin.result }}
        run: |
          set -euo pipefail
          SHORT=${GITHUB_SHA::7}
          IMG="${REGISTRY}/${IMAGE_PREFIX}"
          mkdir -p pointer
          : > pointer/deploy.env
          services_json='[]'

          # publish <compose-var> <image-name> <changed> <build-result>
          publish() {
            local var=$1 name=$2 changed=$3 result=$4
            if [ "$changed" != "true" ] && [ "$EVENT" != "workflow_dispatch" ]; then
              echo "↷ $name: unchanged — the host keeps the current tag"
              return
            fi
            if [ "$result" != "success" ]; then
              # Warning, not error: a broken build must not drag down the pointer of the
              # services that passed. A deploy applies the partial pointer and the broken
              # service stays on the previous tag (which is up). "A deploy" because it is an
              # operator running deploy.sh — nothing applies this automatically, see the NOTE
              # at the top of this file.
              echo "::warning::$name: build=$result — left out of the pointer"
              return
            fi
            echo "→ $name: ${var}=sha-$SHORT"
            echo "${var}=sha-${SHORT}" >> pointer/deploy.env
            services_json=$(jq -c \
              --arg n "$name" --arg v "$var" --arg t "sha-$SHORT" --arg i "$IMG-$name:sha-$SHORT" \
              '. + [{service:$n, compose_var:$v, tag:$t, image:$i}]' <<<"$services_json")
          }

          publish API_TAG    api    "$CH_API"    "$R_API"
          publish WORKER_TAG worker "$CH_WORKER" "$R_WORKER"
          publish WEB_TAG    web    "$CH_WEB"    "$R_WEB"
          publish ADMIN_TAG  admin  "$CH_ADMIN"  "$R_ADMIN"

          count=$(jq 'length' <<<"$services_json")
          jq -n \
            --arg sha "$GITHUB_SHA" \
            --arg short "$SHORT" \
            --arg ref "$GITHUB_REF_NAME" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg registry "$REGISTRY" \
            --arg prefix "$IMAGE_PREFIX" \
            --arg built_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --argjson services "$services_json" \
            '{schema:"nora.release-pointer/v1", sha:$sha, short_sha:$short, ref:$ref,
              run_id:$run_id, registry:$registry, image_prefix:$prefix,
              built_at:$built_at, services:$services}' > pointer/release.json

          echo "count=$count" >> "$GITHUB_OUTPUT"
          cat pointer/release.json

      # Always upload the artifact, even empty (services:[]): the agent distinguishes
      # "nothing changed at this SHA" from "the workflow did not run".
      - name: Upload the release pointer
        uses: actions/upload-artifact@v4
        with:
          name: nora-release-pointer
          path: pointer/
          retention-days: 30
          if-no-files-found: error

      - name: Pointer summary
        env:
          COUNT: ${{ steps.pointer.outputs.count }}
        run: |
          {
            echo "## Release pointer — \`${GITHUB_SHA::7}\`"
            echo ""
            if [ "${COUNT:-0}" = "0" ]; then
              echo "_No service in the pointer at this SHA (nothing changed, or the builds failed)._"
            else
              echo "These are the lines a deploy applies to the compose \`.env\` on the host."
              echo "Nothing applies them automatically — see the header of \`deploy-host.yml\`:"
              echo ""
              echo '```dotenv'
              cat pointer/deploy.env
              echo '```'
              echo ""
              echo "Services outside the list keep their current tag — on purpose."
            fi
            echo ""
            echo "> Rollout is **pull**: nothing here touches the host. See \`.github/workflows/deploy-host.yml\`."
          } >> "$GITHUB_STEP_SUMMARY"

  summary:
    needs: [api, worker, web, admin]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - name: Build summary
        run: |
          echo "## Build Images — results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Imagem | Status | Tag SHA |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| api | ${{ needs.api.result }} | ghcr.io/${{ env.IMAGE_PREFIX }}-api:sha-${GITHUB_SHA::7} |" >> $GITHUB_STEP_SUMMARY
          echo "| worker | ${{ needs.worker.result }} | ghcr.io/${{ env.IMAGE_PREFIX }}-worker:sha-${GITHUB_SHA::7} |" >> $GITHUB_STEP_SUMMARY
          echo "| web | ${{ needs.web.result }} | ghcr.io/${{ env.IMAGE_PREFIX }}-web:sha-${GITHUB_SHA::7} |" >> $GITHUB_STEP_SUMMARY
          echo "| admin | ${{ needs.admin.result }} | ghcr.io/${{ env.IMAGE_PREFIX }}-admin:sha-${GITHUB_SHA::7} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          # Only the tags of services LISTED in the release pointer exist in GHCR for this SHA.
          # Do NOT document `docker pull :latest` here: with :latest the service's resolved
          # reference does not change and `docker compose up -d` considers the container
          # up-to-date — it is NOT recreated and the new code never ships. Rollout is by immutable tag.
          echo "Rollout via the immutable tag \`sha-${GITHUB_SHA::7}\` — see the \`release-pointer\` job." >> $GITHUB_STEP_SUMMARY
