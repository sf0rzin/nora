name: secret-scan

# Looks for credentials committed to this repository, and — the part that makes it worth
# running — CHECKS WHETHER THEY STILL WORK.
#
# ----------------------------------------------------------------------------
# WHY TRUFFLEHOG AND NOT GITLEAKS
# ----------------------------------------------------------------------------
# This is a deliberate choice and not the default one, so it is written down rather than left
# to be re-litigated. Gitleaks is the more commonly reached-for tool, but its GitHub Action
# requires a LICENCE KEY for use by an organisation, which is a recurring cost. The
# constraint this repository operates under is that nothing in CI may cost money, so a tool
# whose free tier depends on who owns the account is not a tool this repository can adopt: it
# would work until the day the repository moved under an organisation, and then fail on a
# billing error rather than on a finding.
#
# TruffleHog OSS has no such gate — the scanner is AGPL, the action is a thin wrapper around
# a public container image, and neither asks who owns the repository.
#
# ----------------------------------------------------------------------------
# WHY `--only-verified`
# ----------------------------------------------------------------------------
# Without it the scanner reports every string that merely LOOKS like a credential, and this
# repository is full of strings that look like credentials on purpose: the CI placeholder
# block in ci.yml, `infra/host/.env.example`, `infra/host/secrets.env.example`, the
# base64 blob standing in for NORA_INTEGRATIONS_ENC_KEY. A scanner that reports those is a
# scanner whose output nobody reads, and a scanner nobody reads is worse than none — it makes
# the repository look covered.
#
# `--only-verified` means TruffleHog takes each candidate and ASKS THE ISSUING SERVICE whether
# it is live. A finding therefore means "this credential exists and works right now", which is
# an alert worth waking up for — so the step is left to fail (the action passes `--fail`)
# rather than reporting and exiting 0.
#
# The cost of that check is a network call per candidate to a third-party API. That is
# acceptable for a public repository whose contents are public anyway; it would not be for a
# repository whose file contents were themselves the secret.
#
# ----------------------------------------------------------------------------
# WHAT THIS DOES NOT DO
# ----------------------------------------------------------------------------
# It does not gate `main`. Like supply-chain-drift.yml, this is a separate workflow and
# therefore not part of `ci-gate` (ADR 0027) — a failure here reds this workflow's own check
# and sends mail, and a reviewer decides. It also cannot un-leak anything: a credential that
# reached a public repository is compromised the moment it is pushed, and the only correct
# response to a finding is to ROTATE THE CREDENTIAL, then remove it. Deleting the commit is
# the second step, never the first, and never the only one.
on:
  pull_request:
    branches: [main]
  schedule:
    # Mondays 05:29 UTC. Between codeql (04:41) and supply-chain-drift (06:17), off the hour,
    # for the queueing reason spelled out in supply-chain-drift.yml.
    - cron: '29 5 * * 1'
  workflow_dispatch:

# `contents: read` and nothing else. The scanner needs no token — it runs a public container
# image against a local clone — so this is the smallest grant that still allows the checkout.
# It is also what makes the job work unchanged on a fork's pull request, where GITHUB_TOKEN is
# read-only and no secret is available: nothing here wanted either.
permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # `fetch-depth: 0` is REQUIRED and is not caution — the same trap the `migrations` job
      # in ci.yml carries a note about. The action resolves the pull request's base SHA with
      # `git rev-parse` and scans the range between it and the head; under the default shallow
      # checkout that base commit is not in the clone, the range collapses, and the job goes
      # GREEN having scanned nothing. On the cron run the full history IS the subject.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # On `pull_request` the action derives base/head from the event and scans only the
      # commits the pull request adds. On `schedule` and `workflow_dispatch` it leaves both
      # empty, which makes TruffleHog walk the ENTIRE history — the case that finds a
      # credential added two years ago and never noticed. Both behaviours come from the
      # action's own event handling, which is why neither `base` nor `head` is set here:
      # setting them would break one of the two modes.
      #
      # `version` is pinned rather than left at the action's `latest` default. The `uses:` SHA
      # below pins the WRAPPER; the wrapper then does `docker run <image>:<version>`, so
      # leaving the default in place would pin the shell script and let the scanner binary
      # float. Both halves have to be pinned or neither is.
      #
      # AND THE TWO HALVES ARE SPELLED DIFFERENTLY, which is the whole reason this comment is
      # longer than the step. The git tag is `v3.97.0`; the image on ghcr.io is `3.97.0`, with
      # no `v`. Passing the tag straight through gives `manifest unknown` and a step that fails
      # in seven seconds looking like a scanner finding rather than a typo. Verified against the
      # registry: `v3.97.0` -> 404, `3.97.0` -> 200.
      - name: TruffleHog (verified credentials only)
        uses: trufflesecurity/trufflehog@bcfcf73aaf4759d4dadc2783177c245a02792318 # v3.97.0
        with:
          path: ./
          version: "3.97.0"
          extra_args: --only-verified
