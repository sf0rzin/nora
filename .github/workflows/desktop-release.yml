name: desktop-release

# Signed build + release of Nora Desktop with auto-update.
#
# Fires on a `desktop-v*` tag (e.g. desktop-v0.2.5) or manually
# (workflow_dispatch providing the tag). tauri-action builds, SIGNS the
# bundles with the updater key (secrets TAURI_SIGNING_PRIVATE_KEY[_PASSWORD]),
# creates the release on GitHub and generates/merges `latest.json` — which is the endpoint
# the app queries (releases/latest/download/latest.json).
#
# ON A TAG PUSH: prerelease:false, so the release becomes "Latest" and the endpoint
# resolves. Unchanged.
#
# ON A DISPATCH: a DRAFT PRERELEASE by default, so it cannot become "Latest". This is not
# caution for its own sake — a dispatch is the only way to rehearse this workflow without
# spending a real version, and with the old hardcoded false/false the rehearsal would have
# repointed `releases/latest/download/latest.json`, which is the exact endpoint the
# rehearsal exists to protect. Pass `publish: PUBLISH` to opt out.
#
# NOTHING RUNS THIS WORKFLOW ON A PULL REQUEST or a push, by design and by necessity: it
# holds the signing key. So a dispatch is the only pre-release evidence available, and the
# two defects fixed here are what stood between it and being worth running.
#
# Bootstrap: the first version WITH the updater (0.2.5) has to be installed by hand;
# from it onward the update-available button in the sidebar does the rest.

on:
  push:
    tags:
      - "desktop-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build. For a REHEARSAL it must NOT match desktop-v* and must have no release yet (e.g. rehearsal-2026-08-13). The guard below enforces both."
        required: true
      publish:
        description: "Type PUBLISH (case-insensitive) for a real release. Anything else, including empty, makes a DRAFT prerelease."
        required: false
        default: ""

concurrency:
  group: desktop-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          # ONE entry, and the matrix is kept for exactly that reason: it is the place a
          # second platform would be added back, and `runs-on` plus the artifact naming
          # already read from it. Windows is the only target the client supports — macOS
          # (BlackHole) and Linux (PulseAudio) were never exercised by anyone and were
          # dropped rather than kept as a promise.
          #
          # No `args` either. There used to be a `--features stt-local` here, believed to
          # exclude an Azure Speech path; it never did, and that path is gone. The embedded
          # STT (whisper.cpp via whisper-rs, ADR 0035) is the only backend and is already
          # the default feature, so `tauri build` takes no flags at all.
          - platform: windows-latest
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60
    steps:
      # `ref:` matters, and its absence is what made a dispatch untrustworthy. Without it
      # checkout takes the branch the dispatch was launched from, while `tagName` below takes
      # the input — so the workflow would build one thing and label it another. A rehearsal
      # that does not build the tag it names proves nothing about the release it rehearses.
      #
      # This is why the `tag` input now says the tag MUST already exist. It used to say "or
      # will be created", which is where the trap came from: tauri-action would create the tag
      # at whatever was built, retroactively making the wrong build correct.
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}

      # THE GUARD THAT MAKES THE DRAFT DEFAULT MEAN ANYTHING. Without it those flags are
      # decoration in the case a rehearsal is most likely to be in, and review found this
      # before it merged.
      #
      # `tauri-action` applies `releaseDraft`/`prerelease` only when it CREATES the release.
      # Read at the pinned SHA: `src/create-release.ts` searches existing releases for the tag
      # and reuses one if found — with no draft filter, and no `updateRelease` call anywhere in
      # the action. `upload-release-assets.ts` then deletes any same-named asset before
      # uploading, and `upload-version-json.ts` deletes and replaces `latest.json` outright.
      #
      # So rehearsing against a tag that already HAS a release overwrites that release's assets
      # and its latest.json — the endpoint hijack the draft default exists to prevent, arriving
      # through the other door.
      #
      # And the tag NAME matters as much as the release. Cutting a `desktop-v*` tag to rehearse
      # against fires `on.push.tags` above, down the unchanged false/false path, publishing a
      # real release before the rehearsal even starts. Creating the tag IS the hijack — which
      # made the first version of this change worse than no change, because it told the
      # operator the tag had to exist first.
      - name: Guard — a rehearsal may not touch an existing release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          set -euo pipefail
          # Lower-cased because GitHub's own `==` ignores case, so `Publish` already opts out
          # of the draft default. Matching that here keeps one rule rather than two.
          if [ "$(printf '%s' "$PUBLISH" | tr '[:upper:]' '[:lower:]')" = "publish" ]; then
            echo "publish=PUBLISH — this is a real release. The guard does not apply."
            exit 0
          fi
          fail=0
          case "$TAG" in
            desktop-v*)
              echo "::error::'$TAG' matches desktop-v*, which this workflow's push trigger fires on."
              echo "::error::Creating such a tag publishes a REAL release before any rehearsal runs."
              echo "::error::Use a name the trigger ignores, e.g. rehearsal-\$(date +%F)."
              fail=1
              ;;
          esac
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "::error::A release already exists for '$TAG'."
            echo "::error::tauri-action REUSES an existing release and ignores releaseDraft/prerelease,"
            echo "::error::then replaces its assets and its latest.json. Rehearse against a fresh tag."
            fail=1
          fi
          [ "$fail" -eq 0 ] || exit 1
          echo "OK — '$TAG' has no release and is outside the push trigger. Safe to rehearse."

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      # Every third-party action in this job is pinned to a commit SHA: this job decrypts
      # the updater signing key, so anything that runs here can observe it. A mutable tag
      # or branch would leave the choice of what executes to the upstream owner.
      # Pinned by SHA, the toolchain is no longer implied by the ref name — state it.
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch @ 2026-08-05
        with:
          toolchain: stable

      # whisper-rs-sys compiles whisper.cpp with CMake + MSBuild. CMake generates deep
      # scratch paths (…/out/build/CMakeFiles/CMakeScratch/TryCompile-XXXXXXX/
      # cmTC_XXXXX.dir/Debug/cmTC_XXXXX.tlog) that blow past Windows' 260-char MAX_PATH,
      # and MSBuild fails with `MSB6003: CL.exe could not be run /
      # DirectoryNotFoundException`. Reproduced locally on 2026-08-07.
      #
      # We do NOT set CARGO_TARGET_DIR here: tauri-action locates the bundles on its own
      # by cargo's default layout, and moving the target dir would risk the SIGNED release
      # not finding what to package. The runner workspace is already short; LongPathsEnabled
      # covers the rest. (In ci.yml's desktop-rust job, which uploads no artifact, we set it.)
      - name: Windows — long paths (whisper.cpp/CMake)
        shell: pwsh
        run: |
          git config --global core.longpaths true
          Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem' `
            -Name LongPathsEnabled -Value 1 -Type DWord -Force

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Build, sign and release
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Same URL baked in at build-time as desktop-bundle (build.rs option_env!).
          # Fallback migrated from the Azure Container Apps FQDN (dead) to the public domain
          # served by the Cloudflare Tunnel -> caddy -> api. A signed and published bundle
          # carries that URL forever: with the old default, every new release was born
          # pointing at a host that does not resolve.
          NORA_API_BASE_URL: ${{ vars.NORA_API_BASE_URL || 'https://api.nora.systems' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: "Nora Desktop ${{ inputs.tag || github.ref_name }}"
          releaseBody: "Nora Desktop update. From v0.2.5 on, installation is automatic through the sidebar button."
          # A TAG PUSH is unchanged: false/false, a real release that becomes Latest.
          #
          # A DISPATCH defaults to a DRAFT PRERELEASE, and this is the whole point. The
          # endpoint every installed client polls is
          # releases/latest/download/latest.json, and GitHub resolves "latest" to the most
          # recent non-draft, non-prerelease release. With these hardcoded to false, a
          # dispatch — the only way to rehearse this workflow without burning a real
          # version — would HIJACK that endpoint and point every client at whatever the
          # rehearsal produced. The thing the rehearsal exists to protect was the thing it
          # would have broken.
          #
          # Draft AND prerelease, not just one: a draft is invisible to the "latest"
          # resolution, and prerelease is the belt to that braces if someone publishes the
          # draft by hand from the UI.
          #
          # `publish: PUBLISH` opts out, for the case where a dispatch really is the
          # intended release path (a tag push that failed halfway, say).
          releaseDraft: ${{ github.event_name == 'workflow_dispatch' && inputs.publish != 'PUBLISH' }}
          prerelease: ${{ github.event_name == 'workflow_dispatch' && inputs.publish != 'PUBLISH' }}
          includeUpdaterJson: true
