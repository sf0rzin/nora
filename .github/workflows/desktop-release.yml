name: desktop-release

# Build assinado + release do Nora Desktop com auto-update.
#
# Dispara por uma tag `desktop-v*` (ex.: desktop-v0.2.5) ou manualmente
# (workflow_dispatch informando a tag). O tauri-action builda, ASSINA os
# bundles com a chave do updater (secrets TAURI_SIGNING_PRIVATE_KEY[_PASSWORD]),
# cria a release no GitHub e gera/mescla o `latest.json` — que é o endpoint que
# o app consulta (releases/latest/download/latest.json). prerelease:false pra a
# release virar "Latest" e o endpoint resolver.
#
# Bootstrap: a primeira versão COM updater (0.2.5) precisa ser instalada à mão;
# dela em diante o botão "Atualização disponível" na sidebar faz o resto.

on:
  push:
    tags:
      - "desktop-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag da release (ex.: desktop-v0.2.5). Precisa existir ou será criada."
        required: true

concurrency:
  group: desktop-release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          # `--features stt-local` liga o STT embarcado (whisper.cpp via whisper-rs,
          # ADR 0035). SEM esta flag o bundle sai com o caminho antigo do Azure Speech
          # ativo — que depende de um `/speech/token` que hoje responde 410 GONE.
          - platform: windows-latest
            args: "--features stt-local"
          - platform: ubuntu-latest
            args: "--features stt-local"
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      # whisper-rs-sys compila o whisper.cpp com CMake + MSBuild. O CMake gera caminhos
      # scratch profundos (…/out/build/CMakeFiles/CMakeScratch/TryCompile-XXXXXXX/
      # cmTC_XXXXX.dir/Debug/cmTC_XXXXX.tlog) que estouram o MAX_PATH de 260 chars do
      # Windows, e o MSBuild falha com `MSB6003: CL.exe could not be run /
      # DirectoryNotFoundException`. Reproduzido localmente em 2026-08-07.
      #
      # NAO setamos CARGO_TARGET_DIR aqui: o tauri-action localiza os bundles sozinho
      # pelo layout padrao do cargo, e mover o target dir arriscaria a release ASSINADA
      # nao encontrar o que empacotar. O workspace do runner ja e curto; LongPathsEnabled
      # cobre o resto. (No job desktop-rust do ci.yml, que nao sobe artifact, setamos.)
      - name: Windows — long paths (whisper.cpp/CMake)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          git config --global core.longpaths true
          Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem' `
            -Name LongPathsEnabled -Value 1 -Type DWord -Force

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Install dependencies (Ubuntu)
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Build, sign and release
        uses: tauri-apps/tauri-action@v0
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Mesma URL baked em build-time do desktop-bundle (build.rs option_env!).
          # Fallback migrado do FQDN do Azure Container Apps (morto) pro domínio público
          # servido pelo Cloudflare Tunnel -> caddy -> api. Um bundle assinado e publicado
          # carrega essa URL pra sempre: com o default antigo, toda release nova nascia
          # apontando pra um host que não resolve.
          NORA_API_BASE_URL: ${{ vars.NORA_API_BASE_URL || 'https://api.nora.systems' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: "Nora Desktop ${{ github.event.inputs.tag || github.ref_name }}"
          releaseBody: "Atualização do Nora Desktop. A instalação a partir da v0.2.5 é automática pelo botão na sidebar."
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.args }}
