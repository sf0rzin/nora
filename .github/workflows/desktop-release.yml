name: desktop-release

# Signed build + release of Nora Desktop with auto-update.
#
# Fires on a `desktop-v*` tag (e.g. desktop-v0.2.5) or manually
# (workflow_dispatch providing the tag). tauri-action builds, SIGNS the
# bundles with the updater key (secrets TAURI_SIGNING_PRIVATE_KEY[_PASSWORD]),
# creates the release on GitHub and generates/merges `latest.json` — which is the endpoint
# the app queries (releases/latest/download/latest.json). prerelease:false so the
# release becomes "Latest" and the endpoint resolves.
#
# Bootstrap: the first version WITH the updater (0.2.5) has to be installed by hand;
# from it onward the "Atualização disponível" button in the sidebar does the rest.

on:
  push:
    tags:
      - "desktop-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag da release (ex.: desktop-v0.2.5). Precisa existir ou será criada."
        required: true

concurrency:
  group: desktop-release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          # `--features stt-local` turns on the embedded STT (whisper.cpp via whisper-rs,
          # ADR 0035). WITHOUT this flag the bundle ships with the old Azure Speech path
          # active — which depends on a `/speech/token` that today answers 410 GONE.
          - platform: windows-latest
            args: "--features stt-local"
          - platform: ubuntu-latest
            args: "--features stt-local"
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      # Every third-party action in this job is pinned to a commit SHA: this job decrypts
      # the updater signing key, so anything that runs here can observe it. A mutable tag
      # or branch would leave the choice of what executes to the upstream owner.
      # Pinned by SHA, the toolchain is no longer implied by the ref name — state it.
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch @ 2026-08-05
        with:
          toolchain: stable

      # whisper-rs-sys compiles whisper.cpp with CMake + MSBuild. CMake generates deep
      # scratch paths (…/out/build/CMakeFiles/CMakeScratch/TryCompile-XXXXXXX/
      # cmTC_XXXXX.dir/Debug/cmTC_XXXXX.tlog) that blow past Windows' 260-char MAX_PATH,
      # and MSBuild fails with `MSB6003: CL.exe could not be run /
      # DirectoryNotFoundException`. Reproduced locally on 2026-08-07.
      #
      # We do NOT set CARGO_TARGET_DIR here: tauri-action locates the bundles on its own
      # by cargo's default layout, and moving the target dir would risk the SIGNED release
      # not finding what to package. The runner workspace is already short; LongPathsEnabled
      # covers the rest. (In ci.yml's desktop-rust job, which uploads no artifact, we set it.)
      - name: Windows — long paths (whisper.cpp/CMake)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          git config --global core.longpaths true
          Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem' `
            -Name LongPathsEnabled -Value 1 -Type DWord -Force

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Install dependencies (Ubuntu)
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Build, sign and release
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Same URL baked in at build-time as desktop-bundle (build.rs option_env!).
          # Fallback migrated from the Azure Container Apps FQDN (dead) to the public domain
          # served by the Cloudflare Tunnel -> caddy -> api. A signed and published bundle
          # carries that URL forever: with the old default, every new release was born
          # pointing at a host that does not resolve.
          NORA_API_BASE_URL: ${{ vars.NORA_API_BASE_URL || 'https://api.nora.systems' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: "Nora Desktop ${{ github.event.inputs.tag || github.ref_name }}"
          releaseBody: "Atualização do Nora Desktop. A instalação a partir da v0.2.5 é automática pelo botão na sidebar."
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.args }}
