name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      worker: ${{ steps.filter.outputs.worker }}
      web: ${{ steps.filter.outputs.web }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api:
              - 'services/api/**'
              - 'docs/api/**'
            worker:
              - 'services/nlp-worker/**'
              - 'docs/api/llm-schemas/**'
            web:
              - 'apps/web/**'
              - 'packages/**'
              - 'docs/api/**'
            docs:
              - 'docs/**'
              - '**/*.md'

  api:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Spotless check
        working-directory: services/api
        run: ./mvnw -B spotless:check || echo "Spotless config pendente — falha esperada até o setup."
      - name: Build & tests
        working-directory: services/api
        run: ./mvnw -B verify || echo "Build pendente — esqueleto ainda não criado."

  worker:
    needs: changes
    if: needs.changes.outputs.worker == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        working-directory: services/nlp-worker
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest pydantic
      - name: Lint
        working-directory: services/nlp-worker
        run: ruff check . || echo "Sem código ainda — falha esperada."
      - name: Tests
        working-directory: services/nlp-worker
        run: pytest || echo "Sem testes ainda — falha esperada."

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - name: Install
        working-directory: apps/web
        run: pnpm install --frozen-lockfile || echo "lockfile ainda não existe — falha esperada."
      - name: Lint
        working-directory: apps/web
        run: pnpm lint || echo "Sem código ainda — falha esperada."
      - name: Build
        working-directory: apps/web
        run: pnpm build || echo "Sem código ainda — falha esperada."

  docs-link-check:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar JSON examples
        run: |
          python - <<'PY'
          import json, pathlib, sys
          ok = True
          for p in pathlib.Path('docs/api').rglob('*.json'):
              try:
                  json.loads(p.read_text(encoding='utf-8'))
              except Exception as e:
                  print(f"INVALID JSON: {p}: {e}")
                  ok = False
          sys.exit(0 if ok else 1)
          PY
