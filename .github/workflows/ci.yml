name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

# Cancela rodadas anteriores do mesmo PR/branch quando um novo commit chega.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      worker: ${{ steps.filter.outputs.worker }}
      web: ${{ steps.filter.outputs.web }}
      docs: ${{ steps.filter.outputs.docs }}
      infra: ${{ steps.filter.outputs.infra }}
      desktop: ${{ steps.filter.outputs.desktop }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api:
              - 'services/api/**'
              - 'docs/api/**'
            worker:
              - 'services/nlp-worker/**'
              - 'packages/nlp-baseline/**'
              - 'docs/api/llm-schemas/**'
              - 'data/synthetic/**'
            web:
              - 'apps/web/**'
              - 'packages/**'
              - 'docs/api/**'
            docs:
              - 'docs/**'
              - '**/*.md'
            desktop:
              - 'apps/desktop/**'
            infra:
              - 'infra/bicep/**'

  api:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Spotless check
        working-directory: services/api
        run: mvn -B spotless:check
      - name: Build & tests
        working-directory: services/api
        run: mvn -B verify

  worker:
    needs: changes
    if: needs.changes.outputs.worker == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/nlp-worker/pyproject.toml
      - name: Install nlp-baseline (local package)
        working-directory: packages/nlp-baseline
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Install
        working-directory: services/nlp-worker
        run: |
          pip install -e ".[dev]"
      - name: Lint
        working-directory: services/nlp-worker
        run: ruff check .
      - name: Format check
        working-directory: services/nlp-worker
        run: ruff format --check .
      - name: Tests
        working-directory: services/nlp-worker
        run: pytest

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install
        working-directory: apps/web
        run: npm ci
      - name: Lint
        working-directory: apps/web
        run: npm run lint
      - name: Typecheck
        working-directory: apps/web
        run: npm run typecheck
      - name: Build
        working-directory: apps/web
        env:
          NEXT_PUBLIC_USE_MOCKS: 'true'
        run: npm run build

  # Job leve em PR: só sidecar tests (mais barato) + Python sanity check.
  # O sidecar é a única parte com lógica de domínio testável fora do Tauri/Rust;
  # o resto (TypeScript + Rust) é validado em release/main pela build full.
  desktop-sidecar:
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/desktop/sidecar/pyproject.toml

      - name: Install sidecar deps + tests
        working-directory: apps/desktop/sidecar
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pytest -v

  # Build full do desktop (sidecar PyInstaller + Tauri bundle msi/dmg/deb/AppImage)
  # roda APENAS em push em main, gerando artifacts publicáveis. Em PR validation
  # esse build é overkill (15-20min cold-cache + fragil em 3 plataformas).
  desktop-bundle:
    needs: changes
    if: needs.changes.outputs.desktop == 'true' && github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-latest
            args: ""
            sidecar_target: x86_64-unknown-linux-gnu
          - platform: windows-latest
            args: ""
            sidecar_target: x86_64-pc-windows-msvc
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
            sidecar_target: aarch64-apple-darwin
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/desktop/sidecar/pyproject.toml

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Install dependencies (Ubuntu)
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Install sidecar deps
        working-directory: apps/desktop/sidecar
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          python -m pip install pyinstaller

      - name: Build sidecar
        working-directory: apps/desktop/sidecar
        run: python build_sidecar.py

      - name: Build Tauri app
        working-directory: apps/desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ""
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: npx tauri build ${{ matrix.args }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nora-desktop-${{ matrix.sidecar_target }}
          path: |
            apps/desktop/src-tauri/target/release/bundle/**/*.deb
            apps/desktop/src-tauri/target/release/bundle/**/*.AppImage
            apps/desktop/src-tauri/target/release/bundle/**/*.msi
            apps/desktop/src-tauri/target/release/bundle/**/*.dmg
          if-no-files-found: ignore

  docs-link-check:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Validar JSON examples
        run: |
          python - <<'PY'
          import json, pathlib, sys
          ok = True
          for p in pathlib.Path('docs/api').rglob('*.json'):
              try:
                  json.loads(p.read_text(encoding='utf-8'))
              except Exception as e:
                  print(f"INVALID JSON: {p}: {e}")
                  ok = False
          sys.exit(0 if ok else 1)
          PY

  infra:
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Install Azure CLI + Bicep
        run: |
          az bicep install
          az bicep version
      - name: Bicep build (main.bicep)
        working-directory: infra/bicep
        run: |
          mkdir -p .bicep-out
          az bicep build --file main.bicep --outdir .bicep-out
          echo "Compiled main.json bytes: $(wc -c < .bicep-out/main.json)"
      - name: Bicep lint (todos os módulos)
        working-directory: infra/bicep
        run: |
          set -e
          for f in modules/*.bicep; do
            echo "::group::Linting $f"
            az bicep build --file "$f" --outdir .bicep-out
            echo "::endgroup::"
          done
