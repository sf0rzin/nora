name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      worker: ${{ steps.filter.outputs.worker }}
      web: ${{ steps.filter.outputs.web }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api:
              - 'services/api/**'
              - 'docs/api/**'
            worker:
              - 'services/nlp-worker/**'
              - 'docs/api/llm-schemas/**'
              - 'data/synthetic/**'
            web:
              - 'apps/web/**'
              - 'packages/**'
              - 'docs/api/**'
            docs:
              - 'docs/**'
              - '**/*.md'
            desktop:
              - 'apps/desktop/**'

  api:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Spotless check
        working-directory: services/api
        run: mvn -B spotless:check
      - name: Build & tests
        working-directory: services/api
        run: mvn -B verify

  worker:
    needs: changes
    if: needs.changes.outputs.worker == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/nlp-worker/pyproject.toml
      - name: Install
        working-directory: services/nlp-worker
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        working-directory: services/nlp-worker
        run: ruff check .
      - name: Format check
        working-directory: services/nlp-worker
        run: ruff format --check .
      - name: Tests
        working-directory: services/nlp-worker
        run: pytest

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: apps/web/package.json
      - name: Install
        working-directory: apps/web
        run: pnpm install --no-frozen-lockfile
      - name: Lint
        working-directory: apps/web
        run: pnpm lint
      - name: Typecheck
        working-directory: apps/web
        run: pnpm typecheck
      - name: Build
        working-directory: apps/web
        env:
          NEXT_PUBLIC_USE_MOCKS: 'true'
        run: pnpm build

  desktop:
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    strategy:
      matrix:
        include:
          - platform: ubuntu-latest
            args: ""
            sidecar_target: x86_64-unknown-linux-gnu
          - platform: windows-latest
            args: ""
            sidecar_target: x86_64-pc-windows-msvc
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
            sidecar_target: aarch64-apple-darwin
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: apps/desktop/package.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Install dependencies (Ubuntu)
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: pnpm install --no-frozen-lockfile

      - name: Build sidecar
        working-directory: apps/desktop/sidecar
        run: |
          python -m pip install pyinstaller
          python build/build_sidecar.py

      - name: Build Tauri app
        working-directory: apps/desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ""
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: pnpm tauri build ${{ matrix.args }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nora-desktop-${{ matrix.sidecar_target }}
          path: |
            apps/desktop/src-tauri/target/release/bundle/**/*.deb
            apps/desktop/src-tauri/target/release/bundle/**/*.AppImage
            apps/desktop/src-tauri/target/release/bundle/**/*.msi
            apps/desktop/src-tauri/target/release/bundle/**/*.dmg
          if-no-files-found: ignore

  docs-link-check:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar JSON examples
        run: |
          python - <<'PY'
          import json, pathlib, sys
          ok = True
          for p in pathlib.Path('docs/api').rglob('*.json'):
              try:
                  json.loads(p.read_text(encoding='utf-8'))
              except Exception as e:
                  print(f"INVALID JSON: {p}: {e}")
                  ok = False
          sys.exit(0 if ok else 1)
          PY
