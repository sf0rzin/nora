name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Disparo manual pra gerar bundles publicaveis do Desktop (release) sob demanda,
  # sem precisar de um commit dummy. Ver job desktop-bundle.
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

# Cancela rodadas anteriores do mesmo PR/branch quando um novo commit chega.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      worker: ${{ steps.filter.outputs.worker }}
      web: ${{ steps.filter.outputs.web }}
      docs: ${{ steps.filter.outputs.docs }}
      infra: ${{ steps.filter.outputs.infra }}
      desktop: ${{ steps.filter.outputs.desktop }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api:
              - 'services/api/**'
              - 'docs/api/**'
            worker:
              - 'services/nlp-worker/**'
              - 'packages/nlp-baseline/**'
              - 'docs/api/llm-schemas/**'
              - 'data/synthetic/**'
            web:
              - 'apps/web/**'
              - 'packages/**'
              - 'docs/api/**'
            docs:
              - 'docs/**'
              - '**/*.md'
            desktop:
              - 'apps/desktop/**'
            # O filtro `infra` deixou de observar infra/bicep/** e passou a observar a
            # stack do Proxmox — o job `infra` (abaixo) trocou de conteúdo na migração.
            # infra/bicep/** fica no repo como referência histórica até o cutover terminar,
            # mas NÃO é mais validado no CI: sem `az bicep` e sem deploy, o lint só
            # gastaria minuto de runner num artefato congelado.
            infra:
              - 'infra/proxmox/**'
              - 'scripts/**'

  api:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Spotless check
        working-directory: services/api
        run: mvn -B spotless:check
      - name: Build & tests
        working-directory: services/api
        run: mvn -B verify

  worker:
    needs: changes
    if: needs.changes.outputs.worker == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/nlp-worker/pyproject.toml
      - name: Install nlp-baseline (local package)
        working-directory: packages/nlp-baseline
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Install
        working-directory: services/nlp-worker
        run: |
          pip install -e ".[dev]"
      - name: Lint
        working-directory: services/nlp-worker
        run: ruff check .
      - name: Format check
        working-directory: services/nlp-worker
        run: ruff format --check .
      - name: Tests
        working-directory: services/nlp-worker
        run: pytest
      # Gate de cobertura escopado ao PII Shield (ADR 0012 + ADR 0018: >85% sustentado em
      # IAM/Auth/PII). NAO impomos cobertura global do worker de proposito — llm.py e
      # live_analyzer tem cobertura baixa e nao sao area critica de PII. Medido: ~96%;
      # limite 90 passa com folga. FOLLOWUP: estender o gate a outras areas criticas exige
      # subir a cobertura delas primeiro.
      - name: PII Shield coverage gate
        working-directory: services/nlp-worker
        run: >
          pytest
          --cov=nora_nlp.services.pii_shield
          --cov-report=term-missing
          --cov-fail-under=90
          tests/test_pii_shield.py

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install
        working-directory: apps/web
        run: npm ci
      - name: Lint
        working-directory: apps/web
        run: npm run lint
      - name: Typecheck
        working-directory: apps/web
        run: npm run typecheck
      - name: Build
        working-directory: apps/web
        env:
          NEXT_PUBLIC_USE_MOCKS: 'true'
        run: npm run build

  # Job leve em PR: só sidecar tests (mais barato) + Python sanity check.
  # O sidecar é a única parte com lógica de domínio testável fora do Tauri/Rust;
  # o resto (TypeScript + Rust) é validado em release/main pela build full.
  desktop-sidecar:
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/desktop/sidecar/pyproject.toml

      - name: Install sidecar deps + tests
        working-directory: apps/desktop/sidecar
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pytest -v

  # Compile-check do Rust do Desktop em PR (cargo check, sem bundle). O desktop-bundle (build
  # full) so roda em push/main — sem este job um erro de compilacao no src-tauri so apareceria
  # depois do merge. tauri-build le o frontendDist, entao buildamos o front (gera dist/) antes.
  desktop-rust:
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Build frontend (gera dist/ pro tauri-build)
        working-directory: apps/desktop
        shell: bash
        run: |
          npm ci
          npm run build

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      # whisper-rs-sys compila o whisper.cpp com CMake + MSBuild, que gera caminhos scratch
      # profundos e estoura o MAX_PATH de 260 chars do Windows (falha com `MSB6003: CL.exe
      # could not be run / DirectoryNotFoundException`). Reproduzido localmente em 2026-08-07.
      - name: Long paths + target dir curto (whisper.cpp/CMake)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path C:\t | Out-Null
          "CARGO_TARGET_DIR=C:\t\nora" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          git config --global core.longpaths true
          Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem' `
            -Name LongPathsEnabled -Value 1 -Type DWord -Force

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      # NÃO existe mais o passo de "stub do binário do sidecar" aqui, e isso é
      # intencional: `externalBin` saiu do `tauri.conf.json` base (ADR 0035) e vive
      # agora só no overlay opt-in `tauri.azure.conf.json`. Como o tauri-build resolve
      # `externalBin` em BUILD SCRIPT, tê-lo no base fazia até um `cargo check` falhar
      # com "resource path binaries/nora-stt-sidecar-<triple>.exe doesn't exist" —
      # obrigando quem só quer typecheckar Rust a rodar PyInstaller antes. Com o base
      # limpo, o stub virou dead code.

      # DUAS invocações de propósito: as duas configurações precisam compilar.
      #  - sem feature: o caminho legado (sidecar Azure), ainda suportado na transição;
      #  - com stt-local: o whisper.cpp embarcado (ADR 0035), que é o que vai pro release.
      # Checar só uma delas deixa a outra apodrecer sem ninguém notar.
      - name: cargo check (sem stt-local — caminho legado)
        working-directory: apps/desktop/src-tauri
        run: cargo check --locked

      - name: cargo check (com stt-local — whisper embarcado)
        working-directory: apps/desktop/src-tauri
        run: cargo check --locked --features stt-local

  # Build full do desktop (Tauri bundle msi/dmg/deb/AppImage) — roda APENAS em push em
  # main, gerando artifacts publicáveis. Em PR validation é overkill (15-20min
  # cold-cache + frágil em 3 plataformas).
  #
  # NÃO builda mais o sidecar PyInstaller. Depois do ADR 0035 o `externalBin` saiu do
  # `tauri.conf.json` base, então o bundle produzido aqui NÃO empacota o sidecar — e
  # rodar PyInstaller nas 3 plataformas gerava um binário que ninguém consumia. Para
  # empacotar o bundle legado com Azure Speech, use o overlay explícito:
  #     cd apps/desktop/sidecar && python build_sidecar.py && cd ..
  #     npx tauri build -- --config src-tauri/tauri.azure.conf.json
  # A lógica do sidecar continua coberta pelos pytest do job `desktop-sidecar`.
  desktop-bundle:
    needs: changes
    if: ${{ (needs.changes.outputs.desktop == 'true' && github.event_name == 'push') || github.event_name == 'workflow_dispatch' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # `--features stt-local` é obrigatório: sem ela o bundle sai com o caminho
          # legado do Azure Speech ativo, dependendo de um /speech/token que agora
          # responde 410 GONE. `label` só nomeia o artifact (era `sidecar_target`,
          # renomeado porque não há mais sidecar neste job).
          - platform: ubuntu-latest
            args: "--features stt-local"
            label: x86_64-unknown-linux-gnu
          - platform: windows-latest
            args: "--features stt-local"
            label: x86_64-pc-windows-msvc
          - platform: macos-latest
            args: "--target aarch64-apple-darwin --features stt-local"
            label: aarch64-apple-darwin
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || '' }}

      # whisper-rs-sys compila o whisper.cpp com CMake, que gera caminhos scratch
      # profundos e pode estourar o MAX_PATH de 260 chars do Windows.
      #
      # Aqui, ao contrário do job `desktop-rust`, NÃO setamos CARGO_TARGET_DIR: este job
      # sobe artifacts de `apps/desktop/src-tauri/target/**`, e mover o target dir
      # deixaria o upload sem encontrar nada (falha silenciosa, porque
      # `if-no-files-found: ignore`). Ficamos só com LongPathsEnabled, que basta porque
      # o workspace do runner (`D:\a\nora\nora`) já é bem mais curto que um checkout
      # local típico. Se algum dia estourar mesmo assim, a saída é setar
      # CARGO_TARGET_DIR **e** derivar os paths de upload dele — não só o primeiro.
      - name: Long paths (Windows, whisper.cpp/CMake)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          git config --global core.longpaths true
          Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem' `
            -Name LongPathsEnabled -Value 1 -Type DWord -Force

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Install dependencies (Ubuntu)
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Build Tauri app
        working-directory: apps/desktop
        env:
          # createUpdaterArtifacts:true no tauri.conf exige a chave de assinatura
          # no build (senão o tauri build falha). Mesmos secrets do desktop-release.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # A URL base da API é baked em build-time pelo build.rs (option_env!).
          # Sem isso o bundle aponta pro localhost. Setar vars.NORA_API_BASE_URL no
          # repo/environment pra sobrescrever o default.
          # Alinhado com NEXT_PUBLIC_API_BASE_URL em build-images.yml — o fallback deixou
          # de ser o FQDN do Azure Container Apps (morto) e passou a ser o domínio público
          # servido pelo Cloudflare Tunnel. Mesma troca em desktop-release.yml.
          NORA_API_BASE_URL: ${{ vars.NORA_API_BASE_URL || 'https://api.nora.systems' }}
        run: npx tauri build ${{ matrix.args }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nora-desktop-${{ matrix.label }}
          # O `target/**` do começo cobre os dois layouts: build nativo escreve em
          # `target/release/bundle/`, e o build com `--target <triple>` (macOS) escreve
          # em `target/<triple>/release/bundle/`. Sem o `**` inicial, o dmg do macOS
          # não seria encontrado — e `if-no-files-found: ignore` esconderia isso.
          path: |
            apps/desktop/src-tauri/target/**/bundle/**/*.deb
            apps/desktop/src-tauri/target/**/bundle/**/*.AppImage
            apps/desktop/src-tauri/target/**/bundle/**/*.msi
            apps/desktop/src-tauri/target/**/bundle/**/*.dmg
          if-no-files-found: ignore

  docs-link-check:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Validar JSON examples
        run: |
          python - <<'PY'
          import json, pathlib, sys
          ok = True
          for p in pathlib.Path('docs/api').rglob('*.json'):
              try:
                  json.loads(p.read_text(encoding='utf-8'))
              except Exception as e:
                  print(f"INVALID JSON: {p}: {e}")
                  ok = False
          sys.exit(0 if ok else 1)
          PY

  # ┌──────────────────────────────────────────────────────────────────────────────────┐
  # │ O NOME DESTE JOB É CONTRATO — NÃO RENOMEIE.                                      │
  # └──────────────────────────────────────────────────────────────────────────────────┘
  # `infra` é `needs` do `ci-gate`, e o ci-gate é o ÚNICO required status check da branch
  # protection da main (ADR 0027). Renomear o job aqui não quebra o gate diretamente (o
  # required check é o ci-gate), mas quebra a lista de `needs` do ci-gate — e um `needs`
  # apontando pra job inexistente é ERRO DE SINTAXE do workflow: nenhum run é criado, o
  # ci-gate nunca reporta, e todo PR fica travado em "Expected — Waiting for status".
  # Por isso a MIGRAÇÃO TROCOU O CONTEÚDO, NÃO O NOME.
  #
  # Antes: `az bicep build` de main.bicep + modules/*.bicep (validação do IaC do Azure).
  # Agora: valida a stack que efetivamente vai pro ar (ADR 0034 / Proxmox + Compose):
  #   1. `docker compose config -q` — o compose é a fonte da verdade do deploy. Pega YAML
  #      inválido, `depends_on` pra serviço inexistente, chave desconhecida e interpolação
  #      quebrada ANTES do merge, que é exatamente o papel que o bicep build tinha.
  #   2. shellcheck nos scripts de operação — no modelo pull, o rollout e o cutover de RLS
  #      são shell rodando no host (infra/proxmox/scripts/, scripts/). Esse shell deixou de
  #      ser utilitário e virou caminho de produção; merece o mesmo lint que o IaC tinha.
  infra:
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      # `docker compose config` FALHA em `${VAR:?mensagem}` quando a variável não existe —
      # e o compose usa esse padrão de propósito em 6 lugares (POSTGRES_ADMIN_PASSWORD,
      # JWT_SECRET, CLOUDFLARE_TUNNEL_TOKEN, GRAFANA_ADMIN_PASSWORD, CF_ACCESS_TEAM_DOMAIN,
      # CF_ACCESS_AUD) pra impedir boot com segredo faltando. Os valores reais vivem
      # cifrados em infra/proxmox/secrets.env.sops e só são decifrados no host (age key em
      # /etc/nora/age.key). O CI só precisa provar que o GRAFO é válido, então injetamos
      # placeholders óbvios. Nenhum valor real entra aqui — este arquivo é público.
      - name: Gera .env de validação (placeholders — nenhum segredo real)
        working-directory: infra/proxmox
        run: |
          set -euo pipefail
          cat > .env.ci <<'EOF'
          POSTGRES_ADMIN_PASSWORD=ci-placeholder
          POSTGRES_PLATFORM_ADMIN_PASSWORD=ci-placeholder
          JWT_SECRET=ci-placeholder-jwt-secret-com-32-chars-ok
          CLOUDFLARE_TUNNEL_TOKEN=ci-placeholder
          GRAFANA_ADMIN_PASSWORD=ci-placeholder
          CF_ACCESS_TEAM_DOMAIN=ci-placeholder.cloudflareaccess.com
          CF_ACCESS_AUD=ci-placeholder-aud
          EOF

      - name: Compose config (stack base)
        working-directory: infra/proxmox
        run: |
          set -euo pipefail
          docker compose --env-file .env.ci -f docker-compose.yml config -q
          echo "docker-compose.yml válido (perfil default)."

      # O profile `platform` (postgres-platform + admin, ADR 0022/0023) fica FORA do
      # `config` default. Sem este segundo passe, um erro dentro desses dois serviços
      # passaria batido no CI e só apareceria no host, no dia do flip do control plane.
      - name: Compose config (profile platform)
        working-directory: infra/proxmox
        run: |
          set -euo pipefail
          docker compose --env-file .env.ci -f docker-compose.yml --profile platform config -q
          echo "docker-compose.yml válido (profile platform)."

      # Confere que os serviços do contrato existem com o nome esperado. `config -q` valida
      # sintaxe, não intenção: um serviço renomeado por engano (ex.: `otel` em vez de
      # `otel-collector`) é YAML perfeitamente válido, mas quebra o OTEL_EXPORTER_OTLP_ENDPOINT
      # dos 4 apps — que resolvem o collector por hostname interno.
      - name: Contrato dos serviços (nomes = hostnames internos)
        working-directory: infra/proxmox
        run: |
          set -euo pipefail
          esperados="admin alloy api backup caddy cloudflared grafana loki otel-collector postgres postgres-platform prometheus web worker"
          atuais=$(docker compose --env-file .env.ci -f docker-compose.yml --profile platform config --services | sort | tr '\n' ' ')
          atuais=$(echo "$atuais" | xargs)
          if [ "$atuais" != "$esperados" ]; then
            echo "::error::Conjunto de serviços mudou."
            echo "  esperado: $esperados"
            echo "  atual:    $atuais"
            echo "Se a mudança é intencional, atualize esta lista E o ADR 0034."
            exit 1
          fi
          echo "14 serviços conferem com o contrato."

      # shellcheck já vem instalado na imagem do ubuntu-latest — sem action de terceiro.
      # `-x` segue os `source` entre scripts.
      #
      # Por que o gate é `-S warning` e não `-S style`: o nível `info` inclui SC2016
      # ("expressions don't expand in single quotes"), que dispara em massa no
      # scripts/dev-stop.sh — ele passa um bloco PowerShell inteiro como string
      # single-quoted (linha 25), e os `$ports`/`$proc` de LÁ são variáveis do PowerShell,
      # não do bash. São falsos positivos por construção. Gatear em info/style deixaria o
      # job vermelho no primeiro merge por causa de um script legado correto — e um
      # required check que "sempre falha" vira check que todo mundo ignora.
      # error+warning já cobre o que importa aqui (SC2115 `rm -rf "$X/"` com X vazio,
      # SC2164 `cd` sem `||exit`, redirect quebrado, uso de var não atribuída).
      # Pra endurecer um script específico, use `# shellcheck enable=...` no topo dele.
      - name: Shellcheck (scripts de operação)
        run: |
          set -euo pipefail
          shellcheck --version
          mapfile -t files < <(find scripts infra/proxmox -name '*.sh' -type f 2>/dev/null | sort)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::Nenhum .sh encontrado em scripts/ ou infra/proxmox/ — o filtro de path disparou este job, então isso indica script movido/apagado sem atualizar o CI."
            exit 1
          fi
          printf 'Analisando %d script(s):\n' "${#files[@]}"
          printf '  %s\n' "${files[@]}"
          shellcheck -x -S warning "${files[@]}"
          echo "shellcheck OK (gate: error+warning)."

      # Passe informativo no nível mais rigoroso. NÃO falha o job — serve pra o achado
      # aparecer no log e ser corrigido por decisão, não por bloqueio.
      - name: Shellcheck — passe informativo (style, não bloqueia)
        if: always()
        run: |
          set -uo pipefail
          mapfile -t files < <(find scripts infra/proxmox -name '*.sh' -type f 2>/dev/null | sort)
          [ "${#files[@]}" -eq 0 ] && exit 0
          shellcheck -x -S style "${files[@]}" || true
          exit 0

  # Gate agregador — é o ÚNICO status check exigido pela branch protection da main (ADR 0027).
  # Os jobs acima são condicionais por path (paths-filter): exigi-los diretamente como required
  # checks travaria o merge quando um job é "skipped" (PR que não toca aquela área — GitHub trata
  # required check que nunca roda como pending eterno). Este gate SEMPRE roda, depende de todos os
  # jobs de PR, e só falha se ALGUM deles falhou/foi cancelado (skipped = ok).
  # desktop-bundle fica de fora de propósito (só roda em push em main, não é portão de PR).
  ci-gate:
    name: ci-gate
    if: always()
    needs: [changes, api, worker, web, desktop-sidecar, desktop-rust, docs-link-check, infra]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checar resultado dos jobs obrigatórios
        run: |
          results="${{ join(needs.*.result, ' ') }}"
          echo "Resultados dos needs: $results"
          for r in $results; do
            if [ "$r" = "failure" ] || [ "$r" = "cancelled" ]; then
              echo "::error::Um job obrigatório do CI não passou (resultado: $r)."
              exit 1
            fi
          done
          echo "OK — todos os jobs obrigatórios passaram ou foram pulados por path-filter."
