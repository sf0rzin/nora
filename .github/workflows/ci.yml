name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Manual trigger to produce publishable Desktop bundles (release) on demand,
  # without needing a dummy commit. See the desktop-bundle job.
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

# Cancels previous runs of the same PR/branch when a new commit arrives.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      worker: ${{ steps.filter.outputs.worker }}
      web: ${{ steps.filter.outputs.web }}
      admin: ${{ steps.filter.outputs.admin }}
      docs: ${{ steps.filter.outputs.docs }}
      infra: ${{ steps.filter.outputs.infra }}
      desktop: ${{ steps.filter.outputs.desktop }}
      desktop_code: ${{ steps.filter.outputs.desktop_code }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            # `.github/workflows/ci.yml` is in both of these for the fourth time this file has
            # had to learn the same thing (see the `admin`, `desktop` and `infra` notes below):
            # without it, a pull request that changes only the api or worker job matches no
            # filter, the job it edited never runs, and ci-gate goes green having verified
            # nothing about the change it contains. It was found here the same way — the
            # coverage-report steps added to both jobs would have shipped unexecuted.
            #
            # It is not free: every ci.yml edit now pays for `mvn verify` with Testcontainers,
            # about five and a half minutes. That is the same bargain `admin`, `desktop` and
            # `infra` already accepted, and it is cheaper than a job nobody ran.
            api:
              - 'services/api/**'
              - 'docs/api/**'
              - 'scripts/report-coverage.sh'
              - '.github/workflows/ci.yml'
            worker:
              - 'services/nlp-worker/**'
              - 'packages/nlp-baseline/**'
              - 'docs/api/llm-schemas/**'
              - 'data/synthetic/**'
              - 'scripts/report-coverage.sh'
              - '.github/workflows/ci.yml'
            # Fifth time, same hole as the four notes around this block: `.github/workflows/ci.yml`
            # was NOT in this filter, so a pull request that changed only the `web` job below
            # matched no filter that runs it, and ci-gate went green having verified nothing about
            # the change it contained. Found while adding the Vitest steps — they would have
            # shipped unexecuted.
            #
            # The three source files after `docs/api/**` are not decoration either. `apps/web`'s
            # unit suite contains two MIRROR tests that read the other half of the mirror straight
            # off disk: `src/lib/pii/redact.test.ts` compares its patterns with the worker's PII
            # Shield, and `src/lib/password-policy.test.ts` compares its two constants with the
            # backend's PasswordPolicy and the three DTOs that carry the same bounds. Drift has
            # historically arrived from THOSE files, not from this app, so a filter that only
            # watches `apps/web/**` would run the mirror on every side but the one that breaks it.
            web:
              - 'apps/web/**'
              - 'packages/**'
              - 'docs/api/**'
              - 'services/nlp-worker/src/nora_nlp/services/pii_shield.py'
              - 'services/api/src/main/java/br/com/nora/api/domain/identity/PasswordPolicy.java'
              - 'services/api/src/main/java/br/com/nora/api/api/dto/auth/SignupRequest.java'
              - 'services/api/src/main/java/br/com/nora/api/api/dto/auth/ConfirmPasswordResetRequest.java'
              - 'services/api/src/main/java/br/com/nora/api/api/dto/iam/AcceptInviteRequest.java'
              - 'scripts/report-coverage.sh'
              - '.github/workflows/ci.yml'
            # The operator console was invisible to this workflow until 2026-08-16: no filter
            # matched `apps/admin/**`, so a pull request touching only the console matched
            # NOTHING, every job skipped, and ci-gate reported green having verified precisely
            # nothing about the change it contained. That is the third time this file has had
            # the same hole — see the two notes below, which fixed it for `desktop` and for
            # `infra`. `.github/workflows/ci.yml` is in here for the same reason it is in those
            # two: otherwise editing the admin job below gates on nothing.
            admin:
              - 'apps/admin/**'
              - '.github/workflows/ci.yml'
            docs:
              - 'docs/**'
              - '**/*.md'
            # TWO desktop filters, on purpose.
            #
            # `desktop` gates the PR-time checks and watches this workflow as well, for the
            # same reason the `infra` filter does: a PR that changes only the desktop job
            # matched no filter, so every desktop job skipped and ci-gate went green having
            # verified nothing about the change it contained. Found on the commit that turned
            # `cargo check --all-targets` into `cargo test`, which CI then did not run.
            #
            # `desktop_code` gates the FULL BUNDLE, which is a three-platform Tauri build with
            # a 60-minute timeout per platform, and it deliberately does NOT watch this file:
            # otherwise every merge that edits ci.yml for an unrelated reason — a tweak to the
            # api job, say — would pay for three bundle builds. The compile checks are worth
            # running on a workflow edit; the release bundle is not.
            desktop:
              - 'apps/desktop/**'
              - '.github/workflows/ci.yml'
            desktop_code:
              - 'apps/desktop/**'
            # The `infra` filter stopped watching infra/bicep/** (deleted; ADR 0036) and now
            # watches the self-hosted stack — the `infra` job (below) swapped content in the
            # migration.
            # `.github/workflows/**` is in here so that editing a workflow actually
            # gates on something: the `infra` job runs shellcheck and the action-pin
            # check, and without this entry a PR touching only CI matched no filter at
            # all — every job skipped and ci-gate went green having verified nothing.
            infra:
              - 'infra/host/**'
              - 'scripts/**'
              - '.github/workflows/**'

  api:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Spotless check
        working-directory: services/api
        run: mvn -B spotless:check
      - name: Build & tests
        working-directory: services/api
        run: mvn -B verify

      # The backend coverage figure, in the log and on the run summary, on every run.
      # `mvn verify` already writes `target/site/jacoco/jacoco.csv`; until this step existed,
      # nothing read it and the only backend coverage number anyone could quote was measured on
      # 2026-05-13 and carried forward through seventy pull requests. This is a report, not a
      # gate — the gate is the JaCoCo rule on PolicyEvaluator in pom.xml, and it is untouched.
      #
      # `always()`: jacoco:report and the jacoco check are both bound to `verify` with report
      # declared first, so a build that fails the coverage RULE has still written the CSV. That
      # is precisely the run whose numbers a reviewer wants. The script exits 0 when there is no
      # report, so it never adds a second red step to a build that already failed earlier.
      - name: Coverage report (JaCoCo)
        if: always()
        run: bash scripts/report-coverage.sh backend

  worker:
    needs: changes
    if: needs.changes.outputs.worker == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/nlp-worker/pyproject.toml
      - name: Install nlp-baseline (local package)
        working-directory: packages/nlp-baseline
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Install
        working-directory: services/nlp-worker
        run: |
          pip install -e ".[dev]"
      - name: Lint
        working-directory: services/nlp-worker
        run: ruff check .
      - name: Format check
        working-directory: services/nlp-worker
        run: ruff format --check .
      # `--cov=nora_nlp` rides along on the suite that was going to run anyway, so the
      # worker-wide figure costs no second pytest invocation. There is deliberately NO
      # `--cov-fail-under` here: this run reports, the next step gates. Adding a global
      # threshold would be the "mandatory total coverage, no distinction by area" that ADR 0018
      # considered and rejected, and it is not this task's decision to make.
      - name: Tests + worker-wide coverage
        working-directory: services/nlp-worker
        run: pytest --cov=nora_nlp --cov-report=term
      # Reads the `.coverage` the step above left behind and prints both scopes side by side:
      # the worker-wide number and the pii_shield number the gate below applies to. Printed
      # together on purpose — quoting the gated module's rate as "the worker's coverage" is the
      # exact overstatement the documents used to carry.
      - name: Coverage report (worker-wide vs. the gated module)
        run: bash scripts/report-coverage.sh worker
      # Coverage gate scoped to the PII Shield (ADR 0012 + ADR 0018: >85% sustained on
      # IAM/Auth/PII). We do NOT enforce global worker coverage on purpose — llm.py and
      # live_analyzer have low coverage and are not PII-critical area. Measured: ~96%;
      # the 90 limit passes with room to spare. FOLLOWUP: extending the gate to other
      # critical areas requires raising their coverage first.
      - name: PII Shield coverage gate
        working-directory: services/nlp-worker
        run: >
          pytest
          --cov=nora_nlp.services.pii_shield
          --cov-report=term-missing
          --cov-fail-under=90
          tests/test_pii_shield.py
      # The two rates, in the log, on every run. `tests/test_pii_corpus.py` is what fails the
      # build — on either rate — and this step is what puts the numbers where a reviewer can
      # read them without re-running anything. Both or neither: a leak rate published without a
      # false-redaction rate beside it is how a redaction defect gets closed by redacting the
      # whole transcript. Under a second for the whole corpus — no case count here on purpose,
      # because it grew from 4,482 to 5,682 in one review and a stale number in a comment is
      # exactly the kind of claim this project forbids.
      - name: PII corpus — leak rate and false-redaction rate
        working-directory: services/nlp-worker
        run: python -m tests.pii_corpus.harness

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    # Raised from 15 for the Playwright steps below: a chromium download plus the suite adds
    # a few minutes, and this job now also starts a server. The e2e steps live HERE rather
    # than in a job of their own so they reuse this job's `npm ci` and `next build` — the
    # suite runs `next start` against exactly the build this job just verified, which is
    # both cheaper and a stronger statement than testing a separate build would be.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install
        working-directory: apps/web
        run: npm ci
      - name: Lint
        working-directory: apps/web
        run: npm run lint
      - name: Typecheck
        working-directory: apps/web
        run: npm run typecheck

      # The first unit tests `apps/web` has ever had (ADR 0018 planned them for Sub-phase 1.12;
      # ADR 0042 records what actually shipped and what it does and does not gate).
      #
      # Its own step, before Build and unrelated to the Playwright steps further down: Vitest
      # needs neither a production build nor a browser, so putting it here fails a broken pure
      # function in a couple of seconds instead of after `next build` and a chromium download.
      #
      # `test:coverage` rather than `test`: the same single run is the gate AND writes the
      # `coverage/coverage-summary.json` the next step reads. The gate has two parts — every test
      # must pass, and the per-module `coverage.thresholds` in `apps/web/vitest.config.mts` must
      # hold. Those thresholds are FLOORS below the measured rate, on three modules; there is no
      # whole-app threshold, because `apps/web` is around 5% overall and a global number would
      # either gate nothing or block every UI pull request. ADR 0042 §Decision has the argument.
      #
      # No `env:` block. The two `NEXT_PUBLIC_*` values the suite depends on are pinned in
      # `vitest.config.mts`, where they are read at import time; setting them here would be a
      # second source of truth for the same two values.
      - name: Unit tests + coverage
        working-directory: apps/web
        run: npm run test:coverage

      # The numbers in the log on every run, whole-app beside the gated modules — the same shape
      # the `api` and `worker` jobs already use, and the same script. It reads the report the step
      # above wrote and measures nothing, so a figure quoted from CI and one read on a workstation
      # come from one implementation. Never a gate: it exits 0 whatever the numbers say.
      - name: Coverage report (whole app vs. the gated modules)
        run: bash scripts/report-coverage.sh web

      # `NEXT_PUBLIC_API_BASE_URL` is new here and is not cosmetic. Unset, `next.config.mjs`'s
      # `apiOrigin()` returns null and the CSP ships `connect-src 'self'` — while
      # `src/lib/api/client.ts` still falls back to its own hardcoded `http://localhost:8080`.
      # The two disagree about where the API lives, so the application violates its own policy
      # on every page that fetches. The e2e suite caught exactly that, on four of six pages.
      #
      # Production builds set this (to https://api.nora.systems), so production does not have
      # the defect; the DEFAULT does. Setting it here makes CI measure a coherent configuration
      # rather than one that exists nowhere. The underlying mismatch — two files with different
      # defaults for one value — is a defect in its own right and is recorded as such.
      - name: Build
        working-directory: apps/web
        env:
          NEXT_PUBLIC_USE_MOCKS: 'true'
          NEXT_PUBLIC_API_BASE_URL: 'http://localhost:8080'
        run: npm run build

      # chromium only. The suite checks response headers, middleware redirects and CSP
      # violations — none of which is browser-specific, and a three-browser matrix would
      # triple the download for no additional statement.
      - name: Install Playwright browsers
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      # The first automated test `apps/web` has ever had. It runs `next start` against the
      # build above (see playwright.config.ts) — NOT `next dev`, whose injected scripts and
      # websocket would raise CSP violations that exist in no deployed build.
      # No `env:` here on purpose. Both variables are `NEXT_PUBLIC_*`, inlined into the client
      # bundle at BUILD time — setting them on the test step changes nothing and would read as
      # a guarantee it cannot make. The build step above is the only place they matter.
      - name: E2E — security headers, route protection, CSP violations
        working-directory: apps/web
        run: npm run test:e2e

      - name: Playwright report (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  # Operator console (ADR 0023/0025). Lint + typecheck + build, which is every check its
  # package.json defines — there is no test script and no test file in apps/admin, and inventing
  # a `npm test` that runs nothing would read as coverage this app does not have.
  #
  # No `env:` on the build, on purpose, and that absence is the interesting part. The console's
  # own default is now the production shape: `NORA_ADMIN_USE_MOCKS` unset means the real data
  # layer with Cloudflare Access JWT validation ON (src/lib/access.ts), so building with an empty
  # environment builds what the host runs. The build log carries the fail-closed warning from
  # access.ts as a side effect, which is the intended noise rather than a defect. Setting
  # NORA_ADMIN_USE_MOCKS=true here would compile the branch nobody deploys; `tsc --noEmit` already
  # typechecks mock.ts either way, since it reads files rather than reachable branches.
  admin:
    needs: changes
    if: needs.changes.outputs.admin == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/admin/package-lock.json
      - name: Install
        working-directory: apps/admin
        run: npm ci
      - name: Lint
        working-directory: apps/admin
        run: npm run lint
      - name: Typecheck
        working-directory: apps/admin
        run: npm run typecheck
      - name: Build
        working-directory: apps/admin
        run: npm run build

  # Compile-check of the Desktop Rust on PR (cargo check, no bundle). desktop-bundle (full
  # build) only runs on push/main — without this job a compile error in src-tauri would only
  # show up after the merge. tauri-build reads frontendDist, so we build the front (produces
  # dist/) first.
  desktop-rust:
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Build frontend (generates dist/ for tauri-build)
        working-directory: apps/desktop
        shell: bash
        run: |
          npm ci
          npm run build

      # Pinned to a commit SHA, so the toolchain can no longer be inferred from the ref
      # name — it is stated explicitly instead.
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch @ 2026-08-05
        with:
          toolchain: stable

      # whisper-rs-sys compiles whisper.cpp with CMake + MSBuild, which generates deep scratch
      # paths and blows past Windows' 260-char MAX_PATH (fails with `MSB6003: CL.exe
      # could not be run / DirectoryNotFoundException`). Reproduced locally on 2026-08-07.
      - name: Long paths + short target dir (whisper.cpp/CMake)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path C:\t | Out-Null
          "CARGO_TARGET_DIR=C:\t\nora" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          git config --global core.longpaths true
          Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem' `
            -Name LongPathsEnabled -Value 1 -Type DWord -Force

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: apps/desktop/src-tauri

      # No `externalBin` anywhere any more: the Azure Speech sidecar and its overlay
      # config were deleted, so nothing here has to stub a binary before Rust will
      # typecheck. tauri-build resolves `externalBin` in the BUILD SCRIPT, which is why
      # having it in the base config used to make even a `cargo check` fail.

      # One configuration, one check. There used to be two invocations here, on the belief
      # that omitting `--features stt-local` exercised a second, legacy backend. It never
      # did: `--features` ADDS to the default set rather than replacing it, so both steps
      # compiled the identical feature set. Only `--no-default-features` would have made
      # them differ, and now there is nothing left to differ about.
      - name: cargo check
        working-directory: apps/desktop/src-tauri
        run: cargo check --locked

      # RUN the tests, do not merely type-check them. This step used to be a
      # `cargo check --all-targets` with a comment saying executing them "means paying for
      # whisper.cpp, and that is a separate CI-cost decision". Measured on 2026-08-10: the
      # whisper.cpp build is a build script, so the `cargo check` step
      # above already pays for it; `cargo test` adds codegen and a link, and the 21 tests
      # themselves run in about 1.5 seconds.
      #
      # What was going unverified while this was a type-check: `whisper_model.rs` is the gate
      # that stops a tampered mirror from installing a Whisper model — it hashes the download
      # and compares against four pinned digests — and its tests had never been executed by any
      # workflow on any platform. The same is true of the two resampler regressions, which exist
      # because `rubato::Fft::new` takes every argument as a usize, so a wrong order compiles
      # and then feeds silence into transcription without failing anything.
      #
      # `--all-targets` is kept so a test that stops COMPILING is still caught here rather than
      # in the middle of the run.
      - name: cargo test (runs the desktop suite)
        working-directory: apps/desktop/src-tauri
        run: cargo test --locked --all-targets

      # `--all-targets` is `--lib --bins --tests --benches --examples` and explicitly does
      # NOT include `--doc`, while a bare `cargo test` does. There are no doc-tests in this
      # crate today, so this is a no-op that costs seconds — and it is here so that the first
      # one somebody writes is not silently skipped by the flag above.
      - name: cargo test (doc-tests, which --all-targets excludes)
        working-directory: apps/desktop/src-tauri
        run: cargo test --locked --doc

  # Supply-chain policy over the desktop Rust graph — advisories, licenses, bans, sources.
  # Until this job existed, nothing in any workflow looked at that graph at all: the `glib`
  # unsoundness was noticed only because `git push` happened to print a Dependabot warning.
  #
  # ONE TOOL. An earlier version of this job ran cargo-audit alongside cargo-deny, on the
  # belief that cargo-deny could not see `informational = "unsound"` advisories. That belief
  # came from reading `cargo deny init`'s template, which is not the schema — `[advisories]`
  # accepts fourteen keys, `unsound` among them. With `unsound = "all"` in deny.toml this job
  # GATES on the two advisories the second tool only warned about. See deny.toml's header.
  #
  # ubuntu-latest, not the Windows runner `desktop-rust` uses: this reads Cargo.lock and never
  # compiles, and `[graph] targets` in deny.toml pins the shipped target explicitly, so the
  # verdict does not depend on which platform evaluates it.
  #
  # WHAT THIS JOB DOES NOT DO: discover a new advisory published against an unchanged lock.
  # It only runs when the desktop or this workflow changes. `supply-chain-drift.yml` is the
  # scheduled half, and it is deliberately outside `ci-gate` so a fresh advisory does not
  # block whichever unrelated pull request happens to run next.
  supply-chain:
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      # cargo-deny hard-requires a toolchain (it shells out to `cargo metadata`). The runner
      # image ships one, but `desktop-rust` pins its toolchain by commit SHA rather than
      # inferring it from the image, and a job that gates every merge is the wrong place to
      # make the opposite choice.
      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch @ 2026-08-05
        with:
          toolchain: stable

      # Saves the registry DOWNLOAD, not the extraction: rust-cache deliberately removes
      # `~/.cargo/registry/src` before saving, and the extracted sources are what cargo-deny
      # reads license text from. Net positive and harmless either way — cargo-deny installs
      # to ~/.local/bin, outside the paths this action restores, so there is no stale-binary
      # trap, and `~/.cargo/advisory-dbs` is not cached, so every run still fetches a fresh
      # advisory database. That last part matters: a cached advisory DB would make this job
      # green against yesterday's knowledge.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: apps/desktop/src-tauri

      # Pinned by version AND by digest. A release asset can be replaced in place on GitHub;
      # the checksum is what makes that visible instead of silent. Retried, because an
      # un-retried network fetch on a required check turns a releases blip into a red gate
      # that looks exactly like a real finding in the checks UI.
      # KEEP IN STEP WITH supply-chain-drift.yml, which installs the same binary the same
      # way. Version and checksum sit together, so a one-sided bump leaves both files
      # internally consistent and neither errors — the gate and the weekly job would then
      # run different cargo-deny versions against one deny.toml. The asymmetry is what makes
      # that bad: a stale GATE reds loudly on the next desktop PR, while a stale DRIFT pin
      # fails a job nobody is required to look at — and per the version note below, a
      # backwards-stale pin means silently zero weekly coverage.
      - name: Install cargo-deny (pinned, checksum-verified)
        env:
          DENY_VERSION: '0.20.2'
          DENY_SHA256: '9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f'
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin" /tmp/sc && cd /tmp/sc
          curl -fsSL --retry 3 --retry-delay 2 --retry-all-errors -o deny.tgz \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/${DENY_VERSION}/cargo-deny-${DENY_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          echo "${DENY_SHA256}  deny.tgz" | sha256sum -c -
          tar xzf deny.tgz --strip-components=1
          install -m755 cargo-deny "$HOME/.local/bin/"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/cargo-deny" --version

      # Version note that cost time to find and would cost it again: cargo-deny 0.18.2 DIES on
      # the current advisory database with `unsupported CVSS version: 4.0`, because a 2026
      # advisory uses CVSS 4.0 and its bundled `rustsec` cannot parse it. Pinning backwards is
      # not a safe rollback.
      #
      # `--log-level info` is load-bearing, not verbosity for its own sake: at the default
      # level a run with three `ignore` entries prints `advisories ok` and NOTHING about
      # them. The whole argument for ignoring an advisory in deny.toml instead of dismissing
      # it in the Dependabot UI is that it stays visible — which is only true if the note is
      # actually printed, with its reason string and dependency tree.
      - name: cargo-deny (advisories, licenses, bans, sources)
        working-directory: apps/desktop/src-tauri
        run: cargo-deny --log-level info --format human check

  # Full desktop build (Tauri bundle, .msi) — runs ONLY on push to main, producing
  # publishable artifacts. On PR validation it is overkill (15-20min cold-cache).
  #
  # ONE platform. The client is Windows-only: the macOS path needed the user to install
  # the BlackHole virtual driver and the Linux path shelled out to PulseAudio, and neither
  # was ever exercised by anybody. Building all three cost three 60-minute Tauri builds per
  # merge to keep two of them unvalidated.
  #
  # There is no PyInstaller sidecar to build: the Azure Speech path was deleted, so
  # transcription is whisper.cpp compiled into the binary and nothing else.
  desktop-bundle:
    needs: changes
    if: ${{ (needs.changes.outputs.desktop_code == 'true' && github.event_name == 'push') || github.event_name == 'workflow_dispatch' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # No `args`: `stt-local` is the only feature and it is already the default, so
          # naming it bought nothing, and there is no `--target` because the build is
          # native. `label` only names the artifact.
          - platform: windows-latest
            label: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      # Pinned to a commit SHA, so the toolchain can no longer be inferred from the ref
      # name — it is stated explicitly instead.
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch @ 2026-08-05
        with:
          toolchain: stable

      # whisper-rs-sys compiles whisper.cpp with CMake, which generates deep scratch
      # paths and can blow past Windows' 260-char MAX_PATH.
      #
      # Here, unlike the `desktop-rust` job, we do NOT set CARGO_TARGET_DIR: this job
      # uploads artifacts from `apps/desktop/src-tauri/target/**`, and moving the target
      # dir would leave the upload finding nothing (silent failure, because
      # `if-no-files-found: ignore`). We keep only LongPathsEnabled, which suffices because
      # the runner workspace (`D:\a\nora\nora`) is already much shorter than a typical
      # local checkout. If it ever blows up anyway, the way out is to set
      # CARGO_TARGET_DIR **and** derive the upload paths from it — not just the first.
      - name: Long paths (Windows, whisper.cpp/CMake)
        shell: pwsh
        run: |
          git config --global core.longpaths true
          Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem' `
            -Name LongPathsEnabled -Value 1 -Type DWord -Force

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Build Tauri app
        working-directory: apps/desktop
        env:
          # createUpdaterArtifacts:true in tauri.conf requires the signing key
          # at build (otherwise tauri build fails). Same secrets as desktop-release.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # The API base URL is baked in at build-time by build.rs (option_env!).
          # Without it the bundle points at localhost. Set vars.NORA_API_BASE_URL in the
          # repo/environment to override the default.
          # Aligned with NEXT_PUBLIC_API_BASE_URL in build-images.yml — the fallback stopped
          # being the Azure Container Apps FQDN (dead) and became the public domain
          # served by the Cloudflare Tunnel. Same swap in desktop-release.yml.
          NORA_API_BASE_URL: ${{ vars.NORA_API_BASE_URL || 'https://api.nora.systems' }}
        run: npx tauri build

      # What signing verification this repository has, and what it does not.
      #
      # `createUpdaterArtifacts: true` makes `tauri build` FAIL when the signing key is absent,
      # so a missing key is already caught here. What was not caught is a signature that stops
      # being produced, or one produced against a key the installed app will not accept — and
      # this job publishes bundles. The public key below is the one compiled into the client
      # (`plugins.updater.pubkey` in tauri.conf.json), so verifying against it walks the same
      # chain the updater walks: sign with the CI secret, verify with the shipped key.
      #
      # THIS STEP MOVED FROM UBUNTU TO WINDOWS, and the move is the whole reason it still
      # exists. It used to carry `if: matrix.platform == 'ubuntu-latest'`, because minisign
      # is one apt package there — so cutting the matrix down to Windows would have deleted
      # the repository's only signing check by omission, silently and with a green run.
      # A signing regression is not platform-specific anyway: it comes from the key or from
      # the config, and both were always shared across the matrix.
      #
      # `choco` is preinstalled on windows-latest and ships minisign; `shell: bash` is
      # explicit because the rest of the script is bash and Windows runners default to pwsh.
      # HONEST LIMIT: this port has not been exercised. `desktop-bundle` does not run on
      # `pull_request` (see the `if:` on the job), so the first push to main that touches
      # desktop code is what proves it. If choco ever stops carrying the package, replace
      # the install with a pinned, checksum-verified download the way `supply-chain` does
      # for cargo-deny — do not drop the step.
      #
      # This does NOT verify `tauri-action`, which is what `desktop-release.yml` uses to create
      # the release and publish `latest.json`. That action runs on a `desktop-v*` tag and on no
      # other trigger, so no workflow run exercises it. See SECURITY-FINDINGS item 11.
      - name: Verify the updater signatures against the shipped public key
        working-directory: apps/desktop
        shell: bash
        run: |
          set -euo pipefail
          choco install minisign -y --no-progress

          # Scratch files go in a RELATIVE directory, not /tmp. Git Bash rewrites
          # POSIX-looking arguments into Windows paths before handing them to a native
          # .exe, and minisign.exe is native — a relative path sidesteps that translation
          # entirely instead of relying on it.
          mkdir -p .sigcheck
          jq -r '.plugins.updater.pubkey' src-tauri/tauri.conf.json | base64 -d > .sigcheck/nora.pub
          head -1 .sigcheck/nora.pub | grep -q 'minisign public key' || {
            echo "::error::tauri.conf.json pubkey does not decode to a minisign public key"
            exit 1
          }

          mapfile -t sigs < <(find src-tauri/target -name '*.sig' | sort)
          if [ "${#sigs[@]}" -eq 0 ]; then
            echo "::error::no .sig produced. createUpdaterArtifacts is on, so either the"
            echo "::error::updater bundle was not built or signing silently stopped."
            exit 1
          fi

          for sig in "${sigs[@]}"; do
            artifact="${sig%.sig}"
            [ -f "$artifact" ] || { echo "::error::signature with no artifact: $sig"; exit 1; }
            # Tauri writes the signature base64-encoded — it is the same string that goes into
            # latest.json. Decoded when it is, used as-is when it is not, so this keeps working
            # if that ever changes rather than failing on a format nobody promised us.
            if base64 -d < "$sig" > .sigcheck/sig 2>/dev/null &&
               head -c 18 .sigcheck/sig | grep -q 'untrusted comment'; then
              :
            else
              cp "$sig" .sigcheck/sig
            fi
            minisign -V -p .sigcheck/nora.pub -x .sigcheck/sig -m "$artifact"
            echo "verified $(basename "$artifact")"
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nora-desktop-${{ matrix.label }}
          # `target/**` rather than `target/release/**`: the build is native and writes to
          # `target/release/bundle/`, but CARGO_TARGET_DIR or a `--target <triple>` would
          # move that, and `if-no-files-found: ignore` would hide the miss rather than
          # report it.
          path: |
            apps/desktop/src-tauri/target/**/bundle/**/*.msi
          if-no-files-found: ignore

  docs-link-check:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Validate JSON examples
        run: |
          python - <<'PY'
          import json, pathlib, sys
          ok = True
          for p in pathlib.Path('docs/api').rglob('*.json'):
              try:
                  json.loads(p.read_text(encoding='utf-8'))
              except Exception as e:
                  print(f"INVALID JSON: {p}: {e}")
                  ok = False
          sys.exit(0 if ok else 1)
          PY

      # What makes this job's NAME true. Every relative markdown link in the repo must
      # resolve; a rename that leaves a dangling link now fails the PR instead of shipping
      # a 404 into the docs.
      - name: Relative markdown links
        run: bash scripts/check-doc-links.sh

  # Always runs (no path filter): the language gate has to see a PR that touches ONE file
  # as much as one that touches a hundred. It is a single pass of grep over the tracked
  # files, so it costs seconds.
  language:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: No Portuguese outside the declared allowlist
        run: bash scripts/check-language.sh

  # Always runs (no path filter), and that is the whole point: this check compares TWO
  # sides that live under different filters. `docs/api/openapi.yaml` matches `docs`;
  # `services/api/**` matches `api`. A PR that deletes a controller touches only the
  # second, so gating this on `docs` would let exactly the deletion case through — which
  # is the case that left `POST /speech/token` in the spec after the handler was gone.
  # Under a filter it would also fail open on the reverse: a new controller with no spec
  # entry, in a PR that touches no doc.
  # Cost is a few seconds of awk, the same reason the `language` job above has no filter.
  openapi-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: The OpenAPI spec and the controllers agree, both directions
        run: bash scripts/check-openapi-coverage.sh

  # ┌──────────────────────────────────────────────────────────────────────────────────┐
  # │ THIS JOB'S NAME IS A CONTRACT — DO NOT RENAME IT.                                │
  # └──────────────────────────────────────────────────────────────────────────────────┘
  # `infra` is a `needs` of `ci-gate`, and ci-gate is the ONLY required status check of
  # main's branch protection (ADR 0027). Renaming the job here does not break the gate
  # directly (the required check is ci-gate), but it breaks ci-gate's `needs` list — and a
  # `needs` pointing at a nonexistent job is a workflow SYNTAX ERROR: no run is created,
  # ci-gate never reports, and every PR hangs on "Expected — Waiting for status".
  # That is why the MIGRATION SWAPPED THE CONTENT, NOT THE NAME.
  #
  # Before: `az bicep build` of main.bicep + modules/*.bicep (validation of the Azure IaC).
  # Now: validates the stack that actually goes live (ADR 0034 / ADR 0036 — self-hosted host + Compose):
  #   1. `docker compose config -q` — the compose is the source of truth of the deploy. It
  #      catches invalid YAML, `depends_on` to a nonexistent service, unknown key and broken
  #      interpolation BEFORE the merge, which is exactly the role bicep build had.
  #   2. shellcheck on the operation scripts — in the pull model, the rollout and the RLS
  #      cutover are shell running on the host (infra/host/scripts/, scripts/). That shell
  #      stopped being a utility and became a production path; it deserves the same lint the
  #      IaC had.
  infra:
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      # `docker compose config` FAILS on `${VAR:?message}` when the variable does not exist —
      # and the compose uses that pattern on purpose on 9 variables (POSTGRES_ADMIN_PASSWORD,
      # JWT_SECRET, CLOUDFLARE_TUNNEL_TOKEN, GRAFANA_ADMIN_PASSWORD, CF_ACCESS_TEAM_DOMAIN,
      # CF_ACCESS_AUD, NORA_PLATFORM_ADMIN_TOKEN, NORA_INTEGRATIONS_ENC_KEY and
      # NORA_WORKER_INTERNAL_TOKEN) to prevent booting with a missing secret.
      # Keep this list and the heredoc below in step: a variable added there and not here is
      # only a stale comment, but one added to the compose and to neither turns this job red.
      # The real values live
      # encrypted in infra/host/secrets.env.sops and are only decrypted on the host (age
      # key in /etc/nora/age.key). CI only needs to prove the GRAPH is valid, so we inject
      # obvious placeholders. No real value goes in here — this file is public.
      - name: Generate the validation .env (placeholders — no real secret)
        working-directory: infra/host
        run: |
          set -euo pipefail
          cat > .env.ci <<'EOF'
          POSTGRES_ADMIN_PASSWORD=ci-placeholder
          POSTGRES_PLATFORM_ADMIN_PASSWORD=ci-placeholder
          JWT_SECRET=ci-placeholder-jwt-secret-with-32-chars-ok
          CLOUDFLARE_TUNNEL_TOKEN=ci-placeholder
          GRAFANA_ADMIN_PASSWORD=ci-placeholder
          CF_ACCESS_TEAM_DOMAIN=ci-placeholder.cloudflareaccess.com
          CF_ACCESS_AUD=ci-placeholder-aud
          NORA_PLATFORM_ADMIN_TOKEN=ci-placeholder-admin-token
          NORA_INTEGRATIONS_ENC_KEY=Y2ktcGxhY2Vob2xkZXItbm90LWEtcmVhbC1rZXktMzI=
          NORA_WORKER_INTERNAL_TOKEN=ci-placeholder-worker-internal-token
          EOF

      - name: Compose config (stack base)
        working-directory: infra/host
        run: |
          set -euo pipefail
          docker compose --env-file .env.ci -f docker-compose.yml config -q
          echo "docker-compose.yml valid (default profile)."

      # The `platform` profile (postgres-platform + admin, ADR 0022/0023) sits OUTSIDE the
      # default `config`. Without this second pass, an error inside those two services
      # would slip past CI and only show up on the host, on control plane flip day.
      - name: Compose config (profile platform)
        working-directory: infra/host
        run: |
          set -euo pipefail
          docker compose --env-file .env.ci -f docker-compose.yml --profile platform config -q
          echo "docker-compose.yml valid (platform profile)."

      # The Caddyfile is the routing plane of the only HTTP ingress, and `docker compose config`
      # says nothing about it: it is a bind-mounted file, so a syntax error or an unknown
      # directive is only discovered when the container restarts and takes the whole site with
      # it. Same reasoning that put the compose itself under CI. The env placeholders in the
      # file all carry defaults (`{$NORA_PUBLIC_DOMAIN:nora.systems}`), so validate needs no
      # environment. Keep the image tag in step with the `caddy` service in the compose.
      - name: Caddyfile validate
        working-directory: infra/host
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD/caddy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2.8-alpine caddy validate --config /etc/caddy/Caddyfile
          echo "Caddyfile valid."

      # Checks that the contract services exist under the expected name. `config -q` validates
      # syntax, not intent: a service renamed by mistake (e.g. `otel` instead of
      # `otel-collector`) is perfectly valid YAML, but breaks the OTEL_EXPORTER_OTLP_ENDPOINT
      # of the 4 apps — which resolve the collector by internal hostname.
      - name: Service contract (names = internal hostnames)
        working-directory: infra/host
        run: |
          set -euo pipefail
          expected="admin alloy api backup caddy cloudflared grafana loki otel-collector postgres postgres-platform prometheus web worker"
          actual=$(docker compose --env-file .env.ci -f docker-compose.yml --profile platform config --services | sort | tr '\n' ' ')
          actual=$(echo "$actual" | xargs)
          if [ "$actual" != "$expected" ]; then
            echo "::error::The service set changed."
            echo "  expected: $expected"
            echo "  actual:   $actual"
            echo "If the change is intentional, update this list AND ADR 0034."
            exit 1
          fi
          echo "14 services match the contract."

      # shellcheck ships preinstalled in the ubuntu-latest image — no third-party action.
      # `-x` follows the `source` between scripts.
      #
      # Why the gate is `-S warning` and not `-S style`: the `info` level includes SC2016
      # ("expressions don't expand in single quotes"), which fires en masse on
      # scripts/dev-stop.sh — it passes an entire PowerShell block as a single-quoted
      # string (line 25), and the `$ports`/`$proc` in THERE are PowerShell variables,
      # not bash ones. They are false positives by construction. Gating at info/style would
      # leave the job red on the first merge because of a correct legacy script — and a
      # required check that "always fails" becomes a check everybody ignores.
      # error+warning already covers what matters here (SC2115 `rm -rf "$X/"` with X empty,
      # SC2164 `cd` without `||exit`, broken redirect, use of unassigned var).
      # To harden a specific script, use `# shellcheck enable=...` at the top of it.
      - name: Shellcheck (operation scripts)
        run: |
          set -euo pipefail
          shellcheck --version
          mapfile -t files < <(find scripts infra/host -name '*.sh' -type f 2>/dev/null | sort)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::No .sh found under scripts/ or infra/host/ — the path filter triggered this job, so a script was moved or deleted without updating CI."
            exit 1
          fi
          printf 'Analyzing %d script(s):\n' "${#files[@]}"
          printf '  %s\n' "${files[@]}"
          shellcheck -x -S warning "${files[@]}"
          echo "shellcheck OK (gate: error+warning)."

      # Supply-chain gate. Third-party actions must be referenced by an immutable commit
      # SHA: a tag or a branch is a pointer the upstream owner can move at any time, and
      # what it points at then executes inside our jobs — including the jobs that hold the
      # Desktop updater signing key. The script carries the full policy (which owners are
      # exempt and why). Invoked via `bash` so it does not depend on the file mode bit.
      - name: Action pins (third-party actions on commit SHAs)
        run: bash scripts/check-action-pins.sh

      # Informative pass at the strictest level. Does NOT fail the job — it exists so the
      # finding shows up in the log and gets fixed by decision, not by blocking.
      - name: Shellcheck — informational pass (style, non-blocking)
        if: always()
        run: |
          set -uo pipefail
          mapfile -t files < <(find scripts infra/host -name '*.sh' -type f 2>/dev/null | sort)
          [ "${#files[@]}" -eq 0 ] && exit 0
          shellcheck -x -S style "${files[@]}" || true
          exit 0

  # Aggregator gate — it is the ONLY status check required by main's branch protection (ADR 0027).
  # The jobs above are conditional by path (paths-filter): requiring them directly as required
  # checks would block the merge when a job is "skipped" (a PR that does not touch that area —
  # GitHub treats a required check that never runs as eternally pending). This gate ALWAYS runs,
  # depends on every PR job, and only fails if ANY of them failed/was cancelled (skipped = ok).
  # desktop-bundle is left out on purpose (only runs on push to main, it is not a PR gate).
  ci-gate:
    name: ci-gate
    if: always()
    needs: [changes, api, worker, web, admin, desktop-rust, supply-chain, docs-link-check, language, openapi-coverage, infra]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check the result of the required jobs
        run: |
          results="${{ join(needs.*.result, ' ') }}"
          echo "needs results: $results"
          for r in $results; do
            if [ "$r" = "failure" ] || [ "$r" = "cancelled" ]; then
              echo "::error::A required CI job did not pass (result: $r)."
              exit 1
            fi
          done
          echo "OK — every required job passed or was skipped by the path filter."
