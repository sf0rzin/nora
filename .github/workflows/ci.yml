name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Disparo manual pra gerar bundles publicaveis do Desktop (release) sob demanda,
  # sem precisar de um commit dummy. Ver job desktop-bundle.
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

# Cancela rodadas anteriores do mesmo PR/branch quando um novo commit chega.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      worker: ${{ steps.filter.outputs.worker }}
      web: ${{ steps.filter.outputs.web }}
      docs: ${{ steps.filter.outputs.docs }}
      infra: ${{ steps.filter.outputs.infra }}
      desktop: ${{ steps.filter.outputs.desktop }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api:
              - 'services/api/**'
              - 'docs/api/**'
            worker:
              - 'services/nlp-worker/**'
              - 'packages/nlp-baseline/**'
              - 'docs/api/llm-schemas/**'
              - 'data/synthetic/**'
            web:
              - 'apps/web/**'
              - 'packages/**'
              - 'docs/api/**'
            docs:
              - 'docs/**'
              - '**/*.md'
            desktop:
              - 'apps/desktop/**'
            infra:
              - 'infra/bicep/**'

  api:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Spotless check
        working-directory: services/api
        run: mvn -B spotless:check
      - name: Build & tests
        working-directory: services/api
        run: mvn -B verify

  worker:
    needs: changes
    if: needs.changes.outputs.worker == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/nlp-worker/pyproject.toml
      - name: Install nlp-baseline (local package)
        working-directory: packages/nlp-baseline
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Install
        working-directory: services/nlp-worker
        run: |
          pip install -e ".[dev]"
      - name: Lint
        working-directory: services/nlp-worker
        run: ruff check .
      - name: Format check
        working-directory: services/nlp-worker
        run: ruff format --check .
      - name: Tests
        working-directory: services/nlp-worker
        run: pytest
      # Gate de cobertura escopado ao PII Shield (ADR 0012 + ADR 0018: >85% sustentado em
      # IAM/Auth/PII). NAO impomos cobertura global do worker de proposito — llm.py e
      # live_analyzer tem cobertura baixa e nao sao area critica de PII. Medido: ~96%;
      # limite 90 passa com folga. FOLLOWUP: estender o gate a outras areas criticas exige
      # subir a cobertura delas primeiro.
      - name: PII Shield coverage gate
        working-directory: services/nlp-worker
        run: >
          pytest
          --cov=nora_nlp.services.pii_shield
          --cov-report=term-missing
          --cov-fail-under=90
          tests/test_pii_shield.py

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install
        working-directory: apps/web
        run: npm ci
      - name: Lint
        working-directory: apps/web
        run: npm run lint
      - name: Typecheck
        working-directory: apps/web
        run: npm run typecheck
      - name: Build
        working-directory: apps/web
        env:
          NEXT_PUBLIC_USE_MOCKS: 'true'
        run: npm run build

  # Job leve em PR: só sidecar tests (mais barato) + Python sanity check.
  # O sidecar é a única parte com lógica de domínio testável fora do Tauri/Rust;
  # o resto (TypeScript + Rust) é validado em release/main pela build full.
  desktop-sidecar:
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/desktop/sidecar/pyproject.toml

      - name: Install sidecar deps + tests
        working-directory: apps/desktop/sidecar
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pytest -v

  # Compile-check do Rust do Desktop em PR (cargo check, sem bundle). O desktop-bundle (build
  # full) so roda em push/main — sem este job um erro de compilacao no src-tauri so apareceria
  # depois do merge. tauri-build le o frontendDist, entao buildamos o front (gera dist/) antes.
  desktop-rust:
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Build frontend (gera dist/ pro tauri-build)
        working-directory: apps/desktop
        shell: bash
        run: |
          npm ci
          npm run build

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      # tauri-build (build.rs) valida que o externalBin do sidecar EXISTE em disco. Este job
      # não builda o sidecar PyInstaller (isso é do desktop-bundle, pesado) — então criamos um
      # stub vazio só pra satisfazer a checagem de existência. cargo check não executa o binário,
      # só precisa que o path exista pra compilar/checar o Rust do app.
      - name: Stub do binario do sidecar (tauri-build checa existencia)
        working-directory: apps/desktop/src-tauri
        shell: bash
        run: |
          mkdir -p binaries
          : > "binaries/nora-stt-sidecar-x86_64-pc-windows-msvc.exe"

      - name: cargo check
        working-directory: apps/desktop/src-tauri
        run: cargo check --locked

  # Build full do desktop (sidecar PyInstaller + Tauri bundle msi/dmg/deb/AppImage)
  # roda APENAS em push em main, gerando artifacts publicáveis. Em PR validation
  # esse build é overkill (15-20min cold-cache + fragil em 3 plataformas).
  desktop-bundle:
    needs: changes
    if: ${{ (needs.changes.outputs.desktop == 'true' && github.event_name == 'push') || github.event_name == 'workflow_dispatch' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-latest
            args: ""
            sidecar_target: x86_64-unknown-linux-gnu
          - platform: windows-latest
            args: ""
            sidecar_target: x86_64-pc-windows-msvc
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
            sidecar_target: aarch64-apple-darwin
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/desktop/sidecar/pyproject.toml

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Install dependencies (Ubuntu)
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Install sidecar deps
        working-directory: apps/desktop/sidecar
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          python -m pip install pyinstaller

      - name: Build sidecar
        working-directory: apps/desktop/sidecar
        run: python build_sidecar.py

      - name: Build Tauri app
        working-directory: apps/desktop
        env:
          # createUpdaterArtifacts:true no tauri.conf exige a chave de assinatura
          # no build (senão o tauri build falha). Mesmos secrets do desktop-release.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # A URL base da API é baked em build-time pelo build.rs (option_env!).
          # Sem isso o bundle aponta pro localhost (inútil contra o Azure). Setar
          # vars.NORA_API_BASE_URL no repo/environment pra sobrescrever o default.
          # Alinhado com NEXT_PUBLIC_API_BASE_URL em build-images.yml.
          NORA_API_BASE_URL: ${{ vars.NORA_API_BASE_URL || 'https://nora-api-dev.salmonbeach-349d395f.centralus.azurecontainerapps.io' }}
        run: npx tauri build ${{ matrix.args }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nora-desktop-${{ matrix.sidecar_target }}
          path: |
            apps/desktop/src-tauri/target/release/bundle/**/*.deb
            apps/desktop/src-tauri/target/release/bundle/**/*.AppImage
            apps/desktop/src-tauri/target/release/bundle/**/*.msi
            apps/desktop/src-tauri/target/release/bundle/**/*.dmg
          if-no-files-found: ignore

  docs-link-check:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Validar JSON examples
        run: |
          python - <<'PY'
          import json, pathlib, sys
          ok = True
          for p in pathlib.Path('docs/api').rglob('*.json'):
              try:
                  json.loads(p.read_text(encoding='utf-8'))
              except Exception as e:
                  print(f"INVALID JSON: {p}: {e}")
                  ok = False
          sys.exit(0 if ok else 1)
          PY

  infra:
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Install Azure CLI + Bicep
        run: |
          az bicep install
          az bicep version
      - name: Bicep build (main.bicep)
        working-directory: infra/bicep
        run: |
          mkdir -p .bicep-out
          az bicep build --file main.bicep --outdir .bicep-out
          echo "Compiled main.json bytes: $(wc -c < .bicep-out/main.json)"
      - name: Bicep lint (todos os módulos)
        working-directory: infra/bicep
        run: |
          set -e
          for f in modules/*.bicep; do
            echo "::group::Linting $f"
            az bicep build --file "$f" --outdir .bicep-out
            echo "::endgroup::"
          done

  # Gate agregador — é o ÚNICO status check exigido pela branch protection da main (ADR 0027).
  # Os jobs acima são condicionais por path (paths-filter): exigi-los diretamente como required
  # checks travaria o merge quando um job é "skipped" (PR que não toca aquela área — GitHub trata
  # required check que nunca roda como pending eterno). Este gate SEMPRE roda, depende de todos os
  # jobs de PR, e só falha se ALGUM deles falhou/foi cancelado (skipped = ok).
  # desktop-bundle fica de fora de propósito (só roda em push em main, não é portão de PR).
  ci-gate:
    name: ci-gate
    if: always()
    needs: [changes, api, worker, web, desktop-sidecar, desktop-rust, docs-link-check, infra]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checar resultado dos jobs obrigatórios
        run: |
          results="${{ join(needs.*.result, ' ') }}"
          echo "Resultados dos needs: $results"
          for r in $results; do
            if [ "$r" = "failure" ] || [ "$r" = "cancelled" ]; then
              echo "::error::Um job obrigatório do CI não passou (resultado: $r)."
              exit 1
            fi
          done
          echo "OK — todos os jobs obrigatórios passaram ou foram pulados por path-filter."
